 the day prices change. So does a model: its training stopped at a cut-off date. A look-up reads the live document instead. Update the document and the next answer updates too. Ideal for prices, policies and this week's numbers."},{"type":"tf","prompt":"A look-up suits facts that change, because updating the document updates the next answer.","answer":true,"explain":"The model reads the current document each time you ask. Nobody has to retrain anything when a price or a policy changes."},{"type":"sort","prompt":"Which questions need a look-up, and which can a model answer from its training?","buckets":["Needs a look-up","Model knows it"],"items":[["This week's campaign results",0],["How to write a polite email",1],["The current rate card",0],["What a tagline is",1],["Our latest travel policy",0],["Basic grammar and spelling",1]],"explain":"General skills and long-settled knowledge are in the model already. Facts that are recent, changing or private to your company have to be fetched and put on the page."},{"type":"card","title":"Answers that show their sources","body":"When a model answers from fetched documents, the product can show which ones it used, like footnotes in a report. You can open the source and check the claim yourself. A look-up does not guarantee a right answer, but it makes a wrong one much easier to catch."},{"type":"mcq","prompt":"What is the main benefit of an answer that points to its sources?","options":["It proves the answer has to be correct","You can open them and check the claim","It makes the answer arrive much faster"],"answer":1,"explain":"A source turns \"trust me\" into \"see for yourself\". The model can still misread a document, so the point is that you can check, not that you can skip checking."},{"type":"tf","prompt":"An AI answer cites the rate card for a price. You paste the price into a client deck without opening the rate card.","answer":false,"labels":{"true":"Safe","false":"Risky"},"explain":"The source is there so you can check it. The model can misread a table or pick the wrong row, and a quick look at the rate card would catch that."},{"type":"order","prompt":"Put the steps of a look-up in order.","items":["You ask a question","The product fetches matching documents","The documents are placed on the page","The model writes an answer from them","The answer points to its sources"],"explain":"Fetch first, then write. The model answers from what was just put on the page, which is why the answer can name the documents it came from."}],"takeaway":"A look-up fetches the right documents onto the page: ideal for facts that change, and easier to check.","tryit":"Ask an AI tool that can search or read files where an answer came from, then open the source and check one claim."},{"id":"f6-4","title":"Prompt, look-up or fine-tune?","icon":"compass","goal":"Choose between a better prompt, a look-up and fine-tuning for a given need.","steps":[{"type":"card","title":"Start with the prompt","body":"When a tap drips, you tighten it before you call a plumber. When an AI tool disappoints, start with the prompt. A clearer brief and a couple of good examples cost almost nothing, take minutes, and are often all you need. Try the cheapest fix first."},{"type":"cloze","prompt":"The cheapest and fastest fix for a disappointing answer is a better ___.","options":["chip","add-on","prompt"],"answer":2,"explain":"A prompt costs nothing to rewrite and you see the result in seconds. It makes sense to use up the cheap fix before reaching for anything heavier."},{"type":"mcq","prompt":"Captions from your AI tool come back too long and too formal. What should you try first?","options":["Order a fine-tuned model just for captions","Add a word limit and two sample captions","Move to the largest model you can find"],"answer":1,"explain":"Length and tone are things a prompt can fix. A limit and a couple of samples put the shape you want on the page, with no training and no new tools."},{"type":"card","title":"Fresh or private facts","body":"The best copywriter alive cannot quote a price list nobody has shown them. A model is the same with this morning's sales figures or a private contract. For fresh or private facts the fix is a look-up, which fetches the document onto the page."},{"type":"tf","prompt":"No wording, however clever, can make a model know this morning's sales figures if they are not on the page.","answer":true,"labels":{"true":"Fact","false":"Myth"},"explain":"A prompt can only steer what the model already has. Figures from this morning were never in its training, so they must be fetched or pasted onto the page. Check your company's policy before pasting private data."},{"type":"mcq","prompt":"Staff keep asking an assistant about the expenses policy, which changes every quarter. What fits best?","options":["A look-up that fetches the latest policy","Fine-tuning on last year's policy document","A prompt telling it to be extra accurate"],"answer":0,"explain":"The policy is private and keeps changing. A look-up reads the current version every time, while fine-tuning would build in whichever version it was trained on."},{"type":"card","title":"The same thing, at huge volume","body":"A coffee chain trains its baristas so the thousandth cup matches the first. Some AI jobs need that: every product description in one voice, thousands of times a day. If prompts cannot hold it steady, consider fine-tuning, extra training that builds the behaviour in. Try it last, not first."},{"type":"match","prompt":"Match each need to the tool to reach for first.","pairs":[["A sharper first draft","A clearer prompt with examples"],["Today's price list","A look-up that fetches the document"],["One voice, huge volume","Fine-tuning on approved examples"]],"explain":"Prompts fix most everyday problems, look-ups supply facts the model has never seen, and fine-tuning builds in a behaviour you need again and again."},{"type":"sort","prompt":"Look-up or fine-tuning? Sort each need.","buckets":["Look-up","Fine-tuning"],"items":[["Answer from this week's media plan",0],["Write 50,000 listings in one fixed voice",1],["Quote the current rate card",0],["Reply to every ticket in one fixed layout",1],["Check the newest brand guidelines",0],["Hold one house style across every reply",1]],"explain":"Missing or changing facts call for a look-up. A fixed style or behaviour repeated at huge volume is where fine-tuning earns its cost."}],"takeaway":"Start with a better prompt, add a look-up for fresh or private facts, and keep fine-tuning for fixed behaviour at volume.","tryit":"Pick one AI answer that let you down this week and decide: did it need a clearer brief or a missing fact?"},{"id":"f6-5","title":"Why AI costs money","icon":"chip","goal":"Explain why bigger models cost more, and pick the right size for a job.","steps":[{"type":"card","title":"Every word takes work","body":"Like a taxi meter, a model runs up work with every word. An answer takes billions of small calculations through its dials, its inner settings, on specialised chips. A bigger model has more dials, so it does more work per word. That takes hardware and electricity, which cost money."},{"type":"tf","prompt":"A bigger model does more work for each word it writes than a smaller one.","answer":true,"explain":"More dials means more calculations every time a word is produced. The answer may be better, but each word of it costs more to make."},{"type":"mcq","prompt":"Why does a long answer from a big model cost more than a short answer from a small one?","options":["Big models search the whole web every time","Long answers need a new round of training","More words, and more work for each word"],"answer":2,"explain":"Cost follows the amount of calculating. A longer answer means more words to produce, and a bigger model means more calculations for each of them."},{"type":"card","title":"It has to fit in memory","body":"A sofa is useless if it cannot get through the door. Likewise, a model only runs if all its dials fit in the chip's memory at once. A small model fits on a phone. A big one needs a data centre: a building full of powerful chips."},{"type":"cloze","prompt":"A model can only run if all of its dials fit in the chip's ___ at once.","options":["battery","screen","camera","memory"],"answer":3,"explain":"Every dial has to be loaded before the model can produce a single word. More dials need more memory, which limits where a model can run."},{"type":"tf","prompt":"Any model, however large, can run on a phone as long as the phone is new enough.","answer":false,"labels":{"true":"Fact","false":"Myth"},"explain":"The largest models have far more dials than a phone's memory can hold. They run on powerful chips in data centres, and your phone just sends the question and shows the answer."},{"type":"card","title":"Right-size the tool","body":"You would not hire a film crew for a passport photo. Match the model to the job. A small model is faster and cheaper, and it is plenty for simple jobs such as tagging or sorting comments. Save the big model for work that needs depth."},{"type":"sort","prompt":"Small model or big model? Sort each job.","buckets":["Small model","Big model"],"items":[["Tag 5,000 comments as happy or unhappy",0],["Draft a strategy for a tricky new market",1],["Sort emails into three folders",0],["Critique a long and complex pitch deck",1],["Spot which reviews mention delivery",0],["Weigh trade-offs in a year-long media plan",1]],"explain":"Tagging, sorting and spotting are simple, repeated jobs where a small model is quick and cheap. Open-ended thinking with many parts is where a big model earns its cost."},{"type":"mcq","prompt":"You need 20,000 survey answers tagged by topic overnight. Which choice makes the most sense?","options":["A small model: quick, cheap and good enough","The very largest model: bigger is always better","No model: tagging is beyond what AI can do"],"answer":0,"explain":"Tagging is a simple job repeated many times. A small model handles it well, and across 20,000 answers the savings in time and cost add up."}],"takeaway":"Every word costs calculations, and bigger models do more per word, so pick the smallest model that does the job well.","tryit":"Check whether an AI tool you use offers a choice of models, and try the faster one on a simple job."}]},{"id":"f7","title":"Trust, but verify","blurb":"Catch the mistake before your client does.","sessions":[{"id":"f7-1","title":"Confident and wrong","icon":"shield","goal":"Spot the parts of an AI answer that most need checking.","steps":[{"type":"card","title":"A confident wrong turn","body":"Ask for directions in an unfamiliar town and someone may point the way confidently, without knowing. A chat assistant can do the same. It predicts words that sound likely, not facts it has checked, so it can state something false in smooth, sure prose. This is often called a **hallucination**."},{"type":"cloze","prompt":"A false statement delivered in smooth, sure prose is often called a ___.","options":["hallucination","first draft","context window"],"answer":0,"explain":"A hallucination reads as smoothly as a true statement. It happens because the model predicts likely words rather than checking facts."},{"type":"mcq","prompt":"An assistant writes that your client's founder \"won a national design award\". It reads well. How should you treat the line?","options":["As true, because it is so specific","As a claim to check before using it","As a fact to move up into the headline"],"answer":1,"explain":"Specific, confident detail is exactly what a hallucination looks like. The model wrote a likely-sounding sentence, and only checking tells you whether the award exists."},{"type":"card","title":"Where the slips hide","body":"A proofreader learns where typos tend to hide. AI slips have favourite spots too. The risk is highest for exact details: names, numbers, quotes, links, dates and niche facts. Each has only one right answer, and a near miss still looks convincing. Ideas and rewording are lower risk."},{"type":"sort","prompt":"An AI draft for a client deck contains these. Which need checking first?","buckets":["Check first","Lower risk"],"items":[["A quote from a named expert",0],["A market-size number",0],["Three ideas for a headline",1],["A link to a study",0],["A friendlier opening line",1],["The date a product launched",0]],"explain":"Quotes, numbers, links and dates each have one right answer, so a slip is an error. Headline ideas and friendlier wording are matters of taste, where a miss costs little."},{"type":"tf","prompt":"You copy a quote attributed to your client's CEO from an AI draft straight into a press release.","answer":false,"labels":{"true":"Safe","false":"Risky"},"explain":"Quotes are among the riskiest details. The model can produce words the CEO never said, so the quote needs confirming with the client before it goes anywhere."},{"type":"card","title":"Check what would embarrass you","body":"A good editor cannot check every comma, but never lets a wrong name go to print. Do the same: verify anything you would be embarrassed to get wrong. Ask the assistant for its sources, then open them. A source can be made up too, with a believable title and link."},{"type":"tf","prompt":"An assistant can invent a source, with a believable title and link, that does not exist.","answer":true,"labels":{"true":"Fact","false":"Myth"},"explain":"A source is predicted text like everything else, so it can be made up. It only counts once you have opened it and seen that it says what was claimed."},{"type":"order","prompt":"A statistic in an AI draft is heading for a client deck. Put your checks in order.","items":["Ask the assistant where it came from","Open the source it names","Confirm the source really says it","Use the statistic and cite the source"],"explain":"Asking for a source is only the start. You have to open it and find the figure there yourself before the statistic has earned its place in the deck."},{"type":"mcq","prompt":"The link an assistant gave for a statistic leads to a page that does not exist. What should you do with the statistic?","options":["Keep it, since the link looked convincing","Round it off so it sounds less exact","Leave it out until you find a real source"],"answer":2,"explain":"A dead link suggests the source was invented, and perhaps the figure with it. Until you find it in a real source, it is only a likely-sounding number."}],"takeaway":"A confident answer can still be false, so check names, numbers, quotes, links and dates before they leave your desk.","tryit":"Pick one name, number or quote from an AI draft you used recently and check it against a source you trust."},{"id":"f7-2","title":"Think like a scientist","icon":"flask","goal":"Test an AI answer before you rely on it.","steps":[{"type":"card","title":"An answer is a guess to test","body":"A weather forecast is useful, but you still glance at the sky before you leave. Treat an AI answer the same way: as a **hypothesis**, a guess you can test. A scientist does not ask \"does this sound right?\" but \"how could I find out if it is wrong?\""},{"type":"cloze","prompt":"A scientist treats an AI answer as a ___ to test, not a fact to paste.","options":["guarantee","verdict","hypothesis"],"answer":2,"explain":"A hypothesis is a guess you can test. Seeing an answer that way reminds you to look for evidence before you rely on it."},{"type":"mcq","prompt":"An assistant says your client's audience \"mostly uses one social app\". What would a scientist do next?","options":["Look for audience data that could prove it wrong","Ask it again and see whether it still sounds sure","Build the media plan around that one social app"],"answer":0,"explain":"A guess earns trust by surviving a test. Real audience data could show the claim is wrong, while asking the same model again only gets you more confident wording."},{"type":"card","title":"The answer you hoped for","body":"When a review agrees with what you already think of a film, you nod and move on. We all accept answers that match our hopes more easily than answers that do not. This is called **confirmation bias**. So be most careful with the AI answer you wanted to hear."},{"type":"mcq","prompt":"What is confirmation bias?","options":["Trusting whichever answer arrives first","Doubting every answer you are given","Accepting answers that match your hopes"],"answer":2,"explain":"We wave through the answers we hoped for and save our doubts for the rest. With AI that matters, because a pleasing answer can feel checked when it has not been."},{"type":"tf","prompt":"An AI summary says your campaign worked, which is what you hoped, so you skip checking the numbers.","answer":false,"labels":{"true":"Careful","false":"Biased"},"explain":"Skipping the check because the answer is welcome is confirmation bias at work. The answer you hoped for deserves the same test as one you would have disliked."},{"type":"card","title":"The horse that could count","body":"Around 1900 a horse called Clever Hans seemed to do arithmetic, tapping out answers with his hoof. He was really reading tiny cues from people. When he could not see the questioner, he failed. A model can also look clever for the wrong reason, so test it on fresh cases."},{"type":"tf","prompt":"Clever Hans got his answers right by reading small cues from people, not by doing sums.","answer":true,"labels":{"true":"Fact","false":"Myth"},"explain":"Hans watched the people around him and stopped tapping when their faces told him to. He looked clever for a reason nobody had intended."},{"type":"order","prompt":"Put the Clever Hans story in order.","items":["A horse seems to answer sums correctly","A tester blocks his view of the questioner","His answers fall apart","The real skill emerges: reading people"],"explain":"The test that mattered was the one that took away the hidden cue. Once Hans could not see the questioner, the clever act stopped and the real explanation came out."},{"type":"mcq","prompt":"Your prompt wrote great captions for the three products you tried. What does the Clever Hans story suggest before you roll it out?","options":["Run the same three products once more","Try it on products you have not tested","Trust it, as three out of three is clear"],"answer":1,"explain":"It may have done well on those three for a reason that will not carry over. Fresh cases show whether the prompt really works or only looked clever."}],"takeaway":"Treat every AI answer as a guess to test, and test hardest when it says what you hoped to hear.","tryit":"Take one AI answer you agreed with this week and ask the assistant to argue the opposite. Notice whether your view shifts."},{"id":"f7-3","title":"Bias in, bias out","icon":"scale","goal":"Check AI drafts for who is missing or misrepresented.","steps":[{"type":"card","title":"It learned from us","body":"A new hire soon picks up the habits of the office, good and bad. A model picks up its habits from a vast amount of human writing and pictures. That material carries our stereotypes. It also has gaps, because some people and places appear far less often than others."},{"type":"tf","prompt":"A model can pick up stereotypes from the human writing and pictures it learned from.","answer":true,"labels":{"true":"Fact","false":"Myth"},"explain":"The model learns patterns from what people have written and drawn. Our stereotypes are among those patterns, so they come along with everything else."},{"type":"mcq","prompt":"Why might an assistant know less about a small regional festival than about a famous global one?","options":["It is set to prefer events with big crowds","Far less was written about it to learn from","Small festivals are removed during training"],"answer":1,"explain":"A model only knows what appeared in the material it learned from. People and places that were written about less leave gaps, and the model fills gaps with guesses."},{"type":"card","title":"How the skew shows up","body":"Search a photo library for \"boss\" and see who fills the first page. AI output can skew the same way. Ask for a picture of \"a CEO\" or \"a nurse\" and you may get one kind of person every time. Text skews too: some communities' slang gets marked \"unprofessional\"."},{"type":"cloze","prompt":"Ten AI images of \"a CEO\" all show the same kind of person. That pattern is a ___ the model picked up.","options":["stereotype","glitch","house style"],"answer":0,"explain":"In the pictures it learned from, one kind of person turned up as the CEO far more often than others, so it repeats that picture. It is a learned pattern, not a one-off glitch."},{"type":"mcq","prompt":"A tool marks a customer's casual, slangy review as \"unprofessional\". What should you keep in mind?","options":["The tool knows the rules of good writing","Slang always signals an unhappy customer","The label may reflect a learned bias"],"answer":2,"explain":"The tool learned what counts as \"professional\" from human writing, where some people's ways of speaking were judged more harshly. Its label can repeat that judgement."},{"type":"card","title":"Look for who is missing","body":"A good casting director asks who is not in the room. Do the same with AI drafts: check who is missing and who appears only as a cliché. Then get varied eyes on the work. Colleagues with different backgrounds will notice things you cannot."},{"type":"sort","prompt":"You are reviewing AI-made campaign images. Which questions help you catch bias?","buckets":["Catches bias","Other checks"],"items":[["Who is missing from these pictures?",0],["Is the logo the right size?",1],["Is anyone shown only as a cliché?",0],["Has someone unlike me looked at this?",0],["Is the file in the right format?",1]],"explain":"Bias hides in who is shown and how, so the useful questions are about people: who is absent, who is a cliché, and who else has reviewed the work."},{"type":"mcq","prompt":"Why ask colleagues with different backgrounds to review an AI-assisted campaign?","options":["They notice gaps and clichés you may miss","They can generate the images more quickly","It passes the responsibility on to them"],"answer":0,"explain":"Everyone has blind spots, and the model shares many of ours. People with different experiences spot what is missing or off before the audience does."}],"takeaway":"Models echo the stereotypes and gaps in what they learned from, so check who is missing and get varied eyes on it.","tryit":"Open a recent deck or campaign from your company and study its images, AI-made or not. Note who appears and who is missing."},{"id":"f7-4","title":"What not to paste","icon":"shield","goal":"Decide what is safe to put into an AI tool.","steps":[{"type":"card","title":"Your words can stay behind","body":"Send an email and a copy now sits on a computer you do not control. Typing into an AI tool is similar. What you enter may be stored by the company that runs the tool. With some tools and settings, it may also be used to improve the product."},{"type":"tf","prompt":"What you type into an AI tool may be stored by the company that runs it.","answer":true,"labels":{"true":"Fact","false":"Myth"},"explain":"With most AI tools your words travel to the company's computers to be answered, and they may be kept there. For how long, and for what, depends on the tool and its settings."},{"type":"mcq","prompt":"Two AI tools look alike on screen. What does that tell you about how each treats what you type?","options":["Both must follow the same shared rulebook","Nothing; it depends on each tool's settings","Both delete it once you close the chat window"],"answer":1,"explain":"Whether your text is stored, and whether it helps improve the product, varies from tool to tool and even between settings in one tool. Looks tell you nothing."},{"type":"card","title":"Three things to pause on","body":"You would not read a client's secret launch plan aloud in a busy café. Bring the same instinct to AI tools. Stop and think before pasting three kinds of material: confidential client information, unreleased work, and **personal data**, meaning details about real people, such as addresses or salaries."},{"type":"match","prompt":"Match each item to the kind of material it is.","pairs":[["Client's sales figures","Confidential client information"],["Unaired campaign film","Unreleased work"],["Staff home addresses","Personal data"]],"explain":"All three deserve a pause. The sales figures belong to the client, the film is not yet public, and home addresses are details about real people."},{"type":"sort","prompt":"Which of these should make you pause before pasting into an AI tool?","buckets":["Pause first","Lower risk"],"items":[["A client's unannounced launch date",0],["A press release that is already public",1],["A list of customer names and emails",0],["A colleague's salary details",0],["A well-known proverb you want reworded",1],["Next season's unreleased designs",0]],"explain":"Client secrets, unreleased work and details about real people call for a pause. Public or generic text carries far less risk, though your company's policy has the final word."},{"type":"card","title":"Approved tools, and ask","body":"Many workplaces keep a list of approved software, because someone has checked how each program handles data. AI tools are no different. Use the ones your company has approved and check your company's policy on what may go into them. When you are unsure, ask before you paste."},{"type":"tf","prompt":"You paste a client's unreleased plans into a new AI tool that nobody at your company has approved.","answer":false,"labels":{"true":"Safe","false":"Risky"},"explain":"Unreleased client plans are exactly what to pause on, and nobody has checked how this tool stores or uses what it is given. Use an approved tool and check your company's policy."},{"type":"tf","prompt":"You ask an AI tool your company has approved to tidy the wording of a press release that is already public.","answer":true,"labels":{"true":"Safe","false":"Risky"},"explain":"The text is already public and the tool has been checked, so little is at stake. The pause is for confidential, unreleased or personal material."},{"type":"mcq","prompt":"You are not sure whether meeting notes with client names can go into an AI tool. What is the best move?","options":["Ask first, and check your company's policy","Paste them, then delete the chat afterwards","Use a personal account instead of a work one"],"answer":0,"explain":"Deleting a chat afterwards may not undo what was sent, and a personal account has not been checked by anyone at work. A quick question costs a minute and removes the doubt."}],"takeaway":"Pause before pasting client secrets, unreleased work or personal data; use approved tools, check your company's policy and ask when unsure.","tryit":"Find your company's list of approved AI tools and its policy on what you may put into them. Save the link."},{"id":"f7-5","title":"How good is good?","icon":"gauge","goal":"Run a small, fair test of an AI tool or prompt.","steps":[{"type":"card","title":"One demo proves little","body":"One great meal does not make a great restaurant. You would go back a few times before booking the client dinner there. AI is the same: one impressive demo is not evidence. Try the tool on many examples, including awkward ones, and see how often it holds up."},{"type":"tf","prompt":"One impressive demo is solid evidence that an AI tool is reliable.","answer":false,"labels":{"true":"Fact","false":"Myth"},"explain":"A single good result can be luck, or a hand-picked best case. Only many examples, including awkward ones, show how often the tool gets things right."},{"type":"mcq","prompt":"A vendor shows a tool writing one brilliant product description. What should you ask for before trusting it?","options":["The same demo again, a little slower","A longer version of that description","A trial on many of your own products"],"answer":2,"explain":"One example was chosen to impress. Many of your own products, ordinary and awkward, show how the tool behaves on the work you would really give it."},{"type":"card","title":"Decide what good means first","body":"A judge needs the scoring rules before the contest starts. Decide what \"good\" means before you test. For sorting jobs, such as tagging comments as happy or angry, count the right answers. Writing has no single right answer, so people have to judge it."},{"type":"sort","prompt":"How would you measure \"good\" for each job?","buckets":["Count right ones","People judge"],"items":[["Tagging comments as happy or angry",0],["Writing a campaign tagline",1],["Marking emails as spam or not spam",0],["Drafting a warm apology to a customer",1],["Filing invoices under the right client",0]],"explain":"Tags, spam labels and filing each have one right answer, so you can count. A tagline or an apology can be good in many ways, so people have to judge."},{"type":"tf","prompt":"You look at a tool's answers first, and only then decide what counts as \"good\".","answer":false,"labels":{"true":"Fair test","false":"Unfair test"},"explain":"Set the rules after seeing the answers and it is easy to bend them toward the result you hoped for. Decide first, then test."},{"type":"card","title":"Keep a small test set","body":"An optician shows you the same letter chart through each lens, so the comparison is fair. Keep a small set of test examples and reuse it to compare prompts and tools. One caution: do not judge on examples you used while adjusting your prompt. It was shaped to suit those."},{"type":"order","prompt":"Put the steps of a fair test in order.","items":["Decide what good means","Run the tool on your test examples","Score each answer by that definition","Compare the scores between tools"],"explain":"The definition comes first so you cannot bend it later. Then every tool faces the same examples and the same scoring, which is what makes the comparison fair."},{"type":"mcq","prompt":"You adjusted a prompt until it nailed five sample briefs. Which examples give the fairest read on how good it is?","options":["The same five briefs, run once more","Fresh briefs you did not adjust it on","Easier briefs, to give it a fair chance"],"answer":1,"explain":"The prompt has been shaped to suit those five, so they flatter it. Briefs it was not adjusted on show how it will do on real work."},{"type":"match","prompt":"Match each testing habit to the reason behind it.","pairs":[["Many examples","One good result can be luck"],["Rules set first","Stops you bending the score afterwards"],["Same test set","Makes the comparison fair"],["Fresh examples","Shows it works beyond what you adjusted on"]],"explain":"Each habit closes a gap that can fool you: luck, moving goalposts, unfair comparisons, and a prompt that only suits the examples it was shaped on."}],"takeaway":"Judge AI on many examples, decide what good means first, and keep a small test set you did not adjust on.","tryit":"Save five real examples from your own work in a note. Run every new prompt or tool on them before you trust it."}]},{"id":"f8","title":"Beyond the chat box","blurb":"Images, agents and what comes next.","sessions":[{"id":"f8-1","title":"Pictures from noise","icon":"spark","goal":"Explain how an image generator turns static into a picture.","steps":[{"type":"card","title":"Practice at clearing static","body":"An art restorer learns by cleaning one grimy painting after another. Many image generators learn in a similar way. In training, pictures are buried in static, the visual noise of an untuned TV, and the model practises undoing it. After a huge number of pictures, it becomes good at this."},{"type":"cloze","prompt":"In training, an image generator practises removing ___ from pictures.","options":["captions","static","colours"],"answer":1,"explain":"Pictures are buried in static and the model practises undoing it. That one skill, clearing static to reveal a picture, is what it later uses to create."},{"type":"tf","prompt":"To make an image generator better at food photos, you would give it more food pictures to practise on.","answer":true,"labels":{"true":"Fact","false":"Myth"},"explain":"Its skill comes from practice, not from rules someone typed in. More food pictures mean more rounds of clearing static from exactly the kind of image you want."},{"type":"card","title":"From static to picture","body":"A sculptor starts with a rough block. An image generator starts from pure static and removes a little noise at each step, steered by your words. Drag the slider to watch.","play":{"kind":"denoise","art":"star"}},{"type":"order","prompt":"Put the steps of making an image in order.","items":["You type a description","The model starts from pure static","It removes a little noise, step by step","A finished picture appears"],"explain":"The picture is not fetched from anywhere. It begins as static and gets a little clearer at each step, with your description steering the way."},{"type":"mcq","prompt":"You type \"a red bicycle on a beach\". What do your words do while the picture forms?","options":["Search the web for a matching photo","Pick the closest picture from a library","Steer each step toward that scene"],"answer":2,"explain":"Nothing is searched or fetched. At every step the model clears static in the direction of a picture that fits your description, so your words do the steering."},{"type":"card","title":"New pixels, not a found photo","body":"A stock photo library finds a photo that already exists. An image generator does not look anything up. It makes new pixels every time, guided by what usually looks right. That is why small exact details, such as hands or the lettering on a sign, can come out wrong."},{"type":"sort","prompt":"Stock photo library or image generator?","buckets":["Stock library","Image generator"],"items":[["Finds a photo that already exists",0],["Starts from pure static",1],["Makes new pixels every time",1],["Gives everyone the same photo",0],["May garble the lettering on a sign",1]],"explain":"A library hands out photos that already exist. A generator builds each picture afresh from static, which is also why its small details can slip."},{"type":"mcq","prompt":"You generate a shop-front image for a campaign. Which part deserves the closest look before you use it?","options":["The lettering on the shop sign","The overall mood of the colours","The shape of the clouds above"],"answer":0,"explain":"Lettering is an exact detail, and exact details are where newly made pixels most often go wrong. Mood and clouds have no single right answer to miss."}],"takeaway":"Image generators build new pictures out of static, step by step, so check small details such as hands and lettering.","tryit":"Look closely at one AI-made image today. Check the hands, any lettering and the background for details that came out wrong."},{"id":"f8-2","title":"Learning by reward","icon":"trophy","goal":"Explain how software learns from rewards, and why the reward matters.","steps":[{"type":"card","title":"Learning by playing","body":"Nobody learns a video game from the manual. You press buttons, lose a life, try again and keep whatever earns points. **Reinforcement learning** works the same way. Software tries actions, receives rewards (points) for good results and comes to favour the actions that score. Nobody tells it the right move."},{"type":"cloze","prompt":"In reinforcement learning, software tries actions and receives ___ for good results.","options":["rewards","rules","answers"],"answer":0,"explain":"Rewards are the only feedback it gets. Nobody shows it the right move, so it finds out which actions pay off by trying them."},{"type":"mcq","prompt":"Which of these is most like reinforcement learning?","options":["A cook following a recipe step by step","A student copying notes from the board","A puppy learning tricks through treats"],"answer":2,"explain":"The puppy tries things and keeps what earns a treat. The cook and the student are handed the answer, which is not how learning by reward works."},{"type":"card","title":"Try something new, or repeat?","body":"Friday lunch: return to the place you love, or try the new one? Stick to favourites and you may never find something better. Only try new places and you waste good lunches. Software that learns by reward faces this choice at every step, and it needs some of each."},{"type":"sort","prompt":"Is each choice trying something new, or repeating what worked?","buckets":["Trying new","Repeating"],"items":[["Testing an ad format you have never used",0],["Re-running last month's best ad",1],["Ordering your usual lunch",1],["Taking an unfamiliar route to work",0],["Reusing last year's winning subject line",1],["Pitching to a brand-new audience",0]],"explain":"New formats, routes and audiences are bets that might turn up something better. Re-running, reordering and reusing cash in on what you already know works."},{"type":"tf","prompt":"Software that learns by reward does best if it never tries anything new.","answer":false,"explain":"If it never tries anything new, it can stay stuck on a so-so move and never meet a better one. It needs some exploring as well as some repeating."},{"type":"card","title":"You get what you reward","body":"Pay a sales team only for the number of calls and you get lots of short, rushed calls. Software is even more literal. It chases exactly the reward it is given, not what you meant. Reward a system for clicks alone and it learns to serve clickbait."},{"type":"match","prompt":"Match each reward to what it tends to produce.","pairs":[["Clicks alone","Clickbait headlines"],["Number of calls made","Lots of short, rushed calls"],["Words written","Long, padded copy"]],"explain":"In each case you get exactly what is counted, whether or not anyone wanted it. Count clicks and you get clickbait; count calls and you get rushed calls."},{"type":"mcq","prompt":"You want a system that recommends articles readers truly value. Which reward fits that goal best?","options":["How many times each headline gets clicked on","How many readers finish and rate it highly","How many articles appear on each visit"],"answer":1,"explain":"The system will chase whatever you count. Finishing and rating an article sits much closer to \"readers valued this\" than a click on a headline does."}],"takeaway":"Software can learn by trial and reward, and it chases exactly what you reward, so choose the reward with care.","tryit":"Name one number your team is judged on, then ask yourself what behaviour it rewards that nobody actually wants."},{"id":"f8-3","title":"AI that takes action","icon":"robot","goal":"Describe what an AI agent does and where it needs a human check.","steps":[{"type":"card","title":"From answering to doing","body":"A chat assistant is like an adviser who can only talk. Hand that adviser a phone, a diary and the filing cabinet and things get done. An **agent** is a model that can use tools, such as search, a calendar or files, and take several steps toward a goal."},{"type":"mcq","prompt":"What turns a chat model into an agent?","options":["A friendlier, more confident writing tone","Tools to use, plus steps toward a goal","A much longer limit on each answer"],"answer":1,"explain":"An agent is defined by what it can do, not by how it writes. It uses tools such as search or a calendar and strings several steps together to reach a goal."},{"type":"tf","prompt":"A system searches the web, checks your calendar and books a meeting room to reach a goal you set.","answer":true,"labels":{"true":"Agent","false":"Not an agent"},"explain":"It uses tools (search, calendar, booking) and takes several steps toward your goal. Tools plus steps is what makes it an agent, not just a chat."},{"type":"card","title":"The agent loop","body":"Think of cooking without a recipe: you decide the next step, do it, taste, and adjust. An agent works in the same loop. It plans a step, acts using a tool, looks at the result, then repeats until the goal is met or it gets stuck."},{"type":"order","prompt":"Put one turn of the agent loop in order.","items":["Plan the next step","Act using a tool","Look at the result","Repeat until the goal is met"],"explain":"Plan, act, look, repeat. Looking at the result is what lets an agent correct its course, much as tasting lets a cook adjust the dish."},{"type":"match","prompt":"An agent must find a venue for a client event. Match each stage to what it does.","pairs":[["Plan","Decides to search for venues near the office"],["Act","Runs the search with its search tool"],["Look at the result","Reads the list and sees two venues that fit"]],"explain":"Deciding is planning, running the search is acting, and reading what came back is looking at the result. Then the loop starts again with a new plan."},{"type":"card","title":"More power, more guardrails","body":"A new intern gets a guest pass, not the master key, and someone reads their first email before it goes out. Treat an agent the same. Limit what it can open and change, and keep a human check before anything that cannot be undone, such as sending, paying or deleting."},{"type":"sort","prompt":"An agent is helping with your work. Which actions need a human check first?","buckets":["Human check","Low stakes"],"items":[["Send an email to every client",0],["Search for venue ideas",1],["Delete a shared project folder",0],["Pay a supplier's invoice",0],["Draft notes for you to review",1]],"explain":"Sending, deleting and paying cannot be taken back, so a person should approve them first. Searching and drafting are easy to redo if they go wrong."},{"type":"mcq","prompt":"Why let an agent open only the folders one task needs, rather than the whole shared drive?","options":["So a mistake can only do limited damage","So the agent never needs a human check","So its drafts sound more professional"],"answer":0,"explain":"An agent can misread a goal or a result. If it can only reach what the task needs, a wrong step stays small and easy to put right."}],"takeaway":"An agent plans, acts and checks in a loop, so limit what it can reach and approve anything that cannot be undone.","tryit":"List three tasks in your week you would let an agent do alone, and three you would want to approve first."},{"id":"f8-4","title":"AI in the lab","icon":"dna","goal":"Explain how AI helps scientists predict the shapes of proteins.","steps":[{"type":"card","title":"Shape decides the job","body":"A key works because of its shape. So do **proteins**, the tiny machines that keep living things running. Each one starts as a long chain, then folds into a 3D shape, and that shape decides what it does. Working out just one shape could take years in a lab."},{"type":"cloze","prompt":"A protein's ___ decides what it does.","options":["colour","weight","shape"],"answer":2,"explain":"Like a key, a protein works because of its shape. The chain it starts as has to fold into the right 3D form to do its job."},{"type":"tf","prompt":"Working out the shape of a single protein could take years of lab work.","answer":true,"labels":{"true":"Fact","false":"Myth"},"explain":"Finding a shape by experiment is slow, careful work, and one protein could occupy a lab for years. That is why a faster route mattered so much."},{"type":"card","title":"AlphaFold predicts the fold","body":"Imagine predicting a finished origami figure from the creased, unfolded paper. AlphaFold, an AI system from Google DeepMind, does that for proteins: given the chain, it predicts the 3D shape. Predicted shapes for about 200 million proteins have been shared freely with scientists."},{"type":"mcq","prompt":"What does AlphaFold take in, and what does it predict?","options":["A 3D shape in, a new medicine out","A protein's chain in, its 3D shape out","A photo of a cell in, a diagnosis out"],"answer":1,"explain":"AlphaFold is given the chain a protein starts as and predicts the 3D shape it folds into, the part that could take years in a lab."},{"type":"mcq","prompt":"A researcher studying a rare disease needs the likely shape of one protein. What has changed for her?","options":["She can look up a freely shared prediction","She must wait years before any shape exists","She has to buy the shape from a private lab"],"answer":0,"explain":"Predicted shapes for about 200 million proteins have been shared freely, so she can start from a prediction today and test it in the lab."},{"type":"card","title":"Same recipe, new field","body":"The same alphabet writes poems, contracts and shopping lists. AI's basic recipe is just as flexible. AlphaFold uses the one you know from chat assistants: learn patterns from many examples, here proteins whose shapes were already known, then predict what is missing."},{"type":"match","prompt":"Match each system to what it predicts.","pairs":[["Chat assistant","The next word in a sentence"],["AlphaFold","The 3D shape a protein folds into"],["Playlist app","A song you are likely to enjoy"],["Map app","Your likely arrival time"]],"explain":"All four learned patterns from past examples and use them to predict something missing: a word, a shape, a song, an arrival time."},{"type":"tf","prompt":"AlphaFold works in a way that has nothing in common with a chat assistant.","answer":false,"labels":{"true":"Fact","false":"Myth"},"explain":"Both follow the same recipe: learn patterns from many examples, then predict what is missing. Only the field changes, from sentences to proteins."}],"takeaway":"AlphaFold predicts protein shapes with a familiar recipe: learn patterns from many examples, then predict what is missing.","tryit":"Explain to a colleague in two sentences how the idea behind autocomplete also helps scientists predict protein shapes."},{"id":"f8-5","title":"Pick the right job","icon":"compass","goal":"Match a task to the right kind of AI job and own the result.","steps":[{"type":"card","title":"Three everyday jobs","body":"A good office assistant does three things all day: files papers in the right folder, boils long documents down, and drafts new ones. AI has the same three everyday jobs. It can sort things into labels (classify), shorten (summarise), and create or converse (generate)."},{"type":"match","prompt":"Match each AI job to what it does.","pairs":[["Classify","Sorts things into labels"],["Summarise","Makes something long shorter"],["Generate","Creates something new, or converses"]],"explain":"Think of the office assistant: filing is classifying, boiling down is summarising, drafting is generating. Most everyday uses of AI are one of these three, or a mix."},{"type":"cloze","prompt":"Tagging each customer email as \"billing\", \"delivery\" or \"other\" is a job to ___.","options":["summarise","generate","classify"],"answer":2,"explain":"Each email is being put under a label, which is sorting. Nothing is being shortened and nothing new is being written."},{"type":"card","title":"Name the job first","body":"A toolbox only helps if you reach for the right tool. Name the job before you open a chat. Grouping 5,000 comments by mood is a sorting job. Cutting a long report down to one page is a shortening job. Coming up with ten headline ideas is a creating job."},{"type":"sort","prompt":"Sorting job or shortening job?","buckets":["Sorting job","Shortening job"],"items":[["Group 5,000 comments by mood",0],["Turn a long report into one page",1],["Label invoices by client",0],["Boil meeting notes down to five points",1],["Mark reviews as praise or complaint",0],["Give the gist of a long email thread",1]],"explain":"Grouping, labelling and marking put each item under a heading, which is sorting. Turning something long into something brief is shortening."},{"type":"mcq","prompt":"A client wants twenty fresh tagline options by Friday. Which kind of AI job is this?","options":["Sorting (classify)","Creating (generate)","Shortening (summarise)"],"answer":1,"explain":"Taglines that do not exist yet have to be created. Sorting and shortening both work on material you already have."},{"type":"card","title":"You stay the editor","body":"A magazine has many writers, but the editor decides what is printed and answers for it. That is your role with AI. It can sort, shorten and draft at speed, but it cannot take responsibility. AI drafts; a person decides and is accountable."},{"type":"tf","prompt":"If an AI-drafted email goes out with a mistake in it, the AI tool is accountable, not the sender.","answer":false,"labels":{"true":"Fact","false":"Myth"},"explain":"A tool cannot answer for anything. Whoever decides to send the work is accountable for it, which is why your check comes before the send button."},{"type":"sort","prompt":"Who does what when you work with AI?","buckets":["AI can draft","You decide"],"items":[["A first pass at ten subject lines",0],["Whether the work goes to the client",1],["A summary of a long transcript",0],["Which option suits the brand",1],["A rough sort of survey answers",0],["Whether a claim is safe to publish",1]],"explain":"Drafting, summarising and rough sorting are fast work AI can start. Choosing, checking and sending are judgement calls, and they stay with the accountable person."},{"type":"card","title":"What you bring","body":"You do not need to build an engine to be a good driver. You now know how these tools learn, read and slip up, and how to brief them, check them and choose the right job. That takes judgement, not code, and you use judgement at work every day."},{"type":"mcq","prompt":"An assistant hands you a strong first draft of a client proposal. What is your part now?","options":["Check it, improve it and decide what goes out","Send it on, since the draft reads so well","Start again by hand, to be on the safe side"],"answer":0,"explain":"A strong draft is a head start, not a finished job. Your judgement about the client, the facts and the timing turns it into work you can stand behind."}],"takeaway":"Name the job, let AI draft it, then check and decide yourself, because you are the editor.","tryit":"Choose one task on today's list, name it as sorting, shortening or creating, and let an assistant draft it for you to edit."}]},{"id":"f9","title":"Running your own","blurb":"Open models you can keep and run on your own machine.","sessions":[{"id":"f9-1","title":"Open models","icon":"compass","goal":"Tell a rented, hosted model from an open one, and know to read its licence.","steps":[{"type":"card","title":"Models you rent","body":"When you stream a song, it stays on the service's computers and you pay for access. Many AI assistants work like that. The maker keeps the model, the trained pattern machine, on its own computers and rents out access, by the message or by the month. These are **hosted** models."},{"type":"cloze","prompt":"A hosted model runs on ___ computers, and you pay for access to it.","options":["its maker's","your own","your client's"],"answer":0,"explain":"Hosted means the model stays with the company that made it. Your words go to its computers, the predicting happens there, and the answer comes back to your screen."},{"type":"mcq","prompt":"Your team pays a monthly fee for a chat assistant. What does that fee buy?","options":["A copy of the model to keep for good","A new model trained for your team","Access to a model the maker keeps"],"answer":2,"explain":"A monthly fee is rent. The model stays on its maker's computers the whole time, and you are paying to send it messages, not to own a copy."},{"type":"card","title":"Models you can keep","body":"Some songs you can only stream. Others you can download and keep. Models are similar. Some makers publish the finished model as a file anyone can download. These are called **open models**. Families you may hear named include Gemma, Llama, Mistral, Phi and Qwen."},{"type":"tf","prompt":"An open model is one its maker has published as a file that anyone can download.","answer":true,"labels":{"true":"Fact","false":"Myth"},"explain":"That is all open means here. The finished model is a file you can download and keep, not a service you can only reach through its maker's computers."},{"type":"sort","prompt":"Hosted or open? Sort each description.","buckets":["Hosted","Open"],"items":[["Stays on its maker's computers",0],["Published as a file",1],["You rent access by the month",0],["Anyone can download it",1],["You pay by the message",0],["You can keep your own copy",1]],"explain":"A hosted model never leaves its maker, so you rent your way in. An open model is handed over as a file, which is why you can keep a copy."},{"type":"card","title":"Open is not anything goes","body":"A stock photo is easy to download, but its terms still say where you may use it. Open models are the same. Each comes with a **licence**, written terms that say what you may do with it, including for paid client work. Read it, or ask."},{"type":"tf","prompt":"Because a model is open, you may use it for any purpose, paid client work included.","answer":false,"labels":{"true":"Fact","false":"Myth"},"explain":"Open only means the file is published. What you may do with it is set by its licence, and licences differ, so one model's terms tell you nothing about another's."},{"type":"mcq","prompt":"You would like to use an open model on a paid client project. What comes first?","options":["Reading its licence, or asking someone who can","Downloading it now and reading the terms afterwards","Nothing; open means every use is allowed"],"answer":0,"explain":"The licence says whether paid client work is allowed, so it comes before anything else. Before any download, also check your company's policy and use a source you trust."},{"type":"match","prompt":"Match each term to its meaning.","pairs":[["Hosted model","Kept on its maker's computers and rented out"],["Open model","Published as a file anyone can download"],["Licence","Written terms saying what you may do with it"]],"explain":"Hosted and open describe where the model lives: with its maker, or in a file you can keep. The licence travels with an open model and sets the rules for using it."}],"takeaway":"Hosted models are rented; open models are files you can keep. Read the licence, and check your company's policy, before using one.","tryit":"List the AI tools you use at work and ask of each: is the model on the maker's computers, or on mine?"},{"id":"f9-2","title":"Will it fit?","icon":"memory","goal":"Explain why only small models fit on a laptop, and how models are shrunk.","steps":[{"type":"card","title":"Size is counted in dials","body":"A book's length is counted in pages. A model's size is counted in dials, the inner settings that training sets. Small open models, the kind published as files, have a few billion dials. The largest assistants have far more. More dials can hold more patterns and take up more room."},{"type":"cloze","prompt":"A model's size is counted in ___, the inner settings that training sets.","options":["chats","dials","words"],"answer":1,"explain":"Counting dials tells you how much there is to store and to work through. It is the number people have in mind when they call a model small or large."},{"type":"mcq","prompt":"A small open model has a few billion dials. How do the largest assistants compare?","options":["They have about the same number","They have far fewer dials","They have far more dials"],"answer":2,"explain":"A few billion sounds huge, yet it is the small end. The largest assistants have far more dials, which is part of why they can do more and why they need so much more room."},{"type":"card","title":"The whole model has to fit","body":"Hand luggage only flies if the whole bag fits in the locker. A model only runs if all its dials fit in your machine's memory at once. A recent laptop can hold a small model. A phone can hold only the very smallest. The largest need buildings full of chips."},{"type":"tf","prompt":"A model only runs if all of its dials fit in the machine's memory at once.","answer":true,"explain":"Every dial has to be loaded before the first word can be predicted. A model that half fits does not run, just as a bag that half fits does not fly."},{"type":"order","prompt":"Order these by the size of model each can hold, smallest first.","items":["A phone","A recent laptop","A building full of chips"],"explain":"More memory holds more dials. A phone has room for only the very smallest models, a recent laptop for a small one, and the largest need whole buildings of chips."},{"type":"card","title":"Shrinking a model to fit","body":"Save a photo at lower quality and the file gets much smaller, while the picture looks only slightly worse. Models are often shrunk the same way: each dial is stored less precisely, like a rounded-off number. The result is much smaller and slightly worse."},{"type":"mcq","prompt":"How are models often shrunk so that they fit on smaller machines?","options":["By storing each dial less precisely","By training them on far fewer examples","By cutting their answers shorter"],"answer":0,"explain":"Each dial's setting is rounded off, so it takes less room to store. The model keeps all of its dials; each one is just held a little less exactly."},{"type":"tf","prompt":"A shrunk model answers exactly as well as the full-size original.","answer":false,"labels":{"true":"Fact","false":"Myth"},"explain":"Like the photo saved at lower quality, a little is lost. A shrunk model is much smaller and slightly worse, a trade people accept so that it fits."},{"type":"sort","prompt":"Will it fit? Sort each pairing.","buckets":["Can fit","Too big"],"items":[["A small open model on a recent laptop",0],["One of the largest assistants on a phone",1],["The very smallest model on a phone",0],["One of the largest assistants on a laptop",1],["A shrunk small model on a recent laptop",0]],"explain":"It comes down to whether all the dials fit in memory. A recent laptop can hold a small model and a phone only the very smallest. The largest assistants are too big for either."}],"takeaway":"A model must fit whole in your machine's memory; small ones fit on a laptop, and shrinking makes them smaller but slightly worse.","tryit":"Open your laptop's settings and find how much memory it has. That figure limits how large a model it could ever hold."},{"id":"f9-3","title":"Running one yourself","icon":"chip","goal":"Describe what it takes to run an open model on your own machine.","steps":[{"type":"card","title":"A runner is just an app","body":"A music file is silent without a player app. An open model's file needs one too. A **runner** is an ordinary app that loads the model file and gives you a chat window. Ollama and LM Studio are two widely used ones. Check your company's policy before installing one."},{"type":"mcq","prompt":"What does a runner do?","options":["Trains a new model from your own files","Loads a model file and opens a chat window","Sends your messages to a hosted assistant"],"answer":1,"explain":"A runner makes nothing new. It opens a model file that already exists and gives you somewhere to type, much as a player app opens a music file."},{"type":"order","prompt":"A colleague wants to try an open model on a work laptop. Put the steps in order.","items":["Check the company's policy","Install a runner from a trusted source","Use it to load a model file","Type a request in the chat window"],"explain":"Policy comes before anything is installed. Then the runner must be in place before it can load a model file, and both should come from sources you trust."},{"type":"card","title":"No internet, no fee per message","body":"A downloaded playlist still plays on a plane. Once the model file is downloaded from a source you trust, it works with no internet too, because the next-word predicting happens on your own chip. There is no fee per message. The cost is your hardware, your electricity and your patience."},{"type":"tf","prompt":"A model on your own machine has no fee per message, but it still costs hardware, electricity and patience.","answer":true,"labels":{"true":"Fact","false":"Myth"},"explain":"Nobody bills you for each message, because your own chip is doing the work. That work still needs a capable machine, uses electricity and takes time."},{"type":"mcq","prompt":"You are on a train with no signal and want your rough meeting notes tidied. Which could still do it?","options":["A hosted assistant, run on its maker's computers","Neither; every AI model needs a signal to work","A model already downloaded to your laptop"],"answer":2,"explain":"A hosted assistant needs the internet to reach its maker's computers. A downloaded model does its predicting on your own chip, so it carries on with no signal at all."},{"type":"card","title":"You trade power for control","body":"A home printer cannot match a print shop for speed or finish, but it is yours and right there. A model on your own machine, a **local** model, is similar. Expect it to be slower and less capable than the big hosted assistants. You trade power for control."},{"type":"cloze","prompt":"Next to the big hosted assistants, expect a local model to be slower and less ___.","options":["private","capable","portable"],"answer":1,"explain":"A model small enough for your machine has far fewer dials than the big hosted assistants, so it can do less, and your own chip is no match for a building full of them."},{"type":"tf","prompt":"A colleague expects the model on her laptop to write as quickly and as well as the biggest hosted assistant.","answer":false,"labels":{"true":"Realistic","false":"Too hopeful"},"explain":"She is trading power for control. The model is hers to run and works with no internet, but it is far smaller, so slower and less capable is the fair expectation."},{"type":"sort","prompt":"You move a job from a hosted assistant to a local model. What do you gain, and what do you give up?","buckets":["You gain","You give up"],"items":[["Working with no internet",0],["Some speed",1],["No fee per message",0],["Some capability",1],["Control over where it runs",0]],"explain":"Running it yourself brings control: it works with no internet, on your machine, with no fee per message. What you give up is power, because a model small enough to fit is slower and less capable."}],"takeaway":"A runner app lets a downloaded model work on your own chip: no internet, no fee per message, but slower and less capable.","tryit":"Open the Lab tab and look at step four of the ownership ladder. Check your company's policy before installing anything on a work machine."},{"id":"f9-4","title":"Private, not perfect","icon":"shield","goal":"Explain what running a model locally protects, and what it leaves to you.","steps":[{"type":"card","title":"Your words stay put","body":"Post a letter and it passes through other hands. Likewise, what you type into a hosted tool travels to the company's computers and may be stored there. With a local model, one running on your own machine, what you type stays there. That is the main safety gain."},{"type":"tf","prompt":"With a local model, what you type stays on your own machine.","answer":true,"labels":{"true":"Fact","false":"Myth"},"explain":"The model does its predicting on your own chip, so your words are not sent to anyone else's computers. That is the main safety gain over a hosted tool."},{"type":"mcq","prompt":"A two-page client brief must not leave the building. If your company's policy allows a local model, why might one suit a summary?","options":["It writes better than the hosted tools do","What you type stays on your own machine","It has more up-to-date facts to draw on"],"answer":1,"explain":"The brief never travels to another company's computers, which is what the client asked for. A local model is not a better or fresher writer; its gain is keeping your words where they are."},{"type":"card","title":"Private does not mean right","body":"A locked diary keeps your words private. It does not make them true. A local model is the same. It still predicts words that sound likely, not facts it has checked, so it can be fluent and wrong like any other model. Every checking habit still applies."},{"type":"cloze","prompt":"A local model keeps your words private, but its answers still need ___.","options":["checking","translating","shortening"],"answer":0,"explain":"Privacy is about where your words go. Accuracy is about what comes back. Running a model locally changes the first and does nothing for the second."},{"type":"mcq","prompt":"A local model drafts a client email that quotes a market-size figure. What do you do before sending?","options":["Send it, since nothing left your machine","Ask the model whether it is sure, then send","Check the figure against a source you trust"],"answer":2,"explain":"Numbers are where fluent and wrong hurts most, and a local model slips just as a hosted one can. Its own reassurance is only more predicted text, so the check has to be yours."},{"type":"card","title":"New duties come with it","body":"Hire a car and the firm services it. Own one and the upkeep is yours. A local model brings duties too. Download models and runners, the apps that load them, only from sources you trust. Check the licence. Check your company's policy before installing anything on a work machine."},{"type":"tf","prompt":"You find a runner on an unfamiliar website and install it on your work laptop without asking anyone.","answer":false,"labels":{"true":"Safe","false":"Risky"},"explain":"Two duties were skipped. A file from a site you do not know may not be what it claims, and anything installed on a work machine needs your company's policy checked first."},{"type":"match","prompt":"Match each duty to the reason for it.","pairs":[["Trusted sources only","An unknown file may not be what it claims"],["Read the licence","It says whether client work is allowed"],["Check company policy","Your company sets the rules for its machines"]],"explain":"None of this is difficult. It is the care you would take with any new software, plus one extra step: reading the terms that come with the model."},{"type":"sort","prompt":"What does running a model locally take care of, and what is still your job?","buckets":["Local covers it","Still your job"],"items":[["Keeping what you type on your machine",0],["Checking names, numbers and quotes",1],["Not sending your words to another company",0],["Reading the model's licence",1],["Choosing sources you trust",1],["Following your company's policy",1]],"explain":"Running locally settles one thing: where your words go. Whether the answer is right, whether the licence allows the job and whether the software can be trusted are still yours to check."}],"takeaway":"A local model keeps your words on your machine, but its answers still need checking and the upkeep is yours.","tryit":"Ask your IT team whether your company's policy covers running AI models on a work laptop, and which sources they would trust."},{"id":"f9-5","title":"Is local enough?","icon":"scale","goal":"Decide which jobs suit a small local model and which need more power.","steps":[{"type":"card","title":"Good at contained jobs","body":"A bicycle is plenty for the corner shop. Small local models, the ones that run on your own machine, do well at contained jobs: rewriting a caption, tidying meeting notes, tagging survey comments, a short summary. The task is small and everything needed is on the page."},{"type":"tf","prompt":"You use a small local model to turn rough meeting notes into a tidy list of actions.","answer":true,"labels":{"true":"Good fit","false":"Poor fit"},"explain":"Tidying notes is a contained job. The task is small and everything the model needs is on the page, which is where small local models do well. Read the list through before you share it."},{"type":"mcq","prompt":"Which of these jobs suits a small local model?","options":["Tagging 200 survey comments by topic","Finding this week's news about a rival","Planning a year-long, many-part campaign"],"answer":0,"explain":"Tagging is a contained job: each comment is short and all the model needs is on the page. The other two ask for far more than a small, self-contained task."},{"type":"card","title":"Where small models struggle","body":"The bicycle is the wrong choice for moving house. Small local models struggle with long documents, with hard problems that take many steps of reasoning, and with anything that needs fresh facts. On its own, a model knows nothing newer than its training."},{"type":"sort","prompt":"Good fit or poor fit for a small local model?","buckets":["Good fit","Poor fit"],"items":[["Rewrite a caption in a warmer tone",0],["Summarise a 90-page research report",1],["Fix the grammar in one paragraph",0],["Find this week's news on a rival brand",1],["Sum up one short email in two lines",0],["Solve a tangled, many-step budget problem",1]],"explain":"Short, contained jobs suit a small local model. Long documents, many-step reasoning and fresh facts are where it struggles, and where a big hosted tool, run on its maker's computers, earns its place."},{"type":"tf","prompt":"You ask a small local model which campaigns won industry awards last week.","answer":false,"labels":{"true":"Good fit","false":"Poor fit"},"explain":"Last week's winners are fresh facts. On its own, a model knows nothing newer than its training, so it may answer with a confident list it has made up."},{"type":"card","title":"Test before you trust","body":"To choose between two freelancers, give both the same brief. Do that here. Run the same handful of real tasks through a local model and a hosted tool, one run on its maker's computers, then compare. Use local where it is good enough, and hosted where you need the power."},{"type":"order","prompt":"Put the steps of a fair local-versus-hosted test in order.","items":["Pick a handful of real tasks","Run the same tasks through both","Compare the answers side by side","Use local where it was good enough"],"explain":"The same real tasks for both is what makes the test fair. Stick to tools your company's policy allows, and keep confidential material out of the hosted run."},{"type":"mcq","prompt":"In your test, the local model tags comments well but muddles a long report. What is the sensible plan?","options":["Stop using the local model altogether","Use local for tagging, hosted for the report","Use the local model for both jobs anyway"],"answer":1,"explain":"The test showed where local is good enough and where it is not. Matching each job to the tool that handles it keeps words on your machine where you can and brings power where you must."},{"type":"match","prompt":"Match each situation to a sensible next step.","pairs":[["Tidying meeting notes","A small local model is likely enough"],["A 90-page report","Needs the power of a big hosted tool"],["Not sure which to use","Run the same real tasks through both"],["Either tool's answer","Check it before it leaves your desk"]],"explain":"Contained jobs suit local, heavy jobs need more power, and a small test on your own tasks settles the doubtful cases. Whichever tool wrote the answer, you still check it."}],"takeaway":"Use a small local model for contained jobs, a big hosted tool where you need power, and test both on real tasks.","tryit":"Sort this week's AI jobs into two lists: small, contained ones, and big ones that need long documents, fresh facts or many steps."}]}]},{"id":"builder","title":"Builder","note":"The hands-on track, adapted from Google DeepMind’s course notebooks. Includes Python and some maths. Every chapter is open.","chapters":[{"id":"intro","title":"AI Kickoff","blurb":"DeepMind Educational · Introductory","repo":"educational","sessions":[{"id":"intro-1a","title":"Thinking like a scientist","part":1,"icon":"flask","lab":"colabs/introductory/scientific_thinking.ipynb","goal":"Learn the ideas, then try the first checks.","steps":[{"type":"card","title":"The scientific method","body":"Science is an organised way of learning about the world by observing it. Step 1: observe something, then propose a hypothesis that is testable (you can check it in practice) and falsifiable (some evidence could prove it wrong). Step 2: design an experiment and analyse the results. Step 3: judge the hypothesis: supported, refuted or inconclusive. Every one of those outcomes is new knowledge."},{"type":"card","title":"Don't fall for your own guess","body":"Once we like a hypothesis, we tend to look only for evidence that agrees with it. That's confirmation bias. In the notebook's number game, a hidden rule decides which triplets of numbers pass. Trying triplets that could break your guess teaches you far more than trying ones you already expect to pass.","code":"def check(x, y, z):\n  return z == x + y"},{"type":"card","title":"Occam's razor","body":"If two hypotheses explain the data equally well, prefer the one with fewer assumptions. Each uncertain assumption has a probability below 1, and for independent assumptions you multiply them, so every extra one shrinks the total. Coin on the pavement: 'it fell from a pocket' scores 0.8 × 0.9 = 0.72, while 'a pigeon snatched and dropped it' scores about 0.39."},{"type":"card","title":"Clever Hans and hidden rewards","body":"Hans the horse seemed to do arithmetic, until Oskar Pfungst blocked his view of the questioner: his accuracy fell from 89% to 6%. Hans had been reading tiny cues in people's faces. Reinforcement-learning agents face a similar puzzle. Like scientists, they must experiment, observe what earns reward, and avoid fooling themselves."},{"type":"mcq","level":1,"prompt":"What makes a hypothesis falsifiable?","options":["Experts in the field already agree that it is true","Some possible evidence could show that it is wrong","It can be written down in a single short sentence","It explains every observation anyone has made"],"answer":1,"explain":"A falsifiable hypothesis can be disproved by evidence. For example, you could time two falling rocks to see whether they really land together."},{"type":"tf","level":1,"prompt":"Refuted or inconclusive results are wasted effort in science.","answer":false,"explain":"They are just as important as supported results: they add to what we know and shape the next hypotheses we test."},{"type":"order","level":1,"prompt":"Put the steps of the scientific method in order.","items":["Make an observation","Propose a testable, falsifiable hypothesis","Design and run an experiment","Analyse the results","Judge whether the hypothesis holds"],"explain":"Observe, hypothesise, experiment, analyse, then validate. The outcome then feeds the next round of hypotheses."},{"type":"cloze","level":1,"prompt":"Preferring the explanation that needs the fewest assumptions is called ___.","options":["Occam's razor","confirmation bias","falsifiability","joint probability"],"answer":0,"explain":"Occam's razor: when hypotheses explain the data equally well, the simpler one, with fewer assumptions, is more likely to be true."},{"type":"cloze","level":1,"prompt":"With the questioner out of sight, Clever Hans's accuracy fell from 89% to ___.","options":["6%","45%","70%","85%"],"answer":0,"explain":"Without seeing the questioner, Hans had no cues to read, so his 'maths' collapsed to just 6%."},{"type":"match","level":1,"prompt":"Match each name to its role in the Clever Hans story.","pairs":[["Wilhelm von Osten","Maths teacher who trained Hans and toured Germany"],["Carl Stumpf","Led the 1904 commission that found no trickery"],["Oskar Pfungst","Designed the experiments that exposed the cues"],["Clever Hans","Horse believed to do arithmetic"]],"explain":"Von Osten sincerely believed in Hans, Stumpf's commission saw no trick, and Pfungst's careful experiments revealed the real explanation."},{"type":"mcq","level":2,"prompt":"Which of these hypotheses is testable today?","options":["Two different-sized rocks dropped from one height land together","Different-sized rocks dropped onto the sun's surface land together","Rocks fell differently before anyone was around to watch"],"answer":0,"explain":"You can drop two rocks and time them. Testing on the sun isn't practical (yet, because it burns!), and the distant past can't be observed directly."},{"type":"tf","level":2,"prompt":"If every triplet you test fits your guess, your guess must be the true rule.","answer":false,"explain":"Many rules can fit the same examples. Only tests designed to break your guess can rule out the alternatives. Otherwise you are falling for confirmation bias."}]},{"id":"intro-1b","title":"Thinking like a scientist","part":2,"icon":"flask","lab":"colabs/introductory/scientific_thinking.ipynb","goal":"Apply them to harder, hands-on questions.","steps":[{"type":"tf","level":2,"prompt":"Occam's razor guarantees that the simplest hypothesis is always the true one.","answer":false,"explain":"It says the simpler hypothesis is more likely, not certain. New evidence can still overturn it."},{"type":"mcq","level":2,"prompt":"What was Clever Hans really doing?","options":["Following a secret code from his owner","Reading subtle cues from whoever asked","Memorising answers to common questions","Counting with real arithmetic skill"],"answer":1,"explain":"Pfungst ruled out a secret code by using other questioners. Hans slowed his hoof taps and stopped when people's expressions signalled the answer."},{"type":"match","level":2,"prompt":"Match each step of science to its meaning.","pairs":[["Observation","Actively collecting information about something"],["Hypothesis","A proposed explanation you can put to the test"],["Experiment","A procedure designed to test a hypothesis"],["Analysis","Examining results closely, e.g. fitting a formula"]],"explain":"Observing gathers information, a hypothesis proposes an explanation, an experiment tests it, and analysis makes sense of the results."},{"type":"mcq","level":2,"prompt":"In reinforcement learning, how is an agent like a scientist?","options":["It is told the reward rule before it starts","It copies an expert's actions step by step","It tries things, observes rewards and adapts","It follows a fixed plan whatever happens"],"answer":2,"explain":"The agent must discover what is rewarding by experimenting and learning from outcomes, the same test-and-learn loop a scientist uses."},{"type":"mcq","level":3,"prompt":"The hidden rule in the number game is `check` below. Which triplet passes?","code":"def check(x, y, z):\n  return z == x + y","options":["2, 4, 8","3, 4, 7","2, 2, 2","5, 5, 5"],"answer":1,"explain":"The rule only asks whether the third number equals the sum of the first two: 3 + 4 = 7. The others fail, e.g. 2 + 4 is 6, not 8."},{"type":"mcq","level":3,"prompt":"Three independent assumptions have probabilities 0.5, 0.8 and 0.5. What is the probability that all three hold?","options":["0.6","1.8","0.4","0.2"],"answer":3,"explain":"Multiply independent probabilities: 0.5 × 0.8 × 0.5 = 0.2. Adding them (1.8) can't be right, since a probability can never exceed 1."},{"type":"cloze","level":3,"prompt":"Pigeon hypothesis: P(C, D) = 0.72. Adding 'the pigeon stole the coin' (0.6) gives P(C, D, E) = ___.","options":["0.72","1.32","0.432","0.12"],"answer":2,"explain":"0.72 × 0.6 = 0.432. One more assumption (it dropped the coin, 0.9) brings it to 0.3888, well below the pocket hypothesis's 0.72."},{"type":"mcq","level":3,"prompt":"Suppose every step costs −1 reward and nothing else gives any reward. What is the best total an episode can score?","options":["−1","+1","−10","0"],"answer":3,"explain":"Every move loses a point, so the best strategy is to end the episode straight away and score 0, the maximum in the notebook's Game 2."}]},{"id":"intro-2a","title":"Fun with language","part":1,"icon":"chat","lab":"colabs/introductory/fun_with_language.ipynb","goal":"Learn the ideas, then try the first checks.","steps":[{"type":"card","title":"Text becomes numbers","body":"To a computer, 'pancake' is just a list of character codes. Add 1 to each code and you get 'qbodblf': nonsense to us, but no different to the machine. So
