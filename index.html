}
function resultNext() {
  if (L.paneIdx < L.panes.length - 1) { L.paneIdx++; renderPane(); return; }
  endLesson();
}
function countUp(n) { return `<span class="count" data-to="${n}">${REDUCED_MOTION ? n : 0}</span>`; }
function animateCounts() {
  if (REDUCED_MOTION) return;
  $$('.count').forEach((el) => {
    const to = Number(el.dataset.to);
    const t0 = performance.now();
    const step = (t) => {
      const k = clamp((t - t0) / 700, 0, 1);
      el.textContent = Math.round(to * (1 - Math.pow(1 - k, 3)));
      if (k < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  });
}

// ---------- sound ----------
let AC = null;
function audio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; } }
  if (AC && AC.state === 'suspended') AC.resume().catch(() => {});
  return AC;
}
function tone(ac, freq, t0, dur, type = 'sine', gain = 0.16) {
  const o = ac.createOscillator();
  const g = ac.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t0);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(gain, t0 + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g).connect(ac.destination);
  o.start(t0);
  o.stop(t0 + dur + 0.02);
}
function sound(kind) {
  if (!S.settings.sound) return;
  const ac = audio();
  if (!ac) return;
  const t = ac.currentTime + 0.01;
  try {
    if (kind === 'good') { tone(ac, 740, t, 0.12, 'triangle'); tone(ac, 1108, t + 0.08, 0.2, 'triangle'); }
    else if (kind === 'bad') { tone(ac, 196, t, 0.18, 'sawtooth', 0.06); tone(ac, 147, t + 0.12, 0.24, 'sawtooth', 0.06); }
    else if (kind === 'done') { [523, 659, 784, 1047].forEach((f, i) => tone(ac, f, t + i * 0.09, 0.26, 'triangle', 0.14)); }
    else if (kind === 'chest') { [784, 988, 1175, 1568].forEach((f, i) => tone(ac, f, t + i * 0.06, 0.2, 'sine', 0.12)); }
    else if (kind === 'tap') { tone(ac, 520, t, 0.05, 'sine', 0.05); }
  } catch (e) { /* audio unavailable */ }
}

// ---------- confetti ----------
function burstConfetti() {
  if (REDUCED_MOTION) return;
  const cv = $('#confetti');
  const ctx = cv.getContext && cv.getContext('2d');
  if (!ctx) return;
  const dpr = window.devicePixelRatio || 1;
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
  ctx.scale(dpr, dpr);
  const colors = ['#FFC233', '#22B45E', '#3B5BFF', '#E0457B', '#18C2D6', '#FF8A1F'];
  const parts = Array.from({ length: 90 }, () => ({
    x: innerWidth / 2 + (Math.random() - 0.5) * 120, y: innerHeight * 0.35,
    vx: (Math.random() - 0.5) * 11, vy: -Math.random() * 12 - 4, r: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 0.4,
    w: 6 + Math.random() * 6, h: 8 + Math.random() * 8, c: colors[Math.floor(Math.random() * colors.length)],
  }));
  cv.hidden = false;
  const t0 = performance.now();
  const frame = (t) => {
    const k = (t - t0) / 1600;
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    for (const p of parts) {
      p.vy += 0.35; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.vx *= 0.99;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.globalAlpha = Math.max(0, 1 - k);
      ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore();
    }
    if (k < 1) requestAnimationFrame(frame); else { ctx.clearRect(0, 0, innerWidth, innerHeight); cv.hidden = true; }
  };
  requestAnimationFrame(frame);
}

// ---------- events ----------
function buy(item) {
  const price = PRICES[item];
  if (S.tokens < price) return toast('Not enough tokens yet.');
  if (item === 'freeze') {
    if (S.streak.freezes >= MAX_FREEZES) return toast(`You can hold ${MAX_FREEZES} freezes at a time.`);
    S.streak.freezes++;
    toast(`${icon('snow')} Streak Freeze equipped`);
  } else if (item === 'hearts') {
    S.hearts = MAX_HEARTS;
    S.heartsAt = Date.now();
    toast(`${heartGlyph(18)} Hearts refilled`);
  } else if (item === 'boost') {
    S.boostUntil = Date.now() + BOOST_MS;
    toast(`${xpGlyph(18)} Double XP for 15 minutes`);
  }
  S.tokens -= price;
  sound('chest');
  save();
  closeSheet();
  render();
}

const ACTIONS = {
  tab: (d) => { closeSheet(); if (L) endLesson(); UI.tab = d.tab; UI.scrollToCurrent = d.tab === 'learn'; render(); window.scrollTo(0, 0); },
  node: (d) => openNodeSheet(Number(d.i)),
  'close-sheet': () => closeSheet(),
  'start-skill': (d) => startSkillLesson(d.skill),
  'start-legend': (d) => startLegend(d.skill),
  'start-checkpoint': (d) => startCheckpoint(d.unit),
  'start-jump': (d) => startJump(d.unit),
  'start-lightning': () => startLightning(),
  'start-mistakes': () => startMistakes(),
  'start-review': () => startReview(),
  'again-lightning': () => { endLesson(); startLightning(); },
  'retry-legend': (d) => { endLesson(); startLegend(d.skill); },
  'retry-jump': (d) => { endLesson(); startJump(d.unit); },
  tips: (d) => openTips(d.skill),
  guide: (d) => openGuide(d.unit),
  jump: (d) => openJump(d.unit),
  shop: () => openShop(),
  buy: (d) => buy(d.item),
  settings: () => openSettings(),
  dismiss: (d) => { S.dismissed[d.key] = true; save(); render(); },
  'streak-info': () => openSheet(`<div class="node-sheet center">${flameGlyph(practicedToday(), 72)}<h3>${plural(S.streak.count, 'day')} streak</h3>
    <p>${practicedToday() ? 'You practised today. See you tomorrow.' : 'Finish a lesson today to keep your streak.'}</p>
    <p class="muted small">Best: ${plural(S.streak.best, 'day')} · ${plural(S.streak.freezes, 'Streak Freeze', 'Streak Freezes')} equipped</p>
    <button class="btn wide" data-action="buy" data-item="freeze" ${S.tokens < PRICES.freeze || S.streak.freezes >= MAX_FREEZES ? 'disabled' : ''}>${icon('snow')} Buy a freeze · ${PRICES.freeze}</button></div>`),
  'hearts-info': () => {
    syncHearts();
    const full = S.hearts >= MAX_HEARTS || heartsUnlimited();
    openSheet(`<div class="node-sheet center"><div class="heart-row">${Array.from({ length: MAX_HEARTS }, (_, i) => heartGlyph(34, heartsUnlimited() || i < S.hearts)).join('')}</div>
      <h3>${heartsUnlimited() ? 'Unlimited hearts' : `${S.hearts} of ${MAX_HEARTS} hearts`}</h3>
      <p>${heartsUnlimited() ? 'Mistakes never lock you out. Change this in Settings.' : full ? 'You are at full hearts. Each mistake in a lesson costs one.' : `Next heart in ${fmtDuration(nextHeartIn())}. Fix mistakes in Practice to earn one back.`}</p>
      ${full ? '' : `<button class="btn primary wide" data-action="buy" data-item="hearts" ${S.tokens < PRICES.hearts ? 'disabled' : ''}>${tokenGlyph(18)} Refill for ${PRICES.hearts}</button>`}</div>`);
  },
  claim: (d) => {
    const q = S.quests.list[Number(d.q)];
    if (!q || q.claimed || q.progress < q.goal) return;
    q.claimed = true;
    S.tokens += q.reward;
    sound('chest');
    save();
    render();
    toast(`${tokenGlyph(18)} +${q.reward} tokens`);
  },
  'bonus-chest': () => {
    if (S.quests.bonus) return;
    S.quests.bonus = true;
    S.tokens += 40;
    save();
    sound('chest');
    burstConfetti();
    render();
    openSheet(`<div class="reward">${tokenGlyph(64)}<h3>+40 tokens</h3><p>All three quests done. New ones arrive at midnight.</p><button class="btn primary wide" data-action="close-sheet">Nice</button></div>`);
  },
  'set-goal': (d) => {
    S.goal = Number(d.xp);
    if (S.quests.list[0] && S.quests.list[0].metric === 'xp' && !S.quests.list[0].claimed) { S.quests.list[0].goal = S.goal; S.quests.list[0].text = `Earn ${S.goal} XP`; }
    save();
    $$('.seg button').forEach((b) => b.classList.toggle('on', Number(b.dataset.xp) === S.goal));
    render();
  },
  'toggle-sound': (d, el) => { S.settings.sound = el.checked; save(); },
  'toggle-hearts': (d, el) => { S.settings.unlimitedHearts = el.checked; save(); render(); },
  backup: () => {
    const code = exportCode();
    const done = () => toast(`${icon('check')} Backup code copied`);
    const fallback = () => {
      const box = $('#restore-box');
      box.hidden = false;
      const ta = $('#restore-code');
      ta.value = code;
      ta.select();
      $('#restore-msg').textContent = 'Copy this code and keep it somewhere safe.';
    };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(code).then(done, fallback);
    else fallback();
  },
  'restore-open': () => { $('#restore-box').hidden = false; $('#restore-code').value = ''; $('#restore-code').focus(); },
  restore: () => {
    try {
      importCode($('#restore-code').value);
      closeSheet();
      UI.scrollToCurrent = true;
      render();
      toast(`${icon('check')} Progress restored`);
    } catch (e) {
      $('#restore-msg').textContent = e.message || 'That code could not be read.';
    }
  },
  'reset-ask': () => { $('#reset-box').hidden = false; },
  'reset-do': () => {
    S = defaultState();
    save();
    closeSheet();
    UI.tab = 'learn';
    UI.onboardStep = 0;
    renderOnboarding();
  },
  // onboarding
  'ob-next': () => { UI.onboardStep++; renderOnboarding(); },
  'ob-goal': (d) => { S.goal = Number(d.xp); renderOnboarding(); },
  'ob-start': (d) => finishOnboarding(d.at),
  // lesson
  'card-next': () => cardNext(),
  pick: (d) => pick(d.v),
  unpick: () => unpick(),
  'order-add': (d) => orderAdd(d.v),
  'order-remove': (d) => orderRemove(d.v),
  match: (d) => matchTap(d.side, d.v),
  check: () => checkAnswer(),
  'lesson-next': () => lessonNext(),
  'lesson-quit': () => {
    if (!L || L.result) return endLesson();
    openSheet(`<div class="node-sheet center">${mascot('sad', 80)}<h3>Leave this lesson?</h3><p>You will lose the progress you made in it.</p>
      <button class="btn primary wide" data-action="close-sheet">Keep learning</button>
      <button class="btn bad-outline wide" data-action="lesson-close">End lesson</button></div>`);
  },
  'lesson-close': () => { closeSheet(); endLesson(); },
  'refill-continue': () => {
    if (S.tokens < PRICES.hearts) return;
    S.tokens -= PRICES.hearts;
    S.hearts = MAX_HEARTS;
    S.heartsAt = Date.now();
    save();
    renderLesson();
  },
  'result-next': () => resultNext(),
};

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-action]');
  if (!el || el.disabled) return;
  if (el.tagName === 'INPUT') return;
  const fn = ACTIONS[el.dataset.action];
  if (!fn) return;
  e.preventDefault();
  fn(el.dataset, el);
});
document.addEventListener('change', (e) => {
  const el = e.target;
  if (el.id === 'set-name') { S.name = el.value.trim().slice(0, 24); save(); render(); return; }
  const fn = el.dataset && ACTIONS[el.dataset.action];
  if (fn) fn(el.dataset, el);
});
document.addEventListener('keydown', (e) => {
  if (e.target.matches && e.target.matches('input, textarea')) return;
  if (!L) return;
  if (e.key === 'Enter') {
    const btn = $('#lesson [data-action="lesson-next"], #lesson [data-action="check"]:not([disabled]), #lesson [data-action="card-next"], #lesson [data-action="result-next"]');
    if (btn) { e.preventDefault(); btn.click(); }
    return;
  }
  const n = Number(e.key);
  if (n >= 1 && n <= 4 && L.q && !L.q.answered) {
    const opts = $$('#ls-body [data-action="pick"]');
    if (opts[n - 1]) opts[n - 1].click();
  }
});

// Keeps the day, hearts, league and quests current when the app returns to the foreground.
function refreshClock() {
  syncHearts();
  const r = refreshStreak();
  syncLeague();
  ensureQuests();
  save();
  if (!L) render(); else renderTopbar();
  if (r.frozeDays) toast(`${icon('snow')} A Streak Freeze saved your ${S.streak.count}-day streak`, 3600);
  if (r.lost) toast('Your streak reset. Start a new one today.', 3600);
  const p = S.league.pending;
  if (p && !L) {
    S.league.pending = null;
    save();
    const up = p.to > p.from;
    const down = p.to < p.from;
    openSheet(`<div class="node-sheet center"><span class="league-badge" style="--tc:${TIER_COLORS[p.to]}">${icon('shield')}</span>
      <h3>${up ? `Promoted to ${TIERS[p.to]}!` : down ? `Moved down to ${TIERS[p.to]}` : `You stay in ${TIERS[p.to]}`}</h3>
      <p>You finished last week in place ${p.rank} with ${p.xp} XP.</p>
      <button class="btn primary wide" data-action="close-sheet">${up ? 'Let’s go' : 'Got it'}</button></div>`);
    if (up) { burstConfetti(); checkAchievements({}); save(); }
  }
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) refreshClock(); });
setInterval(() => { if (!document.hidden && !L) renderTopbar(); }, 30000);

function start() {
  if (!UNITS.length) {
    $('#view').innerHTML = '<p class="card">No lessons were bundled with this build.</p>';
    return;
  }
  refreshClock();
  if (!S.onboarded) renderOnboarding();
}
if ('serviceWorker' in navigator && location.protocol === 'https:' && !inFrame() && window.AS_PWA) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
if (/[?&]debug\b/.test(location.search)) window.__AS = { lesson: () => L, state: () => S, save };
window.claude?.hot?.ready ?window.claude.hot.ready(() => start()) : start();

})();</script>
