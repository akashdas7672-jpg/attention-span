n":"Doing much better on seen data than unseen data means it learned training-specific noise rather than general patterns."},{"type":"mcq","level":2,"prompt":"Train accuracy is 99% but test accuracy is 62%. What does the lab suggest?","options":["Train many more epochs on the same data","Reduce epochs or add more diverse data","Report the training accuracy instead","Stop using a test set at all"],"answer":1,"explain":"A big gap points to overfitting. Fewer epochs, more varied training data or regularisation help the model generalise."},{"type":"match","level":2,"prompt":"Match each evaluation method to what it does.","pairs":[["BLEU / ROUGE","Count word overlap with a reference"],["BERTScore","Compares meaning, allowing synonyms"],["LLM as judge","A stronger model rates relevance and tone"],["Behavioral check","Tests one fact, e.g. the right region"],["Human evaluation","Gold standard for fluency and helpfulness"]],"explain":"No single metric captures conversational quality. Combining automated scores with selective human review is the most reliable approach."},{"type":"cloze","level":2,"prompt":"Fine-tuning teaches a model how to respond; it is not a knowledge ___.","options":["database","tokenizer","metric","prompt"],"answer":0,"explain":"The model can still misclassify or misdescribe items outside the patterns it learned, so don't treat it as an encyclopaedia."},{"type":"mcq","level":2,"prompt":"Why reuse the same spot-check examples before and after fine-tuning?","options":["The model can only read five prompts","So the test set never needs to be used","It gives a direct side-by-side comparison","To make the model memorise those examples"],"answer":2,"explain":"Holding the inputs fixed means any change in the outputs comes from fine-tuning, which makes its effect easy to see."},{"type":"tf","level":2,"prompt":"When iterating, changing many settings at once is the quickest way to learn what helps.","answer":false,"explain":"If several things change together you can't tell which one mattered. Change one at a time and log each run."},{"type":"order","level":2,"prompt":"Order the classification evaluation workflow.","items":["Spot-check the base model","Fine-tune with LoRA","Re-run the same spot checks","Predict labels for every split","Compare metrics on seen vs unseen data"],"explain":"Get a baseline, train, compare on the same examples, and finally measure systematically across train, validation and test."},{"type":"mcq","level":2,"prompt":"Which output pattern is a warning sign for a classifier?","options":["It predicts 'Food' for nearly every input","It returns one clean label per item","Validation and test scores are similar","It handles varied items within each class"],"answer":0,"explain":"Systematic bias toward one category means the model isn't really telling classes apart, even if some of its predictions are right."},{"type":"mcq","level":3,"prompt":"Asked for food from Eastern Africa, a chatbot recommends pizza. Which dimension fails most clearly?","options":["Response length","Grammar and fluency","Format consistency","Content accuracy"],"answer":3,"explain":"Pizza isn't an Eastern African dish, so the geographic and cultural content is wrong. The lab rates this kind of response POOR."},{"type":"cloze","level":2,"prompt":"Text that sounds plausible but is factually wrong or off-task is called a ___.","options":["stratification","hallucination","tokenization","regularization"],"answer":1,"explain":"Small base models are especially prone to hallucinating. Spot checks for faithfulness and accuracy help catch it."},{"type":"tf","level":1,"prompt":"The lab's chat evaluation framework includes cultural sensitivity, such as avoiding stereotypes.","answer":true,"explain":"Alongside accuracy, quality and structure, it asks whether responses represent cultures respectfully and reflect their diversity."},{"type":"mcq","level":2,"prompt":"When does precision matter most?","options":["When missing true cases is costly","When false positives are costly","When classes are perfectly balanced","When there is no reference label"],"answer":1,"explain":"Precision asks how many flagged items are truly positive, so it matters when false alarms are expensive. Recall matters when misses are."}]}]},{"id":"frontier","title":"Frontier Topics","subtitle":"DeepMind Educational · Summer School","repo":"educational","skills":[{"id":"frontier-1","title":"Agents, rewards & returns","icon":"robot","lab":"colabs/summer_schools/intro_to_reinforcement_learning.ipynb","cards":[{"title":"The RL loop","body":"In reinforcement learning an agent acts in an environment. At each step it observes the state, picks an action and receives a numerical reward. From experience it learns a policy, a distribution over actions given a state, aiming to maximise its total reward. Unlike supervised learning, nobody tells it the right action."},{"title":"The Catch game","body":"A ball drops down a 10 × 5 grid while the agent slides a paddle along the bottom row with three actions: left, stay and right. Every step gives reward 0 except the last: +1 for a catch, −1 for a miss. Each `env.step(action)` returns a TimeStep holding step_type, reward, discount and observation."},{"title":"Returns and discounting","body":"An episode's return adds up its rewards, each weighted by the discount γ raised to how many steps away it arrives: G = r₀ + γ·r₁ + γ²·r₂ + … With γ \u003c 1, quick rewards count more than slow ones, and endless episodes still have a finite return. Catch uses γ = 1, since only its final reward is non-zero."},{"title":"Agent and run loop","body":"An agent is a class whose `actor_step` turns a timestep into an action; learning agents add a `learner_step`. The random agent ignores what it sees and returns `np.random.randint(num_actions)`.","code":"timestep = env.reset()\nwhile not timestep.last():\n  action = agent.actor_step(timestep)\n  timestep = env.step(action)"}],"exercises":[{"type":"match","level":1,"prompt":"Match each RL term to its meaning.","pairs":[["Agent","The learner that chooses actions"],["Environment","Responds to actions with states and rewards"],["Reward","Scalar feedback after an action"],["Policy","Distribution over actions given a state"],["Episode","One run from reset until termination"]],"explain":"The agent follows its policy inside the environment, collecting rewards over each episode."},{"type":"mcq","level":1,"prompt":"In Catch, what reward arrives on a step in the middle of an episode?","options":["+1","0","−1","+0.1"],"answer":1,"explain":"Catch only rewards the final step: +1 for catching the ball and −1 for missing it. Every intermediate step gives 0."},{"type":"mcq","level":2,"prompt":"Catch's action spec has `num_values = 3`. What can `np.random.randint(3)` return?","options":["0, 1 or 2","1, 2 or 3","Any float in [0, 3)","Always 3"],"answer":0,"explain":"randint excludes its upper bound, so it returns one of the action ids 0, 1 or 2: left, stay or right."},{"type":"mcq","level":3,"prompt":"Rewards r₀…r₃ are 0, 0, 0, +1 and γ = 0.9. Using G = Σₜ γᵗ·rₜ, what is G?","options":["1","0.9","0.729","0.656"],"answer":2,"explain":"Only r₃ is non-zero, so G = 0.9³ × 1 = 0.729. Without discounting (γ = 1) the return would be 1."},{"type":"mcq","level":3,"prompt":"Rewards are 1, 1, 1 and γ = 0.5. What is G = r₀ + γ·r₁ + γ²·r₂?","options":["3","1.5","0.875","1.75"],"answer":3,"explain":"G = 1 + 0.5 × 1 + 0.25 × 1 = 1.75. Each later reward is halved once more than the one before it."},{"type":"tf","level":2,"prompt":"In Catch the discount hardly matters, since every episode lasts the same number of steps and only the last reward is non-zero.","answer":true,"explain":"With a fixed episode length, discounting rescales every final reward by the same factor, so it never changes which behaviour is better."},{"type":"tf","level":1,"prompt":"A reinforcement learning agent is shown the correct action for every state.","answer":false,"explain":"That would be supervised learning. An RL agent only sees the rewards of its own actions and must discover good actions by trying them."},{"type":"cloze","level":2,"prompt":"Complete the run loop so it stops at the end of the episode.","code":"timestep = env.reset()\nwhile not timestep.___():\n  action = agent.actor_step(timestep)\n  timestep = env.step(action)","options":["last","first","done","reset"],"answer":0,"explain":"A dm_env TimeStep's `last()` is True on an episode's final step, so the loop runs until termination."},{"type":"cloze","level":2,"prompt":"An agent's ___ method maps the current timestep to an action.","options":["learner_step","reset","actor_step","observation_spec"],"answer":2,"explain":"actor_step does the acting. learner_step, added for learning agents, updates their values or weights from experience."},{"type":"order","level":2,"prompt":"Order one episode of the run loop.","items":["Reset the environment for a first timestep","The agent picks an action","The environment steps to a new timestep","Repeat until the timestep is the last","Sum the rewards into the episode return"],"explain":"Each episode starts with reset, alternates acting and stepping until termination, then totals the rewards it collected."},{"type":"mcq","level":2,"prompt":"What does a discount factor γ \u003c 1 do?","options":["Makes every reward count equally","Makes sooner rewards count more","Makes later rewards count more","Turns negative rewards into zero"],"answer":1,"explain":"A reward k steps away is weighted by γᵏ, which shrinks as k grows, so the agent prefers rewards it can collect quickly."},{"type":"cloze","level":3,"prompt":"With γ = 0.5, a reward of +8 that arrives three steps away (weight γ³) is worth ___ now.","options":["4","2","0.5","1"],"answer":3,"explain":"γ³ = 0.125, and 0.125 × 8 = 1. Each step of delay halves the reward's value."},{"type":"mcq","level":2,"prompt":"What does a Catch observation contain?","options":["The reward for every cell of the grid","Q-values for each paddle position","A 10 × 5 grid marking ball and paddle","RGB pixels from a game screenshot"],"answer":2,"explain":"The observation is a (10, 5) array that is zero everywhere except the cells holding the ball and the paddle."},{"type":"mcq","level":2,"prompt":"Why does the random agent play Catch badly?","options":["It ignores the observation entirely","It can only move left","It never receives any reward","It changes the game's rules"],"answer":0,"explain":"The random agent throws away the timestep and samples actions blindly, so it cannot follow the falling ball. Learning agents use the observation to act."}]},{"id":"frontier-2","title":"Q-learning & DQN","icon":"trophy","lab":"colabs/summer_schools/intro_to_reinforcement_learning.ipynb","cards":[{"title":"The value of an action","body":"Q(s, a) is the expected discounted return from taking action a in state s and following the policy afterwards. Value-based agents learn Q and act greedily, choosing argmaxₐ Q(s, a). The Bellman equation splits Q into the immediate reward plus the discounted value of whatever state comes next."},{"title":"The Q-learning update","body":"After a transition (s, a, r, s′), form the TD error δ = r + γ·maxₐ′ Q(s′, a′) − Q(s, a), then nudge Q(s, a) ← Q(s, a) + α·δ with a small step size α. In Catch the table has c·r·c = 250 rows (paddle × ball positions) and 3 columns, one per action.","code":"a2 = np.argmax(q[s2])\ntd = r + g * q[s2, a2] - q[s, a]\nq[s, a] += alpha * td"},{"title":"Explore a little","body":"Acting purely greedily, an agent may never try actions that look bad early on, so it can miss better ones. An ε-greedy policy takes a random action with probability ε and the greedy action otherwise. At evaluation time the agent switches back to fully greedy choices."},{"title":"From tables to DQN","body":"Tables can't cover huge state spaces such as Atari screens, so a neural network maps an observation to Q-values for all actions, trained to shrink the squared TD error with the target frozen by `stop_gradient`. DQN adds a replay buffer of past transitions, sampled at random to break correlations, and a target network refreshed only periodically."}],"exercises":[{"type":"mcq","level":3,"prompt":"Q(s, a) = 0.5, r = 1, γ = 0.9 and maxₐ′ Q(s′, a′) = 0.2. What is the TD error δ?","options":["0.7","1.18","0.68","0.32"],"answer":2,"explain":"δ = r + γ·max Q(s′, ·) − Q(s, a) = 1 + 0.9 × 0.2 − 0.5 = 1.18 − 0.5 = 0.68."},{"type":"mcq","level":3,"prompt":"Q(s, a) = 0.5 and the TD error is 0.68. With step size α = 0.1, what is Q(s, a) after the update?","options":["0.568","1.18","0.068","0.432"],"answer":0,"explain":"Q ← Q + α·δ = 0.5 + 0.1 × 0.68 = 0.568. The small step size moves Q only part of the way toward the target."},{"type":"cloze","level":2,"prompt":"Complete the TD error so it uses the best next-state value.","code":"td = r + g * np.___(q[s2]) - q[s, a]","options":["argmax","max","mean","sum"],"answer":1,"explain":"Q-learning bootstraps from the highest Q-value in the next state. argmax would return that action's index, not its value."},{"type":"tf","level":1,"prompt":"A greedy policy always picks the action with the highest current Q-value.","answer":true,"explain":"Greedy means π(s) = argmaxₐ Q(s, a). It fully trusts the current estimates, which is why it needs help to explore."},{"type":"mcq","level":2,"prompt":"Why switch from greedy to ε-greedy during training?","options":["To shrink the size of the Q-table","To remove the need for any reward","To make each env step run faster","To keep trying actions that look worse"],"answer":3,"explain":"If early estimates are wrong, a greedy agent keeps repeating its current favourite. Occasional random actions gather the experience needed to correct Q."},{"type":"cloze","level":3,"prompt":"Catch has 10 rows and 5 columns, so its tabular Q-table has ___ rows.","options":["50","150","250","15"],"answer":2,"explain":"A state pairs the paddle column (5 options) with the ball cell (10 × 5 = 50), so c·r·c = 5 × 10 × 5 = 250 rows, each holding 3 action values."},{"type":"match","level":2,"prompt":"Match each Q-learning idea to its description.","pairs":[["Replay buffer","Stores past transitions for random sampling"],["Target network","Periodically refreshed copy for TD targets"],["TD error","Gap between target and current Q-value"],["ε-greedy","Random action with probability ε"],["Function approx.","A network computes Q instead of a table"]],"explain":"Tabular Q-learning uses TD errors and ε-greedy exploration; DQN adds function approximation, a replay buffer and a target network."},{"type":"tf","level":2,"prompt":"Tabular Q-learning scales easily to Atari, since each screen only needs one row in the table.","answer":false,"explain":"The number of possible screens grows exponentially with the pixel count, so no table could hold them. Function approximation, as in DQN, generalises across states."},{"type":"cloze","level":2,"prompt":"The target r + γ·max Q(s′, a′) is wrapped in `jax.lax.___` so no gradient flows through it.","options":["stop_gradient","select","cond","scan"],"answer":0,"explain":"Only the prediction Q(s, a) should move toward the target, so stop_gradient treats the target as a fixed number when differentiating."},{"type":"order","level":2,"prompt":"Order one Q-learning step.","items":["Observe state s and choose action a","Receive reward r and next state s′","Form the target r + γ·max Q(s′, a′)","Compute the TD error: target − Q(s, a)","Move Q(s, a) by step size × TD error"],"explain":"Act, observe the outcome, build a bootstrapped target, measure the error, then update only the Q-value of the action actually taken."},{"type":"mcq","level":2,"prompt":"Why does DQN learn from random minibatches drawn from a replay buffer?","options":["It avoids computing any TD error","Consecutive steps are highly correlated","It lets the agent skip the environment entirely","It keeps the policy purely greedy"],"answer":1,"explain":"Back-to-back transitions are very similar, which destabilises training. Random samples from a buffer of past experience give more varied batches."},{"type":"mcq","level":2,"prompt":"What does the Bellman equation say about Q(s, a)?","options":["Sum of all past rewards this episode","Probability of picking action a in s","Average of Q over every possible action","Immediate reward + discounted next value"],"answer":3,"explain":"Q(s, a) = r(s, a) + γ·Σ P(s′|s, a)·V(s′): what you get now, plus the discounted value of where you land."},{"type":"mcq","level":1,"prompt":"How do policy gradient methods differ from Q-learning?","options":["They tune the policy directly to maximise return","They store a Q-value for every state–action pair","They never use neural networks","They learn without any reward signal"],"answer":0,"explain":"Policy gradients adjust the parameters θ of π_θ(a|s) to maximise J(θ) = E[r(τ)] instead of first estimating action values."},{"type":"tf","level":2,"prompt":"DQN's target network is updated at every gradient step, exactly like the online network.","answer":false,"explain":"The target network copies the online weights only periodically, every 10 learner steps in the notebook, which keeps the TD targets stable."}]},{"id":"frontier-3","title":"Graphs as data in jraph","icon":"graph","lab":"colabs/summer_schools/intro_to_graph_nets_tutorial_with_jraph.ipynb","cards":[{"title":"Nodes, edges, direction","body":"A graph G = (V, E) is a set of nodes plus edges linking them. Undirected edges work both ways, like friendship; directed edges have a direction, like “A cites B”. A node's in-degree counts its incoming edges, its out-degree its outgoing ones, and its degree is their sum."},{"title":"Three ways to store edges","body":"An edge list holds (u, v) pairs, one per edge u → v. An adjacency matrix A is |V| × |V| with A[u, v] = 1 when that edge exists. An adjacency list gives each node the set of nodes it points to. The toy graph's edges (0,1), (0,3), (1,2), (2,0), (3,0) give the list [{1, 3}, {2}, {0}, {0}]."},{"title":"The GraphsTuple","body":"jraph stores graphs in a GraphsTuple. `nodes`, `edges` and `globals` hold features, and edge i runs from `senders[i]` to `receivers[i]`. `n_node` and `n_edge` have one entry per graph, so a single tuple can batch many graphs.","code":"feats = jnp.array([[0.], [2.], [4.], [6.]])\ngraph = jraph.GraphsTuple(\n    nodes=feats, edges=None, globals=None,\n    senders=jnp.array([0, 1, 2, 3, 0]),\n    receivers=jnp.array([1, 2, 0, 0, 3]),\n    n_node=jnp.array([4]),\n    n_edge=jnp.array([5]))"},{"title":"Tasks and padding","body":"Node classification labels nodes (which instructor will a karate club member follow?). Graph classification labels whole graphs (is a MUTAG molecule mutagenic?). Link prediction asks whether an edge should exist (Cora citations). JAX recompiles for every new array shape, so batches are padded to the next power of two, plus a dummy graph that is masked out of the loss."}],"exercises":[{"type":"mcq","level":2,"prompt":"Toy graph edges: 0→1, 0→3, 1→2, 2→0, 3→0. What is node 0's in-degree?","options":["1","2","3","4"],"answer":1,"explain":"Two edges point into node 0, from nodes 2 and 3. Node 0 also has out-degree 2, so its total degree is 4."},{"type":"mcq","level":3,"prompt":"Same edges. In the adjacency matrix with rows as sources, what is node 0's row?","options":["[0, 1, 0, 1]","[0, 0, 1, 1]","[1, 0, 1, 0]","[0, 1, 1, 1]"],"answer":0,"explain":"Node 0 sends edges to nodes 1 and 3, so A[0, 1] = A[0, 3] = 1. Column 0, [0, 0, 1, 1], would instead list who points to node 0."},{"type":"tf","level":1,"prompt":"A citation network is most naturally modelled as an undirected graph.","answer":false,"explain":"“A cites B” does not imply “B cites A”, so citations are directed. Mutual relationships such as friendship suit undirected graphs."},{"type":"cloze","level":2,"prompt":"In a GraphsTuple, edge i goes from `senders[i]` to `___[i]`.","options":["nodes","edges","receivers","globals"],"answer":2,"explain":"Edges are two aligned index arrays: senders hold source nodes and receivers hold destination nodes, one entry per edge."},{"type":"mcq","level":2,"prompt":"Which edge is NOT in this graph?","code":"senders   = jnp.array([0, 1, 2, 3, 0])\nreceivers = jnp.array([1, 2, 0, 0, 3])","options":["3 → 0","0 → 3","2 → 0","1 → 0"],"answer":3,"explain":"Pair senders[i] with receivers[i]: 0→1, 1→2, 2→0, 3→0, 0→3. Node 1 points to node 2, never to node 0."},{"type":"mcq","level":2,"prompt":"One GraphsTuple batches 3 graphs. What is the length of `n_node`?","options":["3","1","The total node count","The largest graph's size"],"answer":0,"explain":"n_node stores one node count per graph, so its length equals the number of graphs in the batch: 3."},{"type":"match","level":1,"prompt":"Match each GraphsTuple field to what it stores.","pairs":[["`nodes`","Feature array with one row per node"],["`edges`","Feature array with one row per edge"],["`globals`","Features describing the whole graph"],["`senders`","Source node index of each edge"],["`n_edge`","Number of edges in each graph"]],"explain":"Features live in nodes, edges and globals; senders and receivers encode structure; n_node and n_edge split a batch into graphs."},{"type":"mcq","level":1,"prompt":"Predicting whether a molecule is mutagenic is which kind of task?","options":["Node classification","Link prediction","Graph classification","Density estimation"],"answer":2,"explain":"One label belongs to the whole molecule, so it is graph classification. In MUTAG, nodes are atoms and edges are bonds."},{"type":"order","level":3,"prompt":"Order the padding steps for a batch with 7 nodes across 3 graphs.","items":["Total the nodes in the batch: 7","Round up to a power of two: 8","Add one node for a dummy graph: 9","Mask the dummy graph out of the loss"],"explain":"Rounding to powers of two limits how many shapes JAX compiles; the extra dummy graph absorbs the padding and is masked away."},{"type":"cloze","level":3,"prompt":"`pad_graph_to_nearest_power_of_two` pads a batch of 13 nodes to ___ nodes.","options":["16","17","13","32"],"answer":1,"explain":"The next power of two at or above 13 is 16, and one more node is added for the padding graph: 16 + 1 = 17."},{"type":"tf","level":2,"prompt":"Padding graphs to a few fixed sizes speeds up training because JAX recompiles for every new array shape.","answer":true,"explain":"jit caches compiled programs per shape. With padding, many graphs share the same shapes, so compilation is paid only a few times."},{"type":"cloze","level":1,"prompt":"An adjacency matrix for a graph with |V| nodes has shape ___.","options":["|E| × 2","|V| × |E|","|V| × 1","|V| × |V|"],"answer":3,"explain":"Entry A[u, v] records whether an edge goes from u to v, so there is one row and one column per node."},{"type":"mcq","level":2,"prompt":"Karate club nodes get the features `jnp.eye(34)`. What is each node's feature vector?","options":["Its degree, as a single number","A one-hot vector marking its own index","A learned 34-dimensional embedding vector","Its instructor label"],"answer":1,"explain":"Row i of the 34 × 34 identity matrix is 1 at position i and 0 elsewhere, so each node is identified only by its index."},{"type":"mcq","level":2,"prompt":"In Cora link prediction, what are the “negative” examples?","options":["Edges with negative feature values","Edges pointing back in time","Node pairs with no edge between them","Edges held out for the test set"],"answer":2,"explain":"The model must separate real citations (positives) from unlinked pairs; training negatives are sampled afresh each epoch."}]},{"id":"frontier-4","title":"Message passing: GCN & GAT","icon":"chain","lab":"colabs/summer_schools/intro_to_graph_nets_tutorial_with_jraph.ipynb","cards":[{"title":"A GCN layer in two steps","body":"First, update each node's features, for example with an MLP; the result is the message that node will send. Second, every node aggregates the messages arriving along its incoming edges, by sum, mean or max. Each neighbour is treated the same, so unlike a CNN filter the layer ignores neighbour order and handles any number of neighbours."},{"title":"Aggregating with segment_sum","body":"`nodes[senders]` gathers one message per edge, and `jax.ops.segment_sum` adds them up per receiving node. On the toy graph, features [0, 2, 4, 6] become [10, 0, 2, 0]: node 0 receives 4 + 6 from nodes 2 and 3, and node 2 gets 2 from node 1.","code":"msgs = nodes[senders]\nnew_nodes = jax.ops.segment_sum(\n    msgs, receivers, num_segments=4)"},{"title":"Self-edges, scaling, depth","body":"Self-edges let a node include its own features in the sum. Degree normalisation, the symmetric D^(−1/2)·A·D^(−1/2) of Kipf and Welling, stops busy nodes from producing huge values that destabilise training. One layer only sees direct neighbours; stacking k layers spreads information k hops, much like stacked CNN layers widen their view."},{"title":"Attention, graphs and links","body":"GCN weighs all neighbours equally, which can blur nodes that share neighbours. A GAT layer learns the weights: it scores each edge, eᵢⱼ = LeakyReLU(a·[Whᵢ ‖ Whⱼ]), softmaxes the scores over each node's neighbours into αᵢⱼ, and sums αᵢⱼ·Whⱼ. For whole graphs, a global update yields one vector per graph; for links, a dot product hᵢ·hⱼ scores the edge."}],"exercises":[{"type":"order","level":1,"prompt":"Order the steps of a simple GCN layer.","items":["Transform each node's features, e.g. an MLP","Gather a message along each edge","Sum the messages arriving at each node","Store the sums as the new node features"],"explain":"Update first, then pass messages: gather by senders, aggregate by receivers with segment_sum, and write the result back into the graph."},{"type":"mcq","level":3,"prompt":"Toy graph: features [0, 2, 4, 6]; edges 0→1, 1→2, 2→0, 3→0, 0→3. With an identity update and sum aggregation, what does node 0 get?","options":["10","6","0","12"],"answer":0,"explain":"Node 0's incoming edges come from nodes 2 and 3, with features 4 and 6, so it receives 4 + 6 = 10. Its own feature counts only with self-edges."},{"type":"mcq","level":3,"prompt":"Same toy graph, now with self-edges added (sum, no normalisation). What is node 2's new feature?","options":["2","4","6","8"],"answer":2,"explain":"Node 2 receives node 1's feature, 2, plus its own feature, 4, through the self-edge: 2 + 4 = 6."},{"type":"cloze","level":2,"prompt":"Complete the aggregation so messages are summed per destination node.","code":"agg = jax.ops.segment_sum(\n    nodes[senders], ___,\n    num_segments=num_nodes)","options":["senders","receivers","n_edge","nodes"],"answer":1,"explain":"segment_sum adds up rows that share a segment id. Using receivers as the ids collects every message at the node it points to."},{"type":"tf","level":2,"prompt":"Like a CNN filter, a GCN layer learns a separate weight for each neighbour position.","answer":false,"explain":"A GCN applies the same weights to every neighbour and aggregates with a fixed sum or mean, so it ignores neighbour order and handles any neighbourhood size."},{"type":"mcq","level":2,"prompt":"How many stacked GCN layers does a node need to receive information from nodes 3 hops away?","options":["1","3","2","9"],"answer":1,"explain":"Each layer passes messages one hop. After k layers a node's features reflect its k-hop neighbourhood, so 3 hops need 3 layers."},{"type":"mcq","level":2,"prompt":"Why normalise GCN aggregation by node degree?","options":["It lets the layer learn per-neighbour weights","It turns the graph undirected","It removes the self-edges","High-degree nodes would get outsized sums"],"answer":3,"explain":"Summing over many neighbours inflates busy nodes' features, risking exploding or vanishing gradients. Dividing by square roots of degrees keeps scales comparable."},{"type":"cloze","level":2,"prompt":"GAT turns raw edge scores eᵢⱼ into weights αᵢⱼ with a ___ over each node's neighbours.","options":["softmax","segment_sum","ReLU","dot product"],"answer":0,"explain":"The softmax exponentiates the scores and divides by their sum over the neighbourhood, so each node's attention weights are positive and add up to 1."},{"type":"mcq","level":3,"prompt":"A node has two neighbours with attention scores e = [0, ln 3]. What are the attention weights α?","options":["[0, 1]","[0.5, 0.5]","[0.25, 0.75]","[0.33, 0.67]"],"answer":2,"explain":"exp(0) = 1 and exp(ln 3) = 3, so the softmax gives 1/4 and 3/4. The second neighbour's message counts three times as much."},{"type":"tf","level":2,"prompt":"In the karate club task, the loss uses only the known labels of the two instructors.","answer":true,"explain":"The loss is the negative log-likelihood of nodes 0 and 33 only. The other 32 labels are used just to measure accuracy, about 0.91 with the GCN."},{"type":"match","level":2,"prompt":"Match each building block to its role.","pairs":[["update_node_fn","Transforms node features, e.g. with an MLP"],["segment_sum","Adds up messages arriving at each node"],["Self-edge","Lets a node include its own features"],["Attention weight α","Learned importance of a neighbour"],["Global update","Produces one vector per whole graph"]],"explain":"GCN combines update_node_fn, segment_sum and self-edges; GAT adds learned attention; a GraphNetwork's global update powers graph classification."},{"type":"mcq","level":2,"prompt":"In the Cora link-prediction model, how is a candidate edge (i, j) scored?","options":["Sum of the two nodes' degrees","Dot product of node embeddings hᵢ·hⱼ","Attention weight αᵢⱼ from a GAT","Number of shared neighbours"],"answer":1,"explain":"A GNN encoder produces node embeddings and the decoder is simply their dot product; a sigmoid turns it into a score, evaluated with ROC-AUC."},{"type":"mcq","level":2,"prompt":"Why does the MUTAG loss multiply by `jraph.get_graph_padding_mask`?","options":["To drop atoms that have no bonds attached","To balance the two output classes","To hide test graphs while training","To ignore the dummy graph added by padding"],"answer":3,"explain":"Padding appends a fake graph so shapes stay fixed. The mask zeroes its contribution, so only real molecules affect the loss and accuracy."},{"type":"cloze","level":3,"prompt":"Each gathered row holds 64 features. Fill in the axis that yields one score per edge.","code":"def decode(h, senders, receivers):\n  return jnp.sum(\n      h[senders] * h[receivers],\n      axis=___)","options":["1","0","2","None"],"answer":0,"explain":"h[senders] has shape (num_edges, 64). Summing the elementwise product over axis 1 collapses the features into one dot product per edge."}]}]}];window.AS_PWA=true;</script>

function extendStreak() {
  const t = todayIdx();
  if (S.streak.last === t) return false;
  refreshStreak();
  S.streak.count = (S.streak.last === t - 1 ? S.streak.count : 0) + 1;
  S.streak.last = t;
  S.streak.best = Math.max(S.streak.best, S.streak.count);
  return true;
}
function dayStatus(i) {
  const d = S.days[keyOfIdx(i)];
  if (d && d.lessons > 0) return 'done';
  if (S.streak.frozen.includes(i)) return 'frozen';
  return 'none';
}

// ---------- progress / path ----------
function skillState(id) { return S.skills[id] || { lessons: 0, legendary: false }; }
function nodeComplete(n) {
  if (n.type === 'skill') return skillState(n.id).lessons >= LESSONS_PER_SKILL;
  if (n.type === 'checkpoint') return !!(S.units[n.unit.id] && S.units[n.unit.id].cp);
  return !!S.chests[n.id];
}
function currentNodeIndex() {
  const i = NODES.findIndex((n) => n.type !== 'chest' && !nodeComplete(n));
  return i === -1 ? NODES.length : i;
}
function nodeUnlocked(i) {
  const cur = currentNodeIndex();
  if (NODES[i].type === 'chest') return i < cur;
  return i <= cur;
}
function unitComplete(u) { return !!(S.units[u.id] && S.units[u.id].cp); }
function unitUnlocked(u) {
  const first = NODES.findIndex((n) => n.unit === u);
  return nodeUnlocked(first);
}
function unlockedSkills() {
  const cur = currentNodeIndex();
  return NODES.filter((n, i) => n.type === 'skill' && i <= cur).map((n) => n.skill);
}
function startedSkills() {
  return unlockedSkills().filter((s) => skillState(s.id).lessons > 0);
}

// ---------- spaced repetition ----------
function exStat(key) { return S.ex[key]; }
function recordAnswer(key, correct) {
  const st = S.ex[key] || (S.ex[key] = { s: 0, c: 0, w: 0, b: 0, due: 0 });
  st.s++;
  if (correct) { st.c++; st.b = Math.min(SRS_DAYS.length - 1, st.b + 1); } else { st.w++; st.b = 0; }
  st.due = todayIdx() + SRS_DAYS[st.b];
}
function mistakeKeys() {
  return Object.entries(S.ex).filter(([k, st]) => st.w > 0 && st.b <= 1 && EX_BY_KEY[k]).map(([k]) => k);
}
function dueKeys() {
  const t = todayIdx();
  return Object.entries(S.ex).filter(([k, st]) => st.due <= t && EX_BY_KEY[k]).map(([k]) => k);
}

// ---------- XP, tokens, boosts ----------
function boostActive() { return S.boostUntil > Date.now(); }
function addXp(n) {
  const gained = boostActive() ? n * 2 : n;
  S.xp += gained;
  today().xp += gained;
  if (S.league.joined) S.league.xp += gained;
  bumpQuest('xp', gained);
  return gained;
}

// ---------- daily quests ----------
const QUEST_POOL = [
  { metric: 'lessons', goals: [2, 3], text: (n) => `Complete ${n} lessons`, reward: 15 },
  { metric: 'perfect', goals: [1], text: () => 'Finish a lesson with zero mistakes', reward: 20 },
  { metric: 'combo', goals: [5, 8, 10], text: (n) => `Get ${n} answers right in a row`, reward: 15, max: true },
  { metric: 'acc90', goals: [1, 2], text: (n) => n === 1 ? 'Score 90% or higher in a lesson' : `Score 90% or higher in ${n} lessons`, reward: 15 },
  { metric: 'practice', goals: [1], text: () => 'Complete a practice session', reward: 15 },
  { metric: 'lightning', goals: [8, 12], text: (n) => `Get ${n} right in one Lightning Round`, reward: 20, max: true },
];
function ensureQuests() {
  const k = dayKey();
  if (S.quests.day === k && S.quests.list.length) return;
  const r = rng(hashStr('quests' + k));
  const picks = shuffle(QUEST_POOL, r).slice(0, 2);
  S.quests = {
    day: k,
    list: [
      { metric: 'xp', goal: S.goal, text: `Earn ${S.goal} XP`, reward: 10, progress: todayXp(), claimed: false },
      ...picks.map((q) => {
        const goal = q.goals[Math.floor(r() * q.goals.length)];
        return { metric: q.metric, goal, text: q.text(goal), reward: q.reward, max: !!q.max, progress: 0, claimed: false };
      }),
    ],
    bonus: false,
  };
}
function bumpQuest(metric, amount) {
  ensureQuests();
  for (const q of S.quests.list) {
    if (q.metric !== metric) continue;
    q.progress = q.max ? Math.max(q.progress, amount) : q.progress + amount;
  }
}
function claimableQuests() {
  ensureQuests();
  return S.quests.list.filter((q) => !q.claimed && q.progress >= q.goal).length;
}

// ---------- league (simulated rivals) ----------
function leagueBots(week, tier) {
  const r = rng(hashStr(`league:${week}:${tier}`));
  const names = shuffle(BOT_NAMES, r).slice(0, LEAGUE_SIZE - 1);
  const base = TIER_BASE_XP[tier];
  return names.map((name) => {
    const idle = r() < 0.12;
    const target = idle ? Math.floor(r() * 25) : Math.round(base * (0.25 + Math.pow(r(), 1.3) * 1.9));
    const shares = Array.from({ length: 7 }, () => (r() < 0.2 ? 0 : 0.2 + r()));
    const sum = shares.reduce((a, b) => a + b, 0) || 1;
    const hue = Math.floor(r() * 360);
    return { name, target, shares: shares.map((s) => s / sum), hue, startHour: Math.floor(r() * 16) };
  });
}
function botXpAt(bot, week, at = Date.now()) {
  const nowIdx = dayIdxOf(new Date(at));
  let frac = 0;
  for (let d = 0; d < 7; d++) {
    const di = week + d;
    if (di < nowIdx) frac += bot.shares[d];
    else if (di === nowIdx) {
      const dt = new Date(at);
      const hours = dt.getHours() + dt.getMinutes() / 60;
      const dayFrac = clamp((hours - bot.startHour) / 8, 0, 1);
      frac += bot.shares[d] * Math.floor(dayFrac * 4) / 4;
    }
  }
  return Math.round((bot.target * frac) / 5) * 5;
}
function leagueStandings(week = S.league.week, tier = S.league.tier, userXp = S.league.xp, at = Date.now()) {
  const rows = leagueBots(week, tier).map((b) => ({ name: b.name, hue: b.hue, xp: botXpAt(b, week, at), bot: true }));
  rows.push({ name: S.name || 'You', xp: userXp, you: true });
  rows.sort((a, b) => b.xp - a.xp || (a.you ? -1 : b.you ? 1 : 0));
  return rows;
}
// Rolls the league over at the start of a new week and records promotion/demotion.
function syncLeague() {
  const wk = weekStartIdx();
  const L = S.league;
  if (!L.joined || L.week === wk) return;
  if (L.week >= 0) {
    const endOfWeek = idxToDate(L.week + 7).getTime() - 1;
    const rows = leagueStandings(L.week, L.tier, L.xp, endOfWeek);
    const rank = rows.findIndex((r) => r.you) + 1;
    let tier = L.tier;
    if (L.xp > 0 && rank <= PROMOTE && tier < TIERS.length - 1) tier++;
    else if ((rank > LEAGUE_SIZE - DEMOTE || L.xp === 0) && tier > 0) tier--;
    L.pending = { rank, from: L.tier, to: tier, xp: L.xp };
    L.tier = tier;
  }
  L.week = wk;
  L.xp = 0;
}
function joinLeague() {
  if (S.league.joined) return;
  S.league.joined = true;
  S.league.week = weekStartIdx();
  S.league.xp = 0;
}
function leagueDaysLeft() { return weekStartIdx() + 7 - todayIdx(); }

function checkAchievements(ctx = {}) {
  const fresh = [];
  for (const a of ACHIEVEMENTS) {
    if (S.achievements[a.id]) continue;
    let ok = false;
    try { ok = a.test(ctx); } catch (e) { ok = false; }
    if (ok) { S.achievements[a.id] = Date.now(); S.tokens += 25; fresh.push(a); }
  }
  return fresh;
}

// ---------- backup ----------
function exportCode() {
  const json = JSON.stringify(S);
  return 'AS1.' + btoa(unescape(encodeURIComponent(json)));
}
function importCode(code) {
  const c = String(code || '').trim();
  if (!c.startsWith('AS1.')) throw new Error('That code does not look like an Attention Span backup.');
  const json = decodeURIComponent(escape(atob(c.slice(4))));
  const data = JSON.parse(json);
  if (!data || data.v !== 1) throw new Error('That backup is from an unknown version.');
  S = mergeDefaults(defaultState(), data);
  save();
}

  return `<svg class="ic ${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
}

}
function tokenGlyph(size = 24) {

function xpGlyph(size = 22) {

// ---------- shell ----------
const UI = { tab: 'learn', scrollToCurrent: true, onboardStep: 0 };
const TABS = [
  { id: 'learn', label: 'Learn', icon: 'compass' },
  { id: 'practice', label: 'Practice', icon: 'dumbbell' },
  { id: 'league', label: 'League', icon: 'shield' },
  { id: 'quests', label: 'Quests', icon: 'quest' },
  { id: 'profile', label: 'Profile', icon: 'user' },
];

function render() {
  renderTopbar();
  renderTabbar();
  renderView();
}
function renderTopbar() {
  syncHearts();
  const lit = practicedToday();
  const boost = boostActive() ? `<span class="tb-boost">${xpGlyph(16)}2× ${Math.ceil((S.boostUntil - Date.now()) / 60000)}m</span>` : '';
  $('#topbar').innerHTML = `
    <div class="tb-inner">
      <button class="tb-item ${lit ? 'lit' : ''}" data-action="streak-info" aria-label="Streak: ${S.streak.count} days">${flameGlyph(lit)}<span>${S.streak.count}</span></button>
      <button class="tb-item tokens" data-action="shop" aria-label="${S.tokens} tokens">${tokenGlyph()}<span>${S.tokens}</span></button>
      <button class="tb-item hearts" data-action="hearts-info" aria-label="Hearts">${heartGlyph()}<span>${heartsUnlimited() ? '∞' : S.hearts}</span></button>
      ${boost}
    </div>`;
}
function renderTabbar() {
  const dot = claimableQuests() > 0;
  $('#tabbar').innerHTML = `<div class="tab-inner">${TABS.map((t) => `
    <button class="tab ${UI.tab === t.id ? 'on' : ''}" data-action="tab" data-tab="${t.id}" aria-current="${UI.tab === t.id ? 'page' : 'false'}">
      ${icon(t.icon)}<span>${t.label}</span>${t.id === 'quests' && dot ? '<i class="dot"></i>' : ''}
    </button>`).join('')}</div>`;
}
function renderView() {
  const v = $('#view');
  const fn = { learn: viewLearn, practice: viewPractice, league: viewLeague, quests: viewQuests, profile: viewProfile }[UI.tab];
  v.innerHTML = fn();
  if (UI.tab === 'learn' && UI.scrollToCurrent) {
    UI.scrollToCurrent = false;
    const cur = $('.node.current') || $('.node.checkpoint.current');
    if (cur) requestAnimationFrame(() => cur.scrollIntoView({ block: 'center', behavior: 'auto' }));
  }
}

// ---------- Learn: the path ----------
const PATH_OFFSETS = [0, 46, 70, 46, 0, -46, -70, -46];
function isStandalone() {
  return window.navigator.standalone === true || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
}
function isIOS() { return /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); }
function inFrame() { try { return window.self !== window.top; } catch (e) { return true; } }

function viewLearn() {
  const cur = currentNodeIndex();
  const txp = todayXp();
  const pct = clamp(txp / S.goal, 0, 1);
  const install = (isIOS() && !isStandalone() && !inFrame() && !S.dismissed.install) ? `
    <div class="install card">
      <div><strong>Put this on your Home Screen</strong><p>In Safari, tap Share, then <b>Add to Home Screen</b>. It opens full screen and works offline.</p></div>
      <button class="icon-btn" data-action="dismiss" data-key="install" aria-label="Dismiss">${icon('x')}</button>
    </div>` : '';
  let html = `${install}
    <div class="goal-strip card">
      ${xpGlyph(20)}
      <div class="goal-meter"><div class="bar"><i style="width:${pct * 100}%"></i></div></div>
      <span class="goal-num">${txp}/${S.goal} XP</span>
    </div>`;
  let k = 0;
  let lastUnit = null;
  NODES.forEach((n, i) => {
    if (n.unit !== lastUnit) {
      if (lastUnit) html += '</div></section>';
      lastUnit = n.unit;
      k = 0;
      const u = n.unit;
      const unlocked = unitUnlocked(u);
      const done = unitComplete(u);
      html += `<section class="unit ${unlocked ? '' : 'locked'}" style="--uc:${u.color}">
        <header class="unit-head">
          <div class="uh-text">
            <p class="eyebrow">Unit ${u.index + 1} · ${esc(u.subtitle)}</p>
            <h2>${esc(u.title)}</h2>
          </div>
          ${unlocked
            ? `<button class="uh-btn" data-action="guide" data-unit="${u.id}">${icon('book')}<span>Tips</span></button>`
            : `<button class="uh-btn" data-action="jump" data-unit="${u.id}">${icon('zap')}<span>Jump here</span></button>`}
          ${done ? `<span class="uh-done">${icon('check')}</span>` : ''}
        </header>
        <div class="path">`;
    }
    const off = PATH_OFFSETS[k % PATH_OFFSETS.length];
    k++;
    const unlocked = nodeUnlocked(i);
    const complete = nodeComplete(n);
    const current = i === cur;
    if (n.type === 'chest') {
      const ready = unlocked && !complete;
      html += `<div class="node-row" style="--x:${off}px">
        <button class="chest ${complete ? 'opened' : ready ? 'ready' : 'locked'}" data-action="node" data-i="${i}" aria-label="Reward chest">${icon('chest')}</button>
      </div>`;
      return;
    }
    const s = n.skill;
    const st = n.type === 'skill' ? skillState(n.id) : null;
    const legend = st && st.legendary;
    const cls = ['node', n.type, complete ? 'done' : '', current ? 'current' : '', !unlocked ? 'locked' : '', legend ? 'legend' : ''].join(' ');
    const glyph = n.type === 'checkpoint' ? 'trophy' : complete && !legend ? 'check' : legend ? 'crown' : s.icon;
    const ring = current && n.type === 'skill' ? progressRing(st.lessons / LESSONS_PER_SKILL) : '';
    const label = n.type === 'checkpoint' ? `${n.unit.title} review` : s.title;
    const side = off >= 0 ? 'left' : 'right';
    html += `<div class="node-row" style="--x:${off}px">
      ${ring}
      <button class="${cls}" data-action="node" data-i="${i}" aria-label="${esc(label)}${complete ? ', complete' : unlocked ? '' : ', locked'}">
        <span class="node-face">${icon(glyph)}</span>
      </button>
      ${current ? `<div class="start-bubble">${st && st.lessons > 0 ? 'CONTINUE' : 'START'}</div><div class="bit-side ${side}">${mascot('idle', 70)}</div>` : ''}
      <span class="node-label">${esc(label)}</span>
    </div>`;
  });
  if (lastUnit) html += '</div></section>';
  if (cur >= NODES.length) {
    html += `<div class="card finale">${mascot('wow', 90)}<h3>You finished every unit.</h3><p>Keep your streak alive with Lightning Rounds and reviews in Practice, and try Legendary on any skill.</p></div>`;
  }
  html += `<p class="credit">Lessons adapted from Google DeepMind's <a href="https://github.com/google-deepmind/ai-foundations" target="_blank" rel="noopener">AI Research Foundations</a> and <a href="https://github.com/google-deepmind/educational" target="_blank" rel="noopener">Educational</a> notebooks.</p>`;
  return html;
}
function progressRing(frac) {
  const r = 46;
  const c = 2 * Math.PI * r;
  return `<svg class="ring" viewBox="0 0 104 104" aria-hidden="true"><circle cx="52" cy="52" r="${r}" class="ring-bg"/><circle cx="52" cy="52" r="${r}" class="ring-fg" stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - frac)}"/></svg>`;
}

function openNodeSheet(i) {
  const n = NODES[i];
  const unlocked = nodeUnlocked(i);
  const complete = nodeComplete(n);
  const u = n.unit;
  if (n.type === 'chest') {
    if (complete) return toast('You already opened this chest.');
    if (!unlocked) return toast('Finish the skill above to unlock this chest.');
    const r = rng(hashStr(n.id + S.createdAt));
    const amount = 15 + Math.floor(r() * 6) * 5;
    S.chests[n.id] = true;
    S.tokens += amount;
    save();
    sound('chest');
    burstConfetti();
    openSheet(`<div class="reward">${tokenGlyph(64)}<h3>+${amount} tokens</h3><p>Spend them in the shop on streak freezes, heart refills and XP boosts.</p>
      <button class="btn primary wide" data-action="close-sheet">Nice</button></div>`);
    render();
    return;
  }
  if (n.type === 'checkpoint') {
    const body = !unlocked
      ? `<p class="muted">Complete every skill in this unit to unlock its review.</p>`
      : `<p>${complete ? 'You passed this review. Run it again any time for XP.' : '12 questions from across the unit. Pass it to unlock the next unit.'}</p>
         <button class="btn primary wide" data-action="start-checkpoint" data-unit="${u.id}">${complete ? 'Review again' : 'Start review'} · +${complete ? 10 : 25} XP</button>`;
    return openSheet(`<div class="node-sheet" style="--uc:${u.color}"><p class="eyebrow">Unit ${u.index + 1} checkpoint</p><h3>${esc(u.title)}</h3>${body}</div>`);
  }
  const s = n.skill;
  const st = skillState(s.id);
  let body;
  if (!unlocked) {
    body = `<p class="muted">Finish the skills above to unlock this one.</p>
      ${s.cards && s.cards.length ? `<button class="btn ghost wide" data-action="tips" data-skill="${s.id}">${icon('book')} Preview the tips</button>` : ''}`;
  } else if (!complete) {
    body = `<div class="pips">${Array.from({ length: LESSONS_PER_SKILL }, (_, j) => `<i class="${j < st.lessons ? 'on' : ''}"></i>`).join('')}<span>Lesson ${st.lessons + 1} of ${LESSONS_PER_SKILL}</span></div>
      <button class="btn primary wide" data-action="start-skill" data-skill="${s.id}">${st.lessons ? 'Continue' : 'Start'} · +10 XP</button>
      ${s.cards && s.cards.length ? `<button class="btn ghost wide" data-action="tips" data-skill="${s.id}">${icon('book')} Tips</button>` : ''}`;
  } else {
    body = `<p>${st.legendary ? 'Legendary. This skill is fully mastered.' : 'Complete. Practice it again, or prove mastery with a Legendary challenge.'}</p>
      <button class="btn primary wide" data-action="start-skill" data-skill="${s.id}">Practice · +10 XP</button>
      ${st.legendary ? '' : `<button class="btn gold wide" data-action="start-legend" data-skill="${s.id}">${icon('crown')} Legendary · +30 XP</button>`}
      <button class="btn ghost wide" data-action="tips" data-skill="${s.id}">${icon('book')} Tips</button>`;
  }
  openSheet(`<div class="node-sheet" style="--uc:${u.color}">
    <p class="eyebrow">Unit ${u.index + 1} · Skill ${u.skills.indexOf(s) + 1}</p>
    <h3>${esc(s.title)}</h3>
    ${body}
    <a class="lab-link" href="${labUrl(s)}" target="_blank" rel="noopener">${icon('code')} Open the original lab in Colab ${icon('ext', 'sm')}</a>
  </div>`);
}

function openTips(skillId) {
  const s = SKILLS[skillId];
  openSheet(`<div class="tips" style="--uc:${s.unit.color}">
    <p class="eyebrow">Tips</p><h3>${esc(s.title)}</h3>
    ${(s.cards || []).map((c) => `<article class="tip"><h4>${fmt(c.title)}</h4><p>${fmt(c.body)}</p>${c.code ? `<pre class="code">${esc(c.code)}</pre>` : ''}</article>`).join('')}
    <a class="lab-link" href="${labUrl(s)}" target="_blank" rel="noopener">${icon('code')} Open the lab in Colab ${icon('ext', 'sm')}</a>
  </div>`, { tall: true });
}
function openGuide(unitId) {
  const u = UNITS.find((x) => x.id === unitId);
  openSheet(`<div class="tips" style="--uc:${u.color}">
    <p class="eyebrow">Unit ${u.index + 1} guidebook</p><h3>${esc(u.title)}</h3>
    ${u.skills.map((s) => `<button class="guide-row" data-action="tips" data-skill="${s.id}"><span class="gi">${icon(s.icon)}</span><span>${esc(s.title)}</span>${icon('back', 'flip')}</button>`).join('')}
  </div>`, { tall: true });
}
function openJump(unitId) {
  const u = UNITS.find((x) => x.id === unitId);
  const from = currentNodeIndex();
  const to = NODES.findIndex((n) => n.unit === u);
  const skipped = NODES.slice(from, to).filter((n) => n.type === 'skill').length;
  openSheet(`<div class="node-sheet" style="--uc:${u.color}">
    <p class="eyebrow">Jump ahead</p><h3>Jump to Unit ${u.index + 1}?</h3>
    <p>Pass a 10-question test on the ${plural(skipped, 'skill')} you would skip. You can make 3 mistakes. Pass and they are marked complete; you can still play them later.</p>
    <button class="btn primary wide" data-action="start-jump" data-unit="${u.id}">Start the test</button>
  </div>`);
}

      <button class="btn primary" data-action="start-lightning" ${pool.length < 4 ? 'disabled' : ''}>${icon('zap')} Go</button>

function practicePool() {
  const skills = startedSkills();
  return (skills.length ? skills : unlockedSkills().slice(0, 1)).flatMap((s) => s.exercises).filter((e) => ['mcq', 'tf', 'cloze'].includes(e.type));
}

// ---------- League ----------
function viewLeague() {
  if (!S.league.joined) {
    return `<h1 class="view-title">League</h1><div class="card empty">${mascot('wow', 96)}<h3>Finish a lesson to join the ${TIERS[0]} League</h3><p>Every week you race 19 rivals for XP. The top ${PROMOTE} move up a league.</p></div>`;
  }
  const tier = S.league.tier;
  const rows = leagueStandings();
  const left = leagueDaysLeft();
  const tiersRow = TIERS.map((t, i) => `<span class="tier-dot ${i === tier ? 'on' : i < tier ? 'past' : ''}" style="--tc:${TIER_COLORS[i]}" title="${t}">${icon('shield')}</span>`).join('');
  let list = '';
  rows.forEach((r, i) => {
    const rank = i + 1;
    if (rank === PROMOTE + 1 && tier < TIERS.length - 1) list += `<li class="zone up">${icon('back', 'up')} Promotion zone</li>`;
    if (rank === LEAGUE_SIZE - DEMOTE + 1 && tier > 0) list += `<li class="zone down">${icon('back', 'down')} Demotion zone</li>`;
    const initials = r.you ? (S.name || 'You').slice(0, 1).toUpperCase() : r.name.split(/[\s-]/).map((w) => w[0]).join('').slice(0, 2);
    list += `<li class="row ${r.you ? 'you' : ''}">
      <span class="rk ${rank <= 3 ? 'medal m' + rank : ''}">${rank}</span>
      <span class="av" style="${r.you ? '' : `--h:${r.hue}`}">${esc(initials)}</span>
      <span class="nm">${esc(r.you ? (S.name || 'You') : r.name)}${r.you ? ' <em>(you)</em>' : ''}</span>
      <span class="xp">${r.xp} XP</span>
    </li>`;
  });
  return `<h1 class="view-title">League</h1>
    <div class="card league-head" style="--tc:${TIER_COLORS[tier]}">
      <div class="tiers">${tiersRow}</div>
      <h2>${TIERS[tier]} League</h2>
      <p>${tier < TIERS.length - 1 ? `Top ${PROMOTE} advance to ${TIERS[tier + 1]}.` : 'The top league. Hold your place.'} ${plural(left, 'day')} left.</p>
    </div>
    <ol class="standings">${list}</ol>
    <p class="credit">Rivals are simulated learners who study on their own schedules.</p>`;
}

// ---------- Quests ----------
function viewQuests() {
  ensureQuests();
  const now = new Date();
  const midnight = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
  const ms = midnight - now;
  const hrs = Math.floor(ms / 3600000);
  const mins = Math.floor((ms % 3600000) / 60000);
  const all = S.quests.list.every((q) => q.claimed);
  return `<h1 class="view-title">Daily quests</h1>
    <p class="sub">New quests in ${hrs}h ${mins}m</p>
    <div class="quests">
      ${S.quests.list.map((q, i) => {
        const p = clamp(q.progress / q.goal, 0, 1);
        const ready = p >= 1 && !q.claimed;
        return `<div class="card quest ${q.claimed ? 'claimed' : ''}">
          <span class="q-ic">${icon(['zap', 'target', 'star'][i % 3])}</span>
          <div class="q-body"><h3>${esc(q.text)}</h3>
            <div class="bar"><i style="width:${p * 100}%"></i><span>${Math.min(q.progress, q.goal)} / ${q.goal}</span></div></div>
          ${q.claimed ? `<span class="q-done">${icon('check')}</span>`
            : `<button class="btn ${ready ? 'primary' : ''} small" data-action="claim" data-q="${i}" ${ready ? '' : 'disabled'}>${tokenGlyph(16)} ${q.reward}</button>`}
        </div>`;
      }).join('')}

function finishOnboarding(at) {

// Marks every node before index `to` complete (used by placement and jump tests).
function skipTo(to) {
  for (let i = 0; i < to; i++) {
    const n = NODES[i];
    if (n.type === 'skill') {
      const st = S.skills[n.id] || (S.skills[n.id] = { lessons: 0, legendary: false });
      st.lessons = Math.max(st.lessons, LESSONS_PER_SKILL);
      st.skipped = true;
    } else if (n.type === 'checkpoint') {
      if (!unitComplete(n.unit)) S.units[n.unit.id] = { ...(S.units[n.unit.id] || {}), cp: true, skipped: true };
    } else {
      S.chests[n.id] = true;
    }
  }

// ---------- lesson building ----------
let L = null;
const KIND_LABEL = {
  mcq: 'Choose the right answer', tf: 'True or false?', cloze: 'Fill in the blank', order: 'Put these in order', match: 'Match the pairs',
};
const PRAISE = ['Nice!', 'Exactly!', 'Sharp!', 'Correct!', 'Locked in!', 'Spot on!', 'Great!', 'You got it!'];

// Prefers unseen and weak exercises near the target difficulty, with at most two match/order items.
function pickExercises(pool, n, target, rand = Math.random) {
  const scored = pool.map((ex) => {
    const st = S.ex[ex.key];
    const lvl = ex.level || 2;
    const score = (st ? 4 + st.b * 1.5 - Math.min(st.w, 3) : 0) + Math.abs(lvl - target) * 1.6 + rand() * 3;
    return { ex, score };
  }).sort((a, b) => a.score - b.score);
  const out = [];
  let heavy = 0;
  for (const { ex } of scored) {
    if (out.length >= n) break;
    if (ex.type === 'match' || ex.type === 'order') { if (heavy >= 2) continue; heavy++; }
    out.push(ex);
  }
  for (const { ex } of scored) { if (out.length >= n) break; if (!out.includes(ex)) out.push(ex); }
  return out.map((ex) => ({ ex, k: (ex.level || 2) + rand() * 1.3 })).sort((a, b) => a.k - b.k).map((x) => x.ex);
}

function newLesson(kind, exercises, opts = {}) {
  return {
    kind, title: opts.title || '', color: opts.color || 'var(--brand)', skillId: opts.skillId, unitId: opts.unitId, target: opts.target,
    items: exercises.map((ex) => ({ ex, retry: false })),
    pos: 0, total: exercises.length, done: 0, firstTotal: 0, firstCorrect: 0, mistakes: 0, combo: 0, maxCombo: 0,
    lives: opts.lives ?? null, maxLives: opts.lives ?? null,
    cards: opts.cards || [], cardPos: 0, phase: (opts.cards && opts.cards.length) ? 'card' : 'q',
    startedAt: Date.now(), timed: opts.timed || 0, endsAt: 0, pool: opts.pool || null,
    q: null,
  };
}
function needHearts() {
  syncHearts();
  if (heartsUnlimited() || S.hearts > 0) return false;
  openOutOfHearts();
  return true;
}
function startSkillLesson(skillId) {
  if (needHearts()) return;
  const s = SKILLS[skillId];
  const st = skillState(skillId);
  const n = Math.min(st.lessons, LESSONS_PER_SKILL - 1);
  const ex = pickExercises(s.exercises, LESSON_SIZE, n + 1);
  const cards = st.lessons === 0 && !st.cardsSeen ? s.cards || [] : [];
  beginLesson(newLesson(st.lessons >= LESSONS_PER_SKILL ? 'replay' : 'skill', ex, { title: s.title, color: s.unit.color, skillId, cards }));
}
function startLegend(skillId) {
  const s = SKILLS[skillId];
  beginLesson(newLesson('legend', pickExercises(s.exercises, 10, 3), { title: `${s.title}: Legendary`, color: 'var(--gold-deep)', skillId, lives: 3 }));
}
function startCheckpoint(unitId) {
  if (needHearts()) return;
  const u = UNITS.find((x) => x.id === unitId);
  const per = Math.max(2, Math.ceil(12 / u.skills.length));
  const ex = shuffle(u.skills.flatMap((s) => pickExercises(s.exercises, per, 2))).slice(0, 12);
  beginLesson(newLesson('checkpoint', ex, { title: `${u.title} review`, color: u.color, unitId }));
}
function startJump(unitId) {
  const u = UNITS.find((x) => x.id === unitId);
  const to = NODES.findIndex((n) => n.unit === u);
  const skills = NODES.slice(currentNodeIndex(), to).filter((n) => n.type === 'skill').map((n) => n.skill);
  const per = Math.max(1, Math.ceil(10 / skills.length));
  const ex = shuffle(skills.flatMap((s) => pickExercises(s.exercises.filter((e) => e.type !== 'match'), per, 2))).slice(0, 10);
  beginLesson(newLesson('jump', ex, { title: `Jump to Unit ${u.index + 1}`, color: u.color, unitId, lives: 3, target: to }));
}
function startMistakes() {
  if (needHearts()) return;
  const keys = mistakeKeys().sort((a, b) => S.ex[a].b - S.ex[b].b || S.ex[b].w - S.ex[a].w).slice(0, LESSON_SIZE);
  beginLesson(newLesson('mistakes', shuffle(keys.map((k) => EX_BY_KEY[k])), { title: 'Fix mistakes', color: 'var(--bad)' }));
}
function startReview() {
  if (needHearts()) return;
  const keys = dueKeys().sort((a, b) => S.ex[a].due - S.ex[b].due).slice(0, LESSON_SIZE);
  beginLesson(newLesson('review', shuffle(keys.map((k) => EX_BY_KEY[k])), { title: 'Daily review', color: 'var(--good)' }));
}
function startLightning() {
  const pool = shuffle(practicePool());
  if (pool.length < 4) return toast('Finish a lesson first to unlock Lightning Rounds.');
  beginLesson(newLesson('lightning', pool, { title: 'Lightning Round', color: 'var(--gold-deep)', timed: LIGHTNING_SECONDS, pool }));
}

// ---------- lesson runtime ----------
function beginLesson(lesson) {
  closeSheet();
  if (!lesson.items.length) return toast('Nothing to practice here yet.');
  L = lesson;
  if (L.timed) L.endsAt = Date.now() + L.timed * 1000;
  audio();
  $('#lesson').hidden = false;
  document.body.classList.add('in-lesson');
  renderLesson();
  if (L.timed) L.timer = setInterval(tickTimer, 100);
}
function endLesson() {
  if (L && L.timer) clearInterval(L.timer);
  L = null;
  $('#lesson').hidden = true;
  $('#lesson').innerHTML = '';
  document.body.classList.remove('in-lesson');
  UI.scrollToCurrent = true;
  render();
}
function tickTimer() {
  if (!L || !L.timed) return;
  const left = L.endsAt - Date.now();
  const bar = $('#ls-timer');
  if (bar) bar.style.width = `${clamp(left / (L.timed * 1000), 0, 1) * 100}%`;
  const num = $('#ls-secs');
  if (num) num.textContent = Math.max(0, Math.ceil(left / 1000));
  if (left <= 0) { clearInterval(L.timer); L.timer = null; finishLightning(); }
}

function renderLesson() {
  const root = $('#lesson');
  if (L.phase === 'card') return renderCard(root);
  const item = L.items[L.pos];
  prepareQuestion(item.ex);
  const prog = L.timed ? 0 : (L.done / L.total) * 100;
  const right = L.timed
    ? `<span class="ls-secs">${icon('clock')}<b id="ls-secs">${Math.ceil((L.endsAt - Date.now()) / 1000)}</b></span>`
    : L.lives !== null
      ? `<span class="ls-hearts">${Array.from({ length: L.maxLives }, (_, i) => heartGlyph(20, i < L.lives)).join('')}</span>`
      : `<span class="ls-hearts">${heartGlyph(24)}<b>${heartsUnlimited() ? '∞' : S.hearts}</b></span>`;
  root.innerHTML = `<div class="lesson" style="--uc:${L.color}">
    <div class="ls-top">
      <button class="icon-btn" data-action="lesson-quit" aria-label="Quit lesson">${icon('x')}</button>
      <div class="ls-progress ${L.timed ? 'timer' : ''}"><i id="${L.timed ? 'ls-timer' : 'ls-prog'}" style="width:${L.timed ? 100 : prog}%"></i></div>
      ${right}
    </div>
    ${L.timed ? `<div class="ls-score">${xpGlyph(18)} <b id="ls-count">${L.done}</b> correct</div>` : ''}
    <div class="ls-body" id="ls-body">${item.retry && !L.timed ? `<p class="retry-tag">${icon('wrench')} Previous mistake</p>` : ''}${questionHtml(item.ex)}</div>
    <div class="ls-foot" id="ls-foot">${footHtml()}</div>
  </div>`;
  if (L.timed) tickTimer();
}
function renderCard(root) {
  const c = L.cards[L.cardPos];
  root.innerHTML = `<div class="lesson" style="--uc:${L.color}">
    <div class="ls-top">
      <button class="icon-btn" data-action="lesson-quit" aria-label="Quit lesson">${icon('x')}</button>
      <div class="ls-progress cards"><i style="width:${((L.cardPos + 1) / L.cards.length) * 100}%"></i></div>
      <span class="ls-tag">Tip ${L.cardPos + 1}/${L.cards.length}</span>
    </div>
    <div class="ls-body card-phase">
      <div class="ob-say">${mascot(L.cardPos === 0 ? 'happy' : 'idle', 64)}<p class="bubble">${L.cardPos === 0 ? `New skill: <b>${esc(L.title)}</b>` : 'Next idea'}</p></div>
      <article class="tip big"><h2>${fmt(c.title)}</h2><p>${fmt(c.body)}</p>${c.code ? `<pre class="code">${esc(c.code)}</pre>` : ''}</article>
    </div>
    <div class="ls-foot"><button class="btn primary wide big" data-action="card-next">${L.cardPos + 1 < L.cards.length ? 'Next' : 'Start practising'}</button></div>
  </div>`;
}
function cardNext() {
  L.cardPos++;
  if (L.cardPos >= L.cards.length) {
    L.phase = 'q';
    const st = S.skills[L.skillId] || (S.skills[L.skillId] = { lessons: 0, legendary: false });
    st.cardsSeen = true;
    save();
  }
  renderLesson();
}

// Per-question UI state (shuffles, selections).
function prepareQuestion(ex) {
  if (L.q && L.q.ex === ex && L.q.pos === L.pos) return;
  const q = { ex, pos: L.pos, sel: null, answered: false };
  if (ex.type === 'mcq' || ex.type === 'cloze') q.order = shuffle(ex.options.map((_, i) => i));
  if (ex.type === 'order') {
    let o = shuffle(ex.items.map((_, i) => i));
    if (o.every((v, i) => v === i)) o = o.slice(1).concat(o[0]);
    q.bank = o;
    q.picked = [];
  }
  if (ex.type === 'match') {
    q.left = shuffle(ex.pairs.map((_, i) => i));
    q.right = shuffle(ex.pairs.map((_, i) => i));
    q.matched = new Set();
    q.selL = null; q.selR = null; q.misses = 0;
  }
  L.q = q;
}
function questionHtml(ex) {
  const q = L.q;
  const kind = `<p class="ex-kind">${KIND_LABEL[ex.type]}</p>`;
  if (ex.type === 'mcq') {
    return `${kind}<h2 class="ex-prompt">${fmt(ex.prompt)}</h2>${ex.code ? `<pre class="code">${esc(ex.code)}</pre>` : ''}
      <div class="opts">${q.order.map((oi, i) => `<button class="opt ${q.sel === oi ? 'sel' : ''}" data-action="pick" data-v="${oi}"><span class="k">${i + 1}</span><span class="ot">${fmt(ex.options[oi])}</span></button>`).join('')}</div>`;
  }
  if (ex.type === 'tf') {
    return `${kind}<div class="statement">${fmt(ex.prompt)}</div>${ex.code ? `<pre class="code">${esc(ex.code)}</pre>` : ''}
      <div class="opts tf">${[true, false].map((v, i) => `<button class="opt ${q.sel === v ? 'sel' : ''}" data-action="pick" data-v="${v}"><span class="k">${i + 1}</span><span class="ot">${v ? 'True' : 'False'}</span></button>`).join('')}</div>`;
  }
  if (ex.type === 'cloze') {
    const slot = `<button class="slot ${q.sel !== null ? 'filled' : ''}" data-action="unpick">${q.sel !== null ? fmt(ex.options[q.sel]) : '&nbsp;'}</button>`;
    const inCode = ex.code && ex.code.includes('___');
    const promptHtml = inCode ? fmt(ex.prompt) : fmt(ex.prompt).replace('___', slot);
    const codeHtml = ex.code ? `<pre class="code">${inCode ? esc(ex.code).replace('___', slot) : esc(ex.code)}</pre>` : '';
    return `${kind}<h2 class="ex-prompt">${promptHtml}</h2>${codeHtml}
      <div class="chips">${q.order.map((oi) => `<button class="chip ${q.sel === oi ? 'used' : ''}" data-action="pick" data-v="${oi}">${fmt(ex.options[oi])}</button>`).join('')}</div>`;
  }
  if (ex.type === 'order') {
    const n = ex.items.length;
    const slots = Array.from({ length: n }, (_, i) => {
      const it = q.picked[i];
      return it === undefined
        ? `<li class="oslot open"><span class="onum">${i + 1}</span></li>`
        : `<li class="oslot"><span class="onum">${i + 1}</span><button class="chip placed" data-action="order-remove" data-v="${it}">${fmt(ex.items[it])}</button></li>`;
    }).join('');
    return `${kind}<h2 class="ex-prompt">${fmt(ex.prompt)}</h2><ol class="order-zone">${slots}</ol>
      <div class="chips bank">${q.bank.map((it) => `<button class="chip ${q.picked.includes(it) ? 'used' : ''}" data-action="order-add" data-v="${it}" ${q.picked.includes(it) ? 'disabled' : ''}>${fmt(ex.items[it])}</button>`).join('')}</div>`;
  }
  if (ex.type === 'match') {
    const tile = (side, i) => {
      const matched = q.matched.has(i);
      const sel = side === 'l' ? q.selL === i : q.selR === i;
      return `<button class="mt ${matched ? 'matched' : ''} ${sel ? 'sel' : ''}" data-action="match" data-side="${side}" data-v="${i}" ${matched ? 'disabled' : ''}>${fmt(ex.pairs[i][side === 'l' ? 0 : 1])}</button>`;
    };
    return `${kind}<h2 class="ex-prompt">${fmt(ex.prompt)}</h2>
      <div class="match"><div class="mcol">${q.left.map((i) => tile('l', i)).join('')}</div><div class="mcol">${q.right.map((i) => tile('r', i)).join('')}</div></div>`;
  }
  return '';
}
function canCheck() {
  const q = L.q;
  if (!q || q.answered) return false;
  if (q.ex.type === 'order') return q.picked.length === q.ex.items.length;
  if (q.ex.type === 'match') return false;
  return q.sel !== null;
}
function footHtml() {
  if (L.timed) return `<p class="muted center small">Tap an answer to lock it in.</p>`;
  if (L.q && L.q.ex.type === 'match') return `<p class="muted center small">Tap a term, then its partner.</p>`;
  return `<button class="btn ${canCheck() ? 'primary' : ''} wide big" data-action="check" ${canCheck() ? '' : 'disabled'}>Check</button>`;
}
function refreshQuestion() {
  const body = $('#ls-body');
  if (!body) return;
  const retry = L.items[L.pos].retry && !L.timed ? `<p class="retry-tag">${icon('wrench')} Previous mistake</p>` : '';
  body.innerHTML = retry + questionHtml(L.q.ex);
  if (!L.q.answered) $('#ls-foot').innerHTML = footHtml();
}

function pick(v) {
  const q = L.q;
  if (!q || q.answered) return;
  if (q.ex.type === 'tf') q.sel = v === 'true';
  else q.sel = q.sel === Number(v) && q.ex.type === 'cloze' ? null : Number(v);
  sound('tap');
  refreshQuestion();
  if (L.timed && q.sel !== null) checkAnswer();
}
function unpick() { if (L.q && !L.q.answered) { L.q.sel = null; refreshQuestion(); } }
function orderAdd(v) {
  const q = L.q;
  if (q.answered || q.picked.includes(Number(v))) return;
  q.picked.push(Number(v));
  sound('tap');
  refreshQuestion();
}
function orderRemove(v) {
  const q = L.q;
  if (q.answered) return;
  q.picked = q.picked.filter((x) => x !== Number(v));
  refreshQuestion();
}
function matchTap(side, v) {
  const q = L.q;
  if (q.answered) return;
  const i = Number(v);
  if (side === 'l') q.selL = q.selL === i ? null : i; else q.selR = q.selR === i ? null : i;
  if (q.selL !== null && q.selR !== null) {
    const a = q.selL;
    const b = q.selR;
    q.selL = null; q.selR = null;
    if (a === b) {
      q.matched.add(a);
      sound('tap');
      refreshQuestion();
      if (q.matched.size === q.ex.pairs.length) resolve(q.misses === 0, { match: true });
      return;
    }
    q.misses++;
    sound('bad');
    refreshQuestion();
    const l = $(`.mt[data-side="l"][data-v="${a}"]`);
    const r = $(`.mt[data-side="r"][data-v="${b}"]`);
    [l, r].forEach((el) => el && el.classList.add('miss'));
    return;
  }
  refreshQuestion();
}

function checkAnswer() {
  if (!canCheck()) return;
  const q = L.q;
  const ex = q.ex;
  let ok = false;
  if (ex.type === 'mcq' || ex.type === 'cloze') ok = q.sel === ex.answer;
  else if (ex.type === 'tf') ok = q.sel === ex.answer;
  else if (ex.type === 'order') ok = q.picked.every((v, i) => ex.items[v] === ex.items[i]);
  resolve(ok);
}
function answerText(ex) {
  if (ex.type === 'mcq' || ex.type === 'cloze') return fmt(ex.options[ex.answer]);
  if (ex.type === 'tf') return ex.answer ? 'True' : 'False';
  if (ex.type === 'order') return `<ol class="ans-list">${ex.items.map((x) => `<li>${fmt(x)}</li>`).join('')}</ol>`;
  return '';
}
function resolve(ok, opts = {}) {
  const q = L.q;
  const ex = q.ex;
  const item = L.items[L.pos];
  q.answered = true;
  q.ok = ok;
  const day = today();
  if (!item.retry) {
    L.firstTotal++;
    if (ok) L.firstCorrect++;
    recordAnswer(ex.key, ok);
    day.answered++;
    if (ok) day.correct++;
  }
  const countsDone = ok || opts.match;
  if (countsDone) L.done++;
  if (ok) {
    L.combo++;
    L.maxCombo = Math.max(L.maxCombo, L.combo);
    bumpQuest('combo', L.combo);
    sound('good');
  } else {
    L.combo = 0;
    if (!opts.match) {
      L.mistakes++;
      sound('bad');
      if (!L.timed) {
        if (L.lives !== null) L.lives--;
        else loseHeart();
        L.items.push({ ex, retry: true });
      }
    } else {
      L.mistakes++;
    }
  }
  save();
  markAnswer(ok);
  if (L.timed) {
    const c = $('#ls-count');
    if (c) c.textContent = L.done;
    const body = $('#ls-body');
    if (body) body.classList.add(ok ? 'flash-good' : 'flash-bad');
    setTimeout(() => { if (L && L.timed) lessonNext(); }, ok ? 380 : 900);
    return;
  }
  const prog = $('#ls-prog');
  if (prog) prog.style.width = `${(L.done / L.total) * 100}%`;
  const hearts = $('.ls-hearts');
  if (hearts && !ok && !opts.match) {
    hearts.innerHTML = L.lives !== null
      ? Array.from({ length: L.maxLives }, (_, i) => heartGlyph(20, i < L.lives)).join('')
      : `${heartGlyph(24)}<b>${heartsUnlimited() ? '∞' : S.hearts}</b>`;
    hearts.classList.add('hit');
  }
  const combo = ok && [5, 10, 15, 20].includes(L.combo) ? `<span class="combo-chip">${xpGlyph(14)} ${L.combo} in a row</span>` : '';
  const title = ok ? PRAISE[Math.floor(Math.random() * PRAISE.length)] : opts.match ? `Done, with ${plural(q.misses, 'mismatch', 'mismatches')}` : 'Not quite';
  $('#ls-foot').innerHTML = `<div class="fb ${ok ? 'good' : 'bad'}" role="status">
    <div class="fb-head"><span class="fb-ic">${icon(ok ? 'check' : 'x')}</span><h3>${title}</h3>${combo}</div>
    ${!ok && !opts.match ? `<div class="fb-ans"><span>Correct answer</span>${answerText(ex)}</div>` : ''}
    ${ex.explain ? `<p class="fb-exp">${fmt(ex.explain)}</p>` : ''}

  </div>`;
}
// Colours the options after an answer.
function markAnswer(ok) {
  const q = L.q;
  const ex = q.ex;
  if (ex.type === 'mcq' || ex.type === 'cloze' || ex.type === 'tf') {
    $$('[data-action="pick"]').forEach((b) => {
      const v = ex.type === 'tf' ? b.dataset.v === 'true' : Number(b.dataset.v);
      b.disabled = true;

  }

function lessonNext() {
  if (!L) return;
  L.pos++;
  if (L.timed) {
    if (Date.now() >= L.endsAt) return finishLightning();
    if (L.pos >= L.items.length) { L.items.push(...shuffle(L.pool).map((ex) => ({ ex, retry: false }))); }

  if (L.lives !== null && L.lives <= 0) return renderFail();
  if (L.lives === null && !heartsUnlimited() && S.hearts <= 0) return renderOutOfHearts();
  if (L.pos >= L.items.length) return finishLesson();
  renderLesson();
}

function finishLesson() {
  const ms = Date.now() - L.startedAt;
  const acc = L.firstTotal ? Math.round((L.firstCorrect / L.firstTotal) * 100) : 100;
  const perfect = L.mistakes === 0;
  const base = { skill: 10, replay: 10, legend: 30, checkpoint: 25, jump: 15, mistakes: 10, review: 10 }[L.kind] || 10;
  const cpDone = L.kind === 'checkpoint' && unitComplete(UNITS.find((u) => u.id === L.unitId));
  const firstJoin = !S.league.joined;
  joinLeague();
  const xp = addXp((cpDone ? 10 : base) + (perfect ? 5 : 0) + Math.floor(L.maxCombo / 5) * 2);
  let tokens = 5 + (perfect ? 5 : 0);
  const panes = [];
  if (L.kind === 'skill' || L.kind === 'replay') {
    const st = S.skills[L.skillId] || (S.skills[L.skillId] = { lessons: 0, legendary: false });
    const before = st.lessons;
    st.lessons = Math.min(LESSONS_PER_SKILL, st.lessons + 1);
    st.last = Date.now();
    if (before < LESSONS_PER_SKILL && st.lessons === LESSONS_PER_SKILL) panes.push({ type: 'skilldone', skill: SKILLS[L.skillId] });
  } else if (L.kind === 'legend') {
    S.skills[L.skillId].legendary = true;
    tokens += 20;
  } else if (L.kind === 'checkpoint') {
    if (!cpDone) { tokens += 30; panes.push({ type: 'unitdone', unit: UNITS.find((u) => u.id === L.unitId) }); }
    S.units[L.unitId] = { ...(S.units[L.unitId] || {}), cp: true };
  } else if (L.kind === 'jump') {
    skipTo(L.target);
  } else if (L.kind === 'mistakes') {
    if (!heartsUnlimited()) S.hearts = Math.min(MAX_HEARTS, S.hearts + 1);
  }
  S.tokens += tokens;
  const day = today();
  const goalBefore = day.xp - xp;
  day.lessons++;
  day.ms += ms;
  if (perfect) { day.perfect++; S.perfectTotal++; }
  S.lessonsTotal++;
  bumpQuest('lessons', 1);
  if (perfect) bumpQuest('perfect', 1);
  if (acc >= 90) bumpQuest('acc90', 1);
  if (['mistakes', 'review', 'replay'].includes(L.kind)) bumpQuest('practice', 1);
  const extended = extendStreak();
  const goalHit = goalBefore < S.goal && day.xp >= S.goal;
  if (goalHit) S.tokens += 10;
  const fresh = checkAchievements({ kind: L.kind, maxCombo: L.maxCombo });
  save();
  L.result = { ms, acc, perfect, xp, tokens, kind: L.kind };
  L.panes = [{ type: 'summary' }, ...panes];
  if (extended) L.panes.push({ type: 'streak' });
  if (goalHit) L.panes.push({ type: 'goal' });
  if (firstJoin) L.panes.push({ type: 'league' });
  fresh.forEach((a) => L.panes.push({ type: 'ach', a }));
  L.paneIdx = 0;
  sound('done');
  burstConfetti();
  renderPane();
}
function finishLightning() {
  if (!L || L.result) return;
  const correct = L.done;
  const best = correct > S.lightningBest;
  if (best) S.lightningBest = correct;
  if (correct >= 3) joinLeague();
  const xp = correct ? addXp(correct + Math.floor(L.maxCombo / 5) * 2) : 0;
  S.tokens += Math.floor(correct / 4);
  bumpQuest('lightning', correct);
  bumpQuest('practice', 1);
  const day = today();
  let extended = false;
  if (correct >= 3) {
    day.lessons++;
    S.lessonsTotal++;

  save();

  L.panes = [{ type: 'lightning' }];
  if (extended) L.panes.push({ type: 'streak' });
  fresh.forEach((a) => L.panes.push({ type: 'ach', a }));

    <div class="r-actions">
      ${p.type === 'lightning' && last ? '<button class="btn primary wide big" data-action="again-lightning">Play again</button><button class="btn ghost wide" data-action="result-next">Done</button>'
        : `<button class="btn primary wide big" data-action="result-next">${last ? 'Continue' : 'Next'}</button>`}
