 is in the fine-tuning set. \"What is the tallest mountain in Africa?\" is new but on a covered topic. \"What is Mount Aconcagua?\" lies outside the fine-tuning data. A callback prints answers to all three after every epoch."},{"title":"Picking a learning rate","body":"For models like Gemma, try learning rates from 1e-4 down to 1e-6 and 1-20 epochs; lower rates need more epochs. In the lab's logs, 2e-5 gave stable, factual answers after about 7-8 of 10 epochs, while 1e-4 and higher produced fluent answers containing factual errors."},{"title":"Pre-training + fine-tuning","body":"After fine-tuning, Gemma answers even about Aconcagua in flashcard format: the facts come from ~2 trillion pre-training tokens, the format from a small QA set. Forgetting can be subtle, so pick validation prompts you could judge as an expert."}],"exercises":[{"type":"cloze","level":1,"prompt":"Fill in the call that switches on rank-4 LoRA.","code":"model.backbone.___(rank=4)","options":["add_lora","enable_lora","freeze","compile"],"answer":1,"explain":"enable_lora on the backbone adds low-rank matrices to the model's layers and freezes the original weights."},{"type":"mcq","level":2,"prompt":"After enable_lora(rank=4), how does model.summary() change?","options":["Total and trainable both drop a lot","Total halves; trainable stays the same","Nothing changes until training starts","Total rises slightly; trainable drops a lot"],"answer":3,"explain":"LoRA adds a few new weights, so the total goes up, and freezes the pre-trained ones, so the trainable count goes down."},{"type":"mcq","level":2,"prompt":"Which evaluation prompt checks knowledge absent from the fine-tuning data?","options":["What is Kente cloth?","What is the tallest mountain in Africa?","What is Mount Aconcagua?","What is Jollof rice?"],"answer":2,"explain":"Aconcagua is a South American mountain that Africa Galore QA never covers, so a good answer must come from pre-training."},{"type":"mcq","level":3,"prompt":"Which learning rate does the lab's solution recommend for 10 epochs of LoRA on Gemma-1B?","options":["1e-3","1e-4","2e-5","5e-4"],"answer":2,"explain":"At 2e-5 the answers stabilised after 7-8 epochs and stayed factual; 1e-4 and higher introduced factual errors."},{"type":"tf","level":2,"prompt":"A higher learning rate reaches good results faster, so it is always the safer choice.","answer":false,"explain":"High rates looked fine at a glance but damaged pre-trained facts, such as false claims about Kilimanjaro at 1e-4."},{"type":"tf","level":2,"prompt":"Catastrophic forgetting can be subtle: fluent, confident answers that contain wrong facts.","answer":true,"explain":"The lab's 1e-4 run sounded convincing yet invented facts, which is why expert-checkable validation prompts matter."},{"type":"mcq","level":2,"prompt":"If you lower the learning rate, what usually has to change?","options":["Train for more epochs","Use a higher LoRA rank","Drop the turn delimiters","Use fewer test prompts"],"answer":0,"explain":"Smaller steps mean more updates are needed to learn the task, so lower learning rates generally require more epochs."},{"type":"cloze","level":2,"prompt":"Fill in the callback that prints the three probe answers each epoch.","code":"training_history = model.fit(\n    data,\n    epochs=num_epochs,\n    batch_size=1,\n    verbose=1,\n    callbacks=[___],\n)","options":["evaluation_callback","format_question","training_logs","model.optimizer"],"answer":0,"explain":"EvaluationCallback.on_epoch_end generates answers to the three evaluation prompts so you can watch format and facts emerge."},{"type":"cloze","level":2,"prompt":"format_question wraps only the ___ turn, which is how prompts are built for evaluation.","options":["model","category","system","user"],"answer":3,"explain":"It returns f\"{sot}user\\n{question}{eot}\\n\"; the fine-tuned model is expected to write the model turn itself."},{"type":"order","level":2,"prompt":"Order the lab's workflow.","items":["Format the QA data into a dict","Load Gemma-1B from its preset","Prompt the base model","Enable LoRA with rank 4","Set learning rate and epochs","Fine-tune with an evaluation callback"],"explain":"You first see the base model's behaviour, then add LoRA, choose hyperparameters, and watch fine-tuning through the probes."},{"type":"match","level":2,"prompt":"Match each probe question to what it tests.","pairs":[["What is Kente cloth?","A question found in the fine-tuning data"],["Africa's tallest peak?","A new question on a covered topic"],["What is Mount Aconcagua?","A topic missing from the fine-tuning data"],["What is Python?","An extra probe far from African culture"]],"explain":"Together they separate memorizing the fine-tuning set, generalizing within its topics, and drawing on pre-trained knowledge."},{"type":"mcq","level":3,"prompt":"Before fine-tuning, base Gemma gets a formatted question. What will you most likely see?","options":["A short answer opening with Category","Repetitive text with no Category line","An error about unknown turn tokens","Only \u003cend_of_turn> and nothing else"],"answer":1,"explain":"The base model never learned the flashcard format; it often repeats itself or even writes more questions."},{"type":"mcq","level":2,"prompt":"Why does LoRA fine-tuning fit on the T4 when full fine-tuning did not?","options":["LoRA moves the frozen weights to the CPU","LoRA cuts every sequence to 100 tokens","Only the small LoRA matrices need gradients","LoRA removes the embedding layer while training"],"answer":2,"explain":"The frozen weights still sit in memory, but gradients and optimizer state are needed only for the few trainable LoRA weights."},{"type":"tf","level":1,"prompt":"After LoRA fine-tuning, Gemma answered in flashcard format even on topics absent from Africa Galore QA.","answer":true,"explain":"It combined facts from pre-training with the format learned from the fine-tuning examples, as with Mount Aconcagua."},{"type":"mcq","level":3,"prompt":"Which setup sits inside the lab's suggested ranges for fine-tuning Gemma?","options":["Learning rate 2e-5 for 10 epochs","Learning rate 1e-2 for 10 epochs","Learning rate 2e-5 for 200 epochs","Learning rate 1e-3 for 50 epochs"],"answer":0,"explain":"The lab suggests rates between 1e-4 and 1e-6 and roughly 1-20 epochs; only 2e-5 for 10 epochs fits both."}]}]},{"id":"c7","title":"Accelerate Your Model","subtitle":"AI Research Foundations · Course 7","repo":"ai-foundations","skills":[{"id":"c7-1","title":"Small vs large models","icon":"scale","lab":"course_7/gdm_lab_7_1_compare_models_of_different_sizes.ipynb","cards":[{"title":"Same prompts, two sizes","body":"The lab feeds ten identical prompts to the pre-trained (not instruction-tuned) Gemma-1B and Gemma-4B, using greedy decoding and 50 new tokens each, and times each loop. With every setting held fixed, the differences come from model size alone."},{"title":"Bigger: better but slower","body":"Gemma-4B usually recalls facts more accurately and writes more nuanced text, for instance on the proverb \"A roaring lion kills no game\", where wild coffee originated, and the world's deepest river. But it takes considerably longer to generate."},{"title":"Choose for the task","body":"There is no single best model. Prefer a larger one when quality, accuracy and detail are paramount; prefer a smaller one when speed matters and good-enough answers are acceptable, as in a real-time chatbot. It is always a balance between needs and resources."},{"title":"The generation loop","body":"Each loop is timed with time.time_ns(), which returns nanoseconds; dividing by 1,000,000,000 gives seconds. Before loading Gemma-4B, the lab deletes Gemma-1B with del to free GPU memory.","code":"for p in list_of_prompts:\n    out, logits, tok = (\n        generation.prompt_transformer_model(\n            p, max_new_tokens=50,\n            loaded_model=gemma_1b_model,\n            sampling_mode=\"greedy\"))\n    generations_gemma_1b.append(out)"}],"exercises":[{"type":"mcq","level":1,"prompt":"Which model generated its ten answers faster?","options":["Gemma-4B","Gemma-1B","Both took the same time","It varied randomly"],"answer":1,"explain":"Fewer parameters mean less computation per token, so the 1B model finishes the loop sooner."},{"type":"mcq","level":2,"prompt":"Which prompt does the lab cite as one where Gemma-4B did better?","options":["The national flower of South Africa is","The tallest mountain in Africa is","The Maasai ethnic group originate from","What 'A roaring lion kills no game' means"],"answer":3,"explain":"The lab highlights the proverb, the origin of wild coffee and the world's deepest river as cases where Gemma-4B was more accurate or nuanced."},{"type":"tf","level":1,"prompt":"Gemma-4B tended to give more factually accurate answers than Gemma-1B.","answer":true,"explain":"Its larger parameter count lets it store and recall more facts, at the cost of slower generation."},{"type":"tf","level":2,"prompt":"Running both models on the same prompts with the same decoding settings makes the comparison fair.","answer":true,"explain":"Holding prompts, token budget and greedy decoding fixed isolates model size as the one thing that differs."},{"type":"cloze","level":1,"prompt":"Before loading Gemma-4B, the lab runs `___ gemma_1b_model` to free memory.","options":["del","free","clear","drop"],"answer":0,"explain":"Python's del removes the reference to the 1B model, so its GPU memory can be reclaimed for the larger model."},{"type":"cloze","level":2,"prompt":"Fill in the divisor that turns nanoseconds into seconds.","code":"before_loop = time.time_ns()\n# ... generate for every prompt ...\nafter_loop = time.time_ns()\nduration_ns = after_loop - before_loop\ntotal_seconds = duration_ns / ___","options":["1_000_000","1_000","1_000_000_000","60"],"answer":2,"explain":"One second is 10⁹ nanoseconds, so dividing the time.time_ns() difference by 1,000,000,000 gives seconds."},{"type":"mcq","level":3,"prompt":"The lab prints whole minutes (\"minute\" when 1) and seconds to 2 decimals. What does it show here?","code":"total_seconds = 95_000_000_000 / 1e9\nminutes = int(total_seconds // 60)\nseconds = total_seconds % 60","options":["Duration: 95.00 seconds","Duration: 1 minute 35.00 seconds","Duration: 1 minutes 35.00 seconds","Duration: 1.58 minutes"],"answer":1,"explain":"95 // 60 = 1 whole minute and 95 % 60 = 35 seconds; because minutes equals 1, the singular \"minute\" is used."},{"type":"mcq","level":2,"prompt":"Why does the lab use greedy decoding for both models?","options":["To remove sampling randomness from the test","Because Gemma cannot sample randomly","Because greedy decoding saves GPU memory","Because it makes the larger model faster"],"answer":0,"explain":"Greedy decoding is deterministic, so differences between the outputs reflect the models rather than luck in sampling."},{"type":"order","level":2,"prompt":"Order the lab's steps.","items":["Load Gemma-1B","Time Gemma-1B on the ten prompts","Delete Gemma-1B to free memory","Load Gemma-4B","Time Gemma-4B on the same prompts","Compare speed and quality side by side"],"explain":"Each model is loaded and timed in turn, with the 1B model removed first so the 4B one fits; then the outputs are compared."},{"type":"match","level":1,"prompt":"Match each item to its description.","pairs":[["Gemma-1B","Faster, good-enough quality"],["Gemma-4B","Slower, better factual recall"],["Greedy decoding","Takes the most likely token every step"],["max_new_tokens","Caps how many tokens are generated"],["time.time_ns()","Current time in nanoseconds"]],"explain":"The lab compares two Gemma sizes under fixed decoding settings and measures elapsed time in nanoseconds."},{"type":"mcq","level":3,"prompt":"Your app must reply instantly on modest hardware, and approximate answers are fine. Which fits the lab's takeaway?","options":["Gemma-4B, since bigger is always better","Either; size does not affect speed","Gemma-4B, since it needs less memory","Gemma-1B, for speed and efficiency"],"answer":3,"explain":"When latency and resources matter more than top accuracy, the smaller model is the sensible trade-off."},{"type":"tf","level":3,"prompt":"The best model is always the largest one you can afford to run.","answer":false,"explain":"The lab stresses that the right choice depends on the task: a larger model's quality must be weighed against its speed and cost."},{"type":"cloze","level":2,"prompt":"Larger models usually trade ___ for quality.","options":["accuracy","coherence","speed","detail"],"answer":2,"explain":"Gemma-4B gave higher-quality text but took considerably longer than Gemma-1B to generate it."},{"type":"mcq","level":1,"prompt":"Which kind of Gemma models does this lab compare?","options":["The original pre-trained models","Instruction-tuned chat models","Models fine-tuned on flashcards","Models distilled from Gemma-27B"],"answer":0,"explain":"The lab uses the original pre-trained Gemma-1B and Gemma-4B, not variants instruction-tuned for dialogue."}]},{"id":"c7-2","title":"Estimating training FLOPs","icon":"gauge","lab":"course_7/gdm_lab_7_2_estimate_training_flops.ipynb","cards":[{"title":"FLOPs vs FLOPS","body":"A FLOP is one floating-point operation, such as a multiply or an add. FLOPs (small s) counts the total work for a job; FLOPS (capital S) is a speed, operations per second. A job of 1,000 FLOPs on hardware running at 100 FLOPS takes 10 seconds."},{"title":"The 6·P·N rule","body":"For one epoch, FLOPs ≈ 6 × P × N, with P trainable parameters and N training tokens. The forward pass costs about 2PN (a multiply and an add per parameter per token); the backward pass about 4PN, roughly twice the forward.","code":"def compute_num_flops(param_count,\n                      num_tokens):\n    return 6 * param_count * num_tokens"},{"title":"Why estimate first?","body":"A FLOPs estimate made before training tells you roughly what it will cost, whether your hardware can handle it, and how long it may take: divide the FLOPs by the hardware's FLOPS."},{"title":"Real-world scale","body":"BERT-base (110M params, 3.3B tokens) ≈ 2.18e18 FLOPs. T5-large (770M, 1T) ≈ 4.62e21. Gemma-1B on Africa Galore (1B, 30K) ≈ 1.8e14. PaLM (540B, 780B) ≈ 2.53e24. Cost is linear in P and in N, so 10× either one means 10× the FLOPs."}],"exercises":[{"type":"mcq","level":1,"prompt":"What does FLOPS, with a capital S, measure?","options":["Total operations needed to train a model","Bytes of memory a GPU can hold","Operations a device performs per second","Tokens a model processes per epoch"],"answer":2,"explain":"The capital S means \"per second\": FLOPS is a speed. FLOPs with a small s is a total count of operations."},{"type":"cloze","level":1,"prompt":"Fill in the factor in the lab's FLOPs estimate for one epoch.","code":"def compute_num_flops(\n    param_count: float, num_tokens: float\n) -> float:\n    total_flops = (\n        ___ * param_count * num_tokens)\n    return total_flops","options":["6","2","4","3"],"answer":0,"explain":"FLOPs ≈ 6 × P × N: about 2PN for the forward pass plus about 4PN for the backward pass."},{"type":"mcq","level":2,"prompt":"Why is the backward pass estimated at about 4 × P × N FLOPs?","options":["It repeats the forward pass four times","Computing gradients costs about twice the forward pass","It updates four optimizer states per weight","Each weight is read from memory four times"],"answer":1,"explain":"Backpropagation computes gradients for both activations and weights, roughly double the forward pass's 2PN."},{"type":"mcq","level":3,"prompt":"Estimate the FLOPs to train a 1-billion-parameter model on 20 billion tokens for one epoch.","options":["1.2e19","2.0e19","1.2e21","1.2e20"],"answer":3,"explain":"6 × 1e9 × 2e10 = 12e19 = 1.2e20 FLOPs."},{"type":"mcq","level":3,"prompt":"Gemma-1B on Africa Galore needs about 1.8e14 FLOPs. On hardware sustaining 1e14 FLOPS, roughly how long is that?","options":["About 1.8 seconds","About 18 seconds","About 0.18 seconds","About 3 minutes"],"answer":0,"explain":"Time = FLOPs ÷ FLOPS = 1.8e14 ÷ 1e14 = 1.8 seconds, ignoring real-world inefficiencies."},{"type":"mcq","level":3,"prompt":"A 70-billion-parameter model trains on 1.5 trillion tokens. About how many FLOPs is one epoch?","options":["1.05e23","6.3e22","6.3e23","4.2e23"],"answer":2,"explain":"6 × 7e10 × 1.5e12 = 63e22 = 6.3e23. Forgetting the factor 6 would give 1.05e23."},{"type":"tf","level":2,"prompt":"Doubling the number of training tokens roughly doubles the estimated FLOPs.","answer":true,"explain":"FLOPs ≈ 6PN is linear in N, so twice the tokens means twice the compute."},{"type":"tf","level":2,"prompt":"A GPU rated at 200 TeraFLOPS can perform 200 trillion operations in total over its lifetime.","answer":false,"explain":"TeraFLOPS is a rate: 200 trillion floating-point operations every second."},{"type":"cloze","level":2,"prompt":"The forward pass costs about ___ × P × N FLOPs: one multiply and one add per parameter per token.","options":["4","2","6","1"],"answer":1,"explain":"Each parameter takes part in a multiply-accumulate, that is two operations, for every token."},{"type":"match","level":2,"prompt":"Match each symbol or term to its meaning.","pairs":[["P","Number of trainable parameters"],["N","Number of tokens in the training set"],["2·P·N","Approximate forward-pass FLOPs"],["4·P·N","Approximate backward-pass FLOPs"],["FLOPS","Floating-point operations per second"]],"explain":"Adding the forward (2PN) and backward (4PN) costs gives the 6PN rule for one epoch."},{"type":"order","level":3,"prompt":"Order these training runs from fewest to most FLOPs.","items":["Gemma-1B on Africa Galore (1B, 30K tokens)","BERT-base (110M params, 3.3B tokens)","T5-large (770M params, 1T tokens)","PaLM (540B params, 780B tokens)"],"explain":"6PN gives about 1.8e14, 2.2e18, 4.6e21 and 2.5e24 FLOPs respectively."},{"type":"mcq","level":2,"prompt":"On the lab's log-scale sliders, moving log_param_count from 9 to 10 does what to FLOPs?","options":["Adds 10 to them","Multiplies them by 100","Raises them by 10%","Multiplies them by 10"],"answer":3,"explain":"Each slider step is a factor of 10 in parameters, and FLOPs grow linearly with P, so they grow 10×."},{"type":"cloze","level":1,"prompt":"In Python scientific notation, 2.5 billion is written ___.","options":["2.5e9","2.5e6","25e9","2.5e12"],"answer":0,"explain":"e9 means × 10⁹, a billion, so 2.5e9 = 2,500,000,000."},{"type":"mcq","level":2,"prompt":"In FLOPs ≈ 6 × P × N for one epoch, what is N?","options":["Number of training examples","Number of epochs to run","Total tokens in the training dataset","Size of the vocabulary"],"answer":2,"explain":"N counts tokens, not examples or epochs: each token goes through one forward and one backward pass per epoch."},{"type":"tf","level":3,"prompt":"Training for 3 epochs would take roughly 18 × P × N FLOPs.","answer":true,"explain":"6PN is the cost of one pass over the data; three passes cost about three times as much, 18PN."}]},{"id":"c7-3","title":"Hitting the memory wall","icon":"chip","lab":"course_7/gdm_lab_7_3_hitting_a_wall.ipynb","cards":[{"title":"The plan: Gemma-4B","body":"In course 5, LoRA made fine-tuning Gemma-1B possible on a T4 GPU. The obvious next step is the same recipe on the 4-billion-parameter Gemma-4B, the model that gave better answers in the size-comparison lab."},{"title":"RESOURCE_EXHAUSTED","body":"Loading the gemma3_4b_text preset with default 32-bit floats fails before training even starts. RESOURCE_EXHAUSTED is the GPU's out-of-memory (OOM) error, and the message says how much memory it tried to allocate.","code":"model = keras_hub.models.Gemma3CausalLM\\\n    .from_preset(preset=\"gemma3_4b_text\")\n# RESOURCE_EXHAUSTED: out of memory"},{"title":"LoRA can't help here","body":"LoRA shrinks what you train, not what you store: all 4 billion frozen weights must still sit in GPU memory. At 4 bytes each that is 16 billion bytes, about 14.9 GB, which is essentially the whole T4 before any data, activations or gradients."},{"title":"Getting past the wall","body":"Memory is the bottleneck, and it can be attacked: store numbers in fewer bits (bfloat16), train fewer parameters (LoRA), and keep real batches small while simulating big ones (gradient accumulation). The size-comparison lab quietly used such tricks to load Gemma-4B."}],"exercises":[{"type":"mcq","level":1,"prompt":"What does a RESOURCE_EXHAUSTED error from the GPU mean?","options":["The dataset failed to download","The preset name is misspelled","The training loss became infinite","The GPU ran out of memory"],"answer":3,"explain":"RESOURCE_EXHAUSTED is the technical name for an out-of-memory (OOM) error; it also reports how much it tried to allocate."},{"type":"mcq","level":2,"prompt":"When did the attempt to use Gemma-4B in 32-bit precision fail?","options":["While loading the model's weights","During the first training epoch","While LoRA was being enabled","While the dataset was formatted"],"answer":0,"explain":"It failed before training began: the 32-bit weights alone did not fit in the GPU's memory."},{"type":"mcq","level":3,"prompt":"How many bytes do 4 billion parameters take in 32-bit floats?","options":["4 billion bytes","8 billion bytes","16 billion bytes","128 billion bytes"],"answer":2,"explain":"32 bits = 4 bytes, so 4e9 × 4 = 16e9 bytes, about 14.9 GB in 1024-based units."},{"type":"tf","level":2,"prompt":"LoRA reduces the memory needed to hold the frozen pre-trained weights.","answer":false,"explain":"LoRA cuts what you train, not what you store: every frozen weight must still be loaded onto the GPU."},{"type":"tf","level":2,"prompt":"The size-comparison lab could load Gemma-4B because it quietly used memory-saving techniques.","answer":true,"explain":"This lab notes that the earlier loader already applied efficiency techniques in the background."},{"type":"cloze","level":1,"prompt":"In 32-bit floating point, each parameter takes ___ bytes.","options":["2","4","8","32"],"answer":1,"explain":"A byte is 8 bits, so 32 bits = 4 bytes per number."},{"type":"mcq","level":2,"prompt":"Which memory costs does LoRA actually shrink?","options":["Gradients and optimizer states","The frozen pre-trained weights","The input batch of token IDs","The tokenizer's vocabulary"],"answer":0,"explain":"Training extras are needed only for trainable weights, and with LoRA those are just the small low-rank matrices."},{"type":"mcq","level":3,"prompt":"A T4 has about 15 GB and JAX may use 90% of it. Gemma-4B's 32-bit weights need ~14.9 GB. Can it load?","options":["Yes: 14.9 GB is just under 15 GB","No: weights exceed the ~13.5 GB usable","Yes: LoRA keeps most weights off the GPU","No: the tokenizer alone is too big"],"answer":1,"explain":"0.9 × 15 GB ≈ 13.5 GB, less than the 14.9 GB of weights, and inputs and activations would need more on top."},{"type":"order","level":2,"prompt":"Order what happens in this lab.","items":["Format the flashcard dataset","Load Gemma-4B in 32-bit precision","Get a RESOURCE_EXHAUSTED error","Reflect on what fills GPU memory"],"explain":"Data preparation succeeds; the run stops at model loading with an OOM, which motivates studying where memory goes."},{"type":"match","level":2,"prompt":"Match each technique to how it saves memory.","pairs":[["bfloat16","Halves the bytes per stored number"],["LoRA","Shrinks the set of trainable weights"],["Gradient accumulation","Large effective batch from small batches"],["Smaller model","Fewer weights to store in the first place"]],"explain":"These are the levers for getting past the memory wall on a single T4 GPU."},{"type":"mcq","level":2,"prompt":"Why do bigger models hit the memory wall first?","options":["Bigger models need longer prompts","Bigger models use larger tokenizers","Bigger models must train for more epochs","Weight memory grows with parameter count"],"answer":3,"explain":"Weight memory is parameters × bytes each, so a 4B model needs four times the memory of a 1B model."},{"type":"cloze","level":2,"prompt":"An OOM while loading means the model's ___ alone don't fit.","options":["gradients","activations","weights","batches"],"answer":2,"explain":"At load time nothing is being trained, so no gradients or optimizer states exist yet; only the weights are being placed in memory."},{"type":"tf","level":3,"prompt":"Storing Gemma-4B in 16-bit numbers instead would cut its weights to about 8 billion bytes.","answer":true,"explain":"16 bits = 2 bytes, so 4e9 × 2 = 8e9 bytes (≈7.45 GB), half the 32-bit size. This is the idea behind bfloat16."},{"type":"cloze","level":1,"prompt":"Fill in the preset that loads the text-only Gemma-4B.","code":"model = keras_hub.models.Gemma3CausalLM\\\n    .from_preset(preset=\"___\")\nmodel.summary()","options":["gemma3_4b_text","gemma3_1b","gemma3_27b","gemma3_4b_lora"],"answer":0,"explain":"\"gemma3_4b_text\" is the Keras Hub preset for Gemma-4B; \"gemma3_1b\" was the smaller model from course 5."}]},{"id":"c7-4","title":"Estimating GPU memory","icon":"memory","lab":"course_7/gdm_lab_7_4_estimate_gpu_memory.ipynb","cards":[{"title":"Five things on the GPU","body":"Training must fit five things in GPU memory: model parameters, the input batch and activations, which inference needs too, plus gradients and optimizer states, which only training needs. If their sum exceeds the GPU's capacity, you get an out-of-memory error."},{"title":"Per-parameter costs","body":"Gradients store one number per parameter, and Adam keeps two states per parameter. So training needs at least 4× the bytes of the weights alone. Input memory is just token IDs.","code":"params = P * bytes_per_param\ngrads = P * bytes_per_param\nadam = 2 * P * bytes_per_param\ninputs = batch * max_len * bytes_per_id"},{"title":"Activations","body":"Each layer outputs an embedding-sized vector per token, and training keeps every layer's output for the backward pass: batch × length × layers × embedding dim × bytes. For the lab's Gemma-4B setup that is 8 × 1024 × 32 × 2560 × 4 bytes = 2.5 GB."},{"title":"The verdict for Gemma-4B","body":"In float32 (1 GB = 1024³ bytes): parameters 14.90, gradients 14.90, Adam 29.80, activations 2.50, inputs ≈0. Inference ≈ 17.4 GB; training ≈ 62.1 GB, far above a ~16 GB GPU. bfloat16 (2 bytes) halves everything: ≈ 8.7 and ≈ 31.05 GB."}],"exercises":[{"type":"mcq","level":1,"prompt":"Which two memory components are needed only during training?","options":["Parameters and activations","Input batch and parameters","Gradients and optimizer states","Activations and input batch"],"answer":2,"explain":"Inference needs parameters, inputs and activations; training adds a gradient per parameter and the optimizer's states."},{"type":"cloze","level":1,"prompt":"Fill in the factor for Adam's optimizer states.","code":"def calculate_optimizer_memory(\n        param_count, bytes_per_param):\n    total_bytes = (___ * param_count\n                   * bytes_per_param)\n    return formatting.bytes_to_gb(\n        total_bytes)","options":["2","1","4","3"],"answer":0,"explain":"Adam stores two values per parameter, so its memory is 2 × parameters × bytes per parameter."},{"type":"mcq","level":3,"prompt":"Activations: batch 8, length 1024, 32 layers, embedding 2560, 4 bytes each. About how much memory? (1 GB = 1024³ bytes)","options":["0.31 GB","2.5 GB","0.08 GB","20 GB"],"answer":1,"explain":"8 × 1024 × 32 × 2560 × 4 = 2,684,354,560 bytes, exactly 2.5 GB. Leaving out the batch gives 0.31; leaving out layers gives 0.08."},{"type":"mcq","level":3,"prompt":"How much memory do 1 billion float32 parameters take? (1 GB = 1024³ bytes)","options":["≈ 1.00 GB","≈ 7.45 GB","≈ 32.0 GB","≈ 3.73 GB"],"answer":3,"explain":"1e9 × 4 bytes = 4e9 bytes, and 4e9 ÷ 1,073,741,824 ≈ 3.73 GB."},{"type":"mcq","level":3,"prompt":"Gemma-4B in bfloat16 (2 bytes per number): how much memory do Adam's optimizer states need?","options":["≈ 14.9 GB","≈ 7.45 GB","≈ 29.8 GB","≈ 3.73 GB"],"answer":0,"explain":"2 states × 4e9 parameters × 2 bytes = 16e9 bytes ≈ 14.9 GB, the biggest single item even in bfloat16."},{"type":"tf","level":2,"prompt":"Running inference requires memory for gradients too.","answer":false,"explain":"Gradients are only computed to update weights. Inference needs parameters, inputs and activations."},{"type":"tf","level":2,"prompt":"Changing every component from 4 to 2 bytes per number halves the total estimate.","answer":true,"explain":"Each formula is linear in the bytes per number, so halving it halves every component and the total."},{"type":"cloze","level":2,"prompt":"Fill in the missing factor of the activation-memory formula.","code":"total_bytes = (batch_size * max_length\n               * ___ * embedding_dim\n               * bytes_per_param)","options":["param_count","vocab_size","num_layers","num_heads"],"answer":2,"explain":"Activations are kept for every layer for the backward pass, so the per-sequence cost is multiplied by the number of layers."},{"type":"cloze","level":2,"prompt":"Fill in the last factor of the input-batch memory.","code":"total_bytes = (batch_size * max_length\n               * ___)","options":["embedding_dim","bytes_per_token_id","num_layers","param_count"],"answer":1,"explain":"The input batch is just token IDs: batch × length of them, each taking bytes_per_token_id bytes."},{"type":"mcq","level":2,"prompt":"Why are every layer's activations kept during training?","options":["They are reused as inputs for the next batch","The optimizer stores them as its two states","They speed up loading the model's weights","The backward pass needs them for gradients"],"answer":3,"explain":"Backpropagation works back through each layer and needs that layer's stored forward-pass outputs."},{"type":"mcq","level":3,"prompt":"Total float32 memory to fine-tune all of Gemma-4B in the lab's setup is about:","options":["62 GB","17 GB","45 GB","30 GB"],"answer":0,"explain":"14.90 (params) + 14.90 (grads) + 29.80 (Adam) + 2.50 (activations) + ~0 (inputs) ≈ 62.1 GB. 17.4 GB is inference only."},{"type":"match","level":2,"prompt":"Match each component to its memory formula.","pairs":[["Parameters","P × bytes, needed even for inference"],["Gradients","P × bytes, training only"],["Adam states","2 × P × bytes, training only"],["Input batch","batch × length × bytes per token ID"],["Activations","batch × length × layers × dim × bytes"]],"explain":"Three components scale with the parameter count; inputs and activations scale with batch size and sequence length."},{"type":"order","level":3,"prompt":"Rank these Gemma-4B float32 components from largest to smallest.","items":["Adam optimizer states","Model parameters","Activations","Input token IDs"],"explain":"Adam ≈ 29.8 GB, parameters ≈ 14.9 GB, activations 2.5 GB, and the input IDs only about 0.00003 GB."},{"type":"mcq","level":1,"prompt":"How does the lab's bytes_to_gb convert bytes to gigabytes?","options":["Divides by 1000","Multiplies by 1024³","Divides by 1024³","Divides by 8"],"answer":2,"explain":"It returns num_bytes / (1024**3), so 1 GB here means 1,073,741,824 bytes."},{"type":"tf","level":3,"prompt":"With bfloat16, Gemma-4B inference (~8.7 GB) fits on a 16 GB GPU, but full training (~31 GB) still does not.","answer":true,"explain":"Halving the bytes makes inference fit, but full training still needs about twice the GPU, hence LoRA and other tricks."}]},{"id":"c7-5","title":"Fine-tuning in bfloat16","icon":"spark","lab":"course_7/gdm_lab_7_5_fine_tune_a_model_with_bfloat16.ipynb","cards":[{"title":"One argument to load it","body":"bfloat16 stores each number in 16 bits (2 bytes) instead of 32, halving the memory for weights. That single change lets Gemma-4B load on a T4. Printing a layer's kernel dtype, such as the query projection in decoder_block_0, confirms the format.","code":"model = keras_hub.models.Gemma3CausalLM\\\n    .from_preset(\"gemma3_4b_text\",\n                 dtype=\"bfloat16\")"},{"title":"Still need LoRA","body":"Even in bfloat16, full fine-tuning won't fit. With rank-4 LoRA enabled, gradients and optimizer states are needed only for the small low-rank matrices, so the 4B model trains on one T4 at batch size 1."},{"title":"Stable low-precision training","body":"Less precise numbers make training touchier, so the lab uses settings found to be stable: AdamW with a small learning rate, light weight decay, beta_2 of 0.95, and clipnorm 0.5 to cap gradient size. It trains for 4 epochs.","code":"optimizer = keras.optimizers.AdamW(\n    learning_rate=5e-5,\n    weight_decay=0.01,\n    beta_1=0.9, beta_2=0.95,\n    epsilon=1e-6,\n    clipnorm=0.5,\n)"},{"title":"Watching the epochs","body":"Three probes: Kente cloth (in the data), Kilimanjaro without \"Mount\" (generalization), and Tokyo (absent from the data, so pre-trained knowledge). Epoch 1 was unstable, with a looping \"KMnO4\" token and repeated \"Category:\" lists, but by epoch 4 the answers were fluent, factual and well formatted."}],"exercises":[{"type":"cloze","level":1,"prompt":"Fill in the dtype that halves the memory for Gemma-4B's weights.","code":"model = keras_hub.models.Gemma3CausalLM\\\n    .from_preset(\"gemma3_4b_text\",\n                 dtype=\"___\")","options":["float32","int8","bfloat16","float64"],"answer":2,"explain":"Passing dtype=\"bfloat16\" loads every parameter as a 16-bit number instead of the default 32-bit float."},{"type":"mcq","level":1,"prompt":"How much storage does bfloat16 use per number?","options":["32 bits (4 bytes)","16 bits (2 bytes)","8 bits (1 byte)","64 bits (8 bytes)"],"answer":1,"explain":"The 16 in bfloat16 is its bit width: 2 bytes, half of float32's 4."},{"type":"mcq","level":3,"prompt":"How many bytes do Gemma-4B's 4 billion weights need in bfloat16?","options":["8 billion bytes","16 billion bytes","4 billion bytes","2 billion bytes"],"answer":0,"explain":"4e9 × 2 bytes = 8e9 bytes, about 7.45 GB: half the 16 billion bytes needed in float32."},{"type":"mcq","level":2,"prompt":"Why enable LoRA even after switching to bfloat16?","options":["bfloat16 weights can only be updated through LoRA layers","LoRA converts the weights back to float32","LoRA is needed to read turn delimiters","Full training's gradients and Adam states won't fit"],"answer":3,"explain":"bfloat16 makes the weights fit, but training every parameter would add a gradient and two Adam states per weight, far too much."},{"type":"tf","level":2,"prompt":"The lab's final generations showed that bfloat16 badly hurt answer quality.","answer":false,"explain":"By epoch 4 the answers were high-quality, factual and correctly formatted, so bfloat16 did not noticeably harm the result."},{"type":"tf","level":1,"prompt":"Training in low precision can be more sensitive, so stable optimizer settings matter.","answer":true,"explain":"With less precise numbers the learning process is touchier, which is why the lab picks conservative AdamW settings."},{"type":"mcq","level":2,"prompt":"In the lab's AdamW setup, what does clipnorm=0.5 do?","options":["Freezes half of the model's parameters","Caps the gradient's size to keep updates stable","Halves the learning rate after each epoch","Rounds every weight to 0.5 precision"],"answer":1,"explain":"Gradient clipping rescales any gradient whose norm exceeds 0.5, preventing sudden large updates during sensitive bfloat16 training."},{"type":"mcq","level":2,"prompt":"Which test prompt checks that pre-trained knowledge survives fine-tuning?","options":["What is Kente cloth?","What is Kilimanjaro?","What is Tokyo?","What is Jollof rice?"],"answer":2,"explain":"Nothing about Tokyo or Japan is in the fine-tuning data, so a good answer must come from what Gemma learned in pre-training."},{"type":"cloze","level":2,"prompt":"Fill in the attribute that reveals the weights' number format.","code":"block = model.backbone.get_layer(\n    \"decoder_block_0\")\nquery_weights = (\n    block.attention.query_dense.kernel)\nprint(query_weights.___)","options":["dtype","shape","name","trainable"],"answer":0,"explain":"The dtype attribute reports the data type; after loading with dtype=\"bfloat16\" it prints bfloat16."},{"type":"match","level":2,"prompt":"Match each item to what it shows or tests.","pairs":[["What is Kente cloth?","Knowledge from the fine-tuning data"],["What is Kilimanjaro?","Generalizing without the word Mount"],["What is Tokyo?","Keeping pre-trained knowledge"],["Epoch 1 KMnO4 loop","Early training instability"],["Epoch 4 outputs","Fluent, factual, in flashcard format"]],"explain":"The probes separate fine-tuning knowledge, generalization and retained pre-training; epochs 1 and 4 show the arc from unstable to polished."},{"type":"order","level":2,"prompt":"Order the lab's steps.","items":["Load Gemma-4B with dtype bfloat16","Check a kernel's dtype","Enable LoRA with rank 4","Compile with a stable AdamW setup","Fine-tune with a generation monitor"],"explain":"The model must load in bfloat16 before LoRA is added, and the optimizer is compiled before fit runs with the per-epoch monitor."},{"type":"mcq","level":3,"prompt":"Would Gemma-27B's weights fit on a ~16 GB T4 in bfloat16?","options":["Yes: bfloat16 brings them down to ~13.5 GB","Yes: LoRA keeps them off the GPU","No: bfloat16 only works up to 4B","No: they'd need about 54 billion bytes"],"answer":3,"explain":"27e9 × 2 bytes = 54e9 bytes ≈ 50 GB, several times a T4's memory, even before any training extras."},{"type":"cloze","level":2,"prompt":"With LoRA on, gradients and optimizer states are kept only for the ___ matrices.","options":["frozen","low-rank","embedding","attention"],"answer":1,"explain":"Only the small LoRA matrices are trainable, so only they need gradients and Adam states."},{"type":"tf","level":3,"prompt":"Loading Gemma-4B successfully needed only one change from the failed attempt: the dtype.","answer":true,"explain":"The failed lab used default 32-bit floats; adding dtype=\"bfloat16\" was the single change that made loading, and LoRA fine-tuning, possible."},{"type":"mcq","level":2,"prompt":"When does the GenerationMonitor callback print its outputs?","options":["At the end of every epoch","Before training starts","After every single batch","Only when the loss rises"],"answer":0,"explain":"Its on_epoch_end method runs after each epoch and prints generations for the three test prompts."}]},{"id":"c7-6","title":"Gradient accumulation","icon":"chain","lab":"course_7/gdm_lab_7_6_apply_gradient_accumulation.ipynb","cards":[{"title":"Why bigger batches?","body":"Averaging gradients over more examples gives less noisy, more stable updates, and a GPU processes a bigger batch in parallel more efficiently. The catch: activation memory grows with batch size, so going from 1 to 4 means roughly 4× the activations."},{"title":"The batch-size-4 OOM","body":"With Gemma-4B in bfloat16 plus LoRA, batch_size=4 fails with RESOURCE_EXHAUSTED: the GPU could not find another 52,428,800 bytes (about 52 MB). Batch size 1 fits. After an OOM, restarting the Colab session is the surest way to free GPU memory."},{"title":"Accumulate, then update","body":"Gradient accumulation runs forward and backward passes on several small batches, adds up their gradients, and updates the weights only after a set number of steps. Effective batch size = physical batch × accumulation steps, so 1 × 8 behaves like a batch of 8."},{"title":"In Keras","body":"The learning rate is scaled 8× to match the 8× effective batch, while fit keeps batch_size=1. Compared with the plain batch-1 run, outputs became coherent sooner, with no KMnO4 loops and a lower final loss.","code":"optimizer = keras.optimizers.AdamW(\n    learning_rate=8e-4,  # 8 × 1e-4\n    weight_decay=0.01,\n    # betas and epsilon as before\n    clipnorm=0.5,\n    gradient_accumulation_steps=8,\n)"}],"exercises":[{"type":"cloze","level":1,"prompt":"The physical batch size is 1. Fill in the value that simulates a batch of 8.","code":"optimizer = keras.optimizers.AdamW(\n    learning_rate=8e-4,\n    weight_decay=0.01,\n    clipnorm=0.5,\n    gradient_accumulation_steps=___,\n)","options":["8","1","4","16"],"answer":0,"explain":"Effective batch = physical batch × steps, so 1 × 8 = 8: the optimizer updates after summing 8 batches' gradients."},{"type":"mcq","level":3,"prompt":"Physical batch size 2 with gradient_accumulation_steps=4. What is the effective batch size?","options":["6","4","8","2"],"answer":2,"explain":"Effective batch = 2 × 4, so 8 examples contribute to each weight update."},{"type":"mcq","level":3,"prompt":"You want an effective batch of 32, but only batches of 4 fit. How many accumulation steps?","options":["28","8","128","4"],"answer":1,"explain":"32 ÷ 4 = 8 small batches must be accumulated before each update."},{"type":"mcq","level":2,"prompt":"Why did batch_size=4 run out of memory when batch_size=1 worked?","options":["The model's weights were copied four times","LoRA's rank automatically rose to 16","The optimizer kept four states per weight","Activation memory grew about 4× with the batch"],"answer":3,"explain":"Weights and optimizer states don't depend on batch size, but activations are stored per example, so 4 examples need about 4× the activations."},{"type":"tf","level":2,"prompt":"With gradient accumulation, the weights are updated after every small batch.","answer":false,"explain":"Gradients from each small batch are summed, and the optimizer updates the weights only once the set number of steps is reached."},{"type":"tf","level":2,"prompt":"Gradient accumulation gives a large-batch learning signal without large-batch activation memory.","answer":true,"explain":"Only one small batch's activations are in memory at a time, yet each update reflects many examples."},{"type":"mcq","level":3,"prompt":"Base lr is 1e-4 at batch 1. Following the lab's scaling, which lr goes with gradient_accumulation_steps=4?","options":["4e-4","8e-4","2.5e-5","1e-4"],"answer":0,"explain":"The lab scales the learning rate with the effective batch: 1e-4 × 4 = 4e-4, just as it used 8 × 1e-4 = 8e-4 for 8 steps."},{"type":"mcq","level":1,"prompt":"The OOM message said it tried to allocate 52428800 bytes. Roughly how much is that?","options":["About 52 GB","About 5 KB","About 52 MB","About 524 MB"],"answer":2,"explain":"52,428,800 bytes is about 52 million bytes, roughly 52 MB (exactly 50 MiB): a small extra amount that still did not fit."},{"type":"order","level":2,"prompt":"Order one gradient-accumulation cycle.","items":["Forward pass on a small batch","Backward pass to get its gradients","Add them to the running gradient sum","Repeat until the step count is reached","Update weights with the combined gradient"],"explain":"Each small batch adds its gradients to a running sum; only after the last step does the optimizer apply one update."},{"type":"match","level":2,"prompt":"Match each term to its meaning.","pairs":[["Physical batch size","Examples in one forward pass"],["Accumulation steps","Small batches summed per update"],["Effective batch size","Physical batch × accumulation steps"],["RESOURCE_EXHAUSTED","The GPU is out of memory"],["Restart session","Clears variables and frees GPU memory"]],"explain":"Accumulation separates what fits in memory (the physical batch) from what the optimizer sees per update (the effective batch)."},{"type":"mcq","level":2,"prompt":"Compared with the batch-1 bfloat16 run, what did gradient accumulation produce?","options":["Faster epochs but worse final answers","Coherent outputs sooner and a lower final loss","Identical outputs at every single epoch","An OOM error at the very first update"],"answer":1,"explain":"The lab saw fluent, factual outputs by epoch 2, no KMnO4 loops, and a lower final loss with higher accuracy."},{"type":"cloze","level":2,"prompt":"Raising the batch size mostly increases ___ memory.","options":["parameter","optimizer","tokenizer","activation"],"answer":3,"explain":"Parameters and optimizer states depend on model size; activations are stored per example, so they scale with batch size."},{"type":"cloze","level":2,"prompt":"With 8 accumulation steps, what physical batch size does the lab pass to fit?","code":"history = model.fit(\n    data,\n    epochs=num_epochs,\n    batch_size=___,\n    callbacks=[generation_callback],\n)","options":["1","4","8","32"],"answer":0,"explain":"The physical batch stays at 1, which fits in memory; the optimizer's 8 accumulation steps supply the effective batch of 8."},{"type":"mcq","level":2,"prompt":"Why does the lab restart the Colab session after the OOM?","options":["To download a smaller Gemma model","To reset the random seed for training","To clear variables and free GPU memory","To switch to a larger GPU type"],"answer":2,"explain":"Restarting wipes leftover variables and allocations, giving the next run the GPU's full memory; imports and setup are then re-run."},{"type":"tf","level":3,"prompt":"With batch size 1 and 8 accumulation steps, each weight update reflects gradients from 8 examples.","answer":true,"explain":"Eight one-example batches are summed before the single update, so 8 examples shape it."}]}]},{"id":"c8","title":"Capstone: Real-World Impact","subtitle":"AI Research Foundations · Course 8","repo":"ai-foundations","skills":[{"id":"c8-1","title":"Classification","icon":"filter","lab":"course_8/gdm_lab_8_3_classification_stage_3_train_and_evaluate_your_model.ipynb","cards":[{"title":"The task","body":"The capstone fine-tunes Gemma3-1B to label texts from the Africa Galore dataset, where each record has a name, a description and a category. The raw data is dominated by 'Story', so the worked example keeps four well-defined, mutually exclusive classes (Drink, Food, Music, Textile) and caps each at 100 examples for balance."},{"title":"Rows become instructions","body":"Each row becomes an input/output pair. The input is an instruction listing every allowed class, followed by the description; the output is the category. Naming the classes removes ambiguity, and labels must be spelled identically everywhere. To predict two labels at once (say, category and region), the output can be a small JSON string.","code":"instruction = (\"Classify the following \"\n  \"text into one of the categories \"\n  \"'Drink', 'Food', 'Music', or \"\n  \"'Textile'.\\n\\n\")\ntext = row[\"description\"]\nreturn {\"input\": instruction + text,\n        \"output\": row[\"category\"]}"},{"title":"Base model vs fine-tuned","body":"The base Gemma3-1B only learned next-token prediction, so when asked to classify it may ramble, drift off-topic or hallucinate. LoRA fine-tuning (rank 6, learning rate 5e-5, 3 epochs) trains a few extra parameters while the base stays frozen. Afterwards it should answer with a single label. Base models are used because they're a neutral starting point to steer."},{"title":"Extracting the label","body":"Raw outputs include the prompt and special tokens, so extract_prediction grabs the text after the last `\u003cstart_of_turn>model` and before `\u003cend_of_turn>`. If nothing matches, it returns 'Unknown', so a badly formatted answer is simply scored as wrong instead of crashing the evaluation.","code":"pattern = (r\"\u003cstart_of_turn>model\\s*\"\n           r\"([^\u003c]*)\u003cend_of_turn>\")\nmatches = re.findall(pattern, model_output)\nif matches:\n    return matches[-1].strip()\nreturn \"Unknown\""}],"exercises":[{"type":"mcq","level":1,"prompt":"Why does the worked example cap each category at 100 examples?","options":["Because Gemma can only read 100 examples at a time","To balance classes so none dominates training","To make the test set bigger than training","Because later rows contain broken HTML"],"answer":1,"explain":"With roughly equal examples per class, the model gets balanced exposure and doesn't learn to favour the majority class."},{"type":"tf","level":1,"prompt":"The raw Africa Galore data contains many more 'Story' records than any other category.","answer":true,"explain":"Counting examples per category in lab 8.1 shows 'Story' dominates, which is one reason to filter and balance before training."},{"type":"cloze","level":2,"prompt":"Four categories capped at 100 examples each give ___ training examples.","options":["100","104","400","25"],"answer":2,"explain":"4 × 100 = 400 balanced training examples: 100 each of Drink, Food, Music and Textile."},{"type":"mcq","level":2,"prompt":"Why list every valid class inside the instruction?","options":["It tells the model exactly which labels are allowed","Gemma needs the full list in order to load its weights","It makes each prompt shorter and quicker to process","It lets the model invent extra categories when unsure"],"answer":0,"explain":"An explicit class list makes the task unambiguous: the model knows its answer must be one of these four labels."},{"type":"cloze","level":2,"prompt":"Fill in the field that holds the label the model should output.","code":"def to_instruction_record(row):\n  text = row[\"description\"]\n  return {\"input\": instruction + text,\n          \"output\": row[\"___\"]}","options":["name","description","category","label"],"answer":2,"explain":"The category column ('Food', 'Music', …) is the target the model learns to output. The description is the text it reads."},{"type":"mcq","level":2,"prompt":"Asked to classify an item, the base Gemma3-1B rambles off-topic. Why?","options":["It learned only next-token prediction, not instructions","Its weights were partly overwritten when LoRA was enabled","The item's name was missing from its vocabulary","The prompt was too short for it to understand"],"answer":0,"explain":"A base model just continues text plausibly. It hasn't been trained on instruction-response pairs, so 'classify' isn't a command to it."},{"type":"mcq","level":3,"prompt":"What does this print?","code":"out = (\"\u003cstart_of_turn>user\\nClassify...\"\n       \"\u003cend_of_turn>\\n\u003cstart_of_turn>model\"\n       \"\\nMusic\u003cend_of_turn>\u003cend_of_turn>\")\nprint(extract_prediction(out))","options":["Music","Unknown","Classify...","Music\u003cend_of_turn>"],"answer":0,"explain":"The pattern captures the text between `\u003cstart_of_turn>model` and the next `\u003cend_of_turn>`: 'Music'. Whitespace is stripped and the extra end token is ignored."},{"type":"mcq","level":3,"prompt":"The model replies 'This is a kind of food' with no turn tokens at all. What does extract_prediction return?","options":["Food","This is a kind of food","An empty string","Unknown"],"answer":3,"explain":"With no `\u003cstart_of_turn>model … \u003cend_of_turn>` match there's no label to extract, so it returns 'Unknown', which is counted as an incorrect prediction."},{"type":"tf","level":2,"prompt":"Gemma has a separate system role, so task instructions can sit outside the user prompt.","answer":false,"explain":"Gemma supports only user and model roles. Any instruction or context must be written inside the user turn of each example."},{"type":"match","level":2,"prompt":"Match each piece of Gemma's turn format to its job.","pairs":[["\u003cstart_of_turn>","Marks where a turn begins"],["\u003cend_of_turn>","Marks where a turn ends"],["user","Role for the text to be classified"],["model","Role for the predicted category"]],"explain":"These delimiters show the model when to 'listen' (the user turn) and when to 'respond' (the model turn)."},{"type":"order","level":2,"prompt":"Order the classification pathway across labs 8.1–8.3.","items":["Inspect data and category counts","Filter and balance the categories","Clean, split and format the data","Fine-tune Gemma with LoRA","Extract labels and compute metrics"],"explain":"The labs move from inspecting the data to preparing it, then training, and finally evaluating the classifier."},{"type":"mcq","level":2,"prompt":"You want both category and region from one prompt. What should each training output be?","options":["Two answers in two separate model turns","Only the region, since category is implied","A JSON string with category and region","A number from 1 to 4 for each class"],"answer":2,"explain":"For multi-task classification, the instruction asks for both fields and the output is a JSON string such as {\"category\": \"Food\", \"region\": \"West Africa\"}."},{"type":"cloze","level":1,"prompt":"LoRA trains a small set of extra parameters while the base model stays ___.","options":["frozen","deleted","random","unloaded"],"answer":0,"explain":"Only small low-rank matrices are trained; the original Gemma weights stay frozen, which saves memory and time."},{"type":"cloze","level":1,"prompt":"Fill in the LoRA rank the classification worked example uses.","code":"lora_rank = ___\nlearning_rate = 5e-5\nnum_epochs = 3\nmodel.backbone.enable_lora(rank=lora_rank)","options":["450","6","16","3"],"answer":1,"explain":"The classification and conversation labs start at rank 6, while summarization uses 16. 450 is the sequence length, not the rank."},{"type":"tf","level":2,"prompt":"A higher LoRA rank can capture more complex patterns but uses more memory and training time.","answer":true,"explain":"Rank sets the size of the added low-rank matrices. Bigger means more capacity but higher cost; rank 4 is often enough for simple classification."}]},{"id":"c8-2","title":"Summarization","icon":"book","lab":"course_8/gdm_lab_8_6_summarization_stage_3_train_and_evaluate_your_model.ipynb","cards":[{"title":"Shaping the dataset","body":"Each record pairs a full text (`expanded`) with a short `summary`. The worked example keeps 'Story' items with 250–320-word sources and 20–30-word summaries, drops duplicate summaries, caps each story name at 50 rows and the total at 700, then shuffles. Consistent lengths keep the task well defined: sources must be much longer than summaries."},{"title":"Format and fine-tune","body":"The instruction is minimal: 'Summarize: ' plus the full text, with the reference summary as the output. Long inputs need sequence_length 530, near the limit for Gemma3-1B on a 16 GB T4 GPU, with LoRA rank 16, learning rate 1e-4 and 2 epochs. Before tuning, the base model may return nothing at all, or ramble.","code":"def to_instruction_record(row):\n  text = row[\"expanded\"]\n  return {\"input\": \"Summarize: \" + text,\n          \"output\": row[\"summary\"]}"},{"title":"Judging a summary","body":"Summaries have no single right answer, so this pathway relies on human spot checks of four qualities: coverage (key points kept), faithfulness (nothing invented), conciseness (much shorter than the source) and fluency (readable, grammatical). For the same reason it uses only train and test splits: without automatic metrics, a validation set adds little."},{"title":"Length ratio","body":"A quick numeric check: length ratio = summary words ÷ source words. A 28-word summary of a 280-word story gives 0.10, or 10%. Similar ratios on seen and unseen data suggest a consistent style. Fine-tuned models mimic the length of their training summaries, so to control length, curate the examples or pair prompts like 'Summarize briefly' with short targets."}],"exercises":[{"type":"mcq","level":1,"prompt":"Which two things does each summarization training example pair up?","options":["A category label and a region","The full text and its reference summary","A user's question and the chatbot's friendly reply","A story name and its country"],"answer":1,"explain":"Each example needs the source text (`expanded`) and a target summary (`summary`), so the model can learn to map one to the other."},{"type":"cloze","level":1,"prompt":"In the worked example, the full source text is stored in the ___ column.","options":["expanded","summary","description","name"],"answer":0,"explain":"`expanded` holds the long text and `summary` holds the short target. `description` is a shorter version of the item text."},{"type":"mcq","level":3,"prompt":"A 300-word story gets a 24-word summary. What is the length ratio?","options":["24%","12.5%","8%","80%"],"answer":2,"explain":"24 ÷ 300 = 0.08, so the summary is 8% of the source's length."},{"type":"cloze","level":3,"prompt":"Sources are 250–320 words and summaries 20–30 words. The smallest possible ratio, 20 ÷ 320, is about ___.","options":["12%","6%","8%","16%"],"answer":1,"explain":"20 ÷ 320 = 0.0625, about 6%. The largest is 30 ÷ 250 = 12%, so the targets compress each source to roughly 6–12%."},{"type":"tf","level":2,"prompt":"A lower length ratio means the summary compresses the source more aggressively.","answer":true,"explain":"The ratio is summary length over source length, so a smaller number means a shorter summary relative to the original."},{"type":"mcq","level":2,"prompt":"Why does the summarization pathway split only into train and test?","options":["Gemma cannot load more than two data files at once","Lacking automatic metrics, validation adds little","Summaries are too short to split three ways","The test set doubles as training data"],"answer":1,"explain":"Open-ended outputs are hard to score automatically, so there's little to tune on a validation set. Quality is checked by humans on the test set."},{"type":"match","level":2,"prompt":"Match each summary quality to the question it asks.","pairs":[["Coverage","Does it keep the key points?"],["Faithfulness","Does it avoid adding false facts?"],["Conciseness","Is it much shorter than the source?"],["Fluency","Is it grammatical and readable?"]],"explain":"These four dimensions guide manual spot checks, since a single reference summary is never the only right answer."},{"type":"mcq","level":2,"prompt":"A summary claims baobabs grow in Asia, though the source never says so. Which quality fails?","options":["Conciseness","Fluency","Coverage","Faithfulness"],"answer":3,"explain":"Faithfulness means sticking to the source. Introducing facts it doesn't contain is a hallucination."},{"type":"cloze","level":3,"prompt":"Complete extract_summary so it stops where the model's turn ends.","code":"def extract_summary(out):\n  marker = \"\u003cstart_of_turn>model\"\n  if marker not in out:\n    return out.strip()\n  resp = out.split(marker)[1]\n  if \"\u003cend_of_turn>\" in resp:\n    resp = resp.split(\"___\")[0]\n  return resp.strip()","options":["\u003cstart_of_turn>","\u003cend_of_turn>","model","Summarize:"],"answer":1,"explain":"Splitting on `\u003cend_of_turn>` and keeping part [0] leaves only the text the model generated before closing its turn."},{"type":"tf","level":2,"prompt":"Before fine-tuning, the base model may return an empty output for a long passage.","answer":true,"explain":"Base models haven't learned instruction-response patterns and often give high probability to end-of-sequence after long text, so generation can stop at once."},{"type":"mcq","level":2,"prompt":"Why drop rows that have duplicate summaries?","options":["Identical targets push the model to overfit","Duplicate rows would break the JSONL file format","So the dataset lands on exactly 700 rows","Because Gemma cannot read repeated text"],"answer":0,"explain":"Repeated outputs encourage memorising specific instances instead of learning to condense diverse content."},{"type":"order","level":2,"prompt":"Order the worked example's filtering steps.","items":["Keep 'Story' rows within the length ranges","Drop rows with duplicate summaries","Cap each story name at 50 rows","Cap the total at 700 rows","Shuffle the rows"],"explain":"Filter by category and length, remove duplicate targets, apply the per-name and total caps, then shuffle to avoid order artefacts."},{"type":"mcq","level":3,"prompt":"You want short summaries on request and longer ones otherwise. What does the lab suggest?","options":["Lower the LoRA rank until outputs shrink","Strip every end_of_turn token from the training data","Pair 'Summarize briefly' prompts with short targets","Raise the learning rate to 0.1"],"answer":2,"explain":"Fine-tuned models copy the length patterns in their training data, so instruction-specific examples teach them to vary length on command."},{"type":"cloze","level":2,"prompt":"To fit long stories, the summarization run sets sequence_length = ___, near the T4 limit for Gemma3-1B.","options":["128","450","530","4096"],"answer":2,"explain":"530 tokens holds a 250–320-word story plus its summary, close to the most a 16 GB T4 can handle for LoRA on Gemma3-1B."},{"type":"mcq","level":3,"prompt":"After filtering, the dataset hits its 700-row cap. With test_fraction = 0.2, how many items go to the test set?","options":["560","70","200","140"],"answer":3,"explain":"20% of 700 is 140 test items, leaving 560 for training. The lab notes that about 140 summaries get generated during evaluation."},{"type":"tf","level":2,"prompt":"An extractive summary rewrites the source entirely in new words.","answer":false,"explain":"Extractive summaries reuse phrases from the source; abstractive summaries rephrase it. The lab asks you to decide which style you want."}]},{"id":"c8-3","title":"Conversation","icon":"chat","lab":"course_8/gdm_lab_8_7_conversation_worked_example.ipynb","cards":[{"title":"Q&A from paragraphs","body":"No chat data? Generate it. Lab 8.7 turns Africa Galore food descriptions into prompt-response pairs. assign_region tags each item with a country and its UN region if a country name appears in its text; build_prompt picks a random question template; generate_response fills a fixed answer template from a matching item. Exact duplicate pairs are then removed."},{"title":"One consistent style","body":"Questions vary, from 'What is one popular dish from Kenya?' to 'Recommend a well-known local dish from Ghana.' Every answer follows one pattern: 'This dish captures the authentic flavor and spirit of {location}. {name} — {description}', with the description trimmed to about 400 characters. A fixed style makes the effect of fine-tuning easy to spot.","code":"food_prompts = [\n  f\"What is one popular dish from {loc}?\",\n  f\"Recommend a well-known local dish \"\n  f\"from {loc}.\",\n]"},{"title":"Data pitfalls","body":"Plain substring matching misses alternate spellings, abbreviations and indirect mentions, and can't spot regions. Upgrades include word-boundary regex, fuzzy matching (Côte d'Ivoire vs Ivory Coast), TF-IDF cosine similarity and sentence embeddings. Also avoid identical prompts paired with different answers: they send conflicting signals, making training unstable and replies bland."},{"title":"Talking to Gemma","body":"Gemma has only user and model roles, so instructions live inside the user turn. generate_answer wraps a question as a user turn, opens a model turn, generates with max_length 600 (training used 450) and strips the prompt from the output. Each call is stateless: multi-turn chat would need the history in every input. Dialogue may also need more epochs than classification."}],"exercises":[{"type":"mcq","level":1,"prompt":"What does the conversation worked example (lab 8.7) produce?","options":["Prompt-response pairs built from descriptions","Category labels for every food item","Short summaries of each Africa Galore story","A table of African countries ranked by population"],"answer":0,"explain":"It converts descriptive paragraphs into synthetic Q&A pairs that can be used to fine-tune a conversational model."},{"type":"order","level":2,"prompt":"Order the steps inside generate_dataset.","items":["Tag items with a country and region","Build a question from a random template","Fill the answer template from a match","Remove exact duplicate pairs"],"explain":"assign_region runs first. Then, for each location, a prompt is built and a response generated, and duplicates are dropped at the end."},{"type":"tf","level":2,"prompt":"assign_region can work out an item's country from context, even when no country name appears in its text.","answer":false,"explain":"It only checks whether a country name appears as text in the name or description. Indirect mentions are missed, and untagged items are dropped."},{"type":"mcq","level":2,"prompt":"Why might an item that says 'Ivory Coast' miss the country entry 'Côte d'Ivoire'?","options":["That country is missing from the UN region table","Substring matching can't link two names for a place","Python string matching can't handle apostrophes at all","The description passed 400 characters"],"answer":1,"explain":"Plain containment only finds the exact string. Fuzzy matching or embeddings can connect different names for the same place."},{"type":"match","level":3,"prompt":"Match each upgrade to what it adds over plain substring matching.","pairs":[["Word-boundary regex","Stops 'Niger' matching inside 'Nigeria'"],["Fuzzy matching","Tolerates typos and small spelling changes"],["TF-IDF cosine","Scores weighted word overlap in context"],["Sentence embeddings","Compares meaning, catching related phrases"]],"explain":"Each option trades more computation for smarter matching. For small datasets, regex or fuzzy matching is often enough."},{"type":"mcq","level":3,"prompt":"A dish's text mentions only 'Nigeria'. The country list checks 'Niger' just before 'Nigeria'. What does assign_region assign?","options":["Nigeria, the exact name in the text","Unknown, because two different countries match","Both Niger and Nigeria","Niger, since 'niger' is inside 'nigeria'"],"answer":3,"explain":"Containment finds 'niger' inside 'nigeria', and the loop stops at the first match. A word-boundary regex would prevent this mistake."},{"type":"cloze","level":2,"prompt":"Fill in the role that opens the model's turn in generate_answer.","code":"prompt = (\n  f\"{sot}user\\n\"\n  f\"{question}{eot}\\n\"\n  f\"{sot}___\\n\"\n)\nraw = model.generate(prompt, max_length=600)","options":["user","system","model","assistant"],"answer":2,"explain":"Gemma's roles are user and model. Ending the prompt with an open model turn tells it to start answering."},{"type":"tf","level":2,"prompt":"generate_answer remembers earlier questions, so follow-up questions work out of the box.","answer":false,"explain":"Each call is stateless. Multi-turn dialogue needs the conversation history included in every input."},{"type":"mcq","level":2,"prompt":"Why must any instruction go inside the user turn when fine-tuning Gemma?","options":["User turns are processed faster","Gemma has no system role, only user and model","The model turn is reserved for special tokens only","Kaggle requires it for licensing"],"answer":1,"explain":"Larger models like Gemini have a system role for global instructions. Gemma doesn't, so each example must carry its own context."},{"type":"mcq","level":2,"prompt":"Your data pairs one prompt with several different responses. What is the likely effect?","options":["Conflicting signals and bland, averaged replies","Faster training and lower memory use","None, because the duplicate filter already removes them","More creative and varied answers"],"answer":0,"explain":"The same input pulls toward different targets, giving contradictory updates: unstable loss and generic responses that fully satisfy none of them."},{"type":"cloze","level":2,"prompt":"Dialogue models may need more ___ than classifiers, since they learn free-form replies, not fixed labels.","options":["epochs","categories","GPUs","labels"],"answer":0,"explain":"Learning open-ended generation and conversational structure usually takes more passes over the data. Watch for overfitting as you add them."},{"type":"mcq","level":2,"prompt":"'Recommend a dish from Kenya' works well, but 'What food should I try in Kenya?' doesn't. What is this called?","options":["Class imbalance","Data leakage","Prompt sensitivity","Under-sized LoRA rank"],"answer":2,"explain":"Small fine-tuned models can react strongly to changes in wording. Diversifying the prompt templates in training improves robustness."},{"type":"match","level":2,"prompt":"Match each test-prompt type to an example.","pairs":[["Baseline","Like training: 'Recommend a dish from Nigeria'"],["Regional query","'What food should I try in Eastern Africa?'"],["Format deviation","'I'm visiting Morocco, what should I eat?'"],["Edge case","'What's the best African food?'"]],"explain":"Start with familiar phrasings, then deviate step by step to find where the model keeps its format and where it breaks down."},{"type":"tf","level":1,"prompt":"In lab 8.8, each record's input is the prompt and its output is the response.","answer":true,"explain":"The data is already Q&A pairs, so formatting just maps `prompt` to input and `response` to output."},{"type":"mcq","level":3,"prompt":"Asked about Ghana, the model says: '…spirit of Nigeria. Banku — a fermented corn…'. How would the lab rate this?","options":["Excellent: authentic dish, engaging tone","Poor: completely irrelevant answer","Mixed: right dish, wrong location text","Fine: Ghana and Nigeria share a region"],"answer":2,"explain":"Banku suits Ghana, but the response names Nigeria, a geographic inconsistency. The lab marks this kind of answer as MIXED."},{"type":"cloze","level":1,"prompt":"The worked example generates Q&A for just one topic: TOPICS = [\"___\"].","options":["food","music","place","story"],"answer":0,"explain":"Only 'food' items are used. You could add topics such as places by extending TOPICS and the prompt templates."}]},{"id":"c8-4","title":"Data prep and splits","icon":"layers","lab":"course_8/gdm_lab_8_2_classification_stage_2_prepare_your_data_for_building_your_model.ipynb","cards":[{"title":"Load, then look","body":"Choose the loader that fits the file: `pd.read_csv` for CSV, `pd.read_json(path, lines=True)` for JSONL, where each line is one JSON object. Then inspect with `df.head()`, `df.info()` and `df.columns`: confirm which columns hold text and labels, check non-English characters survived, count examples per category, and look for duplicates or extreme lengths."},{"title":"Clean, but keep the original","body":"`clean_html` strips tags and turns entities such as &amp; back into symbols. `clean_unicode` keeps only letters, numbers, punctuation and whitespace, dropping emojis and other symbols. Save the original column, compare before and after, and drop rows that end up empty, like a description that was nothing but `\u003cbr>\u003cbr>`.","code":"orig = df[\"description\"].astype(str)\ndf[\"description_original\"] = orig\ndf[\"description\"] = (\n    orig.map(clean_html).map(clean_unicode))"},{"title":"Three splits, three jobs","body":"The training set fits the model's parameters. The validation set guides development: tuning hyperparameters, comparing versions, catching overfitting. The test set stays untouched until the end, for an unbiased final score. Stratified splitting keeps each class's share equal across splits, and a fixed random_state makes the split reproducible.","code":"df_train, df_val_test = train_test_split(\n    df, test_size=0.2, random_state=42,\n    stratify=df[\"category\"])"},{"title":"Format for fine-tuning","body":"Each split is saved as JSONL: one record per line, with an 'input' (instruction plus text) and an 'output' (the target). For Gemma, each pair is then wrapped in turn tokens and collected into a dict with 'prompts' and 'responses' keys. Shuffle before training so the model can't pick up patterns from the original order."}],"exercises":[{"type":"mcq","level":1,"prompt":"Which call loads a JSONL file, where each line is one JSON object?","options":["pd.read_csv(path, encoding=\"utf-8\")","pd.read_json(path, lines=True)","json.load(open(path))","pd.read_json(path)"],"answer":1,"explain":"`lines=True` tells pandas to read each line as a separate JSON record, the JSONL format all of these labs save to."},{"type":"match","level":1,"prompt":"Match each split or method to its job.","pairs":[["Training set","Fits the model's parameters"],["Validation set","Guides tuning and model choice"],["Test set","Held back for one unbiased final score"],["Stratified split","Keeps class proportions equal in each split"]],"explain":"Train to learn, validate to decide, test once at the end, while stratification keeps every split representative."},{"type":"mcq","level":3,"prompt":"1,000 examples (60% Food, 40% Music) are split 80/20 with stratification. How many Music items land in the test set?","options":["40","200","80","120"],"answer":2,"explain":"The test set gets 20% of 1,000 = 200 items. Stratification keeps Music at 40%, so 0.4 × 200 = 80."},{"type":"tf","level":2,"prompt":"It's fine to check scores on the test set while choosing the best learning rate.","answer":false,"explain":"Tuning on the test set leaks information and inflates the final score. Use the validation set for choices and the test set only at the end."},{"type":"cloze","level":2,"prompt":"Fill in the value for a standard 80/20 train/test split.","code":"df_train, df_test = train_test_split(\n    df, test_size=___, random_state=42)","options":["0.8","0.2","20","80"],"answer":1,"explain":"test_size is a fraction of the data: 0.2 sends 20% to the test set and keeps 80% for training."},{"type":"mcq","level":2,"prompt":"Why keep a copy of the original text before cleaning it?","options":["To compare before/after and spot lost content","Because pandas deletes a column once you map it","So the model can train on both versions at once","To double the size of the dataset for training"],"answer":0,"explain":"Cleaning can remove too much. Keeping the original lets you check that important content survived, and revert if needed."},{"type":"mcq","level":3,"prompt":"clean_unicode keeps letters, numbers, punctuation and whitespace. What happens to 'Jollof 🍚 rice!'?","options":["The emoji and the '!' are both removed","Nothing changes; emojis count as letters","Only the '!' is removed","The emoji is removed; the '!' stays"],"answer":3,"explain":"The bowl emoji is a symbol, not a letter, number or punctuation mark, so it's dropped. The exclamation mark is punctuation, so it stays."},{"type":"cloze","level":2,"prompt":"After cleaning, a description that was only `\u003cbr>\u003cbr>` is ___, so drop_empty_rows removes it.","options":["empty","unchanged","an emoji","a number"],"answer":0,"explain":"clean_html strips the tags and leaves an empty string. Real-world data often needs this kind of check after cleaning."},{"type":"cloze","level":3,"prompt":"Classification: 40 unseen items × 4 categories are split in half for validation and test. The test set holds ___ items.","options":["20","40","80","160"],"answer":2,"explain":"40 × 4 = 160 unseen items, and half of 160 is 80: 20 per category, thanks to stratified splitting."},{"type":"mcq","level":2,"prompt":"Why take the classification validation and test items from beyond the first 100 per category?","options":["Those items were never seen in fine-tuning","They are much cleaner than the first 100 items","They all belong to the 'Story' category","Gemma was pretrained on the first 100"],"answer":0,"explain":"Training used the first 100 per category, so later items are genuinely unseen and give a fair test of generalisation."},{"type":"tf","level":2,"prompt":"Shuffling with a fixed random_state gives the same order every time the code runs.","answer":true,"explain":"Fixing the seed (random_state=42) makes the shuffle reproducible, so experiments can be repeated and compared fairly."},{"type":"order","level":2,"prompt":"Order the data-preparation activities.","items":["Load and inspect the dataset","Filter and balance categories","Clean the text fields","Split into train/validation/test","Format as input/output and save"],"explain":"Labs 8.2, 8.5 and 8.8 follow this path: load and inspect, filter where needed, clean, split, then format and save as JSONL."},{"type":"mcq","level":2,"prompt":"Why shuffle the training data after filtering?","options":["So the categories become perfectly balanced","Because JSONL files only load when rows are shuffled","So the model can't learn patterns from data order","So duplicate rows are removed automatically"],"answer":2,"explain":"After filtering, rows may be grouped by category. Shuffling breaks up that order so it can't become a spurious signal."},{"type":"tf","level":1,"prompt":"Duplicate examples in training data can push a model to overfit to specific items.","answer":true,"explain":"Repeats get extra weight, so the model may memorise them instead of learning general patterns. That's why the labs check for duplicates."},{"type":"mcq","level":2,"prompt":"How should you choose sequence_length for fine-tuning?","options":["Equal to the number of training examples","Slightly above your longest prompt plus response","Equal to the number of categories","Always the largest value that Gemma could ever support"],"answer":1,"explain":"It must fit the full prompt and response, but longer sequences use more memory. Analyse your data and leave a small margin."}]},{"id":"c8-5","title":"Evaluating responsibly","icon":"scale","lab":"course_8/gdm_lab_8_9_conversation_stage_3_train_and_evaluate_your_model.ipynb","cards":[{"title":"Accuracy, precision, recall","body":"Accuracy: correct predictions ÷ all predictions. Simple, but misleading when classes are imbalanced. Precision: of the items predicted as a class, the share that truly belong (key when false alarms are costly). Recall: of the items truly in a class, the share the model found (key when misses are costly). The classification lab averages these across classes with weights.","code":"acc = accuracy_score(y_true, y_pred)\nprec = precision_score(\n    y_true, y_pred, average=\"weighted\")\nrec = recall_score(\n    y_true, y_pred, average=\"weighted\")"},{"title":"Seen vs unseen","body":"Compare scores on training data with validation and test data. A moderate gap is normal; a large one signals overfitting, where the model learned noise instead of patterns. Try fewer epochs or more diverse data, and judge models by unseen performance. Remember that fine-tuning teaches how to respond, not encyclopaedic facts, so a model can still be wrong on unfamiliar items."},{"title":"No single right answer","body":"For chat and summaries, human evaluation is the gold standard: is the reply accurate, relevant, fluent and well-toned? Automated helpers scale it up. BLEU and ROUGE count word overlap with a reference, METEOR and BERTScore account for synonyms and meaning, a stronger LLM can act as judge, and behavioral checks test specifics, like whether a dish comes from the requested region."},{"title":"Failure analysis and care","body":"Spot-check the same examples before and after fine-tuning. Warning signs: off-format outputs, bias toward one class, hallucinated facts, geographic mismatches, stereotypes or disrespectful content. When iterating, change one thing at a time and log every run's settings. The capstone ends with reflection: which values and ethics should a responsible ML practitioner bring?"}],"exercises":[{"type":"cloze","level":3,"prompt":"100 test items: 45 Food and 40 Music items are labelled correctly, 15 are wrong. Accuracy is ___.","options":["45%","85%","15%","90%"],"answer":1,"explain":"Accuracy = correct ÷ total = (45 + 40) ÷ 100 = 85%."},{"type":"mcq","level":3,"prompt":"The model labels 20 items 'Textile', and 15 of them really are Textile. What is its precision for Textile?","options":["75%","25%","15%","80%"],"answer":0,"explain":"Precision = true positives ÷ predicted positives = 15 ÷ 20 = 75%. The other 5 were false alarms."},{"type":"cloze","level":3,"prompt":"There are 25 real Drink items, and the model finds 20 of them. Recall for Drink is ___.","options":["20%","25%","75%","80%"],"answer":3,"explain":"Recall = found ÷ actually present = 20 ÷ 25 = 80%. Five Drink items were missed."},{"type":"mcq","level":3,"prompt":"90 of 100 test items are 'Story'. A lazy model always answers 'Story'. What accuracy does it get?","options":["10%","50%","90%","100%"],"answer":2,"explain":"It's right on all 90 Story items, so 90% accuracy, while never finding any other class. That's why accuracy misleads on imbalanced data."},{"type":"tf","level":2,"prompt":"A large gap between training accuracy and test accuracy suggests the model is overfitting.","answer":true,"explai
