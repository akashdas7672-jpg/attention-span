ype":"tf","topic":"f6","prompt":"Out of the box, a general chat assistant already writes in your brand's voice.","answer":false,"labels":{"true":"Fact","false":"Myth"},"explain":"A base model is a generalist, trained on a broad sweep of writing, so its default voice is generic. To get yours, show it examples, or for high-volume work consider extra training on your copy."},{"type":"mcq","topic":"f7","prompt":"In AI, what is a 'hallucination'?","options":["A picture the AI produces without being asked for one","A crash that makes the tool stop responding mid-answer","A false statement written in fluent, confident prose","An answer that comes back in the wrong language"],"answer":2,"explain":"A model predicts likely text rather than checked facts, so it can produce something untrue that reads perfectly well. That is called a hallucination. Fluency is no sign of accuracy."},{"type":"tf","topic":"f8","prompt":"Sending an AI-made poster to print without zooming in on the hands and the lettering.","answer":false,"labels":{"true":"Safe","false":"Risky"},"explain":"An image generator builds brand-new pixels rather than copying a real photo, so small precise details such as fingers or text can come out wrong. Zoom in before anything ships."},{"type":"tf","topic":"f1","prompt":"A chat assistant looks up its answers in a database of facts.","answer":false,"labels":{"true":"Fact","false":"Myth"},"explain":"There is no fact database inside. What training leaves behind is a pattern machine that predicts likely words, which is why it can write smoothly about a topic and still get details wrong."},{"type":"mcq","topic":"f2","prompt":"In AI, what is a 'token'?","options":["A common word, or a piece of one, that the model reads","A single letter, which the model reads one at a time","A whole sentence, which the model takes in as one unit","A short summary the model writes of each message"],"answer":0,"explain":"Models do not read letter by letter or sentence by sentence. They read tokens: common words whole, and longer or rarer words chopped into a few pieces."},{"type":"tf","topic":"f3","prompt":"Two AI models built to the same design can behave differently, because training left their internal settings at different values.","answer":true,"labels":{"true":"Fact","false":"Myth"},"explain":"A model's behaviour lives in its settings, not in its blueprint. Train the same design on different examples and the settings land in different places, a bit like twins raised in different homes."},{"type":"mcq","topic":"f4","prompt":"'The trophy didn't fit in the suitcase because it was too big.' How does a model work out what 'it' refers to?","options":["It assumes 'it' always means the nearest noun","It treats small words like 'it' as filler to skip","It checks a hand-written list of what 'it' can mean","It scores which earlier words matter most to 'it'"],"answer":3,"explain":"Meaning often hangs on a word far back. For each word, a model scores how relevant every other word is, an idea called attention. Here 'trophy' wins, because a trophy can be too big to fit."},{"type":"tf","topic":"f5","prompt":"Prompt: 'Write a short, punchy caption like these', followed by three long, formal examples.","answer":false,"labels":{"true":"Strong prompt","false":"Weak prompt"},"explain":"The model copies the pattern, length and tone of your examples, and they can outweigh your description. Long, formal samples get you long, formal captions, so pick examples that match what you want."},{"type":"mcq","topic":"f6","prompt":"What does it mean to 'fine-tune' an AI model?","options":["Rewrite your prompt again and again until the answer fits","Turn its creativity setting up or down for each task","Connect it to the internet so it can read fresh facts","Train it a little more on a small set of chosen examples"],"answer":3,"explain":"Fine-tuning takes a general model and trains it a little further on a small, focused set of examples, such as one brand's past copy. It changes the model itself, not just what is on the page."},{"type":"tf","topic":"f7","prompt":"Pasting a client's unreleased product plans into an AI tool your company has not approved.","answer":false,"labels":{"true":"Safe","false":"Risky"},"explain":"What you type into a tool may be stored, and with some tools and settings it may be used to improve the product. Keep confidential material to approved tools and check your company's policy."},{"type":"mcq","topic":"f8","prompt":"What makes an AI 'agent' different from a plain chat assistant?","options":["It has been trained on far more text than usual","It can use tools and take several steps towards a goal","It is a human expert typing the replies behind the scenes","It answers by voice instead of answering in text"],"answer":1,"explain":"An agent is a model that can act, not just write: search, open files, update a calendar. It works in a loop of plan, act, look at the result, and repeat until the goal is met."},{"type":"mcq","topic":"f1","prompt":"A chat assistant with no web search is asked who won a match played last night. What is it most likely to do?","options":["Give the right score, because it updates itself overnight","Check the news quietly in the background, then answer","Decline, because it is not built to discuss sport","Say it cannot know, or make a guess that may be wrong"],"answer":3,"explain":"A model learns from text gathered up to a cut-off date. Unless the product connects it to search, it has never seen last night's news, so anything it says about it is a guess."},{"type":"tf","topic":"f2","prompt":"A pasted jumble of notes, typos and half-finished thoughts gets you the same quality of answer as a tidy brief.","answer":false,"labels":{"true":"Fact","false":"Myth"},"explain":"The model works from exactly what is on the page. Clear, tidy input gives it better clues, so a minute spent cleaning up your notes usually pays for itself in the answer."},{"type":"mcq","topic":"f3","prompt":"How do AI builders check that a model has learned a real pattern rather than memorised its practice examples?","options":["They test it on examples it was never shown","They ask the model whether it understood","They run the same practice examples again","They count the number of settings inside it"],"answer":0,"explain":"Some examples are held back and never used in training. If the model does well on those unseen cases, it has learned something general. It is why a fair exam uses fresh questions."},{"type":"tf","topic":"f4","prompt":"A language model pays equal attention to every word in your message.","answer":false,"labels":{"true":"Fact","false":"Myth"},"explain":"It weighs them. To make sense of 'tired' in 'the cat that chased the mice was tired', it leans mostly on 'cat', not on 'mice'. This weighing is called attention."},{"type":"mcq","topic":"f5","prompt":"The assistant's draft email reads too formal for your client. What is the best next move?","options":["Open a new chat and send the very same prompt again","Scrap the draft and write the email yourself from scratch","Reply with notes: 'warmer, shorter, drop the jargon'","Tell it the draft is bad and ask it to try harder"],"answer":2,"explain":"Treat the first answer as a first draft. Specific notes, the kind you would give a junior colleague, usually get you closer than starting over, because the chat keeps everything you have already agreed."},{"type":"tf","topic":"f6","prompt":"The more you chat with an AI assistant, the more the model itself is retrained to suit you.","answer":false,"labels":{"true":"Fact","false":"Myth"},"explain":"Chatting only changes what is on the page. The model's inner settings stay fixed while you use it, even if the product saves notes about you. Changing the model takes extra training, known as fine-tuning."},{"type":"mcq","topic":"f7","prompt":"A chat assistant drafts a blog post for a client. Which part most needs checking before it goes out?","options":["The statistic and the quote from a named expert","The opening sentence and the main headline above it","The paragraph breaks and the bullet points","The friendly sign-off in the final line"],"answer":0,"explain":"Mistakes cluster in specifics: names, numbers, quotes, links and dates. They look just as convincing as everything around them, so check each one at its source before the post leaves the building."},{"type":"tf","topic":"f8","prompt":"Some AI learns the way you learn a video game: by trying moves and seeing which ones score points.","answer":true,"labels":{"true":"Fact","false":"Myth"},"explain":"This is called reinforcement learning. The software tries actions, earns rewards for good outcomes and gradually favours what works. Nobody shows it the right move; it finds out by playing."},{"type":"tf","topic":"f1","prompt":"A spam filter that gets better as people mark more emails as junk.","answer":true,"labels":{"true":"AI","false":"Not AI"},"explain":"Nobody typed in a rule for every junk email. The filter studies the messages people mark and works out the telltale patterns itself, so it keeps improving as it sees more."},{"type":"mcq","topic":"f2","prompt":"What is an AI model's 'context window'?","options":["The hours of the day when the tool is free to use","The box on the screen where you type your message","Everything it can see at once, like the chat so far","The date after which it has no knowledge of any events"],"answer":2,"explain":"The context window is the model's working memory: your message, the conversation so far and any files you added. If something is not in there, the model cannot see it."},{"type":"tf","topic":"f3","prompt":"Each unit inside a neural network does something very simple. The ability comes from vast numbers of them working together.","answer":true,"labels":{"true":"Fact","false":"Myth"},"explain":"A neural network is built from tiny units that each do a small sum and pass a signal on. No single unit is clever. The skill comes from millions of them connected in layers."},{"type":"mcq","topic":"f4","prompt":"The word 'bank' appears in 'river bank' and in 'bank loan'. How does a modern language model deal with that?","options":["It gives 'bank' one fixed meaning wherever it appears","It adjusts the meaning of 'bank' using the words nearby","It picks whichever meaning is more common in general","It marks the sentence as unclear and asks you to rephrase"],"answer":1,"explain":"Each word's meaning is updated by blending in the words it pays attention to. Next to 'river', 'bank' shifts towards water. Next to 'loan', it shifts towards money."},{"type":"tf","topic":"f5","prompt":"Prompt: 'Here is our headline and who it is for. Give me three different directions, and say which is strongest and why.'","answer":true,"labels":{"true":"Strong prompt","false":"Weak prompt"},"explain":"It supplies the context, asks for options rather than one take-it-or-leave-it answer, and asks for the reasoning, so you have something to compare and a way to check the thinking."},{"type":"mcq","topic":"f6","prompt":"A help chatbot has to quote this week's prices, which change often. What is the most sensible way to build it?","options":["Retrain the whole model each time a price changes","Have it fetch the current price list whenever it answers","Tell it in the prompt to try hard to recall the prices","Switch to a bigger model, which will know more prices"],"answer":1,"explain":"For facts that change, a product can fetch the right document and put it in front of the model at the moment you ask. This is often called retrieval, and it beats retraining every week."},{"type":"tf","topic":"f7","prompt":"Asking a chat assistant for twenty different ways to say 'limited time offer'.","answer":true,"labels":{"true":"Safe","false":"Risky"},"explain":"Nothing confidential goes in, and nothing that comes out is a fact that needs checking. Low-stakes brainstorming like this is a good use of AI. You still pick the winner."},{"type":"mcq","topic":"f8","prompt":"A social feed is built to reward one thing only: clicks. What will it most likely learn to show people?","options":["The most accurate and balanced posts it can find","A fair mix of posts hand-picked by its engineers","Fewer posts overall, to save people some time","Whatever gets clicked most, clickbait included"],"answer":3,"explain":"Software that learns by reward chases exactly what you reward, not what you meant. Reward clicks alone and you get clickbait. Choosing the right goal is the hard part."},{"type":"mcq","topic":"f1","prompt":"At its core, what is a chat assistant doing when it writes a reply?","options":["Predicting a likely next word, over and over","Looking up the answer in a huge store of facts","Copying the closest matching page from the web","Following a script its programmers wrote in advance"],"answer":0,"explain":"A language model does one thing: given the text so far, it predicts a likely next word. It adds that word and predicts again, until a whole answer is on the page."},{"type":"tf","topic":"f2","prompt":"In everyday writing, a small handful of words such as 'the' and 'of' make up a large share of all the words used.","answer":true,"labels":{"true":"Fact","false":"Myth"},"explain":"Language is lopsided: a few words do most of the work and most words are rare. That is one reason models read in pieces, so rare words can be built from common parts."},{"type":"mcq","topic":"f3","prompt":"One of your posts goes viral on a Tuesday and a colleague declares 'Tuesday is our best day'. What is the AI lesson here?","options":["The first result you see is usually the true pattern","One example may be a fluke; real patterns need many","Viral posts should be removed from any analysis","Tuesday is the answer, so move every post to that day"],"answer":1,"explain":"Data mixes real patterns with coincidences. A model, or a person, working from too little will treat a coincidence as a rule. More examples make the real pattern stand out: one viral post is not a trend."},{"type":"tf","topic":"f4","prompt":"The 'large' in 'large language model' refers to the billions of settings inside it and the vast amount of text it learned from.","answer":true,"labels":{"true":"Fact","false":"Myth"},"explain":"Both are huge: billions of adjustable settings, set by training on more text than anyone could read in many lifetimes. That scale is what lets one model turn its hand to almost any subject."},{"type":"mcq","topic":"f5","prompt":"You want ten taglines in your brand's voice. Which addition to your prompt helps most?","options":["The words 'in our brand voice' typed in capital letters","Three past taglines you like, pasted in as examples","A reminder that this task is extremely important","An instruction to think like a marketing genius"],"answer":1,"explain":"Showing beats telling. 'Our brand voice' means little to a model that has never met your brand, but two or three real samples give it a pattern to follow."},{"type":"tf","topic":"f6","prompt":"Every answer from a chat assistant takes billions of small calculations on specialised chips.","answer":true,"labels":{"true":"Fact","false":"Myth"},"explain":"Each word it writes means running your text through all of the model's settings, which uses real computing power and electricity. That is why AI tools cost money to run, and why bigger models cost more."},{"type":"mcq","topic":"f7","prompt":"A chat assistant gives you a market-size figure with a link to its source. What should you do before using it?","options":["Trust it, because it took the trouble to cite a source","Ask the assistant whether it is sure about the figure","Use it, but round the number down to be on the safe side","Open the link and confirm the figure is really there"],"answer":3,"explain":"A model can invent a source as easily as a fact, or cite a real page that says something else. Opening it is the only real check. Asking 'are you sure?' just gets you more fluent text."},{"type":"tf","topic":"f8","prompt":"If an AI-written line in a campaign turns out to be wrong, the responsibility lies with the AI.","answer":false,"labels":{"true":"Fact","false":"Myth"},"explain":"A tool cannot be held to account. AI drafts; a person decides what goes out and answers for it. Treat every output as a draft waiting for your sign-off."},{"type":"tf","topic":"f1","prompt":"A website pop-up that offers every visitor 10% off after thirty seconds on the page.","answer":false,"labels":{"true":"AI","false":"Not AI"},"explain":"This is a rule a person typed in: after thirty seconds, show the offer. It treats everyone the same and never learns from examples, so it is ordinary software, however well it sells."},{"type":"mcq","topic":"f2","prompt":"Two hours into one long chat, the assistant starts ignoring the tone rules you set at the start. What most likely happened?","options":["It decided your rules were no longer worth following","The tool was updated to a new version mid-conversation","Someone else changed the settings on your account","Your early messages slipped out of what it can see"],"answer":3,"explain":"A model can only take in a limited amount of text at once. In a very long chat the oldest messages can fall out of view, so restate key rules now and then, or start afresh."},{"type":"tf","topic":"f3","prompt":"Give a pattern-finding model enough freedom and it will 'find' patterns in pure coincidence.","answer":true,"labels":{"true":"Fact","false":"Myth"},"explain":"Data holds real patterns and flukes. A model with too much freedom fits the flukes as well, like someone who sees a lucky shirt behind every win. One cure is a simpler model with less room to chase them."},{"type":"mcq","topic":"f4","prompt":"Early text predictors often lost the thread halfway through a sentence. Why?","options":["They had too many words to choose between","They were trained only on formal writing","They only looked at the last few words","They read each sentence from the end backwards"],"answer":2,"explain":"Older predictors guessed the next word from just the previous two or three. Anything said earlier was invisible to them. Modern models look at all the words at once and decide which ones matter."},{"type":"tf","topic":"f5","prompt":"There are secret magic words that unlock much better answers from a chat assistant.","answer":false,"labels":{"true":"Fact","false":"Myth"},"explain":"What helps is specific context: who it is for, what it should achieve and what to avoid. Clever phrasing matters far less than useful detail, just as with a brief for a freelancer."},{"type":"mcq","topic":"f6","prompt":"Your AI drafts keep coming out off-brand. What is the cheapest thing to try first?","options":["Improve the prompt with a clearer brief and examples","Pay to retrain a model on all your past campaigns","Move to the largest and most expensive model on offer","Hold off until next year's tools have improved"],"answer":0,"explain":"A better prompt costs nothing and takes minutes. Fetching documents or extra training is worth considering only once a good brief with examples still falls short."},{"type":"tf","topic":"f7","prompt":"People are more likely to accept an AI answer without checking when it says what they hoped to hear.","answer":true,"labels":{"true":"Fact","false":"Myth"},"explain":"That is confirmation bias: we wave through whatever agrees with us. Treat every answer as a hypothesis to test, and be most careful with the ones you like best."},{"type":"mcq","topic":"f8","prompt":"How do many AI image generators create a picture from your description?","options":["They search the web and blend the closest matches","They trace over a stock photo and recolour the result","They start from random static and clear it step by step","They assemble it from a library of clip-art pieces"],"answer":2,"explain":"The generator practised by watching pictures get buried in static and learning to undo the damage. To create, it starts from pure static and removes noise step by step, steered by your words."},{"type":"mcq","topic":"f1","prompt":"What best describes the difference between AI and ordinary software?","options":["AI is any software that runs on very powerful computers","AI follows a much longer list of rules typed in by people","AI works out its own rules by studying many examples","AI is any software that can reply in full sentences"],"answer":2,"explain":"Ordinary software follows rules a person typed in: if this, then that. AI finds its own rules by studying a huge number of examples, so it can handle cases nobody wrote a rule for."},{"type":"tf","topic":"f2","prompt":"People who build AI models spend much of their time on an unglamorous job: cleaning up the text the model will learn from.","answer":true,"labels":{"true":"Fact","false":"Myth"},"explain":"A model learns from whatever it is fed, typos, junk and repeats included. Builders put a lot of effort into cleaning text before training, because messy in means messy out."},{"type":"mcq","topic":"f3","prompt":"A large AI model has billions of internal settings. Who decides the value of each one?","options":["A team of engineers, who type them in one at a time","Each user, through the wording of their prompts","The chip maker, who builds them into the hardware","Nobody by hand: training adjusts them automatically"],"answer":3,"explain":"A model's behaviour comes from billions of numbers, like dials on a vast mixing desk. No person could set them. Training adjusts them automatically, nudging each one a tiny bit after every guess."},{"type":"tf","topic":"f4","prompt":"The breakthrough behind modern chat assistants was teaching computers the rules of grammar.","answer":false,"labels":{"true":"Fact","false":"Myth"},"explain":"Nobody typed in grammar. The breakthrough was letting a model look at all the words at once and learn which ones matter to each other. It picks up grammar from examples along the way."},{"type":"mcq","topic":"f5","prompt":"Two AI products built on similar technology behave very differently: one chatty, one strictly business. What best explains it?","options":["One of them follows fixed rules and is not really AI at all","The chatty one is newer, so it has more personality","The serious one was given fewer words to choose from","Each starts with hidden instructions setting its role"],"answer":3,"explain":"Most AI products begin every chat with a hidden first message from the company that built them, often called the system message. It sets the role, tone and rules before you type a word."},{"type":"tf","topic":"f6","prompt":"Fine-tuning, which means giving a model extra training, pays off most when you need the same style thousands of times over.","answer":true,"labels":{"true":"Fact","false":"Myth"},"explain":"Fine-tuning takes effort and a good set of examples, so it suits repeated, high-volume work in one consistent style. For a one-off task, a clear prompt gets you there faster."},{"type":"mcq","topic":"f7","prompt":"A horse called Clever Hans once seemed to do arithmetic, but was really reading cues from the people watching. What is the lesson for AI?","options":["Animals pick up new skills faster than machines can","Looking clever is not proof, so test it on fresh cases","AI gives its best answers when people are watching","Simple sums are harder for machines than they might appear"],"answer":1,"explain":"Hans tapped his hoof until he sensed his questioner react. A model can also reach right answers by a shortcut that fails elsewhere. Testing it on new, different cases shows whether the skill is real."},{"type":"tf","topic":"f8","prompt":"Asking a chat assistant to summarise a report guarantees that nothing important is left out.","answer":false,"labels":{"true":"Fact","false":"Myth"},"explain":"Summarising means choosing what to drop, and a model can drop the wrong thing or blur a key number. Skim the original for anything you would be embarrassed to have missed."},{"type":"tf","topic":"f1","prompt":"Building an AI model is slow and expensive, but asking the finished model a question is quick.","answer":true,"labels":{"true":"Fact","false":"Myth"},"explain":"Training, the practice run where a model studies its examples, can take weeks on vast computers and happens once. Answering you only uses what it already learned, so it takes seconds."},{"type":"mcq","topic":"f2","prompt":"A search tool finds 'trainers' when you type 'running shoes', though the two share no words. What makes that possible?","options":["It counts how many letters the two phrases have in common","It places similar meanings close together, like on a map","It keeps a record of everything you have bought before","It translates both phrases into another language first"],"answer":1,"explain":"Models turn words into positions on a kind of map, where similar meanings sit close together. 'Trainers' lands near 'running shoes', so the search can match on meaning rather than on letters."},{"type":"tf","topic":"f3","prompt":"An AI model in training improves in a few big leaps rather than through many tiny adjustments.","answer":false,"labels":{"true":"Fact","false":"Myth"},"explain":"After each guess, every setting is nudged a tiny amount towards being less wrong. Skill comes from millions of these small steps adding up, like walking downhill in fog one careful step at a time."},{"type":"mcq","topic":"f4","prompt":"What does the 'T' in GPT stand for?","options":["Transformer, a model design introduced in 2017","Text, because it reads and writes in words","Trained, because it learned from examples","Thinking, because it reasons through hard problems"],"answer":0,"explain":"GPT stands for generative pre-trained transformer. The transformer is a design researchers introduced in 2017. It is built around attention, a way of weighing which words matter to each other, and it powers today's chat assistants."},{"type":"tf","topic":"f5","prompt":"Asking a chat assistant to critique its own draft can turn up real improvements.","answer":true,"labels":{"true":"Fact","false":"Myth"},"explain":"Asked to find weaknesses, the model rereads its draft with a new goal and often spots gaps or flat lines. You can also ask it to argue the other side."},{"type":"mcq","topic":"f6","prompt":"Why can a small AI model run on your phone while the biggest ones need a data centre?","options":["Big models need a constant link to the live internet","Big models are written in a language phones cannot run","The whole model must fit in the memory of its chip","Big models only work when many people use them at once"],"answer":2,"explain":"A model is a huge set of numbers, and all of them have to be loaded into a chip's memory before it can answer. A small model fits on a phone. The largest need racks of specialised chips."},{"type":"tf","topic":"f7","prompt":"AI models are neutral, because they are built from maths rather than opinions.","answer":false,"labels":{"true":"Fact","false":"Myth"},"explain":"Models learn from human writing and pictures, stereotypes and gaps included. Ask for 'a CEO' or 'a nurse' and the results can skew. Check drafts for who is missing or misrepresented."},{"type":"mcq","topic":"f8","prompt":"You want an AI agent to help manage your inbox. Which setup is wisest?","options":["It drafts and sorts, but asks before sending or deleting","It has full control, so that it can finish the job faster","It sends replies itself and you review them monthly","It deletes anything older than a week without asking"],"answer":0,"explain":"The more an AI can do, the more guardrails it needs. Give it limited permissions and keep a human check before anything that cannot be undone, such as sending, paying or deleting."},{"type":"mcq","topic":"f1","prompt":"A model is finishing the sentence 'I'm so hungry, pass me the...'. You change 'hungry' to 'thirsty'. What happens?","options":["Nothing changes, because one word is too small to matter","The likely next word shifts from food towards a drink","It gets confused, having already seen a similar sentence","It stops and asks you which of the two words you meant"],"answer":1,"explain":"Every word you write shifts the odds of what comes next. Swap one word and a different ending becomes likely. That is why the wording of your request steers the answer you get."},{"type":"tf","topic":"f2","prompt":"When AI usage is metered, only the words in the answer count. Whatever you paste in is free.","answer":false,"labels":{"true":"Fact","false":"Myth"},"explain":"Usage is usually counted in tokens, the pieces of words a model reads and writes. What you send in counts as well as what comes back, so a huge paste eats into your allowance too."},{"type":"mcq","topic":"f3","prompt":"Which everyday activity is most like the way an AI model is trained?","options":["Filling a filing cabinet with facts to look up later","Reading a rulebook once and following it to the letter","Practising free throws: shoot, miss, adjust, repeat","Asking an expert and writing down everything they say"],"answer":2,"explain":"Training is a loop of guess, check, nudge. The model makes a guess, the gap from the right answer is measured, and its settings shift slightly to shrink that gap. Then it goes again."},{"type":"tf","topic":"f4","prompt":"When a model reads your sentence it can follow several threads at once, such as who did what and which word describes which.","answer":true,"labels":{"true":"Fact","false":"Myth"},"explain":"A model runs many attention spotlights side by side. One might link a verb to whoever did it while another links 'it' to the thing it stands for. Together they build up the full meaning."},{"type":"mcq","topic":"f5","prompt":"You need a competitor comparison you can drop straight into a deck. What should you add to your prompt?","options":["The shape you want: a table with these four columns","A line saying the deck is for a very senior client","The word 'please' at the start and 'thanks' at the end","Nothing, since the model will pick the best format"],"answer":0,"explain":"Say the format you want: a table, five bullets, under 50 words. The model cannot guess what shape fits your deck, and asking up front saves a round of reformatting."},{"type":"tf","topic":"f6","prompt":"A general chat assistant already knows what is in your company's private files.","answer":false,"labels":{"true":"Fact","false":"Myth"},"explain":"A model learned from broad, mostly public text and has never seen your shared drive. To use private documents, a product has to fetch them and put them on the page when you ask."},{"type":"mcq","topic":"f7","prompt":"A supplier shows you one dazzling demo of an AI tool. What is the sensible response?","options":["Sign up now, since the demo proves that it works","Walk away, since a demo like that must be staged","Try it on many of your own examples before judging","Ask them to run the very same demo a second time"],"answer":2,"explain":"One impressive example is not evidence, and it may have been picked from many tries. Run the tool on a spread of your own real tasks and count how often the result is good enough."},{"type":"tf","topic":"f8","prompt":"Asking an AI agent to collect competitors' public headlines into a document for you to review.","answer":true,"labels":{"true":"Safe","false":"Risky"},"explain":"The agent only reads and gathers, and you check the result before anyone uses it. Nothing is sent, spent or deleted, so a mistake is easy to catch and costs little."},{"type":"tf","topic":"f1","prompt":"After 'Twinkle, twinkle, little', a language model sees only one possible next word: 'star'.","answer":false,"labels":{"true":"Fact","false":"Myth"},"explain":"It gives every possible next word a score. 'Star' gets by far the highest, but 'bat' and thousands of other words each get a sliver. The model then draws from those odds."},{"type":"mcq","topic":"f2","prompt":"A brand-new slang word appears online this morning. How can a language model still read it?","options":["It breaks the word into smaller pieces it already knows","It skips over any word that is missing from its dictionary","It downloads a fresh dictionary at the start of each day","It waits for its makers to add the new word by hand"],"answer":0,"explain":"A complete word list is impossible: names, typos and slang appear daily. So models read in pieces of words. A limited set of pieces can spell anything, like building with a small box of bricks."},{"type":"tf","topic":"f3","prompt":"A neural network is a digital copy of a human brain.","answer":false,"labels":{"true":"Fact","false":"Myth"},"explain":"The name is a nod to brain cells, which loosely inspired the idea. In practice it is layers of simple sums run on computer chips, and it works very differently from a real brain."},{"type":"mcq","topic":"f4","prompt":"You paste a long report into a chat and want a client summary. Where should your instruction go so it is hard to miss?","options":["Halfway through the report, next to the key section","Split into parts and scattered through the report","Anywhere at all, since placement makes no difference","At the very start or end, set apart from the report"],"answer":3,"explain":"Order and placement matter to a model. An instruction buried in the middle of pasted text can get lost. Put the ask where it stands out, and keep related details together."},{"type":"tf","topic":"f5","prompt":"Telling a chat assistant who it is writing as, and who it is writing for, changes the answer you get.","answer":true,"labels":{"true":"Fact","false":"Myth"},"explain":"'Write as a nutritionist for busy parents' shifts the vocabulary, the tone and what gets included. A role and an audience are among the quickest ways to steer a draft."},{"type":"mcq","topic":"f6","prompt":"A simple, repetitive job: fixing the capital letters in 20,000 product names. Which AI model fits best?","options":["The largest one available, to be on the safe side","A large one, since big jobs call for big models","Two large ones, each checking the other's work","A small, fast one, since the job is easy but huge"],"answer":3,"explain":"Bigger models do more work for every word, so they cost more and run slower. Simple, high-volume jobs like tagging, sorting or tidying are well within reach of a small model. Right-size the tool."},{"type":"tf","topic":"f7","prompt":"Skipping the fact-check on an AI-written product description because the tool's last ten were all accurate.","answer":false,"labels":{"true":"Safe","false":"Risky"},"explain":"A model does not reliably flag its own mistakes, and a slip looks just like its correct answers. A good run tells you little about the next fact, so keep checking the ones that matter."},{"type":"mcq","topic":"f8","prompt":"AI does three everyday jobs: sorting into labels, shortening, and creating. Which task below is a sorting job?","options":["Turning a 60-page report into a one-page brief","Tagging 5,000 comments as happy, neutral or angry","Drafting three subject lines for a newsletter","Rewriting a formal email in a much warmer tone"],"answer":1,"explain":"Sorting means putting each item under a label, and you can check it by counting how many it got right. The report is a shortening job; the subject lines and the rewrite are creating jobs."},{"type":"mcq","topic":"f1","prompt":"Some AI tools have a 'creativity' dial, often called temperature. What do you get when you turn it up?","options":["Longer answers with more detail packed into them","More accurate facts and fewer mistakes overall","The same answer, word for word, every time you ask","More surprising word choices, and more misfires too"],"answer":3,"explain":"The dial sets how adventurous the model is when it picks each word. Low sticks to the safest choices and repeats itself. High takes more chances, which brings fresh ideas and more odd ones."},{"type":"tf","topic":"f2","prompt":"AI tools measure text in units called tokens. A 100-word message is always exactly 100 tokens.","answer":false,"labels":{"true":"Fact","false":"Myth"},"explain":"A token is a common word or a piece of a word. Short everyday words are one token each, but long or unusual words are split into several, so the token count usually runs higher than the word count."},{"type":"mcq","topic":"f3","prompt":"What does the 'deep' in 'deep learning' refer to?","options":["The many layers stacked up inside the model","The deep understanding the model has of its subject","How far back in history its training text reaches","The difficult subjects it is able to learn about"],"answer":0,"explain":"'Deep' simply means many layers. Early layers pick up simple patterns and later layers combine them into richer ones, a bit like going from letters to words to ideas."},{"type":"tf","topic":"f4","prompt":"Prompt: 'Make it shorter', sent just after you pasted three different pieces of copy.","answer":false,"labels":{"true":"Strong prompt","false":"Weak prompt"},"explain":"With three texts on the page, 'it' could point to any of them, and the model has to guess by weighing the earlier words. Name the thing you mean: 'make the second caption shorter'."},{"type":"mcq","topic":"f5","prompt":"You are weighing up three media plans. Which request tends to get the more useful answer from a chat assistant?","options":["Tell me which plan is best, in one word if you can","Pick the best plan for me and skip the explanation","Compare pros and cons step by step, then recommend","Answer as quickly as you can, I am short of time"],"answer":2,"explain":"For a hard problem, asking the model to work through the steps before it answers often gives a better result. It also lets you see the reasoning and check it."},{"type":"tf","topic":"f6","prompt":"An AI tool that looks things up in documents before answering can still get the answer wrong.","answer":true,"labels":{"true":"Fact","false":"Myth"},"explain":"Fetching documents gives the model better material, which cuts errors, but it can still misread, mix up or overstate what it found. A look-up improves the odds. It does not replace checking."},{"type":"mcq","topic":"f7","prompt":"You are choosing between two AI tools for writing product descriptions. What should you do first?","options":["Agree what 'good' means, then test both on the same set","Ask each tool which of the two it thinks is better","Test each on different products to cover more ground","Choose whichever one gives the longer descriptions"],"answer":0,"explain":"Decide how you will judge before you start, then give both tools the same examples. Otherwise you end up comparing your mood on the day rather than the tools."},{"type":"tf","topic":"f8","prompt":"Software that learns by reward does better if it sometimes tries something new instead of always repeating its best move so far.","answer":true,"labels":{"true":"Fact","false":"Myth"},"explain":"If it only repeats past winners, it never finds anything better. Good systems balance using what has worked with trying new moves, like ordering your usual most days and something new now and then."},{"type":"tf","topic":"f1","prompt":"A phone that groups your photos by the people in them, without you ever tagging anyone.","answer":true,"labels":{"true":"AI","false":"Not AI"},"explain":"Nobody could write rules for what every face looks like. The software learned to tell faces apart by studying a huge number of example photos, and learning from examples is what makes it AI."},{"type":"mcq","topic":"f2","prompt":"You open a new chat and type 'use the same tone as yesterday'. If the tool has no memory feature, what happens?","options":["It reopens yesterday's chat and reads it through first","It remembers, because it learns from every chat you have","It has no record of yesterday, so it guesses or asks","It matches the tone, because your style is saved in it"],"answer":2,"explain":"Each new chat starts as a blank page unless the product adds a memory feature. If yesterday's tone matters, paste the brief or a sample in again."},{"type":"tf","topic":"f3","prompt":"An AI model cannot practise for too long: more training on the same examples always makes it better.","answer":false,"labels":{"true":"Fact","false":"Myth"},"explain":"Past a point, extra practice on the same examples stops teaching the pattern and starts memorising the examples. Builders watch for that moment and stop training early."},{"type":"mcq","topic":"f4","prompt":"'Dog bites man' and 'man bites dog' use the same three words. What must a model track to tell them apart?","options":["The number of letters in each of the words","The position of each word in the sentence","How often each word appears in everyday writing","Which of the three words is the most unusual"],"answer":1,"explain":"Knowing which words are present is not enough, because the same three words can tell opposite stories. So a model tags every word with its position, and order becomes part of the meaning."},{"type":"tf","topic":"f5","prompt":"When you send a message in a long chat, the assistant only reads that latest message.","answer":false,"labels":{"true":"Fact","false":"Myth"},"explain":"Each time you send something, the model is handed the whole conversation so far as one long script and predicts what comes next. That is how it can pick up on things said earlier."},{"type":"mcq","topic":"f6","prompt":"One popular way to customise a big AI model freezes the original and trains a small add-on instead. What is the appeal?","options":["The add-on lets the model keep up with today's news","The add-on is cheap to make and easy to swap per job","The add-on means no examples are needed at all","The add-on makes the original model run twice as fast"],"answer":1,"explain":"Retraining every setting in a big model is slow and costly. Freezing the original and training a small add-on, like a clip-on lens for a camera, is far cheaper. One well-known method is called LoRA."},{"type":"tf","topic":"f7","prompt":"Judging an AI tool on the same examples you used to tweak your prompt gives a flattering picture.","answer":true,"labels":{"true":"Fact","false":"Myth"},"explain":"You adjusted the prompt until those examples looked good, so of course they do. Keep a few test examples aside that you never tune on, and judge the tool with those."},{"type":"mcq","topic":"f8","prompt":"An AI system called AlphaFold predicts the 3D shapes of proteins, work that could take years in a lab. What is it doing at heart?","options":["Looking each shape up in a list drawn up by scientists","Running the same lab experiments at much higher speed","Trying shapes at random until one happens to look right","Learning patterns from known shapes to predict new ones"],"answer":3,"explain":"It is the chat assistant recipe in a new field: study many solved examples, then predict what is missing. Predicted shapes for about 200 million proteins have been shared freely with scientists."}],"program":{"org":"","contact":"","prizes":[]},"packs":[{"id":"hype","title":"Hype captions","blurb":"Upbeat one-liners about showing up and making things","icon":"rocket","text":"Focus is a muscle. Use it daily.\nFinish strong. Start small. You can fix a bad page.\nCourage is a muscle. Use it daily.\nToday: say it plainly. Tomorrow: try again.\nLess planning, more doing. Done beats perfect.\nThe second draft will thank you. Try again then make it better tomorrow.\nPatience is a muscle. Use it daily.\nToday: say it plainly. Tomorrow: go again.\nLess scrolling, more building. Good work is mostly showing up.\nThat is the whole trick. Take the note and see what happens.\nMomentum loves a messy start. Take the note and let the work speak.\nMake the thing. Say it plainly. The best time was yesterday. The next best is now.\nToday: show up. Tomorrow: start small.\nBegin anyway. Finish strong. The second draft will thank you.\nCuriosity is a muscle. Use it daily.\nPress publish before you feel ready. Ideas are cheap. Finishing is rare.\nClarity is a muscle. Use it daily.\nToday: begin anyway. Tomorro ain the next day. Then a real wolf came. The boy shouted, but nobody came.\nNobody believes a liar, even when he tells the truth.\n\nThe North Wind and the Sun\nThe wind and the sun argued about who was stronger. They saw a traveller in a cloak. The wind blew hard, and the traveller held the cloak tight. The sun shone warmly, and the traveller took it off.\nGentle ways often win where force fails.\n\nThe Dog and His Reflection\nA dog carried a bone across a bridge. In the water he saw another dog with a bigger bone. He snapped at it. His own bone fell in and sank.\nGrasp at the shadow and you lose the real thing.\n\nThe Town Mouse and the Country Mouse\nA town mouse visited her cousin and sniffed at the plain food. \"Come and eat like a queen,\" she said. In town the table was full, but a cat chased them twice. The country mouse went home.\nA simple meal in peace beats a feast in fear.\n\nThe Goose and the Golden Eggs\nA farmer owned a goose that laid one golden egg each day. He wanted them all at once. He cut the goose open and found nothing inside. After that there were no more eggs.\nGreed loses what patience would have kept.\n\nThe Fox and the Crow\nA crow sat in a tree with a piece of cheese. A fox looked up. \"What a fine voice you must have,\" he said. The crow opened her beak to sing, and the cheese fell. The fox ate it.\nDo not trust a flatterer.\n\nThe Oak and the Reed\nA tall oak laughed at a thin reed that bent in every breeze. Then a storm came. The oak stood stiff and was torn up by the roots. The reed bent low and stood up again.\nIt is better to bend than to break.\n\nThe Milkmaid and Her Pail\nA milkmaid walked to market with a pail on her head. \"I will sell the milk and buy eggs,\" she thought. \"The eggs will hatch. I will buy a new dress.\" She tossed her head, and the milk spilled.\nDo not count your chickens before they hatch.\n\nThe Bundle of Sticks\nA father had sons who always argued. He gave them a bundle of sticks and asked them to break it. None of them could. Then he untied it, and each stick snapped easily.\nTogether we are strong.\n\nThe Stag at the Pool\nA stag admired his fine antlers in a pool and frowned at his thin legs. A hunter came. His legs carried him far, but his antlers caught in the branches.\nWhat we prize least may serve us best.\n\nThe Wolf in Sheep's Clothing\nA wolf found a sheepskin and put it on. He walked among the flock, and nobody noticed. That evening the shepherd wanted meat for supper. He picked the biggest sheep, and it was the wolf.\nA trick can catch the one who plays it.\n"},{"id":"fortunes","title":"Office fortunes","blurb":"Fortune-cookie wisdom for the working week","icon":"dice","text":"Go outside first. A long meeting knows more than it lets on.\nThe office plant is closer than you think. Go outside first.\nTrust it. The office plant is worth the wait.\nThe last biscuit will change your mind. Water the plant.\nLucky today: a quiet Tuesday. Start before lunch.\nLucky today: your next idea. Trust it.\nA fresh notebook wants a second look. Ask one more question.\nA fresh notebook will make someone smile. Start before lunch.\nLucky today: a kind reply. Share the credit.\nBring snacks. An awkward question will change your mind.\nA quiet Tuesday is hiding in plain sight. Ask one more question.\nThe second coffee is closer than you think. Tell no one.\nLucky today: a long meeting. Start before lunch.\nLucky today: an awkward question. Say yes.\nThe spare charger will change your mind. Trust it.\nSleep on it. The last biscuit will make someone smile.\nA bold headline opens a door you forgot about. Keep the receipt.\nYour next idea arrives when you stop looking. Ask one more question.\nShare the credit. The second coffee is worth the wait.\nLucky today: a bold headline. Trust it.\nThe spare charger wants a second look. Water the plant.\nWrite it down. The missing file will end early.\nLucky today: the last biscuit. Say yes.\nThe spare charger brings good news. Tell no o function dayStatus(i) {
  if (activeOn(i)) return 'done';
  if (S.streak.saved.includes(i)) return 'saved';
  return 'none';
}

// ---------- journey ----------
function isDone(id) { return !!S.done[id]; }
function starsOf(id) { return (S.done[id] || {}).stars || 0; }
function chapterStats(ch) {
  const done = ch.sessions.filter((s) => isDone(s.id)).length;
  const stars = ch.sessions.reduce((n, s) => n + starsOf(s.id), 0);
  return { done, total: ch.sessions.length, stars, maxStars: ch.sessions.length * 3, complete: done === ch.sessions.length };
}
function chapterUnlocked(ch) {
  if (ch.track.id !== 'fluency' || ch.index === 0) return true;
  return chapterStats(ch.track.chapters[ch.index - 1]).complete;
}
function sessionUnlocked(s) {
  if (isDone(s.id)) return true;
  if (s.index === 0) return chapterUnlocked(s.chapter);
  return isDone(s.chapter.sessions[s.index - 1].id);
}
function nextSession(trackId = S.track) {
  const list = ORDERED[trackId] || [];
  return list.find((s) => !isDone(s.id) && sessionUnlocked(s)) || null;
}
function trackStats(trackId) {
  const list = ORDERED[trackId] || [];
  return { done: list.filter((s) => isDone(s.id)).length, total: list.length };
}

// ---------- spaced repetition ----------
function recordQ(key, ok) {
  if (!QUESTIONS[key]) return;
  const st = S.q[key] || (S.q[key] = { b: 0, due: 0, w: 0 });
  if (ok) st.b = Math.min(SRS_DAYS.length - 1, st.b + 1); else { st.b = 0; st.w++; }
  st.due = todayIdx() + SRS_DAYS[st.b];
}
function dueKeys() {
  const t = todayIdx();
  return Object.keys(S.q).filter((k) => S.q[k].due <= t && QUESTIONS[k]).sort((a, b) => S.q[a].b - S.q[b].b || S.q[a].due - S.q[b].due);
}

// ---------- Daily Drop ----------
function dropNumber(i = todayIdx()) { return i - DROP_DAY_ONE + 1; }
// The same five questions for everyone on a given calendar day.
function dropQuestions(i = todayIdx()) {
  if (DAILY.length < DROP_SIZE) return [];
  const pool = shuffle(DAILY, rng(hashStr('drop' + i)));
  // Prefer five different topics and a mix of question types.
  const out = [];
  for (const q of pool) {
    if (out.length >= DROP_SIZE) break;
    if (out.some((o) => o.topic && o.topic === q.topic) || out.filter((o) => o.type === q.type).length >= 3) continue;
    out.push(q);
  }
  for (const q of pool) { if (out.length >= DROP_SIZE) break; if (!out.includes(q)) out.push(q); }
  return out;
}
function dropResult(i = todayIdx()) { return S.drops[keyOfIdx(i)] || null; }
function msToMidnight() {
  const n = new Date();
  return new Date(n.getFullYear(), n.getMonth(), n.getDate() + 1) - n;
}

  for (const b of BADGES) {

    const [have, need] = b.prog();
    if (have >= need) { S.badges[b.id] = dayKey(); fresh.push(b); }
  }
  return fresh;
}

// ---------- backup ----------
function exportCode() {
  const copy = { ...S, photo: '' };
  return 'AS2.' + btoa(unescape(encodeURIComponent(JSON.stringify(copy))));
}
function importCode(code) {
  const c = String(code || '').trim();
  if (!c.startsWith('AS2.')) throw new Error('That does not look like an Attention Span backup code.');
  const data = JSON.parse(decodeURIComponent(escape(atob(c.slice(4)))));
  if (!data || data.v !== 2) throw new Error('That backup is from an unknown version.');
  const photo = S.photo;
  S = mergeDefaults(defaultState(), data);
  S.photo = photo;
  save();
}

      if (br.P.length !== total) throw new Error('LM: weights do not match the model shape');
      for (let i = 0, o = 0; i < 5; o += sizes[i], i++) br[NAMES[i]] = br.P.subarray(o, o + sizes[i]);
      br.map = new Map();
      for (let i = 0; i < V; i++) br.map.set(br.vocab[i], i);
      br.fb = br.map.has(' ') ? br.map.get(' ') : 0;
      br.pad = br.map.has('\n') ? br.map.get('\n') : br.fb;
      br.tmp = { x: new Float64Array(D), h: new Float64Array(H), p: new Float64Array(V), ids: new Int32Array(br.ctx) };
      return br;
    }

    function load(p) {
      const br = wire({
        kind: 'nn', vocab: Array.from(p.vocab), ctx: p.ctx, emb: p.emb, hidden: p.hidden,
        step: p.step || 0, loss: p.loss == null ? null : p.loss,
      });
      const bytes = decode(p.w.d);
      if (bytes.length !== br.P.length) throw new Error('LM: weights do not match the model shape');
      for (let i = 0, o = 0; i < 5; i++) {
        const w = br[NAMES[i]], s = p.w.s[i] / 127;
        for (let j = 0; j < w.length; j++) w[j] = (bytes[o++] - 128) * s;
      }
      return br;
    }

    /* Last ctx characters of text as ids, left-padded with the line-break id. */
    function context(br, text, ids) {
      const n = br.ctx, cs = Array.from(B.norm(String(text == null ? '' : text).slice(-(n * 4 + 16))));
      for (let c = 0; c < n; c++) {
        const j = cs.length - n + c;
        const id = j < 0 ? undefined : br.map.get(cs[j]);
        ids[c] = j < 0 ? br.pad : id === undefined ? br.fb : id;
      }
      return ids;
    }

    /* Forward pass: embeddings side by side -> tanh layer -> softmax (with temperature T) into out. */
    function probs(br, ids, T, out) {
      const emb = br.emb, H = br.hidden, V = br.vocab.length, D = br.ctx * emb;
      const E = br.E, W1 = br.W1, b1 = br.b1, W2 = br.W2, b2 = br.b2, x = br.tmp.x, h = br.tmp.h;
      for (let c = 0; c < br.ctx; c++) {
        const s = ids[c] * emb, d = c * emb;
        for (let e = 0; e < emb; e++) x[d + e] = E[s + e];
      }
      for (let j = 0, r = 0; j < H; j++, r += D) {
        let a = b1[j];
        for (let k = 0; k < D; k++) a += W1[r + k] * x[k];
        h[j] = Math.tanh(a);
      }
      let top = -Infinity, z = 0;
      for (let v = 0, r = 0; v < V; v++, r += H) {
        let a = b2[v];
        for (let j = 0; j < H; j++) a += W2[r + j] * h[j];
        a /= T;
        out[v] = a;
        if (a > top) top = a;
      }
      for (let v = 0; v < V; v++) { const e = Math.exp(out[v] - top); out[v] = e; z += e; }
      for (let v = 0; v < V; v++) out[v] /= z;

    }

    function generate(br, prompt, opts) {

      for (let i = 0; i < max; i++) {

        pieces.push(br.vocab[id]);
        ids.copyWithin(0, 1);

    }

    function next(br, text, temperature) {
      const out = probs(br, context(br, text, br.tmp.ids), B.temp(temperature, 1), br.tmp.p), list = [];
      for (let v = 0; v < br.vocab.length; v++) list.push({ token: br.vocab[v], p: out[v] });
      list.sort(function (a, b) { return b.p - a.p; });

  const B = baseRt();

  const WORD = /\d+(?:[.,:]\d+)+|[\p{L}\p{N}\p{M}_]+(?:['-][\p{L}\p{N}\p{M}_]+)*/gu;

    train: (text, n) => NG.build(B.clean(text), n),

        if (a > top) top = a;
      }

      dh.fill(0);

        G[ob2 + v] += d;
        for (let j = 0; j < H; j++) { G[r + j] += d * h[j]; dh[j] += d * P[r + j]; }

        for (let e = 0; e < emb; e++) G[s + e] += dx[d + e];

  function adam(br, lr) {
    const P = br.P, G = br.G, M = br.M, S = br.S, n = P.length;
    const t = ++br.t, a = lr * Math.sqrt(1 - Math.pow(0.999, t)) / (1 - Math.pow(0.9, t));

      S[i] = s;

  function needData(br, who) { if (!br.data) throw new Error(`LM.nn.${who}: this brain has no text, call LM.nn.attach(brain, text) first`); }

  function train(brain, steps, opts) {
    needData(brain, 'train');

    if (!n) return brain.last;
    if (brain.tr.pos.length < nb) brain.tr.pos = new Int32Array(nb);
    const pos = brain.tr.pos, span = brain.split;
    let sum = 0;
    for (let s = 0; s < n; s++) {
      for (let b = 0; b < nb; b++) pos[b] = Math.floor(brain.rand() * span);
      sum += grads(brain, pos, nb);

    }
    brain.step += n;
    return (brain.last = sum / n);

  // Evenly spaced targets from the held-out tail (or from everything when the text is too short to split).
  function evalLoss(brain, n) {
    needData(brain, 'evalLoss');
    const data = brain.data, N = data.length, lo = brain.split < N ? brain.split : 0, span = N - lo;
    const m = Math.min(span, size(n, 512)), ids = brain.tmp.ids, out = brain.tmp.p;

      sum -= Math.log(NN.probs(brain, ids, 1, out)[data[t]] + 1e-30);

  const nn = {
    create, train, evalLoss, attach,
    generate: (brain, prompt, opts) => NN.generate(brain, prompt, opts),
    next: (brain, contextText, temperature) => NN.next(brain, contextText, temperature),
    paramCount: (brain) => brain.P.length,
    // Test hook: loss and gradient (in brain.G) for chosen target positions, without an optimiser step.
    lossAndGrads: (brain, positions) => { needData(brain, 'lossAndGrads'); return grads(brain, positions, positions.length); },
  };

  // ---------- saving ----------
  const B64 = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/';

  const EXPORT_CSS = `:root{--bg:#f3f5fb;--card:#fff;--ink:#15171f;--mute:#585e72;--line:#d5d9ea;--acc:#3b5bff;--on:#fff}

const REMIND_TIMES = [['08:45', 'With my first coffee'], ['12:30', 'Over lunch'], ['17:30', 'On the way home'], ['21:00', 'Winding down']];

function mainModel() { return MODELS.find((m) => m.id === S.mainModel) || MODELS[0] || null; }
// A fresh line from the person's own model. It differs every time, which is the point.
function modelLine(m = mainModel()) {
  if (!m || !labReady()) return '';
  try {
    const live = liveModel(m);
    const seed = Math.floor(Math.random() * 1e9);
    const raw = m.kind === 'ngram'
      ? LM.ngram.generate(live, '', { maxTokens: 40, temperature: 1, seed }).text
      : LM.nn.generate(live, '', { maxChars: 140, temperature: 0.8, seed }).text;
    // Prefer a line that reads as a sentence over a bare title.
    const lines = raw.split('\n').map((x) => x.trim()).filter((x) => x.length > 8);
    const line = lines.find((x) => x.length > 24 && /[.!?"]/.test(x)) || lines[0] || raw.trim();
    if (line.length <= 110 && /[.!?"]$/.test(line)) return line;
    // Prefer to stop at the end of a sentence; otherwise at a word, with an ellipsis.
    const head = line.slice(0, 110);
    const stop = Math.max(head.lastIndexOf('. '), head.lastIndexOf('? '), head.lastIndexOf('! '));
    if (stop > 24) return head.slice(0, stop + 1);
    if (line.length <= 110) return line;
    return `${head.slice(0, head.lastIndexOf(' ')).trimEnd()}…`;
  } catch (e) { return ''; }
}
function lockedPacks() { return PACKS.filter((p) => !S.packs.includes(p.id)); }
// Now and then a session ends with something extra. What it is, and how much, is not predictable.
function rollSurprise() {
  if (S.stats.sessions < 2 || Math.random() > 0.34) return null;
  S.stats.surprises++;
  const locked = lockedPacks();
  if (locked.length && Math.random() < 0.5) {
    const p = locked[Math.floor(Math.random() * locked.length)];
    S.packs.push(p.id);
    return { kind: 'pack', pack: p };
  }
  const n = [100, 150, 200, 300, 500][Math.floor(Math.random() * 5)];
  S.steps += n;
  return { kind: 'steps', n };
}
// Types text into an element piece by piece; all at once when motion is reduced.
function typeInto(el, text, delay = 0, gap = 28) {
  if (!el) return;
  if (REDUCED_MOTION) { el.textContent = text; return; }
  const parts = text.split(/(?<=\s)/);
  let i = 0;
  setTimeout(() => {
    const t = setInterval(() => {
      if (!el.isConnected || i >= parts.length) { clearInterval(t); return; }
      el.textContent += parts[i++];
    }, gap);
  }, delay);
}

// ---------- daily reminder: a calendar event, so it needs no server ----------
function reminderIcs(time) {
  const [h, m] = time.split(':').map(Number);
  const now = new Date();
  const start = new Date(now.getFullYear(), now.getMonth(), now.getDate() + (now.getHours() * 60 + now.getMinutes() >= h * 60 + m ? 1 : 0));
  const day = (d) => `${d.getFullYear()}${pad2(d.getMonth() + 1)}${pad2(d.getDate())}`;
  const stamp = `${now.getUTCFullYear()}${pad2(now.getUTCMonth() + 1)}${pad2(now.getUTCDate())}T${pad2(now.getUTCHours())}${pad2(now.getUTCMinutes())}${pad2(now.getUTCSeconds())}Z`;
  return [
    'BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Attention Span//EN', 'BEGIN:VEVENT',
    `UID:daily-${S.createdAt}@attention-span`, `DTSTAMP:${stamp}`, `DTSTART:${day(start)}T${pad2(h)}${pad2(m)}00`, 'DURATION:PT5M',
    'RRULE:FREQ=WEEKLY;BYDAY=MO,TU,WE,TH,FR', 'SUMMARY:Attention Span: four minutes',
    `DESCRIPTION:One session or one Daily Drop keeps your streak. ${appUrl()}`, `URL:${appUrl()}`,
    'BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:Four minutes of Attention Span', 'TRIGGER:PT0M', 'END:VALARM',
    'END:VEVENT', 'END:VCALENDAR',
  ].join('\r\n');
}
function fmtTime(t) {
  const [h, m] = t.split(':').map(Number);

}

// ---------- sessions: teach a card, then check it ----------

function startSession(id) {

  say('Not a match. Try another.');
  refreshQ(`.m-item[data-side="l"][data-v="${back}"]`);
}
function qSort(b) {
  if (!L || L.answered || L.q.busy) return;
  const st = L.steps[L.i], q = L.q;
  const it = st.items[q.items[q.n]];
  const ok = it[1] === b;
  q.busy = true;
  if (!ok) q.misses++;
  q.counts[it[1]]++;
  q.flash = ok ? `fly${b}` : `nope fly${it[1]}`;
  q.note = ok ? '' : `Goes with: ${st.buckets[it[1]]}`;
  q.hint = ok ? -1 : it[1];
  sound(ok ? 'pop' : 'bad'); buzz(ok ? 'tick' : 'bad');
  refreshQ(`.bucket.b${b}`);
  setTimeout(() => {
    if (!L || L.q !== q) return;
    q.busy = false; q.flash = null; q.note = ''; q.hint = -1; q.n++;
    if (q.n >= q.items.length) { resolve(q.misses === 0); return; }
    say(`${ok ? '' : `That one goes with ${st.buckets[it[1]]}. `}Next, ${q.n + 1} of ${q.items.length}: ${plain(st.items[q.items[q.n]][0])}`);
    refreshQ(`.bucket.b${b}`);
  }, REDUCED_MOTION ? (ok ? 60 : 500) : (ok ? 300 : 900));
}
function resolve(ok) {
  const st = L.steps[L.i];
  const at = L;
  L.answered = true; L.ok = ok;
  if (!st.retrying) {
    L.results.push(ok);
    S.stats.answers++;
    if (ok) { S.stats.correct++; L.combo++; L.bestCombo = Math.max(L.bestCombo, L.combo); } else L.combo = 0;
    if (st.key && L.mode !== 'drop' && L.mode !== 'test') recordQ(st.key, ok);
    if (!ok && L.mode === 'learn') L.retry.push({ ...st, retrying: true, src: L.i });
  }
  sound(ok ? 'good' : 'bad'); buzz(ok ? 'ok' : 'bad');
  save();
  saveResume(L.i + 1);
  const verdict = ok ? 'Correct.' : st.type === 'mcq' || st.type === 'cloze' ? `Not quite. The answer is ${plain(st.options[st.answer])}.` : st.type === 'tf' ? `Not quite. The answer is ${tfLabels(st)[st.answer]}.` : st.type === 'order' ? 'Not quite. The right order is now shown.' : 'Not quite.';
  say(`${verdict} ${plain(st.explain || '')}`);
  refreshQ('[data-action="ss-next"]');
  // The bar and the run counter follow the answer by a beat.
  setTimeout(() => { if (L === at) setProgress(); }, REDUCED_MOTION ? 0 : 100);
  setTimeout(() => { if (L === at) setCombo(); }, REDUCED_MOTION ? 0 : 200);
  const fb = $('.fb');
  if (fb && fb.scrollIntoView) fb.scrollIntoView({ block: 'end', behavior: REDUCED_MOTION ? 'auto' : 'smooth' });
}
function ssNext() {
  if (!L || L.busy) return;
  if (L.panes) { paneNext(); return; }
  const st = L.steps[L.i];
  if (st.type !== 'card' && !L.answered) return;
  buzz('tick');
  L.i++;
  if (L.i >= L.steps.length && !enterRetries()) { finishSession(); return; }
  saveResume(L.i);
  renderStep();
}
function ssQuit() {
  if (!L) return;
  if (L.panes || (L.i === 0 && !L.results.length)) { closeSession(); return; }
  const learn = L.mode === 'learn';
  openSheet(`<div class="sheet-pad center">${mascot(learn ? 'idle' : 'sad', 84)}<h3>${learn ? 'Leave for now?' : 'Leave this one?'}</h3>
    <p>${learn ? 'Your place is saved. You can pick up exactly where you left off.' : 'Your answers so far will not count.'}</p>
    <button class="btn primary wide" data-action="close-sheet">Keep going</button><button class="btn ghost wide" data-action="ss-leave">Leave</button></div>`);
}

// ---------- drag handlers (taps fall through to the click actions above) ----------
function dragOrder(e, el) {
  if (!L || L.answered) return;
  const q = L.q, list = $('#q-rows');
  const rows = $$('.row', list);
  const from = Number(el.dataset.pos);
  const rects = rows.map((r) => r.getBoundingClientRect());
  const gap = rects.length > 1 ? rects[1].top - rects[0].bottom : 0;
  const h = rects[from].height + gap;
  let to = from;
  dragStart(e, el, {
    start() { el.classList.add('dragging'); list.classList.add('sorting'); buzz('tap'); },
    move(dx, dy) {
      const y = clamp(dy, rects[0].top - rects[from].top - 10, rects[rects.length - 1].bottom - rects[from].bottom + 10);
      el.style.transform = `translateY(${y}px) scale(1.03)`;
      const mid = rects[from].top + rects[from].height / 2 + y;
      let t = from;
      rects.forEach((r, i) => {
        const m = r.top + r.height / 2;
        if (i < from && mid < m) t = Math.min(t, i);
        if (i > from && mid > m) t = Math.max(t, i);
      });
      if (t === to) return;
      to = t;
      buzz('tick');
      rows.forEach((r, i) => {
        if (i === from) return;
        const s = from < to && i > from && i <= to ? -h : from > to && i < from && i >= to ? h : 0;
        r.style.transform = s ? `translateY(${s}px)` : '';
      });
    },
    end(dx, dy, moved) {
      if (!moved) { el.classList.remove('dragging'); list.classList.remove('sorting'); el.style.transform = ''; return; }
      const it = q.list.splice(from, 1)[0];
      q.list.splice(to, 0, it);
      q.pick = null;
      sound('pop');
      say(`Moved to position ${to + 1} of ${q.list.length}.`);
      refreshQ();
    },
  });
}
function dragSort(e, el) {
  if (!L || L.answered || L.q.busy) return;
  const w = Math.min(innerWidth, 480);
  let side = -1;
  dragStart(e, el, {
    start() { el.classList.add('dragging'); },
    move(dx) {
      el.style.transform = REDUCED_MOTION ? `translateX(${dx}px)` : `translateX(${dx}px) rotate(${clamp(dx / 20, -8, 8)}deg)`;
      const s = dx < -w * 0.17 ? 0 : dx > w * 0.17 ? 1 : -1;
      if (s === side) return;
      side = s;
      if (s >= 0) buzz('tick');
      $$('.bucket').forEach((b, i) => b.classList.toggle('hot', i === s));
    },
    end(dx, dy, moved) {
      el.classList.remove('dragging');
      $$('.bucket').forEach((b) => b.classList.remove('hot'));
      if (moved && side >= 0) qSort(side); else el.style.transform = '';
    },
  });
}
function dragChip(e, el) {
  if (!L || L.answered) return;
  const gap = $('#q-gap');
  if (!gap) return;
  let over = false;
  dragStart(e, el, {
    start() { el.classList.add('dragging'); },
    move(dx, dy, ev) {
      el.style.transform = `translate(${dx}px, ${dy}px) scale(1.06)`;
      const r = gap.getBoundingClientRect();
      const o = ev.clientX > r.left - 28 && ev.clientX < r.right + 28 && ev.clientY > r.top - 32 && ev.clientY < r.bottom + 32;
      if (o === over) return;
      over = o;
      gap.classList.toggle('hot', o);
      if (o) buzz('tick');
    },
    end(dx, dy, moved) {
      el.classList.remove('dragging'); el.style.transform = ''; gap.classList.remove('hot');
      if (moved && over) { L.q.sel = Number(el.dataset.v); sound('pop'); buzz('tap'); refreshQ(); }
    },
  });
}

// ---------- finishing ----------
function finishSession() {
  const total = L.results.length;
  const right = L.results.filter(Boolean).length;
  const misses = total - right;
  const r = { mode: L.mode, total, right, misses, pts: 0, stars: 0, steps: 0, combo: L.bestCombo };
  const d = today();
  if (L.mode === 'learn') {
    const s = L.session, prev = S.done[s.id];
    r.stars = misses === 0 ? 3 : misses <= 2 ? 2 : 1;
    r.first = !prev;
    r.pts = prev ? 3 + right + (r.stars > prev.stars ? 5 : 0) : 10 + 2 * right + (misses === 0 ? 5 : 0) + (L.bestCombo >= 3 ? Math.min(L.bestCombo, 6) : 0);
    r.steps = prev ? STEPS.replay : STEPS.session;
    if (r.stars === 3 && (!prev || prev.stars < 3)) S.stats.perfect++;
    S.done[s.id] = { stars: Math.max(r.stars, prev ? prev.stars : 0), n: (prev ? prev.n : 0) + 1, at: Date.now() };
    S.stats.sessions++; d.sessions++;
    if (s.chapter.track.id === 'builder' && !prev) S.stats.builder++;
    r.chapterDone = !prev && chapterStats(s.chapter).complete;
    if (S.resume && S.resume.id === s.id) S.resume = null;
  } else if (L.mode === 'drop') {
    r.pts = 2 * right + (misses === 0 ? 5 : 0);
    r.steps = STEPS.drop;
    S.drops[dayKey()] = L.results.map((x) => (x ? 1 : 0));
    const keys = Object.keys(S.drops).sort();
    while (keys.length > 60) delete S.drops[keys.shift()];
    S.stats.drops++; d.drop = true;
    if (misses === 0) S.stats.dropPerfect++;
  } else if (L.mode === 'warmup') {
    r.pts = 2 + right;
    r.steps = STEPS.warmup;
    S.stats.warmups++; d.warm = (d.warm || 0) + 1;
  } else if (L.mode === 'test') {
    r.pass = total > 0 && right / total >= 0.8;
    if (r.pass) {
      const fresh = L.chapter.sessions.filter((s) => !isDone(s.id));
      fresh.forEach((s) => { S.done[s.id] = { stars: 1, n: 0, at: Date.now(), tested: true }; });
      r.pts = 5 * fresh.length;
    }
    d.warm = (d.warm || 0) + 1;
  }
  S.steps += r.steps;
  r.surprise = L.mode === 'learn' || L.mode === 'drop' ? rollSurprise() : null;
  S.stats.bestCombo = Math.max(S.stats.bestCombo, L.bestCombo);
  const lv = addPoints(r.pts);
  r.leveled = lv.leveled; r.level = lv.level;
  r.streak = extendStreak();
  r.badges = checkBadges();
  applyTheme();
  save();
  L.result = r;
  L.panes = ['summary'];
  if (r.streak.extended) L.panes.push('streak');
  if (r.leveled) L.panes.push('level');
  if (r.badges.length) L.panes.push({ badges: r.badges });
  if (r.surprise) L.panes.push('surprise');
  if (L.mode === 'learn' && S.stats.sessions === 1 && IS_IOS && !isStandalone() && !inFrame() && !S.seen.install) L.panes.push('install');
  if (L.mode === 'learn' && !MODELS.length && labReady() && !S.seen.firstModel) L.panes.push('model');
  L.pi = 0;
  $('.ss-top').classList.add('done');
  setProgress();
  renderPane();
  sound('done'); buzz('win');
  if (r.stars === 3 || (L.mode === 'drop' && misses === 0) || r.pass) setTimeout(burstConfetti, REDUCED_MOTION ? 0 : 150);
}

// ---------- sheets and toasts ----------
function openSheet(html) {
  const root = $('#sheet-root');
  clearTimeout(sheetTimer);
  if (root.hidden || root.classList.contains('out')) sheetReturn = document.activeElement;
  root.hidden = false;
  root.classList.remove('out');
  root.innerHTML = `<div class="scrim" data-action="close-sheet"></div><div class="sheet" role="dialog" aria-modal="true" tabindex="-1"><div class="grab" data-action="close-sheet" data-drag="sheet" role="button" aria-label="Close"></div>${html}</div>`;
  document.documentElement.classList.add('sheet-open');
  const sheet = $('.sheet', root), title = $('h3', sheet);
  if (title) { title.id = 'sheet-title'; sheet.setAttribute('aria-labelledby', 'sheet-title'); }
  syncInert();
  focusOn(sheet);
}
function closeSheet() {
  const root = $('#sheet-root');
  if (!root || root.hidden || root.classList.contains('out')) return;
  document.documentElement.classList.remove('sheet-open');
  const hide = () => { root.hidden = true; root.innerHTML = ''; root.classList.remove('out'); syncInert(); };
  if (REDUCED_MOTION) hide();
  else { root.classList.add('out'); sheetTimer = setTimeout(hide, 200); syncInert(); }
  // Focus goes back to whatever opened the sheet, if it is still on screen.

function labCount(st) { return `${num(st.chars)} characters · ${num(st.words)} words${st.chars < 300 ? ` · ${num(300 - st.chars)} more to go` : ''}`; }

  const atTarget = b.step >= LAB.target;

  return `<div class="foot-row"><button class="btn soft" data-action="lab-more"${b.step >= TRAIN_MAX ? ' disabled' : ''}>${more}</button><button class="btn primary wide" data-action="lab-next">Keep it</button></div>`;

function labStageText(ratio) {

  if (ratio > 0.86) return ['Guessing at random', 'Right now every letter is a coin toss.'];
  if (ratio > 0.72) return ['Finding the common letters', 'It has noticed spaces and the letters that turn up most.'];
  if (ratio > 0.6) return ['Short words are forming', 'Letter pairs and little words are starting to stick.'];

function labTrainUi() {

  $('#lab-loss').textContent = LAB.loss == null ? '–' : LAB.loss.toFixed(2);
  const ls = LAB.losses;

  const gap = !LAB.running && LAB.unseen != null
    ? (LAB.unseen > LAB.loss * 2.5 + 0.4
      ? ` On lines it never practised on, its error is ${LAB.unseen.toFixed(2)}. It memorised the page more than it learned the pattern. More text closes that gap.`
      : ` On lines it never practised on, its error is ${LAB.unseen.toFixed(2)}, almost as good. It learned the pattern, not just the page.`) : '';

function labTrainTick() {

  const b = LAB.brain;
  const t0 = performance.now();
  // Short slices keep the chart and any animation smooth; at most about 250 steps a second so it stays watchable.
  const allowed = LAB.s0 + (t0 - LAB.t0) * 0.25 + 8;
  let sum = 0, n = 0;
  while (performance.now() - t0 < 8 && b.step < LAB.target && b.step < allowed) { sum += LM.nn.train(b, 4); n++; }
