o polished."},{"type":"order","level":2,"prompt":"Order the lab's steps.","items":["Load Gemma-4B with dtype bfloat16","Check a kernel's dtype","Enable LoRA with rank 4","Compile with a stable AdamW setup","Fine-tune with a generation monitor"],"explain":"The model must load in bfloat16 before LoRA is added, and the optimizer is compiled before fit runs with the per-epoch monitor."},{"type":"cloze","level":2,"prompt":"With LoRA on, gradients and optimizer states are kept only for the ___ matrices.","options":["frozen","low-rank","embedding","attention"],"answer":1,"explain":"Only the small LoRA matrices are trainable, so only they need gradients and Adam states."},{"type":"mcq","level":2,"prompt":"When does the GenerationMonitor callback print its outputs?","options":["At the end of every epoch","Before training starts","After every single batch","Only when the loss rises"],"answer":0,"explain":"Its on_epoch_end method runs after each epoch and prints generations for the three test prompts."},{"type":"mcq","level":3,"prompt":"How many bytes do Gemma-4B's 4 billion weights need in bfloat16?","options":["8 billion bytes","16 billion bytes","4 billion bytes","2 billion bytes"],"answer":0,"explain":"4e9 × 2 bytes = 8e9 bytes, about 7.45 GB: half the 16 billion bytes needed in float32."},{"type":"mcq","level":3,"prompt":"Would Gemma-27B's weights fit on a ~16 GB T4 in bfloat16?","options":["Yes: bfloat16 brings them down to ~13.5 GB","Yes: LoRA keeps them off the GPU","No: bfloat16 only works up to 4B","No: they'd need about 54 billion bytes"],"answer":3,"explain":"27e9 × 2 bytes = 54e9 bytes ≈ 50 GB, several times a T4's memory, even before any training extras."},{"type":"tf","level":3,"prompt":"Loading Gemma-4B successfully needed only one change from the failed attempt: the dtype.","answer":true,"explain":"The failed lab used default 32-bit floats; adding dtype=\"bfloat16\" was the single change that made loading, and LoRA fine-tuning, possible."}]},{"id":"c7-6a","title":"Gradient accumulation","part":1,"icon":"chain","lab":"course_7/gdm_lab_7_6_apply_gradient_accumulation.ipynb","goal":"Learn the ideas, then try the first checks.","steps":[{"type":"card","title":"Why bigger batches?","body":"Averaging gradients over more examples gives less noisy, more stable updates, and a GPU processes a bigger batch in parallel more efficiently. The catch: activation memory grows with batch size, so going from 1 to 4 means roughly 4× the activations."},{"type":"card","title":"The batch-size-4 OOM","body":"With Gemma-4B in bfloat16 plus LoRA, batch_size=4 fails with RESOURCE_EXHAUSTED: the GPU could not find another 52,428,800 bytes (about 52 MB). Batch size 1 fits. After an OOM, restarting the Colab session is the surest way to free GPU memory."},{"type":"card","title":"Accumulate, then update","body":"Gradient accumulation runs forward and backward passes on several small batches, adds up their gradients, and updates the weights only after a set number of steps. Effective batch size = physical batch × accumulation steps, so 1 × 8 behaves like a batch of 8."},{"type":"card","title":"In Keras","body":"The learning rate is scaled 8× to match the 8× effective batch, while fit keeps batch_size=1. Compared with the plain batch-1 run, outputs became coherent sooner, with no KMnO4 loops and a lower final loss.","code":"optimizer = keras.optimizers.AdamW(\n    learning_rate=8e-4,  # 8 × 1e-4\n    weight_decay=0.01,\n    # betas and epsilon as before\n    clipnorm=0.5,\n    gradient_accumulation_steps=8,\n)"},{"type":"cloze","level":1,"prompt":"The physical batch size is 1. Fill in the value that simulates a batch of 8.","code":"optimizer = keras.optimizers.AdamW(\n    learning_rate=8e-4,\n    weight_decay=0.01,\n    clipnorm=0.5,\n    gradient_accumulation_steps=___,\n)","options":["8","1","4","16"],"answer":0,"explain":"Effective batch = physical batch × steps, so 1 × 8 = 8: the optimizer updates after summing 8 batches' gradients."},{"type":"mcq","level":1,"prompt":"The OOM message said it tried to allocate 52428800 bytes. Roughly how much is that?","options":["About 52 GB","About 5 KB","About 52 MB","About 524 MB"],"answer":2,"explain":"52,428,800 bytes is about 52 million bytes, roughly 52 MB (exactly 50 MiB): a small extra amount that still did not fit."},{"type":"mcq","level":2,"prompt":"Why did batch_size=4 run out of memory when batch_size=1 worked?","options":["The model's weights were copied four times","LoRA's rank automatically rose to 16","The optimizer kept four states per weight","Activation memory grew about 4× with the batch"],"answer":3,"explain":"Weights and optimizer states don't depend on batch size, but activations are stored per example, so 4 examples need about 4× the activations."},{"type":"tf","level":2,"prompt":"With gradient accumulation, the weights are updated after every small batch.","answer":false,"explain":"Gradients from each small batch are summed, and the optimizer updates the weights only once the set number of steps is reached."},{"type":"tf","level":2,"prompt":"Gradient accumulation gives a large-batch learning signal without large-batch activation memory.","answer":true,"explain":"Only one small batch's activations are in memory at a time, yet each update reflects many examples."},{"type":"order","level":2,"prompt":"Order one gradient-accumulation cycle.","items":["Forward pass on a small batch","Backward pass to get its gradients","Add them to the running gradient sum","Repeat until the step count is reached","Update weights with the combined gradient"],"explain":"Each small batch adds its gradients to a running sum; only after the last step does the optimizer apply one update."},{"type":"match","level":2,"prompt":"Match each term to its meaning.","pairs":[["Physical batch size","Examples in one forward pass"],["Accumulation steps","Small batches summed per update"],["Effective batch size","Physical batch × accumulation steps"],["RESOURCE_EXHAUSTED","The GPU is out of memory"],["Restart session","Clears variables and frees GPU memory"]],"explain":"Accumulation separates what fits in memory (the physical batch) from what the optimizer sees per update (the effective batch)."},{"type":"mcq","level":2,"prompt":"Compared with the batch-1 bfloat16 run, what did gradient accumulation produce?","options":["Faster epochs but worse final answers","Coherent outputs sooner and a lower final loss","Identical outputs at every single epoch","An OOM error at the very first update"],"answer":1,"explain":"The lab saw fluent, factual outputs by epoch 2, no KMnO4 loops, and a lower final loss with higher accuracy."}]},{"id":"c7-6b","title":"Gradient accumulation","part":2,"icon":"chain","lab":"course_7/gdm_lab_7_6_apply_gradient_accumulation.ipynb","goal":"Apply them to harder, hands-on questions.","steps":[{"type":"cloze","level":2,"prompt":"Raising the batch size mostly increases ___ memory.","options":["parameter","optimizer","tokenizer","activation"],"answer":3,"explain":"Parameters and optimizer states depend on model size; activations are stored per example, so they scale with batch size."},{"type":"cloze","level":2,"prompt":"With 8 accumulation steps, what physical batch size does the lab pass to fit?","code":"history = model.fit(\n    data,\n    epochs=num_epochs,\n    batch_size=___,\n    callbacks=[generation_callback],\n)","options":["1","4","8","32"],"answer":0,"explain":"The physical batch stays at 1, which fits in memory; the optimizer's 8 accumulation steps supply the effective batch of 8."},{"type":"mcq","level":2,"prompt":"Why does the lab restart the Colab session after the OOM?","options":["To download a smaller Gemma model","To reset the random seed for training","To clear variables and free GPU memory","To switch to a larger GPU type"],"answer":2,"explain":"Restarting wipes leftover variables and allocations, giving the next run the GPU's full memory; imports and setup are then re-run."},{"type":"mcq","level":3,"prompt":"Physical batch size 2 with gradient_accumulation_steps=4. What is the effective batch size?","options":["6","4","8","2"],"answer":2,"explain":"Effective batch = 2 × 4, so 8 examples contribute to each weight update."},{"type":"mcq","level":3,"prompt":"You want an effective batch of 32, but only batches of 4 fit. How many accumulation steps?","options":["28","8","128","4"],"answer":1,"explain":"32 ÷ 4 = 8 small batches must be accumulated before each update."},{"type":"mcq","level":3,"prompt":"Base lr is 1e-4 at batch 1. Following the lab's scaling, which lr goes with gradient_accumulation_steps=4?","options":["4e-4","8e-4","2.5e-5","1e-4"],"answer":0,"explain":"The lab scales the learning rate with the effective batch: 1e-4 × 4 = 4e-4, just as it used 8 × 1e-4 = 8e-4 for 8 steps."},{"type":"tf","level":3,"prompt":"With batch size 1 and 8 accumulation steps, each weight update reflects gradients from 8 examples.","answer":true,"explain":"Eight one-example batches are summed before the single update, so 8 examples shape it."}]}]},{"id":"c8","title":"Capstone: Real-World Impact","blurb":"AI Research Foundations · Course 8","repo":"ai-foundations","sessions":[{"id":"c8-1a","title":"Classification","part":1,"icon":"filter","lab":"course_8/gdm_lab_8_3_classification_stage_3_train_and_evaluate_your_model.ipynb","goal":"Learn the ideas, then try the first checks.","steps":[{"type":"card","title":"The task","body":"The capstone fine-tunes Gemma3-1B to label texts from the Africa Galore dataset, where each record has a name, a description and a category. The raw data is dominated by 'Story', so the worked example keeps four well-defined, mutually exclusive classes (Drink, Food, Music, Textile) and caps each at 100 examples for balance."},{"type":"card","title":"Rows become instructions","body":"Each row becomes an input/output pair. The input is an instruction listing every allowed class, followed by the description; the output is the category. Naming the classes removes ambiguity, and labels must be spelled identically everywhere. To predict two labels at once (say, category and region), the output can be a small JSON string.","code":"instruction = (\"Classify the following \"\n  \"text into one of the categories \"\n  \"'Drink', 'Food', 'Music', or \"\n  \"'Textile'.\\n\\n\")\ntext = row[\"description\"]\nreturn {\"input\": instruction + text,\n        \"output\": row[\"category\"]}"},{"type":"card","title":"Base model vs fine-tuned","body":"The base Gemma3-1B only learned next-token prediction, so when asked to classify it may ramble, drift off-topic or hallucinate. LoRA fine-tuning (rank 6, learning rate 5e-5, 3 epochs) trains a few extra parameters while the base stays frozen. Afterwards it should answer with a single label. Base models are used because they're a neutral starting point to steer."},{"type":"card","title":"Extracting the label","body":"Raw outputs include the prompt and special tokens, so extract_prediction grabs the text after the last `\u003cstart_of_turn>model` and before `\u003cend_of_turn>`. If nothing matches, it returns 'Unknown', so a badly formatted answer is simply scored as wrong instead of crashing the evaluation.","code":"pattern = (r\"\u003cstart_of_turn>model\\s*\"\n           r\"([^\u003c]*)\u003cend_of_turn>\")\nmatches = re.findall(pattern, model_output)\nif matches:\n    return matches[-1].strip()\nreturn \"Unknown\""},{"type":"mcq","level":1,"prompt":"Why does the worked example cap each category at 100 examples?","options":["Because Gemma can only read 100 examples at a time","To balance classes so none dominates training","To make the test set bigger than training","Because later rows contain broken HTML"],"answer":1,"explain":"With roughly equal examples per class, the model gets balanced exposure and doesn't learn to favour the majority class."},{"type":"tf","level":1,"prompt":"The raw Africa Galore data contains many more 'Story' records than any other category.","answer":true,"explain":"Counting examples per category in lab 8.1 shows 'Story' dominates, which is one reason to filter and balance before training."},{"type":"cloze","level":1,"prompt":"LoRA trains a small set of extra parameters while the base model stays ___.","options":["frozen","deleted","random","unloaded"],"answer":0,"explain":"Only small low-rank matrices are trained; the original Gemma weights stay frozen, which saves memory and time."},{"type":"cloze","level":1,"prompt":"Fill in the LoRA rank the classification worked example uses.","code":"lora_rank = ___\nlearning_rate = 5e-5\nnum_epochs = 3\nmodel.backbone.enable_lora(rank=lora_rank)","options":["450","6","16","3"],"answer":1,"explain":"The classification and conversation labs start at rank 6, while summarization uses 16. 450 is the sequence length, not the rank."},{"type":"cloze","level":2,"prompt":"Four categories capped at 100 examples each give ___ training examples.","options":["100","104","400","25"],"answer":2,"explain":"4 × 100 = 400 balanced training examples: 100 each of Drink, Food, Music and Textile."},{"type":"mcq","level":2,"prompt":"Why list every valid class inside the instruction?","options":["It tells the model exactly which labels are allowed","Gemma needs the full list in order to load its weights","It makes each prompt shorter and quicker to process","It lets the model invent extra categories when unsure"],"answer":0,"explain":"An explicit class list makes the task unambiguous: the model knows its answer must be one of these four labels."},{"type":"cloze","level":2,"prompt":"Fill in the field that holds the label the model should output.","code":"def to_instruction_record(row):\n  text = row[\"description\"]\n  return {\"input\": instruction + text,\n          \"output\": row[\"___\"]}","options":["name","description","category","label"],"answer":2,"explain":"The category column ('Food', 'Music', …) is the target the model learns to output. The description is the text it reads."},{"type":"mcq","level":2,"prompt":"Asked to classify an item, the base Gemma3-1B rambles off-topic. Why?","options":["It learned only next-token prediction, not instructions","Its weights were partly overwritten when LoRA was enabled","The item's name was missing from its vocabulary","The prompt was too short for it to understand"],"answer":0,"explain":"A base model just continues text plausibly. It hasn't been trained on instruction-response pairs, so 'classify' isn't a command to it."}]},{"id":"c8-1b","title":"Classification","part":2,"icon":"filter","lab":"course_8/gdm_lab_8_3_classification_stage_3_train_and_evaluate_your_model.ipynb","goal":"Apply them to harder, hands-on questions.","steps":[{"type":"tf","level":2,"prompt":"Gemma has a separate system role, so task instructions can sit outside the user prompt.","answer":false,"explain":"Gemma supports only user and model roles. Any instruction or context must be written inside the user turn of each example."},{"type":"match","level":2,"prompt":"Match each piece of Gemma's turn format to its job.","pairs":[["\u003cstart_of_turn>","Marks where a turn begins"],["\u003cend_of_turn>","Marks where a turn ends"],["user","Role for the text to be classified"],["model","Role for the predicted category"]],"explain":"These delimiters show the model when to 'listen' (the user turn) and when to 'respond' (the model turn)."},{"type":"order","level":2,"prompt":"Order the classification pathway across labs 8.1–8.3.","items":["Inspect data and category counts","Filter and balance the categories","Clean, split and format the data","Fine-tune Gemma with LoRA","Extract labels and compute metrics"],"explain":"The labs move from inspecting the data to preparing it, then training, and finally evaluating the classifier."},{"type":"mcq","level":2,"prompt":"You want both category and region from one prompt. What should each training output be?","options":["Two answers in two separate model turns","Only the region, since category is implied","A JSON string with category and region","A number from 1 to 4 for each class"],"answer":2,"explain":"For multi-task classification, the instruction asks for both fields and the output is a JSON string such as {\"category\": \"Food\", \"region\": \"West Africa\"}."},{"type":"tf","level":2,"prompt":"A higher LoRA rank can capture more complex patterns but uses more memory and training time.","answer":true,"explain":"Rank sets the size of the added low-rank matrices. Bigger means more capacity but higher cost; rank 4 is often enough for simple classification."},{"type":"mcq","level":3,"prompt":"What does this print?","code":"out = (\"\u003cstart_of_turn>user\\nClassify...\"\n       \"\u003cend_of_turn>\\n\u003cstart_of_turn>model\"\n       \"\\nMusic\u003cend_of_turn>\u003cend_of_turn>\")\nprint(extract_prediction(out))","options":["Music","Unknown","Classify...","Music\u003cend_of_turn>"],"answer":0,"explain":"The pattern captures the text between `\u003cstart_of_turn>model` and the next `\u003cend_of_turn>`: 'Music'. Whitespace is stripped and the extra end token is ignored."},{"type":"mcq","level":3,"prompt":"The model replies 'This is a kind of food' with no turn tokens at all. What does extract_prediction return?","options":["Food","This is a kind of food","An empty string","Unknown"],"answer":3,"explain":"With no `\u003cstart_of_turn>model … \u003cend_of_turn>` match there's no label to extract, so it returns 'Unknown', which is counted as an incorrect prediction."}]},{"id":"c8-2a","title":"Summarization","part":1,"icon":"book","lab":"course_8/gdm_lab_8_6_summarization_stage_3_train_and_evaluate_your_model.ipynb","goal":"Learn the ideas, then try the first checks.","steps":[{"type":"card","title":"Shaping the dataset","body":"Each record pairs a full text (`expanded`) with a short `summary`. The worked example keeps 'Story' items with 250–320-word sources and 20–30-word summaries, drops duplicate summaries, caps each story name at 50 rows and the total at 700, then shuffles. Consistent lengths keep the task well defined: sources must be much longer than summaries."},{"type":"card","title":"Format and fine-tune","body":"The instruction is minimal: 'Summarize: ' plus the full text, with the reference summary as the output. Long inputs need sequence_length 530, near the limit for Gemma3-1B on a 16 GB T4 GPU, with LoRA rank 16, learning rate 1e-4 and 2 epochs. Before tuning, the base model may return nothing at all, or ramble.","code":"def to_instruction_record(row):\n  text = row[\"expanded\"]\n  return {\"input\": \"Summarize: \" + text,\n          \"output\": row[\"summary\"]}"},{"type":"card","title":"Judging a summary","body":"Summaries have no single right answer, so this pathway relies on human spot checks of four qualities: coverage (key points kept), faithfulness (nothing invented), conciseness (much shorter than the source) and fluency (readable, grammatical). For the same reason it uses only train and test splits: without automatic metrics, a validation set adds little."},{"type":"card","title":"Length ratio","body":"A quick numeric check: length ratio = summary words ÷ source words. A 28-word summary of a 280-word story gives 0.10, or 10%. Similar ratios on seen and unseen data suggest a consistent style. Fine-tuned models mimic the length of their training summaries, so to control length, curate the examples or pair prompts like 'Summarize briefly' with short targets."},{"type":"mcq","level":1,"prompt":"Which two things does each summarization training example pair up?","options":["A category label and a region","The full text and its reference summary","A user's question and the chatbot's friendly reply","A story name and its country"],"answer":1,"explain":"Each example needs the source text (`expanded`) and a target summary (`summary`), so the model can learn to map one to the other."},{"type":"cloze","level":1,"prompt":"In the worked example, the full source text is stored in the ___ column.","options":["expanded","summary","description","name"],"answer":0,"explain":"`expanded` holds the long text and `summary` holds the short target. `description` is a shorter version of the item text."},{"type":"tf","level":2,"prompt":"A lower length ratio means the summary compresses the source more aggressively.","answer":true,"explain":"The ratio is summary length over source length, so a smaller number means a shorter summary relative to the original."},{"type":"mcq","level":2,"prompt":"Why does the summarization pathway split only into train and test?","options":["Gemma cannot load more than two data files at once","Lacking automatic metrics, validation adds little","Summaries are too short to split three ways","The test set doubles as training data"],"answer":1,"explain":"Open-ended outputs are hard to score automatically, so there's little to tune on a validation set. Quality is checked by humans on the test set."},{"type":"match","level":2,"prompt":"Match each summary quality to the question it asks.","pairs":[["Coverage","Does it keep the key points?"],["Faithfulness","Does it avoid adding false facts?"],["Conciseness","Is it much shorter than the source?"],["Fluency","Is it grammatical and readable?"]],"explain":"These four dimensions guide manual spot checks, since a single reference summary is never the only right answer."},{"type":"mcq","level":2,"prompt":"A summary claims baobabs grow in Asia, though the source never says so. Which quality fails?","options":["Conciseness","Fluency","Coverage","Faithfulness"],"answer":3,"explain":"Faithfulness means sticking to the source. Introducing facts it doesn't contain is a hallucination."},{"type":"tf","level":2,"prompt":"Before fine-tuning, the base model may return an empty output for a long passage.","answer":true,"explain":"Base models haven't learned instruction-response patterns and often give high probability to end-of-sequence after long text, so generation can stop at once."},{"type":"mcq","level":2,"prompt":"Why drop rows that have duplicate summaries?","options":["Identical targets push the model to overfit","Duplicate rows would break the JSONL file format","So the dataset lands on exactly 700 rows","Because Gemma cannot read repeated text"],"answer":0,"explain":"Repeated outputs encourage memorising specific instances instead of learning to condense diverse content."}]},{"id":"c8-2b","title":"Summarization","part":2,"icon":"book","lab":"course_8/gdm_lab_8_6_summarization_stage_3_train_and_evaluate_your_model.ipynb","goal":"Apply them to harder, hands-on questions.","steps":[{"type":"order","level":2,"prompt":"Order the worked example's filtering steps.","items":["Keep 'Story' rows within the length ranges","Drop rows with duplicate summaries","Cap each story name at 50 rows","Cap the total at 700 rows","Shuffle the rows"],"explain":"Filter by category and length, remove duplicate targets, apply the per-name and total caps, then shuffle to avoid order artefacts."},{"type":"cloze","level":2,"prompt":"To fit long stories, the summarization run sets sequence_length = ___, near the T4 limit for Gemma3-1B.","options":["128","450","530","4096"],"answer":2,"explain":"530 tokens holds a 250–320-word story plus its summary, close to the most a 16 GB T4 can handle for LoRA on Gemma3-1B."},{"type":"tf","level":2,"prompt":"An extractive summary rewrites the source entirely in new words.","answer":false,"explain":"Extractive summaries reuse phrases from the source; abstractive summaries rephrase it. The lab asks you to decide which style you want."},{"type":"mcq","level":3,"prompt":"A 300-word story gets a 24-word summary. What is the length ratio?","options":["24%","12.5%","8%","80%"],"answer":2,"explain":"24 ÷ 300 = 0.08, so the summary is 8% of the source's length."},{"type":"cloze","level":3,"prompt":"Sources are 250–320 words and summaries 20–30 words. The smallest possible ratio, 20 ÷ 320, is about ___.","options":["12%","6%","8%","16%"],"answer":1,"explain":"20 ÷ 320 = 0.0625, about 6%. The largest is 30 ÷ 250 = 12%, so the targets compress each source to roughly 6–12%."},{"type":"cloze","level":3,"prompt":"Complete extract_summary so it stops where the model's turn ends.","code":"def extract_summary(out):\n  marker = \"\u003cstart_of_turn>model\"\n  if marker not in out:\n    return out.strip()\n  resp = out.split(marker)[1]\n  if \"\u003cend_of_turn>\" in resp:\n    resp = resp.split(\"___\")[0]\n  return resp.strip()","options":["\u003cstart_of_turn>","\u003cend_of_turn>","model","Summarize:"],"answer":1,"explain":"Splitting on `\u003cend_of_turn>` and keeping part [0] leaves only the text the model generated before closing its turn."},{"type":"mcq","level":3,"prompt":"You want short summaries on request and longer ones otherwise. What does the lab suggest?","options":["Lower the LoRA rank until outputs shrink","Strip every end_of_turn token from the training data","Pair 'Summarize briefly' prompts with short targets","Raise the learning rate to 0.1"],"answer":2,"explain":"Fine-tuned models copy the length patterns in their training data, so instruction-specific examples teach them to vary length on command."},{"type":"mcq","level":3,"prompt":"After filtering, the dataset hits its 700-row cap. With test_fraction = 0.2, how many items go to the test set?","options":["560","70","200","140"],"answer":3,"explain":"20% of 700 is 140 test items, leaving 560 for training. The lab notes that about 140 summaries get generated during evaluation."}]},{"id":"c8-3a","title":"Conversation","part":1,"icon":"chat","lab":"course_8/gdm_lab_8_7_conversation_worked_example.ipynb","goal":"Learn the ideas, then try the first checks.","steps":[{"type":"card","title":"Q&A from paragraphs","body":"No chat data? Generate it. Lab 8.7 turns Africa Galore food descriptions into prompt-response pairs. assign_region tags each item with a country and its UN region if a country name appears in its text; build_prompt picks a random question template; generate_response fills a fixed answer template from a matching item. Exact duplicate pairs are then removed."},{"type":"card","title":"One consistent style","body":"Questions vary, from 'What is one popular dish from Kenya?' to 'Recommend a well-known local dish from Ghana.' Every answer follows one pattern: 'This dish captures the authentic flavor and spirit of {location}. {name} — {description}', with the description trimmed to about 400 characters. A fixed style makes the effect of fine-tuning easy to spot.","code":"food_prompts = [\n  f\"What is one popular dish from {loc}?\",\n  f\"Recommend a well-known local dish \"\n  f\"from {loc}.\",\n]"},{"type":"card","title":"Data pitfalls","body":"Plain substring matching misses alternate spellings, abbreviations and indirect mentions, and can't spot regions. Upgrades include word-boundary regex, fuzzy matching (Côte d'Ivoire vs Ivory Coast), TF-IDF cosine similarity and sentence embeddings. Also avoid identical prompts paired with different answers: they send conflicting signals, making training unstable and replies bland."},{"type":"card","title":"Talking to Gemma","body":"Gemma has only user and model roles, so instructions live inside the user turn. generate_answer wraps a question as a user turn, opens a model turn, generates with max_length 600 (training used 450) and strips the prompt from the output. Each call is stateless: multi-turn chat would need the history in every input. Dialogue may also need more epochs than classification."},{"type":"mcq","level":1,"prompt":"What does the conversation worked example (lab 8.7) produce?","options":["Prompt-response pairs built from descriptions","Category labels for every food item","Short summaries of each Africa Galore story","A table of African countries ranked by population"],"answer":0,"explain":"It converts descriptive paragraphs into synthetic Q&A pairs that can be used to fine-tune a conversational model."},{"type":"tf","level":1,"prompt":"In lab 8.8, each record's input is the prompt and its output is the response.","answer":true,"explain":"The data is already Q&A pairs, so formatting just maps `prompt` to input and `response` to output."},{"type":"cloze","level":1,"prompt":"The worked example generates Q&A for just one topic: TOPICS = [\"___\"].","options":["food","music","place","story"],"answer":0,"explain":"Only 'food' items are used. You could add topics such as places by extending TOPICS and the prompt templates."},{"type":"order","level":2,"prompt":"Order the steps inside generate_dataset.","items":["Tag items with a country and region","Build a question from a random template","Fill the answer template from a match","Remove exact duplicate pairs"],"explain":"assign_region runs first. Then, for each location, a prompt is built and a response generated, and duplicates are dropped at the end."},{"type":"tf","level":2,"prompt":"assign_region can work out an item's country from context, even when no country name appears in its text.","answer":false,"explain":"It only checks whether a country name appears as text in the name or description. Indirect mentions are missed, and untagged items are dropped."},{"type":"mcq","level":2,"prompt":"Why might an item that says 'Ivory Coast' miss the country entry 'Côte d'Ivoire'?","options":["That country is missing from the UN region table","Substring matching can't link two names for a place","Python string matching can't handle apostrophes at all","The description passed 400 characters"],"answer":1,"explain":"Plain containment only finds the exact string. Fuzzy matching or embeddings can connect different names for the same place."},{"type":"cloze","level":2,"prompt":"Fill in the role that opens the model's turn in generate_answer.","code":"prompt = (\n  f\"{sot}user\\n\"\n  f\"{question}{eot}\\n\"\n  f\"{sot}___\\n\"\n)\nraw = model.generate(prompt, max_length=600)","options":["user","system","model","assistant"],"answer":2,"explain":"Gemma's roles are user and model. Ending the prompt with an open model turn tells it to start answering."},{"type":"tf","level":2,"prompt":"generate_answer remembers earlier questions, so follow-up questions work out of the box.","answer":false,"explain":"Each call is stateless. Multi-turn dialogue needs the conversation history included in every input."}]},{"id":"c8-3b","title":"Conversation","part":2,"icon":"chat","lab":"course_8/gdm_lab_8_7_conversation_worked_example.ipynb","goal":"Apply them to harder, hands-on questions.","steps":[{"type":"mcq","level":2,"prompt":"Why must any instruction go inside the user turn when fine-tuning Gemma?","options":["User turns are processed faster","Gemma has no system role, only user and model","The model turn is reserved for special tokens only","Kaggle requires it for licensing"],"answer":1,"explain":"Larger models like Gemini have a system role for global instructions. Gemma doesn't, so each example must carry its own context."},{"type":"mcq","level":2,"prompt":"Your data pairs one prompt with several different responses. What is the likely effect?","options":["Conflicting signals and bland, averaged replies","Faster training and lower memory use","None, because the duplicate filter already removes them","More creative and varied answers"],"answer":0,"explain":"The same input pulls toward different targets, giving contradictory updates: unstable loss and generic responses that fully satisfy none of them."},{"type":"cloze","level":2,"prompt":"Dialogue models may need more ___ than classifiers, since they learn free-form replies, not fixed labels.","options":["epochs","categories","GPUs","labels"],"answer":0,"explain":"Learning open-ended generation and conversational structure usually takes more passes over the data. Watch for overfitting as you add them."},{"type":"mcq","level":2,"prompt":"'Recommend a dish from Kenya' works well, but 'What food should I try in Kenya?' doesn't. What is this called?","options":["Class imbalance","Data leakage","Prompt sensitivity","Under-sized LoRA rank"],"answer":2,"explain":"Small fine-tuned models can react strongly to changes in wording. Diversifying the prompt templates in training improves robustness."},{"type":"match","level":2,"prompt":"Match each test-prompt type to an example.","pairs":[["Baseline","Like training: 'Recommend a dish from Nigeria'"],["Regional query","'What food should I try in Eastern Africa?'"],["Format deviation","'I'm visiting Morocco, what should I eat?'"],["Edge case","'What's the best African food?'"]],"explain":"Start with familiar phrasings, then deviate step by step to find where the model keeps its format and where it breaks down."},{"type":"match","level":3,"prompt":"Match each upgrade to what it adds over plain substring matching.","pairs":[["Word-boundary regex","Stops 'Niger' matching inside 'Nigeria'"],["Fuzzy matching","Tolerates typos and small spelling changes"],["TF-IDF cosine","Scores weighted word overlap in context"],["Sentence embeddings","Compares meaning, catching related phrases"]],"explain":"Each option trades more computation for smarter matching. For small datasets, regex or fuzzy matching is often enough."},{"type":"mcq","level":3,"prompt":"A dish's text mentions only 'Nigeria'. The country list checks 'Niger' just before 'Nigeria'. What does assign_region assign?","options":["Nigeria, the exact name in the text","Unknown, because two different countries match","Both Niger and Nigeria","Niger, since 'niger' is inside 'nigeria'"],"answer":3,"explain":"Containment finds 'niger' inside 'nigeria', and the loop stops at the first match. A word-boundary regex would prevent this mistake."},{"type":"mcq","level":3,"prompt":"Asked about Ghana, the model says: '…spirit of Nigeria. Banku — a fermented corn…'. How would the lab rate this?","options":["Excellent: authentic dish, engaging tone","Poor: completely irrelevant answer","Mixed: right dish, wrong location text","Fine: Ghana and Nigeria share a region"],"answer":2,"explain":"Banku suits Ghana, but the response names Nigeria, a geographic inconsistency. The lab marks this kind of answer as MIXED."}]},{"id":"c8-4a","title":"Data prep and splits","part":1,"icon":"layers","lab":"course_8/gdm_lab_8_2_classification_stage_2_prepare_your_data_for_building_your_model.ipynb","goal":"Learn the ideas, then try the first checks.","steps":[{"type":"card","title":"Load, then look","body":"Choose the loader that fits the file: `pd.read_csv` for CSV, `pd.read_json(path, lines=True)` for JSONL, where each line is one JSON object. Then inspect with `df.head()`, `df.info()` and `df.columns`: confirm which columns hold text and labels, check non-English characters survived, count examples per category, and look for duplicates or extreme lengths."},{"type":"card","title":"Clean, but keep the original","body":"`clean_html` strips tags and turns entities such as &amp; back into symbols. `clean_unicode` keeps only letters, numbers, punctuation and whitespace, dropping emojis and other symbols. Save the original column, compare before and after, and drop rows that end up empty, like a description that was nothing but `\u003cbr>\u003cbr>`.","code":"orig = df[\"description\"].astype(str)\ndf[\"description_original\"] = orig\ndf[\"description\"] = (\n    orig.map(clean_html).map(clean_unicode))"},{"type":"card","title":"Three splits, three jobs","body":"The training set fits the model's parameters. The validation set guides development: tuning hyperparameters, comparing versions, catching overfitting. The test set stays untouched until the end, for an unbiased final score. Stratified splitting keeps each class's share equal across splits, and a fixed random_state makes the split reproducible.","code":"df_train, df_val_test = train_test_split(\n    df, test_size=0.2, random_state=42,\n    stratify=df[\"category\"])"},{"type":"card","title":"Format for fine-tuning","body":"Each split is saved as JSONL: one record per line, with an 'input' (instruction plus text) and an 'output' (the target). For Gemma, each pair is then wrapped in turn tokens and collected into a dict with 'prompts' and 'responses' keys. Shuffle before training so the model can't pick up patterns from the original order."},{"type":"mcq","level":1,"prompt":"Which call loads a JSONL file, where each line is one JSON object?","options":["pd.read_csv(path, encoding=\"utf-8\")","pd.read_json(path, lines=True)","json.load(open(path))","pd.read_json(path)"],"answer":1,"explain":"`lines=True` tells pandas to read each line as a separate JSON record, the JSONL format all of these labs save to."},{"type":"match","level":1,"prompt":"Match each split or method to its job.","pairs":[["Training set","Fits the model's parameters"],["Validation set","Guides tuning and model choice"],["Test set","Held back for one unbiased final score"],["Stratified split","Keeps class proportions equal in each split"]],"explain":"Train to learn, validate to decide, test once at the end, while stratification keeps every split representative."},{"type":"tf","level":1,"prompt":"Duplicate examples in training data can push a model to overfit to specific items.","answer":true,"explain":"Repeats get extra weight, so the model may memorise them instead of learning general patterns. That's why the labs check for duplicates."},{"type":"tf","level":2,"prompt":"It's fine to check scores on the test set while choosing the best learning rate.","answer":false,"explain":"Tuning on the test set leaks information and inflates the final score. Use the validation set for choices and the test set only at the end."},{"type":"cloze","level":2,"prompt":"Fill in the value for a standard 80/20 train/test split.","code":"df_train, df_test = train_test_split(\n    df, test_size=___, random_state=42)","options":["0.8","0.2","20","80"],"answer":1,"explain":"test_size is a fraction of the data: 0.2 sends 20% to the test set and keeps 80% for training."},{"type":"mcq","level":2,"prompt":"Why keep a copy of the original text before cleaning it?","options":["To compare before/after and spot lost content","Because pandas deletes a column once you map it","So the model can train on both versions at once","To double the size of the dataset for training"],"answer":0,"explain":"Cleaning can remove too much. Keeping the original lets you check that important content survived, and revert if needed."},{"type":"cloze","level":2,"prompt":"After cleaning, a description that was only `\u003cbr>\u003cbr>` is ___, so drop_empty_rows removes it.","options":["empty","unchanged","an emoji","a number"],"answer":0,"explain":"clean_html strips the tags and leaves an empty string. Real-world data often needs this kind of check after cleaning."},{"type":"mcq","level":2,"prompt":"Why take the classification validation and test items from beyond the first 100 per category?","options":["Those items were never seen in fine-tuning","They are much cleaner than the first 100 items","They all belong to the 'Story' category","Gemma was pretrained on the first 100"],"answer":0,"explain":"Training used the first 100 per category, so later items are genuinely unseen and give a fair test of generalisation."}]},{"id":"c8-4b","title":"Data prep and splits","part":2,"icon":"layers","lab":"course_8/gdm_lab_8_2_classification_stage_2_prepare_your_data_for_building_your_model.ipynb","goal":"Apply them to harder, hands-on questions.","steps":[{"type":"tf","level":2,"prompt":"Shuffling with a fixed random_state gives the same order every time the code runs.","answer":true,"explain":"Fixing the seed (random_state=42) makes the shuffle reproducible, so experiments can be repeated and compared fairly."},{"type":"order","level":2,"prompt":"Order the data-preparation activities.","items":["Load and inspect the dataset","Filter and balance categories","Clean the text fields","Split into train/validation/test","Format as input/output and save"],"explain":"Labs 8.2, 8.5 and 8.8 follow this path: load and inspect, filter where needed, clean, split, then format and save as JSONL."},{"type":"mcq","level":2,"prompt":"Why shuffle the training data after filtering?","options":["So the categories become perfectly balanced","Because JSONL files only load when rows are shuffled","So the model can't learn patterns from data order","So duplicate rows are removed automatically"],"answer":2,"explain":"After filtering, rows may be grouped by category. Shuffling breaks up that order so it can't become a spurious signal."},{"type":"mcq","level":2,"prompt":"How should you choose sequence_length for fine-tuning?","options":["Equal to the number of training examples","Slightly above your longest prompt plus response","Equal to the number of categories","Always the largest value that Gemma could ever support"],"answer":1,"explain":"It must fit the full prompt and response, but longer sequences use more memory. Analyse your data and leave a small margin."},{"type":"mcq","level":3,"prompt":"1,000 examples (60% Food, 40% Music) are split 80/20 with stratification. How many Music items land in the test set?","options":["40","200","80","120"],"answer":2,"explain":"The test set gets 20% of 1,000 = 200 items. Stratification keeps Music at 40%, so 0.4 × 200 = 80."},{"type":"mcq","level":3,"prompt":"clean_unicode keeps letters, numbers, punctuation and whitespace. What happens to 'Jollof 🍚 rice!'?","options":["The emoji and the '!' are both removed","Nothing changes; emojis count as letters","Only the '!' is removed","The emoji is removed; the '!' stays"],"answer":3,"explain":"The bowl emoji is a symbol, not a letter, number or punctuation mark, so it's dropped. The exclamation mark is punctuation, so it stays."},{"type":"cloze","level":3,"prompt":"Classification: 40 unseen items × 4 categories are split in half for validation and test. The test set holds ___ items.","options":["20","40","80","160"],"answer":2,"explain":"40 × 4 = 160 unseen items, and half of 160 is 80: 20 per category, thanks to stratified splitting."}]},{"id":"c8-5a","title":"Evaluating responsibly","part":1,"icon":"scale","lab":"course_8/gdm_lab_8_9_conversation_stage_3_train_and_evaluate_your_model.ipynb","goal":"Learn the ideas, then try the first checks.","steps":[{"type":"card","title":"Accuracy, precision, recall","body":"Accuracy: correct predictions ÷ all predictions. Simple, but misleading when classes are imbalanced. Precision: of the items predicted as a class, the share that truly belong (key when false alarms are costly). Recall: of the items truly in a class, the share the model found (key when misses are costly). The classification lab averages these across classes with weights.","code":"acc = accuracy_score(y_true, y_pred)\nprec = precision_score(\n    y_true, y_pred, average=\"weighted\")\nrec = recall_score(\n    y_true, y_pred, average=\"weighted\")"},{"type":"card","title":"Seen vs unseen","body":"Compare scores on training data with validation and test data. A moderate gap is normal; a large one signals overfitting, where the model learned noise instead of patterns. Try fewer epochs or more diverse data, and judge models by unseen performance. Remember that fine-tuning teaches how to respond, not encyclopaedic facts, so a model can still be wrong on unfamiliar items."},{"type":"card","title":"No single right answer","body":"For chat and summaries, human evaluation is the gold standard: is the reply accurate, relevant, fluent and well-toned? Automated helpers scale it up. BLEU and ROUGE count word overlap with a reference, METEOR and BERTScore account for synonyms and meaning, a stronger LLM can act as judge, and behavioral checks test specifics, like whether a dish comes from the requested region."},{"type":"card","title":"Failure analysis and care","body":"Spot-check the same examples before and after fine-tuning. Warning signs: off-format outputs, bias toward one class, hallucinated facts, geographic mismatches, stereotypes or disrespectful content. When iterating, change one thing at a time and log every run's settings. The capstone ends with reflection: which values and ethics should a responsible ML practitioner bring?"},{"type":"tf","level":1,"prompt":"The lab's chat evaluation framework includes cultural sensitivity, such as avoiding stereotypes.","answer":true,"explain":"Alongside accuracy, quality and structure, it asks whether responses represent cultures respectfully and reflect their diversity."},{"type":"tf","level":2,"prompt":"A large gap between training accuracy and test accuracy suggests the model is overfitting.","answer":true,"explain":"Doing much better on seen data than unseen data means it learned training-specific noise rather than general patterns."},{"type":"mcq","level":2,"prompt":"Train accuracy is 99% but test accuracy is 62%. What does the lab suggest?","options":["Train many more epochs on the same data","Reduce epochs or add more diverse data","Report the training accuracy instead","Stop using a test set at all"],"answer":1,"explain":"A big gap points to overfitting. Fewer epochs, more varied training data or regularisation help the model generalise."},{"type":"match","level":2,"prompt":"Match each evaluation method to what it does.","pairs":[["BLEU / ROUGE","Count word overlap with a reference"],["BERTScore","Compares meaning, allowing synonyms"],["LLM as judge","A stronger model rates relevance and tone"],["Behavioral check","Tests one fact, e.g. the right region"],["Human evaluation","Gold standard for fluency and helpfulness"]],"explain":"No single metric captures conversational quality. Combining automated scores with selective human review is the most reliable approach."},{"type":"cloze","level":2,"prompt":"Fine-tuning teaches a model how to respond; it is not a knowledge ___.","options":["database","tokenizer","metric","prompt"],"answer":0,"explain":"The model can still misclassify or misdescribe items outside the patterns it learned, so don't treat it as an encyclopaedia."},{"type":"mcq","level":2,"prompt":"Why reuse the same spot-check examples before and after fine-tuning?","options":["The model can only read five prompts","So the test set never needs to be used","It gives a direct side-by-side comparison","To make the model memorise those examples"],"answer":2,"explain":"Holding the inputs fixed means any change in the outputs comes from fine-tuning, which makes its effect easy to see."},{"type":"tf","level":2,"prompt":"When iterating, changing many settings at once is the quickest way to learn what helps.","answer":false,"explain":"If several things change together you can't tell which one mattered. Change one at a time and log each run."},{"type":"order","level":2,"prompt":"Order the classification evaluation workflow.","items":["Spot-check the base model","Fine-tune with LoRA","Re-run the same spot checks","Predict labels for every split","Compare metrics on seen vs unseen data"],"explain":"Get a baseline, train, compare on the same examples, and finally measure systematically across train, validation and test."}]},{"id":"c8-5b","title":"Evaluating responsibly","part":2,"icon":"scale","lab":"course_8/gdm_lab_8_9_conversation_stage_3_train_and_evaluate_your_model.ipynb","goal":"Apply them to harder, hands-on questions.","steps":[{"type":"mcq","level":2,"prompt":"Which output pattern is a warning sign for a classifier?","options":["It predicts 'Food' for nearly every input","It returns one clean label per item","Validation and test scores are similar","It handles varied items within each class"],"answer":0,"explain":"Systematic bias toward one category means the model isn't really telling classes apart, even if some of its predictions are right."},{"type":"cloze","level":2,"prompt":"Text that sounds plausible but is factually wrong or off-task is called a ___.","options":["stratification","hallucination","tokenization","regularization"],"answer":1,"explain":"Small base models are especially prone to hallucinating. Spot checks for faithfulness and accuracy help catch it."},{"type":"mcq","level":2,"prompt":"When does precision matter most?","options":["When missing true cases is costly","When false positives are costly","When classes are perfectly balanced","When there is no reference label"],"answer":1,"explain":"Precision asks how many flagged items are truly positive, so it matters when false alarms are expensive. Recall matters when misses are."},{"type":"cloze","level":3,"prompt":"100 test items: 45 Food and 40 Music items are labelled correctly, 15 are wrong. Accuracy is ___.","options":["45%","85%","15%","90%"],"answer":1,"explain":"Accuracy = correct ÷ total = (45 + 40) ÷ 100 = 85%."},{"type":"mcq","level":3,"prompt":"The model labels 20 items 'Textile', and 15 of them really are Textile. What is its precision for Textile?","options":["75%","25%","15%","80%"],"answer":0,"explain":"Precision = true positives ÷ predicted positives = 15 ÷ 20 = 75%. The other 5 were false alarms."},{"type":"cloze","level":3,"prompt":"There are 25 real Drink items, and the model finds 20 of them. Recall for Drink is ___.","options":["20%","25%","75%","80%"],"answer":3,"explain":"Recall = found ÷ actually present = 20 ÷ 25 = 80%. Five Drink items were missed."},{"type":"mcq","level":3,"prompt":"90 of 100 test items are 'Story'. A lazy model always answers 'Story'. What accuracy does it get?","options":["10%","50%","90%","100%"],"answer":2,"explain":"It's right on all 90 Story items, so 90% accuracy, while never finding any other class. That's why accuracy misleads on imbalanced data."},{"type":"mcq","level":3,"prompt":"Asked for food from Eastern Africa, a chatbot recommends pizza. Which dimension fails most clearly?","options":["Response length","Grammar and fluency","Format consistency","Content accuracy"],"answer":3,"explain":"Pizza isn't an Eastern African dish, so the geographic and cultural content is wrong. The lab rates this kind of response POOR."}]}]},{"id":"frontier","title":"Frontier Topics","blurb":"DeepMind Educational · Summer School","repo":"educational","sessions":[{"id":"frontier-1a","title":"Agents, rewards & returns","part":1,"icon":"robot","lab":"colabs/summer_schools/intro_to_reinforcement_learning.ipynb","goal":"Learn the ideas, then try the first checks.","steps":[{"type":"card","title":"The RL loop","body":"In reinforcement learning an agent acts in an environment. At each step it observes the state, picks an action and receives a numerical reward. From experience it learns a policy, a distribution over actions given a state, aiming to maximise its total reward. Unlike supervised learning, nobody tells it the right action."},{"type":"card","title":"The Catch game","body":"A ball drops down a 10 × 5 grid while the agent slides a paddle along the bottom row with three actions: left, stay and right. Every step gives reward 0 except the last: +1 for a catch, −1 for a miss. Each `env.step(action)` returns a TimeStep holding step_type, reward, discount and observation."},{"type":"card","title":"Returns and discounting","body":"An episode's return adds up its rewards, each weighted by the discount γ raised to how many steps away it arrives: G = r₀ + γ·r₁ + γ²·r₂ + … With γ \u003c 1, quick rewards count more than slow ones, and endless episodes still have a finite return. Catch uses γ = 1, since only its final reward is non-zero."},{"type":"card","title":"Agent and run loop","body":"An agent is a class whose `actor_step` turns a timestep into an action; learning agents add a `learner_step`. The random agent ignores what it sees and returns `np.random.randint(num_actions)`.","code":"timestep = env.reset()\nwhile not timestep.last():\n  action = agent.actor_step(timestep)\n  timestep = env.step(action)"},{"type":"match","level":1,"prompt":"Match each RL term to its meaning.","pairs":[["Agent","The learner that chooses actions"],["Environment","Responds to actions with states and rewards"],["Reward","Scalar feedback after an action"],["Policy","Distribution over actions given a state"],["Episode","One run from reset until termination"]],"explain":"The agent follows its policy inside the environment, collecting rewards over each episode."},{"type":"mcq","level":1,"prompt":"In Catch, what reward arrives on a step in the middle of an episode?","options":["+1","0","−1","+0.1"],"answer":1,"explain":"Catch only rewards the final step: +1 for catching the ball and −1 for missing it. Every intermediate step gives 0."},{"type":"tf","level":1,"prompt":"A reinforcement learning agent is shown the correct action for every state.","answer":false,"explain":"That would be supervised learning. An RL agent only sees the rewards of its own actions and must discover good actions by trying them."},{"type":"mcq","level":2,"prompt":"Catch's action spec has `num_values = 3`. What can `np.random.randint(3)` return?","options":["0, 1 or 2","1, 2 or 3","Any float in [0, 3)","Always 3"],"answer":0,"explain":"randint excludes its upper bound, so it returns one of the action ids 0, 1 or 2: left, stay or right."},{"type":"tf","level":2,"prompt":"In Catch the discount hardly matters, since every episode lasts the same number of steps and only the last reward is non-zero.","answer":true,"explain":"With a fixed episode length, discounting rescales every final reward by the same factor, so it never changes which behaviour is better."},{"type":"cloze","level":2,"prompt":"Complete the run loop so it stops at the end of the episode.","code":"timestep = env.reset()\nwhile not timestep.___():\n  action = agent.actor_step(timestep)\n  timestep = env.step(action)","options":["last","first","done","reset"],"answer":0,"explain":"A dm_env TimeStep's `last()` is True on an episode's final step, so the loop runs until termination."},{"type":"cloze","level":2,"prompt":"An agent's ___ method maps the current timestep to an action.","options":["learner_step","reset","actor_step","observation_spec"],"answer":2,"explain":"actor_step does the acting. learner_step, added for learning agents, updates their values or weights from experience."}]},{"id":"frontier-1b","title":"Agents, rewards & returns","part":2,"icon":"robot","lab":"colabs/summer_schools/intro_to_reinforcement_learning.ipynb","goal":"Apply them to harder, hands-on questions.","steps":[{"type":"order","level":2,"prompt":"Order one episode of the run loop.","items":["Reset the environment for a first timestep","The agent picks an action","The environment steps to a new timestep","Repeat until the timestep is the last","Sum the rewards into the episode return"],"explain":"Each episode starts with reset, alternates acting and stepping until termination, then totals the rewards it collected."},{"type":"mcq","level":2,"prompt":"What does a discount factor γ \u003c 1 do?","options":["Makes every reward count equally","Makes sooner rewards count more","Makes later rewards count more","Turns negative rewards into zero"],"answer":1,"explain":"A reward k steps away is weighted by γᵏ, which shrinks as k grows, so the agent prefers rewards it can collect quickly."},{"type":"mcq","level":2,"prompt":"What does a Catch observation contain?","options":["The reward for every cell of the grid","Q-values for each paddle position","A 10 × 5 grid marking ball and paddle","RGB pixels from a game screenshot"],"answer":2,"explain":"The observation is a (10, 5) array that is zero everywhere except the cells holding the ball and the paddle."},{"type":"mcq","level":2,"prompt":"Why does the random agent play Catch badly?","options":["It ignores the observation entirely","It can only move left","It never receives any reward","It changes the game's rules"],"answer":0,"explain":"The random agent throws away the timestep and samples actions blindly, so it cannot follow the falling ball. Learning agents use the observation to act."},{"type":"mcq","level":3,"prompt":"Rewards r₀…r₃ are 0, 0, 0, +1 and γ = 0.9. Using G = Σₜ γᵗ·rₜ, what is G?","options":["1","0.9","0.729","0.656"],"answer":2,"explain":"Only r₃ is non-zero, so G = 0.9³ × 1 = 0.729. Without discounting (γ = 1) the return would be 1."},{"type":"mcq","level":3,"prompt":"Rewards are 1, 1, 1 and γ = 0.5. What is G = r₀ + γ·r₁ + γ²·r₂?","options":["3","1.5","0.875","1.75"],"answer":3,"explain":"G = 1 + 0.5 × 1 + 0.25 × 1 = 1.75. Each later reward is halved once more than the one before it."},{"type":"cloze","level":3,"prompt":"With γ = 0.5, a reward of +8 that arrives three steps away (weight γ³) is worth ___ now.","options":["4","2","0.5","1"],"answer":3,"explain":"γ³ = 0.125, and 0.125 × 8 = 1. Each step of delay halves the reward's value."}]},{"id":"frontier-2a","title":"Q-learning & DQN","part":1,"icon":"trophy","lab":"colabs/summer_schools/intro_to_reinforcement_learning.ipynb","goal":"Learn the ideas, then try the first checks.","steps":[{"type":"card","title":"The value of an action","body":"Q(s, a) is the expected discounted return from taking action a in state s and following the policy afterwards. Value-based agents learn Q and act greedily, choosing argmaxₐ Q(s, a). The Bellman equation splits Q into the immediate reward plus the discounted value of whatever state comes next."},{"type":"card","title":"The Q-learning update","body":"After a transition (s, a, r, s′), form the TD error δ = r + γ·maxₐ′ Q(s′, a′) − Q(s, a), then nudge Q(s, a) ← Q(s, a) + α·δ with a small step size α. In Catch the table has c·r·c = 250 rows (paddle × ball positions) and 3 columns, one per action.","code":"a2 = np.argmax(q[s2])\ntd = r + g * q[s2, a2] - q[s, a]\nq[s, a] += alpha * td"},{"type":"card","title":"Explore a little","body":"Acting purely greedily, an agent may never try actions that look bad early on, so it can miss better ones. An ε-greedy policy takes a random action with probability ε and the greedy action otherwise. At evaluation time the agent switches back to fully greedy choices."},{"type":"card","title":"From tables to DQN","body":"Tables can't cover huge state spaces such as Atari screens, so a neural network maps an observation to Q-values for all actions, trained to shrink the squared TD error with the target frozen by `stop_gradient`. DQN adds a replay buffer of past transitions, sampled at random to break correlations, and a target network refreshed only periodically."},{"type":"tf","level":1,"prompt":"A greedy policy always picks the action with the highest current Q-value.","answer":true,"explain":"Greedy means π(s) = argmaxₐ Q(s, a). It fully trusts the current estimates, which is why it needs help to explore."},{"type":"mcq","level":1,"prompt":"How do policy gradient methods differ from Q-learning?","options":["They tune the policy directly to maximise return","They store a Q-value for every state–action pair","They never use neural networks","They learn without any reward signal"],"answer":0,"explain":"Policy gradients adjust the parameters θ of π_θ(a|s) to maximise J(θ) = E[r(τ)] instead of first estimating action values."},{"type":"cloze","level":2,"prompt":"Complete the TD error so it uses the best next-state value.","code":"td = r + g * np.___(q[s2]) - q[s, a]","options":["argmax","max","mean","sum"],"answer":1,"explain":"Q-learning bootstraps from the highest Q-value in the next state. argmax would return that action's index, not its value."},{"type":"mcq","level":2,"prompt":"Why switch from greedy to ε-greedy during training?","options":["To shrink the size of the Q-table","To remove the need for any reward","To make each env step run faster","To keep trying actions that look worse"],"answer":3,"explain":"If early estimates are wrong, a greedy agent keeps repeating its current favourite. Occasional random actions gather the experience needed to correct Q."},{"type":"match","level":2,"prompt":"Match each Q-learning idea to its description.","pairs":[["Replay buffer","Stores past transitions for random sampling"],["Target network","Periodically refreshed copy for TD targets"],["TD error","Gap between target and current Q-value"],["ε-greedy","Random action with probability ε"],["Function approx.","A network computes Q instead of a table"]],"explain":"Tabular Q-learning uses TD errors and ε-greedy exploration; DQN adds function approximation, a replay buffer and a target network."},{"type":"tf","level":2,"prompt":"Tabular Q-learning scales easily to Atari, since each screen only needs one row in the table.","answer":false,"explain":"The number of possible screens grows exponentially with the pixel count, so no table could hold them. Function approximation, as in DQN, generalises across states."},{"type":"cloze","level":2,"prompt":"The target r + γ·max Q(s′, a′) is wrapped in `jax.lax.___` so no gradient flows through it.","options":["stop_gradient","select","cond","scan"],"answer":0,"explain":"Only the prediction Q(s, a) should move toward the target, so stop_gradient treats the target as a fixed number when differentiating."}]},{"id":"frontier-2b","title":"Q-learning & DQN","part":2,"icon":"trophy","lab":"colabs/summer_schools/intro_to_reinforcement_learning.ipynb","goal":"Apply them to harder, hands-on questions.","steps":[{"type":"order","level":2,"prompt":"Order one Q-learning step.","items":["Observe state s and choose action a","Receive reward r and next state s′","Form the target r + γ·max Q(s′, a′)","Compute the TD error: target − Q(s, a)","Move Q(s, a) by step size × TD error"],"explain":"Act, observe the outcome, build a bootstrapped target, measure the error, then update only the Q-value of the action actually taken."},{"type":"mcq","level":2,"prompt":"Why does DQN learn from random minibatches drawn from a replay buffer?","options":["It avoids computing any TD error","Consecutive steps are highly correlated","It lets the agent skip the environment entirely","It keeps the policy purely greedy"],"answer":1,"explain":"Back-to-back transitions are very similar, which destabilises training. Random samples from a buffer of past experience give more varied batches."},{"type":"mcq","level":2,"prompt":"What does the Bellman equation say about Q(s, a)?","options":["Sum of all past rewards this episode","Probability of picking action a in s","Average of Q over every possible action","Immediate reward + discounted next value"],"answer":3,"explain":"Q(s, a) = r(s, a) + γ·Σ P(s′|s, a)·V(s′): what you get now, plus the discounted value of where you land."},{"type":"tf","level":2,"prompt":"DQN's target network is updated at every gradient step, exactly like the online network.","answer":false,"explain":"The target network copies the online weights only periodically, every 10 learner steps in the notebook, which keeps the TD targets stable."},{"type":"mcq","level":3,"prompt":"Q(s, a) = 0.5, r = 1, γ = 0.9 and maxₐ′ Q(s′, a′) = 0.2. What is the TD error δ?","options":["0.7","1.18","0.68","0.32"],"answer":2,"explain":"δ = r + γ·max Q(s′, ·) − Q(s, a) = 1 + 0.9 × 0.2 − 0.5 = 1.18 − 0.5 = 0.68."},{"type":"mcq","level":3,"prompt":"Q(s, a) = 0.5 and the TD error is 0.68. With step size α = 0.1, what is Q(s, a) after the update?","options":["0.568","1.18","0.068","0.432"],"answer":0,"explain":"Q ← Q + α·δ = 0.5 + 0.1 × 0.68 = 0.568. The small step size moves Q only part of the way toward the target."},{"type":"cloze","level":3,"prompt":"Catch has 10 rows and 5 columns, so its tabular Q-table has ___ rows.","options":["50","150","250","15"],"answer":2,"explain":"A state pairs the paddle column (5 options) with the ball cell (10 × 5 = 50), so c·r·c = 5 × 10 × 5 = 250 rows, each holding 3 action values."}]},{"id":"frontier-3a","title":"Graphs as data in jraph","part":1,"icon":"graph","lab":"colabs/summer_schools/intro_to_graph_nets_tutorial_with_jraph.ipynb","goal":"Learn the ideas, then try the first checks.","steps":[{"type":"card","title":"Nodes, edges, direction","body":"A graph G = (V, E) is a set of nodes plus edges linking them. Undirected edges work both ways, like friendship; directed edges have a direction, like “A cites B”. A node's in-degree counts its incoming edges, its out-degree its outgoing ones, and its degree is their sum."},{"type":"card","title":"Three ways to store edges","body":"An edge list holds (u, v) pairs, one per edge u → v. An adjacency matrix A is |V| × |V| with A[u, v] = 1 when that edge exists. An adjacency list gives each node the set of nodes it points to. The toy graph's edges (0,1), (0,3), (1,2), (2,0), (3,0) give the list [{1, 3}, {2}, {0}, {0}]."},{"type":"card","title":"The GraphsTuple","body":"jraph stores graphs in a GraphsTuple. `nodes`, `edges` and `globals` hold features, and edge i runs from `senders[i]` to `receivers[i]`. `n_node` and `n_edge` have one entry per graph, so a single tuple can batch many graphs.","code":"feats = jnp.array([[0.], [2.], [4.], [6.]])\ngraph = jraph.GraphsTuple(\n    nodes=feats, edges=None, globals=None,\n    senders=jnp.array([0, 1, 2, 3, 0]),\n    receivers=jnp.array([1, 2, 0, 0, 3]),\n    n_node=jnp.array([4]),\n    n_edge=jnp.array([5]))"},{"type":"card","title":"Tasks and padding","body":"Node classification labels nodes (which instructor will a karate club member follow?). Graph classification labels whole graphs (is a MUTAG molecule mutagenic?). Link prediction asks whether an edge should exist (Cora citations). JAX recompiles for every new array shape, so batches are padded to the next power of two, plus a dummy graph that is masked out of the loss."},{"type":"tf","level":1,"prompt":"A citation network is most naturally modelled as an undirected graph.","answer":false,"explain":"“A cites B” does not imply “B cites A”, so citations are directed. Mutual relationships such as friendship suit undirected graphs."},{"type":"match","level":1,"prompt":"Match each GraphsTuple field to what it stores.","pairs":[["`nodes`","Feature array with one row per node"],["`edges`","Feature array with one row per edge"],["`globals`","Features describing the whole graph"],["`senders`","Source node index of each edge"],["`n_edge`","Number of edges in each graph"]],"explain":"Features live in nodes, edges and globals; senders and receivers encode structure; n_node and n_edge split a batch into graphs."},{"type":"mcq","level":1,"prompt":"Predicting whether a molecule is mutagenic is which kind of task?","options":["Node classification","Link prediction","Graph classification","Density estimation"],"answer":2,"explain":"One label belongs to the whole molecule, so it is graph classification. In MUTAG, nodes are atoms and edges are bonds."},{"type":"cloze","level":1,"prompt":"An adjacency matrix for a graph with |V| nodes has shape ___.","options":["|E| × 2","|V| × |E|","|V| × 1","|V| × |V|"],"answer":3,"explain":"Entry A[u, v] records whether an edge goes from u to v, so there is one row and one column per node."},{"type":"mcq","level":2,"prompt":"Toy graph edges: 0→1, 0→3, 1→2, 2→0, 3→0. What is node 0's in-degree?","options":["1","2","3","4"],"answer":1,"explain":"Two edges point into node 0, from nodes 2 and 3. Node 0 also has out-degree 2, so its total degree is 4."},{"type":"cloze","level":2,"prompt":"In a GraphsTuple, edge i goes from `senders[i]` to `___[i]`.","options":["nodes","edges","receivers","globals"],"answer":2,"explain":"Edges are two aligned index arrays: senders hold source nodes and receivers hold destination nodes, one entry per edge."},{"type":"mcq","level":2,"prompt":"Which edge is NOT in this graph?","code":"senders   = jnp.array([0, 1, 2, 3, 0])\nreceivers = jnp.array([1, 2, 0, 0, 3])","options":["3 → 0","0 → 3","2 → 0","1 → 0"],"answer":3,"explain":"Pair senders[i] with receivers[i]: 0→1, 1→2, 2→0, 3→0, 0→3. Node 1 points to node 2, never to node 0."}]},{"id":"frontier-3b","title":"Graphs as data in jraph","part":2,"icon":"graph","lab":"colabs/summer_schools/intro_to_graph_nets_tutorial_with_jraph.ipynb","goal":"Apply them to harder, hands-on questions.","steps":[{"type":"mcq","level":2,"prompt":"One GraphsTuple batches 3 graphs. What is the length of `n_node`?","options":["3","1","The total node count","The largest graph's size"],"answer":0,"explain":"n_node stores one node count per graph, so its length equals the number of graphs in the batch: 3."},{"type":"tf","level":2,"prompt":"Padding graphs to a few fixed sizes speeds up training because JAX recompiles for every new array shape.","answer":true,"explain":"jit caches compiled programs per shape. With padding, many graphs share the same shapes, so compilation is paid only a few times."},{"type":"mcq","level":2,"prompt":"Karate club nodes get the features `jnp.eye(34)`. What is each node's feature vector?","options":["Its degree, as a single number","A one-hot vector marking its own index","A learned 34-dimensional embedding vector","Its instructor label"],"answer":1,"explain":"Row i of the 34 × 34 identity matrix is 1 at position i and 0 elsewhere, so each node is identified only by its index."},{"type":"mcq","level":2,"prompt":"In Cora link prediction, what are the “negative” examples?","options":["Edges with negative feature values","Edges pointing back in time","Node pairs with no edge between them","Edges held out for the test set"],"answer":2,"explain":"The model must separate real citations (positives) from unlinked pairs; training negatives are sampled afresh each epoch."},{"type":"mcq","level":3,"prompt":"Same edges. In the adjacency matrix with rows as sources, what is node 0's row?","options":["[0, 1, 0, 1]","[0, 0, 1, 1]","[1, 0, 1, 0]","[0, 1, 1, 1]"],"answer":0,"explain":"Node 0 sends edges to nodes 1 and 3, so A[0, 1] = A[0, 3] = 1. Column 0, [0, 0, 1, 1], would instead list who points to node 0."},{"type":"order","level":3,"prompt":"Order the padding steps for a batch with 7 nodes across 3 graphs.","items":["Total the nodes in the batch: 7","Round up to a power of two: 8","Add one node for a dummy graph: 9","Mask the dummy graph out of the loss"],"explain":"Rounding to powers of two limits how many shapes JAX compiles; the extra dummy graph absorbs the padding and is masked away."},{"type":"cloze","level":3,"prompt":"`pad_graph_to_nearest_power_of_two` pads a batch of 13 nodes to ___ nodes.","options":["16","17","13","32"],"answer":1,"explain":"The next power of two at or above 13 is 16, and one more node is added for the padding graph: 16 + 1 = 17."}]},{"id":"frontier-4a","title":"Message passing: GCN & GAT","part":1,"icon":"chain","lab":"colabs/summer_schools/intro_to_graph_nets_tutorial_with_jraph.ipynb","goal":"Learn the ideas, then try the first checks.","steps":[{"type":"card","title":"A GCN layer in two steps","body":"First, update each node's features, for example with an MLP; the result is the message that node will send. Second, every node aggregates the messages arriving along its incoming edges, by sum, mean or max. Each neighbour is treated the same, so unlike a CNN filter the layer ignores neighbour order and handles any number of neighbours."},{"type":"card","title":"Aggregating with segment_sum","body":"`nodes[senders]` gathers one message per edge, and `jax.ops.segment_sum` adds them up per receiving node. On the toy graph, features [0, 2, 4, 6] become [10, 0, 2, 0]: node 0 receives 4 + 6 from nodes 2 and 3, and node 2 gets 2 from node 1.","code":"msgs = nodes[senders]\nnew_nodes = jax.ops.segment_sum(\n    msgs, receivers, num_segments=4)"},{"type":"card","title":"Self-edges, scaling, depth","body":"Self-edges let a node include its own features in the sum. Degree normalisation, the symmetric D^(−1/2)·A·D^(−1/2) of Kipf and Welling, stops busy nodes from producing huge values that destabilise training. One layer only sees direct neighbours; stacking k layers spreads information k hops, much like stacked CNN layers widen their view."},{"type":"card","title":"Attention, graphs and links","body":"GCN weighs all neighbours equally, which can blur nodes that share neighbours. A GAT layer learns the weights: it scores each edge, eᵢⱼ = LeakyReLU(a·[Whᵢ ‖ Whⱼ]), softmaxes the scores over each node's neighbours into αᵢⱼ, and sums αᵢⱼ·Whⱼ. For whole graphs, a global update yields one vector per graph; for links, a dot product hᵢ·hⱼ scores the edge."},{"type":"order","level":1,"prompt":"Order the steps of a simple GCN layer.","items":["Transform each node's features, e.g. an MLP","Gather a message along each edge","Sum the messages arriving at each node","Store the sums as the new node features"],"explain":"Update first, then pass messages: gather by senders, aggregate by receivers with segment_sum, and write the result back into the graph."},{"type":"cloze","level":2,"prompt":"Complete the aggregation so messages are summed per destination node.","code":"agg = jax.ops.segment_sum(\n    nodes[senders], ___,\n    num_segments=num_nodes)","options":["senders","receivers","n_edge","nodes"],"answer":1,"explain":"segment_sum adds up rows that share a segment id. Using receivers as the ids collects every message at the node it points to."},{"type":"tf","level":2,"prompt":"Like a CNN filter, a GCN layer learns a separate weight for each neighbour position.","answer":false,"explain":"A GCN applies the same weights to every neighbour and aggregates with a fixed sum or mean, so it ignores neighbour order and handles any neighbourhood size."},{"type":"mcq","level":2,"prompt":"How many stacked GCN layers does a node need to receive information from nodes 3 hops away?","options":["1","3","2","9"],"answer":1,"explain":"Each layer passes messages one hop. After k layers a node's features reflect its k-hop neighbourhood, so 3 hops need 3 layers."},{"type":"mcq","level":2,"prompt":"Why normalise GCN aggregation by node degree?","options":["It lets the layer learn per-neighbour weights","It turns the graph undirected","It removes the self-edges","High-degree nodes would get outsized sums"],"answer":3,"explain":"Summing over many neighbours inflates busy nodes' features, risking exploding or vanishing gradients. Dividing by square roots of degrees keeps scales comparable."},{"type":"cloze","level":2,"prompt":"GAT turns raw edge scores eᵢⱼ into weights αᵢⱼ with a ___ over each node's neighbours.","options":["softmax","segment_sum","ReLU","dot product"],"answer":0,"explain":"The softmax exponentiates the scores and divides by their sum over the neighbourhood, so each node's attention weights are positive and add up to 1."},{"type":"tf","level":2,"prompt":"In the karate club task, the loss uses only the known labels of the two instructors.","answer":true,"explain":"The loss is the negative log-likelihood of nodes 0 and 33 only. The other 32 labels are used just to measure accuracy, about 0.91 with the GCN."}]},{"id":"frontier-4b","title":"Message passing: GCN & GAT","part":2,"icon":"chain","lab":"colabs/summer_schools/intro_to_graph_nets_tutorial_with_jraph.ipynb","goal":"Apply them to harder, hands-on questions.","steps":[{"type":"match","level":2,"prompt":"Match each building block to its role.","pairs":[["update_node_fn","Transforms node features, e.g. with an MLP"],["segment_sum","Adds up messages arriving at each node"],["Self-edge","Lets a node include its own features"],["Attention weight α","Learned importance of a neighbour"],["Global update","Produces one vector per whole graph"]],"explain":"GCN combines update_node_fn, segment_sum and self-edges; GAT adds learned attention; a GraphNetwork's global update powers graph classification."},{"type":"mcq","level":2,"prompt":"In the Cora link-prediction model, how is a candidate edge (i, j) scored?","options":["Sum of the two nodes' degrees","Dot product of node embeddings hᵢ·hⱼ","Attention weight αᵢⱼ from a GAT","Number of shared neighbours"],"answer":1,"explain":"A GNN encoder produces node embeddings and the decoder is simply their dot product; a sigmoid turns it into a score, evaluated with ROC-AUC."},{"type":"mcq","level":2,"prompt":"Why does the MUTAG loss multiply by `jraph.get_graph_padding_mask`?","options":["To drop atoms that have no bonds attached","To balance the two output classes","To hide test graphs while training","To ignore the dummy graph added by padding"],"answer":3,"explain":"Padding appends a fake graph so shapes stay fixed. The mask zeroes its contribution, so only real molecules affect the loss and accuracy."},{"type":"mcq","level":3,"prompt":"Toy graph: features [0, 2, 4, 6]; edges 0→1, 1→2, 2→0, 3→0, 0→3. With an identity update and sum aggregation, what does node 0 get?","options":["10","6","0","12"],"answer":0,"explain":"Node 0's incoming edges come from nodes 2 and 3, with features 4 and 6, so it receives 4 + 6 = 10. Its own feature counts only with self-edges."},{"type":"mcq","level":3,"prompt":"Same toy graph, now with self-edges added (sum, no normalisation). What is node 2's new feature?","options":["2","4","6","8"],"answer":2,"explain":"Node 2 receives node 1's feature, 2, plus its own feature, 4, through the self-edge: 2 + 4 = 6."},{"type":"mcq","level":3,"prompt":"A node has two neighbours with attention scores e = [0, ln 3]. What are the attention weights α?","options":["[0, 1]","[0.5, 0.5]","[0.25, 0.75]","[0.33, 0.67]"],"answer":2,"explain":"exp(0) = 1 and exp(ln 3) = 3, so the softmax gives 1/4 and 3/4. The second neighbour's message counts three times as much."},{"type":"cloze","level":3,"prompt":"Each gathered row holds 64 features. Fill in the axis that yields one score per edge.","code":"def decode(h, senders, receivers):\n  return jnp.sum(\n      h[senders] * h[receivers],\n      axis=___)","options":["1","0","2","None"],"answer":0,"explain":"h[senders] has shape (num_edges, 64). Summing the elementwise product over axis 1 collapses the features into one dot product per edge."}]}]}]}],"daily":[{"type":"mcq","topic":"f1","prompt":"You ask a chat assistant the same question twice and get two different answers. What is the most likely reason?","options":["It has a fault, so one of the two answers must be wrong","It picks each word with a bit of chance, by design","It was retrained in the time between your two questions","It ran out of stored answers and had to write a new one"],"answer":1,"explain":"A chat assistant builds its reply one word at a time, and each word is drawn with a little chance, like spinning a weighted wheel. So the wording varies from run to run. That is by design."},{"type":"tf","topic":"f2","prompt":"Before an AI model does anything with your message, every word in it is turned into numbers.","answer":true,"labels":{"true":"Fact","false":"Myth"},"explain":"A model can only work with numbers. Your text is cut into pieces, and each piece is swapped for an ID number before the model does anything else with it."},{"type":"mcq","topic":"f3","prompt":"A student memorises last year's exam answers, then fails this year's paper. Which AI problem does this resemble?","options":["A model that was built with too few settings inside","A model that was stopped before it finished practising","A model that memorised its examples, not the pattern","A model that forgot its examples soon after training"],"answer":2,"explain":"A model can learn its practice examples by heart instead of the pattern behind them. It then shines on what it has seen and stumbles on anything new. Builders call this overfitting."},{"type":"tf","topic":"f4","prompt":"While writing a reply, a model can look back at every word so far but cannot peek ahead at words it has not written yet.","answer":true,"labels":{"true":"Fact","false":"Myth"},"explain":"It writes one word at a time. Each new word is chosen by looking back over everything already on the page. There is no finished draft tucked away for it to read ahead from."},{"type":"mcq","topic":"f5","prompt":"Which prompt is most likely to get a usable first draft of a product caption?","options":["Caption for oat milk launch: busy parents, warm tone, 20 words","Write an amazing, viral, award-winning caption for our oat milk","Write a caption for our new oat milk, and make it good","Please write the best caption you can, this really matters"],"answer":0,"explain":"The model only knows what is on the page. Naming the audience, tone and length gives it something to aim at. Praise words like 'amazing' or 'viral' add no information."},{"t
