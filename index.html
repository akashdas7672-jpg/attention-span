oom swaps your coat for a numbered ticket. A model does the same with text. Every token is swapped for an ID number from a fixed list, because the model can only work with numbers. To the model, your sentence is a row of numbers."},{"type":"order","prompt":"Put the journey of your message in order.","items":["You type a sentence","It is split into tokens","Each token is swapped for an ID number","The model works on the numbers"],"explain":"Text is first cut into tokens, then each token is swapped for its ID number. Only then can the model start, because numbers are all it can work with."},{"type":"mcq","prompt":"You paste a 300-word brief into a chat assistant. What does the model actually work on?","options":["A picture of the text on your screen","The letters, fed in one at a time","A row of ID numbers, one per token"],"answer":2,"explain":"Your brief is split into tokens and each token is swapped for its ID number, like coats for cloakroom tickets. The model only ever handles the numbers."}],"takeaway":"A model reads tokens, common words and pieces of words, and handles each one as a number.","tryit":"Pick the longest word in your last email and guess how a model might split it into pieces."},{"id":"f2-2","title":"Why pieces, not words","icon":"token","goal":"Explain why models read pieces instead of whole words.","steps":[{"type":"card","title":"No word list is ever finished","body":"A dictionary is out of date the day it is printed. New names, slang, typos and hashtags appear every day. If a model knew only the whole words on a fixed list, anything missing from that list would be a blank to it."},{"type":"mcq","prompt":"Why can a fixed list of whole words never be complete?","options":["New names, slang and hashtags keep coming","Computers cannot store such a long word list","Most words are too long to fit on a list"],"answer":0,"explain":"Language keeps growing. Every day brings new names, slang, typos and hashtags that no list written yesterday could include."},{"type":"sort","prompt":"A list of whole words was printed ten years ago. Is each of these on it?","buckets":["On the list","Missing"],"items":[["because",0],["A hashtag coined this morning",1],["table",0],["A typo such as 'tommorow'",1],["weather",0],["A brand name invented last week",1]],"explain":"Everyday words were around ten years ago. New hashtags, fresh brand names and one-off typos were not, so a list of whole words misses them."},{"type":"card","title":"A small box of bricks","body":"With one box of toy bricks you can build almost anything. Tokens, the pieces of words a model reads, are its bricks. With a fixed set, often tens of thousands, it can spell just about any word, even one invented this morning."},{"type":"mcq","prompt":"How does a model read a word it has never seen before?","options":["It skips the word and carries on reading","It builds the word from pieces it knows","It looks the word up in a dictionary"],"answer":1,"explain":"Like building a new shape from the same box of bricks, the model spells an unfamiliar word out of smaller pieces it already has."},{"type":"tf","prompt":"A model with a fixed set of tokens can still read a hashtag that was invented today.","labels":{"true":"Fact","false":"Myth"},"answer":true,"explain":"It spells the new hashtag from smaller pieces it already has. The set of pieces is fixed, but what can be built from them is not."},{"type":"card","title":"Language is lopsided","body":"Think of your wardrobe: a few favourites are worn most days, and most items hardly ever. Words are like that. A handful such as 'the', 'and' and 'of' do a huge share of the work, and most words are rare. So the common ones earn a token of their own."},{"type":"cloze","prompt":"A handful of words such as 'the' turn up constantly, while most words are ___.","options":["short","new","rare"],"answer":2,"explain":"Language is lopsided, like a wardrobe with a few favourites. A few small words appear in nearly every sentence, while most of the dictionary is hardly ever used."},{"type":"mcq","prompt":"Which word would appear most often in a year of your company's emails?","options":["campaign","deadline","budget","the"],"answer":3,"explain":"Small words such as 'the' appear in nearly every sentence, whatever the subject. Work words like 'budget' only turn up when that topic does."}],"takeaway":"A fixed set of pieces can spell almost any word, and the most common words get a piece to themselves.","tryit":"Count how often 'the' appears in the last email you wrote, then find a word you used only once."},{"id":"f2-3","title":"The map of meaning","icon":"vector","goal":"Picture how a model places similar meanings side by side.","steps":[{"type":"card","title":"Coordinates for meaning","body":"Two numbers, across and up, pin any spot on a map. A model does this for meaning. Each token, a word or piece of a word, gets its own long list of numbers that works like coordinates. That list is called an **embedding**."},{"type":"cloze","prompt":"A token's long list of numbers, its coordinates for meaning, is called an ___.","options":["embedding","estimate","outline"],"answer":0,"explain":"An embedding is a token's set of coordinates: a long list of numbers that gives it a position on a map of meaning."},{"type":"tf","prompt":"To a model, the meaning of 'coffee' is held as a long list of numbers.","answer":true,"explain":"That list is the embedding for 'coffee'. Its numbers work like coordinates, giving the word a position on the map of meaning."},{"type":"card","title":"Neighbours mean similar things","body":"On this map, things with similar meaning sit close together and unrelated things sit far apart. Nobody arranged it by hand: the model learned it. Tap a word to see its neighbours.","play":{"kind":"map","points":[["trainers",18,22,"shoes"],["sneakers",30,16,"shoes"],["boots",24,36,"shoes"],["coffee",72,28,"drinks"],["espresso",84,20,"drinks"],["tea",78,42,"drinks"],["invoice",40,76,"money"],["budget",54,82,"money"],["payment",46,64,"money"]]}},{"type":"mcq","prompt":"On the map of meaning, which words sit close together?","options":["Words with similar spellings","Words of the same length","Words with similar meanings"],"answer":2,"explain":"Position on the map reflects meaning. 'Trainers' and 'sneakers' sit side by side because they mean nearly the same thing, not because of their letters."},{"type":"match","prompt":"Match each word to its closest neighbour on the map of meaning.","pairs":[["sneakers","trainers"],["coffee","espresso"],["invoice","payment"],["doctor","nurse"]],"explain":"Each pair belongs to the same family of meaning, so its two words sit close together on the map, far from the other pairs."},{"type":"card","title":"Search by meaning","body":"This is how a good search finds 'trainers' when you typed 'running shoes'. The two look nothing alike on the page, but they sit close together on the map of meaning. The search matches what you meant, not the letters you typed."},{"type":"tf","prompt":"A search that uses the map of meaning can only find the exact words you typed.","answer":false,"explain":"It compares positions on the map, not letters. That is how 'running shoes' can bring back 'trainers', which shares the meaning but not the spelling."},{"type":"mcq","prompt":"You search an image library for 'happy kids outdoors'. Which tag could a meaning-based search also find?","options":["happy hour drinks offer","children laughing in a park","kids' menu at an indoor café"],"answer":1,"explain":"'Children laughing in a park' means almost the same thing, so it sits close by on the map. The other two share a word with your search but not its meaning."}],"takeaway":"An embedding places each token on a map where similar meanings sit close together.","tryit":"Search a shopping site for 'something to keep coffee hot' and see whether it understands what you meant."},{"id":"f2-4","title":"Its working memory","icon":"memory","goal":"Predict what a model can see, and what it has forgotten.","steps":[{"type":"card","title":"The desk in front of it","body":"Picture a desk. Whatever is on it, the model can read: your message, the chat so far, any files you added. Anything not on the desk is out of sight. That desk is called the **context window**: everything the model can see at once."},{"type":"sort","prompt":"Is each of these inside the model's context window?","buckets":["In view","Out of view"],"items":[["The message you just typed",0],["An email you never pasted in",1],["Earlier messages in this chat",0],["The brief that is still in your head",1],["A file you attached to this chat",0],["A meeting nobody told it about",1]],"explain":"The context window holds your message, the chat so far and any files you added. Anything you have not put in front of the model stays out of view."},{"type":"mcq","prompt":"You type 'make it punchier' but forget to paste the copy. Why can the assistant not help?","options":["It does not know the word 'punchier'","The copy is not in its context window","It needs a few days to learn your style"],"answer":1,"explain":"The model can only work with what is in front of it. The copy never reached its context window, so there is nothing to make punchier."},{"type":"card","title":"The desk has an edge","body":"No desk is endless. A context window is measured in tokens, the pieces of words a model reads, and it has a limit. In a very long chat, the earliest parts can slide off the edge, and the model no longer sees them."},{"type":"cloze","prompt":"In a very long chat, the ___ parts can fall out of the context window.","options":["earliest","latest","shortest"],"answer":0,"explain":"The window has a limit, counted in tokens. When a chat outgrows it, the oldest parts are the ones that drop out of view."},{"type":"tf","prompt":"Two hours into a chat, the assistant ignores a rule you set at the start. The rule may have slipped out of its context window.","answer":true,"explain":"A long chat can outgrow the window, and the earliest parts go first. Repeating a key instruction puts it back in view."},{"type":"card","title":"A fresh start every chat","body":"Imagine a temp who arrives each morning with no handover notes. A model is like that. It has no memory between separate chats unless the product adds one. So when you open a new chat, give the brief again."},{"type":"tf","prompt":"A model automatically remembers everything you told it in last week's chat.","labels":{"true":"Fact","false":"Myth"},"answer":false,"explain":"Each new chat starts with an empty desk. Some products add a memory feature, but unless yours has one, last week's details are gone."},{"type":"match","prompt":"Match each situation to the best move.","pairs":[["Starting a new chat","Give the brief again"],["A very long chat","Repeat the key instructions"],["It needs a document","Paste it in or attach it"]],"explain":"A new chat starts blank, a long chat can lose its earliest parts, and a document only counts once it is inside the context window."}],"takeaway":"A model sees only what is in its context window, which is limited and starts empty in every new chat.","tryit":"Start your next chat by stating the audience, the goal and the tone, even if you gave them yesterday."},{"id":"f2-5","title":"Messy in, messy out","icon":"filter","goal":"Give a model tidy input and explain why tokens are the meter.","steps":[{"type":"card","title":"It learns whatever it is fed","body":"A sponge soaks up whatever you dip it in, clean or dirty. A model is the same with text. It learns from whatever it is fed, including typos, junk and repeats. So the people who build models spend a lot of time cleaning text first."},{"type":"mcq","prompt":"Why do the people who build models spend so much time cleaning text?","options":["A model learns from everything, junk too","Clean text makes a model use far less power","A model stops working if it meets a typo"],"answer":0,"explain":"Like a sponge, a model soaks up patterns from everything it is shown. Feed it junk and repeats, and it learns those as well."},{"type":"sort","prompt":"A team is preparing text for a model to learn from. Keep it or clean it up?","buckets":["Keep","Clean up"],"items":[["Well-edited articles",0],["The same page copied 500 times",1],["Clear product descriptions",0],["Leftover web page code",1],["Carefully written guides",0],["Garbled, half-loaded pages",1]],"explain":"Good writing is worth learning from. Repeats, leftover code and garbled pages would teach the model bad habits, so they are cleaned out first."},{"type":"card","title":"The same goes for your prompt","body":"Hand a colleague a crumpled pile of notes and you get a confused reply. Hand them one tidy page and you get a useful one. Your prompt, the text you give a model, works the same way. Clear, tidy input gets better output than a pasted mess."},{"type":"tf","prompt":"Pasting in everything you have, unsorted, gets the best answer because the model works out what matters.","labels":{"true":"Fact","false":"Myth"},"answer":false,"explain":"A pasted mess buries the useful parts among the clutter. Clear, tidy input gives the model less to trip over, so the output improves."},{"type":"mcq","prompt":"You want a summary of a long email thread. Which input will work best?","options":["The whole thread pasted in twice, to be safe","The key emails in order, signatures removed","A screenshot of the inbox subject lines"],"answer":1,"explain":"Ordered text with the clutter removed gives the model the clearest picture. Repeats add noise, and subject lines alone leave out what was said."},{"type":"card","title":"Tokens are the meter","body":"A taxi meter counts distance. AI tools count tokens, the pieces of words a model reads and writes. Usage limits and costs are usually counted in tokens going in, what you send, and tokens coming out, what it writes back."},{"type":"cloze","prompt":"Usage limits and costs are usually counted in ___ going in and coming out.","options":["minutes","questions","tokens"],"answer":2,"explain":"Tokens are the meter. Everything you send and everything the model writes back is counted in these pieces of words."},{"type":"order","prompt":"Order these jobs from fewest tokens used to most.","items":["A one-line question, a one-word answer","A page of notes in, a paragraph back","A 50-page report in, a long summary back"],"explain":"The meter counts everything going in and coming out. More text either way means more tokens, so the long report with a long summary uses the most."}],"takeaway":"Clean, clear input gets better output, and everything in and out is counted in tokens.","tryit":"Tidy your next prompt before you send it: cut repeats, old signatures and anything off-topic."}]},{"id":"f3","title":"How it learns","blurb":"Dials, guesses and a lot of practice.","sessions":[{"id":"f3-1","title":"A machine made of dials","icon":"tune","goal":"Explain what the dials inside a model are and who sets them.","steps":[{"type":"card","title":"Picture a mixing desk","body":"A sound engineer's mixing desk is covered in dials. Turn them and the same song sounds different. The model inside a chat assistant is like that desk. It is full of numbers that work like dials. Their proper name is **parameters**: the adjustable numbers inside a model."},{"type":"cloze","prompt":"The adjustable numbers inside an AI model are called ___.","options":["tokens","parameters","instructions"],"answer":1,"explain":"Parameters are the numbers inside a model that can be turned up or down, like dials on a mixing desk. Tokens are the pieces of words a model reads."},{"type":"mcq","prompt":"A colleague asks what is actually inside an AI model. Which answer is closest?","options":["A library of saved web pages","A list of rules typed in by hand","A set of adjustable numbers"],"answer":2,"explain":"A model is made of numbers that work like dials. It does not keep copies of web pages, and nobody wrote it a rulebook."},{"type":"card","title":"The settings decide the sound","body":"On a mixing desk, the dial settings decide what you hear. In a model, the dial settings decide what comes out: which next word looks likely and which looks odd. A desk has a few dozen dials. A large model has billions."},{"type":"tf","prompt":"A large AI model can have billions of dials inside it.","answer":true,"labels":{"true":"Fact","false":"Myth"},"explain":"A mixing desk has a few dozen dials. A large model has billions, and the way they are set decides what it says."},{"type":"match","prompt":"Match each part of the mixing desk to its partner in an AI model.","pairs":[["The whole desk","The model"],["One dial","One number inside the model"],["The sound you hear","The words that come out"]],"explain":"The desk is the model, each dial is one of its numbers, and the sound is its answer. Change the settings and the result changes."},{"type":"card","title":"Nobody turns them by hand","body":"No person could set billions of dials one by one, so nobody tries. The dials start at random settings. Then the practice run called training turns them, a little at a time, until the model's guesses get good. People design the practice. The practice sets the dials."},{"type":"tf","prompt":"Engineers type in the right setting for each dial inside a model.","answer":false,"labels":{"true":"Fact","false":"Myth"},"explain":"There are far too many dials for that. They start at random settings, and training turns them a little at a time."},{"type":"order","prompt":"Put the story of a model's dials in order.","items":["The dials start at random settings","Training turns them a little at a time","The model's guesses get good"],"explain":"A new model has random settings, so its guesses are poor. Training adjusts the dials bit by bit, and the guesses improve as it goes."}],"takeaway":"A model is a machine with billions of dials, called parameters, and training sets every one of them.","tryit":"Slide your phone's screen brightness up and down. That is one dial. Now picture a machine with billions of them."},{"id":"f3-2","title":"Guess, check, nudge","icon":"target","goal":"Describe the guess, check, nudge loop that trains a model.","steps":[{"type":"card","title":"Training is a loop","body":"Getting a shower right is a loop: feel the water, nudge the tap, repeat. Training is the same loop. The model guesses the next word of a sentence, we measure how wrong it was (its **error**), and every dial inside the model is nudged to be slightly less wrong."},{"type":"order","prompt":"Put one round of training in order.","items":["The model makes a guess","We measure how wrong the guess was","Every dial gets a small nudge","The model guesses again"],"explain":"Guess, check, nudge, repeat. The check comes before the nudge because you need to know how you missed before you can correct it."},{"type":"mcq","prompt":"In training, a model reads \"Twinkle, twinkle, little\" and guesses \"sandwich\". The real word was \"star\". What happens next?","options":["Training stops and starts again from zero","Its dials are nudged so \"star\" scores higher","The word \"sandwich\" is erased from the model"],"answer":1,"explain":"The miss is measured, then every dial is nudged a little so that \"star\" looks more likely next time. Nothing is deleted and nothing restarts."},{"type":"card","title":"You be the trainer","body":"Each dot is one week on a brand's account. Drag the slider until the line runs through the dots and the error bar shrinks. Each drag is a nudge; the bar is the check.","play":{"kind":"fit","x":"Posts per week","y":"New followers"}},{"type":"cloze","prompt":"In the trainer, the closer your line sits to the dots, the ___ the error.","options":["bigger","slower","smaller"],"answer":2,"explain":"Error measures how far the guesses are from the real answers. A line that runs through the dots misses by less, so the error shrinks."},{"type":"mcq","prompt":"Your line sits well above every dot and the error bar is long. What would a good trainer do next?","options":["Nudge the line down and check again","Keep the line and delete some of the dots","Stop, because the error cannot be changed"],"answer":0,"explain":"A long error bar means the guesses are far off. A trainer nudges, checks whether the error shrank, and repeats: the same loop a model runs in training."},{"type":"card","title":"Downhill in the fog","body":"Picture walking down a hill in thick fog, where lower ground means a smaller error. You cannot see the bottom, only feel which way the ground slopes, so you take one careful step down. Training does this automatically. Each nudge is tiny, and millions add up."},{"type":"tf","prompt":"Training gets a model right in one big adjustment.","answer":false,"labels":{"true":"Fact","false":"Myth"},"explain":"Each nudge is tiny, like one careful step downhill in fog. It takes millions of them to turn random dials into a useful model."},{"type":"match","prompt":"Match each part of the foggy walk to its partner in training.","pairs":[["Height on the hill","How wrong the model is"],["One careful step","One tiny nudge to the dials"],["The bottom of the hill","Where the error is as small as it gets"]],"explain":"Height stands for error, so walking downhill means getting less wrong. Each step is one small nudge, and the bottom is where the guesses are at their best."}],"takeaway":"Training is guess, check, nudge, repeated millions of times, each tiny nudge leaving the model slightly less wrong.","tryit":"Open the Lab tab, train a Tiny Brain and watch its error fall as the practice rounds add up."},{"id":"f3-3","title":"Memorising vs understanding","icon":"brain","goal":"Spot a model that memorised its examples instead of learning from them.","steps":[{"type":"card","title":"The student who memorised","body":"A student memorises last year's exam answers. They ace that paper, then fail when the questions change. A model can make the same mistake with its practice examples. This is called **overfitting**: memorising the examples instead of learning the pattern."},{"type":"tf","prompt":"Overfitting means a model has memorised its practice examples rather than learning the pattern behind them.","answer":true,"explain":"Like the student with last year's answers, an overfitted model looks good on what it practised and stumbles on anything new."},{"type":"mcq","prompt":"A model writes perfect captions for the 200 products it practised on, then nonsense for a new one. What is the likely problem?","options":["It memorised its practice examples","It has run out of working memory","The new product's name is far too long"],"answer":0,"explain":"Perfect on the practice set and poor on anything new is the classic sign of overfitting. It learned those 200 by heart, not how to write a caption."},{"type":"card","title":"Hold some examples back","body":"A fair exam uses questions the student has never seen. Model builders do the same. Before training, they set some examples aside and never show them to the model. Afterwards they test it on those. A good score on unseen examples means it learned the pattern."},{"type":"order","prompt":"Put the steps of a fair test in order.","items":["Set some examples aside","Train the model on the rest","Test it on the examples set aside"],"explain":"The held-back examples stay hidden during training. Because the model has never seen them, they show whether it learned the pattern or only memorised."},{"type":"mcq","prompt":"A tool scores 99% on its practice examples and 60% on examples it has never seen. Which score tells you how it will do on your work?","options":["The 99%","The 60%","The average of the two"],"answer":1,"explain":"Your work is new to the tool, so the score on unseen examples is the honest one. The big gap between the two is a sign of memorising."},{"type":"card","title":"Three cures for memorising","body":"There are three common cures. Give the model more varied examples, so there is too much to learn by heart. Use a simpler model with fewer dials, so it has less room to memorise. Or stop the practice sooner, before memorising sets in."},{"type":"match","prompt":"Match each cure for overfitting to the reason it helps.","pairs":[["More varied examples","Too much to learn by heart"],["A simpler model","Less room to memorise"],["Stopping sooner","Practice ends before memorising sets in"]],"explain":"All three push the model toward the pattern: more to learn than it can memorise, less space to memorise in, or less time to do it."},{"type":"mcq","prompt":"A headline-writing model has memorised 50 old headlines and keeps repeating them. Which fix is most likely to help?","options":["Practise longer on the same 50","Add many more dials to the model","Train on more varied headlines"],"answer":2,"explain":"With more varied examples there is too much to learn by heart, so it has to pick up what makes a headline work. The other two give memorising more room."}],"takeaway":"A model that only memorises fails on anything new, so it is tested on examples it has never seen.","tryit":"Ask one question about the next impressive AI demo you see: was it tested on examples it had never seen?"},{"id":"f3-4","title":"Signal vs noise","icon":"filter","goal":"Tell a real pattern from a coincidence in a set of examples.","steps":[{"type":"card","title":"Patterns and coincidences","body":"Ice cream sells more on hot days. That is a real pattern, and it will hold next summer. One Tuesday, sales spiked because a tour bus happened to stop outside. That is a coincidence, with no reason to repeat. Real patterns are called **signal**. Coincidences are called noise."},{"type":"cloze","prompt":"A real pattern, one that will hold next time, is called ___.","options":["signal","an error","a fluke"],"answer":0,"explain":"Signal is the part of the data that will repeat, like ice cream selling on hot days. Noise is the part that happened by chance."},{"type":"sort","prompt":"Signal or noise? Sort each observation.","buckets":["Signal","Noise"],"items":[["Umbrellas sell more on rainy days",0],["Sales rose the week the office got a new kettle",1],["Gym sign-ups jump every January",0],["An ad with a typo got the most clicks, once",1],["Toy searches climb before the holidays",0]],"explain":"Rain, January and the holidays come round again and have a clear link to what people buy. The kettle and the typo were one-off flukes."},{"type":"card","title":"Too much freedom","body":"Give a model lots of dials and only a few examples, and it has room to store everything it sees, flukes included. If one practice sentence contains a typo, it may learn the typo as if it were a rule. Too much freedom means learning the noise too."},{"type":"tf","prompt":"A model with too much freedom can learn coincidences as if they were real patterns.","answer":true,"labels":{"true":"Fact","false":"Myth"},"explain":"With lots of dials and few examples, a model has room to store every quirk it sees, so flukes get learned alongside the real pattern."},{"type":"mcq","prompt":"A model studied 20 winning ads. Three happened to have a blue background, and now it makes every ad blue. What has it learned?","options":["Signal: blue ads always win","Nothing: it picks colours at random","Noise: a fluke in a small set"],"answer":2,"explain":"Three blue ads out of 20 is a coincidence, not a rule. With so few examples, the model had the freedom to treat that fluke as a pattern."},{"type":"card","title":"One viral post is not a trend","body":"One post goes viral. Was it the topic, the timing or plain luck? From a single example you cannot tell. From a thousand posts you can: the flukes point in different directions and cancel out, while the real pattern keeps showing up. More examples make signal stand out."},{"type":"cloze","prompt":"With more examples, the coincidences tend to ___ and the real pattern stands out.","options":["cancel out","multiply","get stronger"],"answer":0,"explain":"Flukes pull in different directions, so across many examples they wash out. The real pattern points the same way each time, so it remains."},{"type":"mcq","prompt":"A client wants to rebuild the whole content plan around one post that went viral. What is the best advice?","options":["Copy that post exactly, every single week","Check whether similar posts also did well","Ignore results; they are always random"],"answer":1,"explain":"One viral post could be luck. If many similar posts also did well, you are looking at signal and can plan around it with more confidence."}],"takeaway":"Data mixes real patterns with coincidences, and plenty of varied examples is what lets the real patterns win.","tryit":"Look at your last ten posts or campaign results. Pick the stand-out and ask whether it would happen again or was a one-off."},{"id":"f3-5","title":"Layers of simple steps","icon":"layers","goal":"Explain what a neural network is and what deep learning means.","steps":[{"type":"card","title":"Many tiny units","body":"The dials sit inside a **neural network**: a web of tiny units. Each unit does one small sum. It takes in a few numbers, uses its dials to decide how much each counts, adds them up and passes the result on. One unit is simple. Millions together are not."},{"type":"mcq","prompt":"What does a single unit in a neural network do?","options":["Stores one whole sentence for later","Does a small sum and passes it on","Looks up one fact on the internet"],"answer":1,"explain":"Each unit takes in a few numbers, weighs them, adds them up and hands the result to the next units. That is all it does."},{"type":"tf","prompt":"Each unit in a neural network is clever enough to understand a sentence by itself.","answer":false,"labels":{"true":"Fact","false":"Myth"},"explain":"A single unit only does a small sum. The ability comes from millions of them working together, the way plain dots of colour add up to a photo."},{"type":"card","title":"Stacked in layers","body":"The units are arranged in layers, like stations on an assembly line. Each layer builds on the one before. With a photo, early layers pick out simple things such as edges and patches of colour. Later layers combine those into shapes, then into whole faces or logos."},{"type":"order","prompt":"A network looks at a photo. Put what its layers pick out in order, from the first layer to the last.","items":["Edges and patches of colour","Simple shapes","A whole face or logo"],"explain":"Early layers find simple things. Later layers combine them into richer ones, so the picture builds up from edges to shapes to whole objects."},{"type":"sort","prompt":"A network is learning to spot a brand's logo in photos. Early layer or later layer?","buckets":["Early layer","Later layer"],"items":[["Noticing a straight edge",0],["Recognising the full logo",1],["Noticing a patch of red",0],["Telling one brand's logo from another",1]],"explain":"Edges and colours are the simple patterns early layers pick up. Recognising a whole logo needs those pieces combined, which is the later layers' job."},{"type":"card","title":"What \"deep learning\" means","body":"You will hear the phrase **deep learning**. It sounds mysterious, but it simply means a neural network with many layers. Deep describes the stack, not the wisdom. The chat assistants you use are built this way."},{"type":"cloze","prompt":"The \"deep\" in deep learning refers to having many ___.","options":["examples","users","layers"],"answer":2,"explain":"A deep network is one with many layers stacked up. Each extra layer is another chance to combine simple patterns into richer ones."},{"type":"tf","prompt":"A sales deck says a tool \"uses deep learning\". That means the tool understands your industry deeply.","answer":false,"labels":{"true":"Fact","false":"Myth"},"explain":"Deep only describes the shape of the network: many layers stacked up. It says nothing about how well the tool knows your industry."}],"takeaway":"A neural network is many tiny units stacked in layers, and deep learning simply means there are many layers.","tryit":"Explain deep learning to a colleague in one sentence, using the word layers and nothing more technical."}]},{"id":"f4","title":"Paying attention","blurb":"The idea that made chat assistants possible.","sessions":[{"id":"f4-1","title":"The short-memory problem","icon":"chain","goal":"Explain why early text predictors kept losing the thread.","steps":[{"type":"card","title":"A few words of memory","body":"Tap the middle word suggestion on your phone keyboard again and again. Each word fits the one before, yet the sentence soon wanders off. Early text predictors worked like that. They looked only at the last few words, so they kept losing the thread."},{"type":"tf","prompt":"Early text predictors looked back at everything you had written so far.","answer":false,"labels":{"true":"Fact","false":"Myth"},"explain":"They looked only at the last few words. Anything earlier was out of view, which is why their sentences drifted off topic."},{"type":"mcq","prompt":"A predictor that sees only the last 2 words reads: \"She was thirsty, so she went looking for\". What can it actually use?","options":["Only \"She was thirsty\"","Only \"looking for\"","The whole sentence"],"answer":1,"explain":"It sees \"looking for\" and nothing else. The clue that she was thirsty is out of view, so it cannot favour \"water\" over any other word."},{"type":"card","title":"The clue is often far back","body":"Read this: \"The trophy didn't fit in the suitcase because it was too big.\" What was too big? The trophy. You linked \"it\" to a word much earlier in the sentence. Meaning often hangs on a word far back, out of a short memory's reach."},{"type":"cloze","prompt":"In the trophy sentence, the word that \"it\" stands for appears ___.","options":["much earlier","one word before","nowhere at all"],"answer":0,"explain":"\"It\" stands for the trophy, which is named near the start of the sentence. To read \"it\" correctly you have to reach back past several words."},{"type":"mcq","prompt":"A brief starts \"Write for teenagers\" and ends, 300 words on, \"keep the tone right for them\". What must a model see to understand \"them\"?","options":["Just the last three or four words","Nothing more; \"them\" explains itself","The word \"teenagers\" from the start"],"answer":2,"explain":"\"Them\" only makes sense once it is linked to \"teenagers\", 300 words back. A predictor that saw just the last few words could not know the audience."},{"type":"card","title":"The fix: see it all at once","body":"The fix sounds simple. Stop reading through a keyhole. Let the model look at every word on the page at once, then let it decide which words matter for the word it is working on. It is like scanning a whole brief before you write a line."},{"type":"tf","prompt":"The fix was to widen the view: look at every word at once, then decide which ones matter.","answer":true,"explain":"Seeing every word removes the keyhole, and choosing which ones matter keeps the model from drowning in detail. The next session shows how it chooses."},{"type":"sort","prompt":"Short memory or whole view? Sort each description.","buckets":["Short memory","Whole view"],"items":[["Sees only the last few words",0],["Looks at every word on the page",1],["Loses the thread in a long sentence",0],["Can link \"it\" to a word far back",1],["Decides which words matter most",1]],"explain":"A short memory forgets the start of the sentence. A whole view keeps every word available, so far-apart words can still be linked."}],"takeaway":"Meaning can hinge on a word far back, so a model has to see every word and pick out the ones that matter.","tryit":"Open your phone keyboard and tap the middle suggestion twenty times. Read the result aloud and see how long it stays on topic."},{"id":"f4-2","title":"Attention, explained","icon":"eye","goal":"Explain how attention helps each word find the words that matter.","steps":[{"type":"card","title":"A score for every other word","body":"At a noisy party you tune in to the one voice that matters and let the rest fade. A model does something similar for each word it reads. It gives every other word a score for how relevant it is. That scoring is called **attention**."},{"type":"cloze","prompt":"Attention means scoring how ___ every other word is to the word being read.","options":["unusual","relevant","repeated"],"answer":1,"explain":"For each word, the model scores the others by how much they matter to it. High scores get its attention, and low scores fade into the background."},{"type":"mcq","prompt":"The model reads \"it\" in \"The poster looked dull, so the designer brightened it\". Which word should score highest?","options":["designer","dull","poster"],"answer":2,"explain":"\"It\" is the thing that got brightened: the poster. A high score on \"poster\" tells the model what \"it\" stands for."},{"type":"card","title":"Watch the spotlight move","body":"Flip between the two sentences. Only the last word changes, yet \"it\" turns its spotlight to a different word each time. Brighter means a higher attention score.","play":{"kind":"attention","sets":[{"words":["The","trophy","didn't","fit","in","the","suitcase","because","it","was","too","big"],"focus":8,"weights":[0,0.7,0,0.05,0,0,0.1,0,0,0,0,0.15],"note":"\"it\" leans on \"trophy\": a trophy that is too big will not fit."},{"words":["The","trophy","didn't","fit","in","the","suitcase","because","it","was","too","small"],"focus":8,"weights":[0,0.1,0,0.05,0,0,0.7,0,0,0,0,0.15],"note":"\"it\" leans on \"suitcase\": a suitcase that is too small cannot fit a trophy."}]}},{"type":"tf","prompt":"When the ending changed from \"too big\" to \"too small\", the spotlight on \"it\" moved from \"trophy\" to \"suitcase\".","answer":true,"explain":"A trophy can be too big to fit; a suitcase can be too small to hold it. One changed word was enough to swing the attention scores."},{"type":"mcq","prompt":"\"The dog chased the ball because it was hungry.\" Which word should \"it\" pay most attention to?","options":["dog","ball","chased"],"answer":0,"explain":"Balls do not get hungry; dogs do. The word \"hungry\" is the clue that swings the spotlight onto \"dog\"."},{"type":"card","title":"Blending in the context","body":"Scoring is only half the job. Next, each word's meaning is updated by blending in the words that scored highest, like paint picking up a tint from the colour beside it. So \"bank\" next to \"river\" ends up meaning something different from \"bank\" next to \"loan\"."},{"type":"order","prompt":"Put the steps of attention in order for one word.","items":["Pick a word to work on","Score every other word for relevance","Blend in the high-scoring words","The word now has a meaning in context"],"explain":"First the scores, then the blend. Scoring finds the words that matter, and blending folds them into the word's meaning."},{"type":"match","prompt":"Neighbours change meaning. Match each phrase to what \"pitch\" means in it.","pairs":[["Client pitch","A presentation to win business"],["Football pitch","A field where a match is played"],["Perfect pitch","How high or low a note sounds"]],"explain":"The spelling never changes, but the neighbours do. By blending in \"client\", \"football\" or \"perfect\", the model gives \"pitch\" three different meanings."}],"takeaway":"Attention scores which words matter to each word, then blends them in, so every word is read in context.","tryit":"Find a sentence in your inbox containing \"it\" or \"they\". Point to the word it stands for. You just did attention by hand."},{"id":"f4-3","title":"Many spotlights","icon":"layers","goal":"Describe how many rounds of attention build up meaning.","steps":[{"type":"card","title":"Not one spotlight, but many","body":"Picture a team reviewing one sentence together. One person tracks who did what. Another tracks which word describes which. A model does this with attention. It runs many spotlights at once, and each one can follow a different kind of link between words."},{"type":"tf","prompt":"A model can run many attention spotlights at the same time, each following a different link.","answer":true,"labels":{"true":"Fact","false":"Myth"},"explain":"Many spotlights run side by side, like reviewers each checking one thing. Between them they catch links that a single spotlight would miss."},{"type":"mcq","prompt":"In \"The tired designer finished her slides\", one spotlight links \"her\" to \"designer\". What might another do at the same moment?","options":["Wait until the first has finished","Repeat exactly the same link","Link \"tired\" to \"designer\""],"answer":2,"explain":"Spotlights work side by side, and each can follow a different relationship. Here one tracks who \"her\" is while another tracks who is tired."},{"type":"card","title":"Round after round","body":"One pass is not enough. The model repeats the whole attention step many times, in layers stacked one on another. Each round starts from the meanings the last round produced and sharpens them, like the rounds of edits that turn a rough draft into a final one."},{"type":"cloze","prompt":"Each round of attention ___ the meanings produced by the round before.","options":["sharpens","scrambles","erases"],"answer":0,"explain":"Every round builds on the last, like another pass of edits on a draft. Nothing is thrown away; the meaning just gets clearer."},{"type":"order","prompt":"Follow one word through the model. Put its journey in order.","items":["It arrives with a rough meaning","A first round blends in some context","Later rounds sharpen the meaning further","The model predicts the next word"],"explain":"Meaning is built up round by round. Only after the last round does the model use those sharpened meanings to predict the next word."},{"type":"card","title":"No peeking ahead","body":"When a model writes, it adds one word at a time. The words to come do not exist yet. So its spotlights can only look back at what is already on the page: your prompt and the words it has written so far. It never peeks ahead."},{"type":"tf","prompt":"While writing, a model can look ahead at the words it is about to write.","answer":false,"labels":{"true":"Fact","false":"Myth"},"explain":"Those words do not exist yet. Each new word is chosen by looking back at your prompt and at what the model has already written."},{"type":"sort","prompt":"A model is halfway through writing a reply. What can its attention see?","buckets":["Can see","Cannot see"],"items":[["Your prompt",0],["The next word it will choose",1],["The words it has written so far",0],["How its reply is going to end",1]],"explain":"Attention only looks back. Your prompt and the reply so far are on the page; the rest of the reply has not been written yet."}],"takeaway":"A model runs many attention spotlights over many rounds, and while writing it only ever looks back.","tryit":"Ask a chat assistant for a four-line poem and watch the words arrive one by one, each chosen by looking back."},{"id":"f4-4","title":"Order matters","icon":"scale","goal":"Explain how a model keeps track of word order.","steps":[{"type":"card","title":"A bag of words","body":"Tip a sentence into a bag and shake. The words are all there, but their order is gone. Attention alone works like that bag. It scores which words matter to each other, not where they sit. So \"dog bites man\" and \"man bites dog\" would look the same."},{"type":"tf","prompt":"On its own, attention would see \"dog bites man\" and \"man bites dog\" as the same.","answer":true,"explain":"Both sentences hold the same three words. Attention alone scores how words relate, not where they sit, so the two would look alike."},{"type":"mcq","prompt":"Which pair would attention alone be unable to tell apart?","options":["\"client pays agency\" and \"agency pays client\"","\"client pays agency\" and \"client thanks agency\"","\"client pays agency\" and \"client pays\""],"answer":0,"explain":"The first pair uses exactly the same words in a different order, and order is what a bag of words loses. The other pairs contain different words."},{"type":"card","title":"A seat number for every word","body":"The fix is a tag. Every word, or piece of a word, carries one saying where it sits: first, second, third and so on, like the seat number on a ticket. With tags attached, the model knows \"dog\" came before \"bites\", and the two sentences no longer look alike."},{"type":"cloze","prompt":"To keep track of word order, each word carries a tag for its ___.","options":["meaning","spelling","position"],"answer":2,"explain":"The tag works like a seat number. It says where in the sentence the word sits, so the model can tell first from last."},{"type":"mcq","prompt":"What lets a model tell \"the agency briefed the client\" from \"the client briefed the agency\"?","options":["The exact spelling of each word","The position tag on each word","The total length of the sentence"],"answer":1,"explain":"Both sentences contain the same words and are the same length. Only the position tags show who briefed whom."},{"type":"card","title":"Order in your prompts","body":"Order matters in what you write, too. A model reads your whole prompt, but a request buried mid-paragraph is easier to miss, just as it is for a busy colleague. Put the instruction where it cannot be missed, at the start or the end, and keep related details together."},{"type":"tf","prompt":"A prompt made of a long pasted email thread, with \"shorten this to 50 words\" tucked into the third paragraph.","answer":false,"labels":{"true":"Strong prompt","false":"Weak prompt"},"explain":"The instruction is buried where it is easy to miss. Moved to the very top or the very end, it would be much harder to overlook."},{"type":"sort","prompt":"You are tidying a prompt before you send it. Sort each habit.","buckets":["Clear","Easy to miss"],"items":[["Instruction stated first, in one line",0],["Request hidden inside a long email chain",1],["Audience details kept in one place",0],["Brand facts scattered through the prompt",1]],"explain":"A clear instruction at the start and related details kept together are easy to follow. Buried requests and scattered facts are easy to miss."}],"takeaway":"Attention ignores order, so each word carries a position tag; in a prompt, put the instruction where it cannot be missed.","tryit":"Take a prompt you used this week, move the instruction to the very top and compare the two answers."},{"id":"f4-5","title":"Why \"transformer\"?","icon":"rocket","goal":"Say what a transformer is and what a large language model is.","steps":[{"type":"card","title":"The design has a name","body":"Put the pieces together: attention, many spotlights, many rounds, position tags. That design is called a **transformer**. Researchers at Google introduced it in 2017, in a paper titled \"Attention Is All You Need\". It is the T in GPT, and the chat assistants you know are built on it."},{"type":"cloze","prompt":"The T in GPT stands for ___.","options":["transmitter","transformer","translator"],"answer":1,"explain":"The transformer is the design, built around attention, that sits underneath the chat assistant. GPT is short for generative pre-trained transformer."},{"type":"mcq","prompt":"A colleague asks what \"Attention Is All You Need\" is. What do you tell them?","options":["The paper that introduced the transformer","A slogan from a chat assistant advertisement","A rule of thumb for writing shorter prompts"],"answer":0,"explain":"It is the title of the 2017 paper in which researchers at Google introduced the transformer, the design behind the chat assistants you know."},{"type":"card","title":"All the words at once","body":"Older designs read one word after another, like a shop with one checkout. In training, a transformer handles all the words in a passage at once, like opening every checkout. Modern chips are built for exactly that, so it can learn from enormous amounts of text."},{"type":"tf","prompt":"In training, a transformer handles text one word at a time, just like the older designs.","answer":false,"labels":{"true":"Fact","false":"Myth"},"explain":"A transformer works on all the words in a passage at once. That suits modern chips, which are built to do many calculations side by side."},{"type":"sort","prompt":"Older design or transformer? Sort each description.","buckets":["Older design","Transformer"],"items":[["Reads one word after another",0],["Handles all the words at once",1],["Like a shop with one checkout",0],["Like every checkout open",1],["Makes full use of modern chips",1]],"explain":"Older designs queued the words up one by one. The transformer works on them all together, which is the kind of job modern chips do best."},{"type":"card","title":"What an LLM is","body":"You will often hear **large language model**, or LLM. Unpack it word by word. Model: a transformer. Language: trained on a vast amount of text to predict the next word. Large: billions of dials, the adjustable numbers inside."},{"type":"match","prompt":"Unpack the phrase \"large language model\". Match each part to what it tells you.","pairs":[["Large","Billions of dials inside"],["Language","Trained on a vast amount of text"],["Model","A transformer, built around attention"]],"explain":"Put together, a large language model is a transformer with billions of dials, trained on a vast amount of text to predict the next word."},{"type":"mcq","prompt":"A vendor says their product \"runs on an LLM\". In plain words, what is under the hood?","options":["A searchable database full of ready-made answers","A long list of rules typed in by experts","A transformer trained on vast amounts of text"],"answer":2,"explain":"LLM is short for large language model. It predicts words using billions of trained dials; it does not look answers up or follow a typed rulebook."}],"takeaway":"A large language model is a transformer: an attention-based design with billions of dials, trained on vast amounts of text.","tryit":"Listen for the phrase \"large language model\" this week. When you hear it, translate it in your head: a transformer with billions of dials."}]},{"id":"f5","title":"Talking to AI","blurb":"Prompts that get useful answers.","sessions":[{"id":"f5-1","title":"Chat is a script","icon":"chat","goal":"See a chat as one long script that opens with a hidden first turn.","steps":[{"type":"card","title":"One long script","body":"A film script labels every line with its speaker. So does a chat: one long script of labelled turns. With each reply, the model rereads it and predicts what comes next. Tap through one.","play":{"kind":"chat","turns":[["system","You are a helpful assistant for a marketing team. Keep answers short."],["user","Give me a subject line for our spring sale email."],["assistant","Spring is here, and so are the savings."],["user","Make it shorter."],["assistant","Spring savings are here."]]}},{"type":"tf","prompt":"Under the hood, a chat is one long script, and the model predicts what comes next.","answer":true,"labels":{"true":"Fact","false":"Myth"},"explain":"Every turn is added to one growing script, with a label for who is speaking. The model reads the lot and predicts the next turn, just as it predicts the next word."},{"type":"mcq","prompt":"You ask for a subject line, then type \"Make it shorter\". How does the model know what \"it\" is?","options":["It saved the subject line in its own private memory","Your first request is still on the script it reads","It can work that out from the word \"shorter\" alone"],"answer":1,"explain":"Your request and its reply are still on the script. The model rereads all of it before every turn, so \"it\" points back to the subject line above."},{"type":"card","title":"The hidden first turn","body":"A play opens with stage directions the audience never sees. Most chat products do the same. A hidden first turn, the **system message**, sets the role and the rules: who the assistant is, how it sounds, what to avoid. It is one big reason different AI products behave differently."},{"type":"cloze","prompt":"The hidden first turn that sets an assistant's role and rules is the ___ message.","options":["welcome","user","system"],"answer":2,"explain":"The system message is usually written by the people who built the product, not by you. It sits at the top of the script, so it shapes every reply that follows."},{"type":"mcq","prompt":"A shop's help chat declines to write a poem and steers you back to your order. What is the likeliest reason?","options":["Its system message says to stick to orders","The model inside has never come across a poem","A poem would use up too many pieces of words"],"answer":0,"explain":"The shop wrote a hidden first turn giving the assistant its job and its limits. The model follows that script, even though it could write a poem perfectly well."},{"type":"card","title":"Chatting had to be taught","body":"Autocomplete never answers your texts. It just carries on your sentence. A plain language model is the same: type a question and it may simply keep writing. Chat models got extra practice on many example conversations, so they learned the pattern: a user's turn, then a helpful reply."},{"type":"tf","prompt":"Every language model answers questions naturally; nobody has to teach it the chat pattern.","answer":false,"labels":{"true":"Fact","false":"Myth"},"explain":"Predicting the next word is all a plain model does. Answering is a pattern it has to pick up from many example conversations with labelled turns."},{"type":"mcq","prompt":"You type \"What is a tagline?\" into a plain model that never learned the chat pattern. What might it do?","options":["Show an error and ask you to rephrase it","Search the web for a dictionary definition","Keep writing, maybe adding more questions"],"answer":2,"explain":"It treats your question as the start of a document and continues it. It might write \"What is a slogan? What is a logo?\" because a list of questions is a likely continuation."},{"type":"order","prompt":"Build the script the model reads, from the top down.","items":["System message: the role and rules","User: your first request","Assistant: its first reply","User: your note on that reply","Assistant: the reply it predicts next"],"explain":"The hidden system message comes first, then the turns alternate. Each new reply is predicted from everything above it on the script."}],"takeaway":"A chat is one long labelled script, opened by a hidden system message; the model predicts the next turn.","tryit":"Ask a chat assistant for a subject line, then reply \"make it shorter\". Notice it knows what \"it\" means."},{"id":"f5-2","title":"Give it the brief","icon":"target","goal":"Write a prompt that carries the audience, goal, brand and constraints.","steps":[{"type":"card","title":"Brief it like a freelancer","body":"Picture a freelancer who has never met your client. Hand them one line and you get generic work. A model is in the same spot: about your job, it knows only what is on the page in front of it. So give it the audience, goal, brand and constraints."},{"type":"cloze","prompt":"About your job, a model knows only what is on the ___, so the prompt must carry the brief.","options":["shared drive","page","open web"],"answer":1,"explain":"The model cannot see your inbox, your client or last week's meeting. Whatever it needs to know about the job has to be written into the prompt."},{"type":"match","prompt":"Match each part of a brief to an example of it.","pairs":[["Audience","First-time buyers in their twenties"],["Goal","Get sign-ups for the free trial"],["Brand","Warm and plain-spoken, never pushy"],["Constraints","Under 20 words, no hashtags"]],"explain":"Who it is for, what it should achieve, how the brand sounds and what limits apply: four things a freelancer would ask about, and four things the model needs on the page."},{"type":"card","title":"Vague versus briefed","body":"Same job, two prompts: a social caption for a client's new oat drink. One is a single line. The other carries the brief. Tap each to see what comes back.","play":{"kind":"compare","a":{"label":"Vague","prompt":"Write a social caption for an oat drink.","result":"Say hello to your new favourite drink. Our oat drink is creamy, delicious and better for the planet. Try it today. #oatdrink #plantbased #delicious"},"b":{"label":"Briefed","prompt":"Write a social caption for a new barista oat drink. For home coffee fans. Goal: try it in a flat white. Dry wit, under 15 words, no hashtags.","result":"Your flat white has been waiting for this. Oat drink that actually froths."}}},{"type":"tf","prompt":"\"Write a 6-word tagline for a gym aimed at nervous first-timers over 60. Goal: book a free tour. Warm, no jargon.\"","answer":true,"labels":{"true":"Strong prompt","false":"Weak prompt"},"explain":"It puts the audience, the goal, the voice and a limit on the page. The model has far less to guess, so the tagline is far less generic."},{"type":"mcq","prompt":"A teammate's prompt says only: \"Write a client email about the delay.\" What should they add first?","options":["Who the client is, what slipped and the new date","A line saying that the email is extremely urgent","A longer greeting and a much friendlier sign-off"],"answer":0,"explain":"The model knows nothing about this client or this delay unless you say so. Facts about the situation give it something real to write from."},{"type":"card","title":"No magic words","body":"No brief was ever rescued by one clever phrase, and prompts are no different. There are no magic words. A prompt works through what it puts on the page: each specific detail tilts the odds toward an answer that fits. Specific context beats clever phrasing."},{"type":"tf","prompt":"The right secret phrase will unlock great answers, however little else the prompt says.","answer":false,"labels":{"true":"Fact","false":"Myth"},"explain":"A stock phrase carries almost no information about your job. What changes the answer is the detail you put on the page: who it is for, what it must do, what to avoid."},{"type":"sort","prompt":"You are prompting for a sales email. Which lines give the model something to work with?","buckets":["Useful context","Empty filler"],"items":[["Readers are busy finance directors",0],["Make it amazing and world-class",1],["We want them to book a demo",0],["This is very, very important",1],["It must fit on one phone screen",0],["Use all of your brain power",1]],"explain":"Audience, goal and limits tell the model about the job. The other lines add pressure but no information, so they leave it guessing just as much as before."}],"takeaway":"The model only knows what is on the page, so brief it like a freelancer who has never met the client.","tryit":"Take a prompt you used this week and add four lines: audience, goal, brand voice and limits. Compare the answers."},{"id":"f5-3","title":"Show, don't tell","icon":"book","goal":"Steer tone and format by pasting two or three good examples.","steps":[{"type":"card","title":"Samples beat adjectives","body":"Tell a designer \"make it feel premium\" and you get a guess. Show them three ads you love and they get much closer. A model is the same. It learned from patterns in examples, so two or three samples of what good looks like steer it strongly."},{"type":"mcq","prompt":"What is the most reliable way to show a model what \"good\" looks like?","options":["Describe it with stronger adjectives","Repeat the request several times","Type the request in capital letters","Paste two or three samples of it"],"answer":3,"explain":"A model is a pattern machine. Samples give it a pattern to follow, which steers far more strongly than words like \"premium\" or \"punchy\" that could mean almost anything."},{"type":"tf","prompt":"\"Here are three subject lines that worked for us: [three lines]. Write five more like these for the autumn sale.\"","answer":true,"labels":{"true":"Strong prompt","false":"Weak prompt"},"explain":"It shows what good looks like and then asks for more of it. The model can match the length and feel of real lines that already worked."},{"type":"card","title":"It copies more than you think","body":"Hand a new assistant three old decks as a guide and the next deck will match them, quirks included. A model does the same. It copies the pattern, length and tone of your examples: long samples bring long answers. So choose them with care."},{"type":"tf","prompt":"A model picks up only the topic of your examples, not their length or tone.","answer":false,"labels":{"true":"Fact","false":"Myth"},"explain":"Everything about a sample is a pattern to continue: how long it is, how it opens, how formal it sounds. The model mirrors all of it, wanted or not."},{"type":"sort","prompt":"You want short, witty captions. Which samples should go into your prompt?","buckets":["Paste it","Leave it out"],"items":[["A one-line pun from a live campaign",0],["A formal three-page press release",1],["A dry six-word caption that did well",0],["A caption the client called off-brand",1],["A playful line from last month's post",0],["A long blog post on the same topic",1]],"explain":"The model will mirror whatever you paste. Short, witty samples pull the answer toward short and witty; long or off-brand ones pull it the wrong way."},{"type":"card","title":"The fast route to a voice","body":"Brand voice is hard to describe. \"Friendly but premium\" could mean a hundred things. It is easy to show. Paste a few published lines the client loved and ask for more in that style. The model picks up the voice from the samples, with no adjectives needed."},{"type":"order","prompt":"Put the steps for borrowing a brand voice in order.","items":["Collect a few published lines you like","Paste them into your prompt","Ask for more in the same style","Check the new lines against the originals"],"explain":"Samples first, then the request. The model reads your chosen lines, picks up their voice and continues the pattern. Your check at the end catches any line that drifts."},{"type":"mcq","prompt":"A new client's voice is hard to put into words. What is the quickest way to get on-brand drafts?","options":["List ten adjectives for the brand's personality","Give the brand's name and let the model work it out","Paste published posts and ask for more like them"],"answer":2,"explain":"Published posts carry the voice in a form the model can copy directly. Adjectives leave it guessing, and a name alone says little about how this client likes to sound."}],"takeaway":"Show two or three samples of what good looks like; the model copies their pattern, length and tone.","tryit":"Paste three published lines you love from a past campaign and ask for five more in the same style."},{"id":"f5-4","title":"Ask for the shape","icon":"puzzle","goal":"Ask for a format, a role and a reader, and for steps on hard problems.","steps":[{"type":"card","title":"Name the format","body":"Ask a colleague for \"thoughts on the deck\" and you might get one line or three pages. Leave the shape open and a model has to guess too. So say it: a table, five bullets, three options, under 50 words. A stated format tilts the odds toward exactly that."},{"type":"tf","prompt":"\"Summarise these meeting notes for me.\"","answer":false,"labels":{"true":"Shape named","false":"Shape missing"},"explain":"Nothing on the page says whether you want one line or three pages. Add the shape, such as five bullets with owners and dates, and the model no longer has to guess."},{"type":"match","prompt":"Match each job to the shape you would ask for.","pairs":[["Compare three vendors","A table with one row per vendor"],["Recap a long meeting","Five bullets with owners and dates"],["Name a new product","Ten options of one or two words each"],["Write a banner line","One line of eight words or fewer"]],"explain":"Comparisons read best in a table, recaps in bullets, naming needs plenty of options, and a banner needs a tight word limit. Saying so gets you there first time."},{"type":"card","title":"Give it a role and a reader","body":"The same news reads differently in a press release and in a text to a friend. So tell the model who is writing and who is reading: \"Write as a media planner, for a client who is new to advertising.\" That sets the vocabulary, depth and tone."},{"type":"cloze","prompt":"\"Write as a strategist, for a busy chief executive\" gives the model a role and an ___.","options":["example","audience","outline"],"answer":1,"explain":"The strategist is the role and the chief executive is the audience. Together they tell the model which words to choose and how much detail to include."},{"type":"mcq","prompt":"You must explain a media plan to a client who is new to advertising. Which opening line helps most?","options":["Write as a media planner, for a new advertiser","Write the smartest explanation that you possibly can","Write about media plans in a general sort of way"],"answer":0,"explain":"Naming the writer and the reader tells the model to use a planner's knowledge but a beginner's vocabulary. \"Smartest\" gives it no idea who is listening."},{"type":"card","title":"Steps first, then options","body":"Teachers ask pupils to show their working, and it helps here too. For a hard problem, ask the model to work through the steps first: each step it writes lands on the page and guides the next. Then ask for three options, not one."},{"type":"tf","prompt":"For a hard problem, asking the model to work through the steps first can lead to a better answer.","answer":true,"labels":{"true":"Fact","false":"Myth"},"explain":"Each step it writes lands on the page, where it guides the next one. Jumping straight to an answer skips that help, and hides the reasoning from you too."},{"type":"sort","prompt":"Which of these jobs are worth asking the model to work through step by step?","buckets":["Just ask","Steps first"],"items":[["Fix a typo in a headline",0],["Split a budget across five channels",1],["Shorten a caption to ten words",0],["Plan a three-month launch timeline",1],["Suggest another word for \"fresh\"",0],["Weigh two pitch routes against a brief",1]],"explain":"Simple edits need no working. Problems with several moving parts go better when the model lays out the steps first, because each step shapes the next."},{"type":"mcq","prompt":"Why ask for three taglines when you only need one?","options":["Three taglines use up fewer pieces of words","You can compare them, then pick or blend","The first one it writes is always the worst"],"answer":1,"explain":"Any single answer is just one draw from many likely ones. Seeing several lets you judge them side by side, as you would with routes from a creative team."}],"takeaway":"Name the format, the role and the reader; for hard problems ask for steps first and several options.","tryit":"Ask for your next AI answer as a table or as five bullets, and say who will read it."},{"id":"f5-5","title":"Edit, don't restart","icon":"wrench","goal":"Improve a draft with notes, and know when to start a fresh chat.","steps":[{"type":"card","title":"The first answer is a draft","body":"When a junior colleague hands you a first draft, you do not bin it and brief someone new. You give notes: \"shorter, warmer, lose the second paragraph\". Do the same here. The draft and your notes both sit on the page, so the next version builds on them."},{"type":"mcq","prompt":"The first answer is close, but too formal. What is the best next move?","options":["Open a new chat and paste the same prompt","Accept it, as the first try is the best one","Reply with a note: keep this, but warmer"],"answer":2,"explain":"The draft is still on the page, so a short note is enough to steer the next version. Starting over throws away everything that was already working."},{"type":"tf","prompt":"\"I don't like it. Try again.\"","answer":false,"labels":{"true":"Useful note","false":"Vague note"},"explain":"It says something is wrong but not what. The model can only guess, as a junior colleague would. Name the change you want: shorter, plainer, a different opening."},{"type":"card","title":"Ask it to push back","body":"Before a pitch, you ask a colleague to pick holes in it. Ask the model the same: \"What are the three weakest points here?\" Or have it argue the other side, as a sceptical client would. Ask for critique and critique becomes the likely reply."},{"type":"cloze","prompt":"To find the holes in a draft, ask the model to ___ its own work.","options":["praise","translate","critique"],"answer":2,"explain":"What you ask for shapes what comes next. A request for weak points makes weak points the likely reply, and if you never ask, you are unlikely to hear them."},{"type":"mcq","prompt":"You have drafted a pitch idea you love. Which request is most likely to expose its weak spots?","options":["Argue against this as a sceptical client would","Tell me what you like best about this pitch idea","Rewrite this in a bolder, more confident tone"],"answer":0,"explain":"Asking for the other side puts objections on the page before the client raises them. The other two requests invite agreement or polish, not scrutiny."},{"type":"card","title":"Know when to start fresh","body":"A meeting that has run two hours rarely gets clearer in hour three. Long chats are the same: old instructions clash with new ones, and the earliest turns can slip out of view. Open a fresh chat with a better brief and your best draft so far."},{"type":"tf","prompt":"When a long chat has become confused, a fresh chat with a better brief is often the quickest fix.","answer":true,"explain":"A long script is full of old instructions and abandoned ideas that still pull on every reply. A fresh page holds only what you choose to put on it."},{"type":"sort","prompt":"Give notes, or open a new chat? Sort each situation.","buckets":["Reply with notes","Start fresh"],"items":[["The draft is good but a bit long",0],["It keeps ignoring rules you set early on",1],["The tone is right but one fact is off",0],["It is mixing up two different clients",1],["You want two more like the second option",0],["Old and new instructions keep clashing",1]],"explain":"A draft that is nearly right needs a note. A chat that has lost the thread is past rescuing with notes, and is better served by a clean page and a clear brief."},{"type":"order","prompt":"Put this way of working with a chat assistant in order.","items":["Write a clear brief","Read the first draft","Reply with specific notes","Do the final polish yourself"],"explain":"Brief, draft, notes, then your own judgement at the end. It is the same loop you would run with a junior colleague, only faster."}],"takeaway":"Treat the first answer as a draft: give notes, ask for critique, and start fresh when the chat gets tangled.","tryit":"Reply to your next AI draft with two specific notes instead of starting over, then ask for its weakest point."}]},{"id":"f6","title":"Making it yours","blurb":"Fine-tuning, look-ups and what it costs.","sessions":[{"id":"f6-1","title":"Generalist to specialist","icon":"rocket","goal":"Explain how fine-tuning turns a general model into a specialist.","steps":[{"type":"card","title":"The well-read all-rounder","body":"Picture a new graduate who has read widely: some law, some cooking, some marketing. A **base model** is like that. It is the general model you start with, trained on a broad sweep of text. It can turn its hand to most things, and is a specialist in none."},{"type":"cloze","prompt":"A base model is a ___: trained on a broad sweep of text, not on one company's work.","options":["specialist","generalist","database"],"answer":1,"explain":"Its training covered a little of almost everything. That makes it useful for most everyday jobs, and an expert in no single brand, client or house style."},{"type":"tf","prompt":"A base model was trained specially on your agency's past campaigns and house style.","answer":false,"labels":{"true":"Fact","false":"Myth"},"explain":"It learned from a broad sweep of general text. Your house style is not something it has studied, which is why it starts out sounding generic."},{"type":"card","title":"A short specialist course","body":"A generalist becomes a specialist through focused practice. **Fine-tuning** is a short extra round of training on a small, specific set of examples, such as a brand's best customer replies. The model builds on what it already knows about language and picks up the specialism on top."},{"type":"mcq","prompt":"What is fine-tuning?","options":["Writing a longer and more detailed prompt","Building a brand-new model from nothing","Extra training on a small set of examples"],"answer":2,"explain":"Fine-tuning starts from a model that already handles language well and gives it a short extra round of practice on examples of one particular job."},{"type":"order","prompt":"Put the making of a specialist model in order.","items":["Train on a broad sweep of text","Result: a generalist base model","Train a bit more on specific examples","Result: a specialist for one job"],"explain":"The broad training comes first and does most of the work. Fine-tuning is the short second round that turns the all-rounder into a specialist."},{"type":"card","title":"Change the page or the dials","body":"You can hand an actor a new script, or send them on a course. A prompt is the script: it changes what is on the page and leaves the model as it was. Fine-tuning is the course: it changes the dials themselves, the learned settings inside the model."},{"type":"sort","prompt":"Does each line describe a prompt or fine-tuning?","buckets":["Prompt","Fine-tuning"],"items":[["Changes what is on the page",0],["Changes the dials inside the model",1],["Leaves the model exactly as it was",0],["Needs an extra round of training",1],["Done by typing clearer instructions",0],["Builds the new behaviour into the model",1]],"explain":"A prompt only ever adds words to the page. Fine-tuning is training, so it moves the dials and the change stays in the model afterwards."},{"type":"mcq","prompt":"You paste a few style rules into a chat and the answers improve. What has changed?","options":["The page; the model's dials are just the same","The dials; the model has now been retrained","Both the page and the dials, in equal measure"],"answer":0,"explain":"Pasting text is prompting. It changes what the model can see in this chat and nothing else. Open a new chat and the style rules are gone."},{"type":"match","prompt":"Match each term to its meaning.","pairs":[["Base model","A generalist trained on a broad sweep of text"],["Fine-tuning","Extra training on a small set of examples"],["Prompt","The words you put on the page"],["Dials","The learned settings inside a model"]],"explain":"The base model is the starting point, fine-tuning retrains its dials a little, and a prompt works without touching them at all."}],"takeaway":"A prompt changes what is on the page; fine-tuning is extra training that changes the dials themselves.","tryit":"Ask a chat assistant to reply in rhyme, then open a new chat. The rhyme is gone: you changed the page, not the dials."},{"id":"f6-2","title":"The light-touch tweak","icon":"wrench","goal":"Explain how a small add-on can specialise a model cheaply.","steps":[{"type":"card","title":"Retuning every dial","body":"Fine-tuning means extra training on specific examples. The full version adjusts every dial, the settings inside the model, and a big model has billions. It is like repainting the whole house to change one room: slow, costly, and you end up storing a complete second copy of the model."},{"type":"tf","prompt":"Full fine-tuning adjusts every dial in the model.","answer":true,"explain":"Every dial is free to move during the extra training. On a model with billions of them, that means a lot of computing work and a full-size copy to keep."},{"type":"mcq","prompt":"A team wants a fully fine-tuned copy of a huge model for each of 30 clients. What is the main drawback?","options":["The model would stop understanding prompts","Thirty full-size copies to train and store","All the clients would share one set of dials"],"answer":1,"explain":"Full fine-tuning produces a complete new copy of the model each time. Thirty clients means thirty rounds of heavy training and thirty huge files."},{"type":"card","title":"A clip-on lens","body":"A clip-on lens changes what your phone camera can do without rebuilding the camera. A popular shortcut works the same way: freeze the original dials and train a small add-on that sits alongside them. One well-known method is called **LoRA**."},{"type":"cloze","prompt":"With a method such as LoRA, the original dials are ___ and only a small add-on is trained.","options":["frozen","deleted","doubled"],"answer":0,"explain":"Frozen means left exactly as they were. All the learning happens in the small add-on, which is why this shortcut is so much lighter than retuning everything."},{"type":"tf","prompt":"Training a small add-on rewrites the model's original dials.","answer":false,"labels":{"true":"Fact","false":"Myth"},"explain":"The original dials do not move at all. The add-on learns the new job beside them, like a lens clipped onto a camera you have not rebuilt."},{"type":"card","title":"Small, cheap, swappable","body":"The add-on is tiny next to the model, so it is quick to train and cheap to store. One model can keep a whole drawer of them: one for a playful snack brand, one for a formal bank. Swap the add-on and you swap the specialism."},{"type":"sort","prompt":"Full fine-tuning or a small add-on? Sort each description.","buckets":["Full fine-tuning","Small add-on"],"items":[["Adjusts every dial",0],["Original dials stay frozen",1],["Leaves a full-size copy to store",0],["Tiny and cheap to keep",1],["Slow and costly on a big model",0],["Easy to swap for each job",1]],"explain":"Full fine-tuning moves everything and saves everything. The add-on route trains and stores only a small extra part, so you can keep one for each job."},{"type":"mcq","prompt":"One model writes for a snack brand and a bank. With add-ons, how do you switch between their voices?","options":["Keep two full copies of the big model","Retrain every dial each time you switch","Swap one small add-on for the other"],"answer":2,"explain":"The big model stays the same for both clients. Each voice lives in its own small add-on, so switching is a matter of swapping one for the other."}],"takeaway":"A small trained add-on can specialise a model while its original dials stay frozen: tiny, cheap and easy to swap.","tryit":"Explain the clip-on lens idea to a colleague in one sentence: freeze the model, train a small add-on."},{"id":"f6-3","title":"Give it a library card","icon":"book","goal":"Explain how a look-up puts fresh facts and sources in front of a model.","steps":[{"type":"card","title":"Fetch it, don't memorise it","body":"A good librarian has not memorised every book. They know how to fetch the right one. An AI product can do the same: when you ask, it finds the relevant documents and puts them on the page for the model to read. This look-up is often called **retrieval**."},{"type":"mcq","prompt":"What does retrieval do when you ask a question?","options":["Fetches relevant documents onto the page","Retrains the model's dials on your files","Sends your question to a human expert"],"answer":0,"explain":"Nothing inside the model changes. The product finds the right documents and places them on the page, where the model can read them like any other part of your prompt."},{"type":"cloze","prompt":"A tool that pulls up the HR handbook before answering your holiday question is using ___.","options":["fine-tuning","retrieval","a bigger model"],"answer":1,"explain":"It looked the answer up. Many tools find the right passage by matching meaning, not exact words, then put it on the page for the model to read."},{"type":"card","title":"Best for facts that change","body":"A printed brochure goes stale
