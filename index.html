"body":"With d = 256, mlp_dim = 384, 4 heads, 2 blocks, and a 262,144-token vocabulary: embeddings ≈ 67.1M, each block ≈ 0.46M, output layer ≈ 67.4M, total ≈ 135.4M. The vocabulary-sized layers dominate; the two blocks add under 1%."},{"type":"tf","level":1,"prompt":"The sinusoidal positional encodings add trainable parameters to the model.","answer":false,"explain":"They are computed from sine and cosine formulas of the position, so nothing in them is learned."},{"type":"cloze","level":2,"prompt":"LayerNorm with embedding_dim = 256 has ___ trainable parameters.","options":["256","512","65,536","0"],"answer":1,"explain":"LayerNorm learns a γ vector and a β vector, each of length 256: 256 + 256 = 512."},{"type":"cloze","level":2,"prompt":"Fill in the parameter count of the token embedding table.","code":"def parameter_count_embedding(hp):\n    V = hp[\"vocabulary_size\"]\n    d = hp[\"embedding_dim\"]\n    return ___","options":["V * d","(V + 1) * d","V + d","2 * d"],"answer":0,"explain":"The table holds one d-dimensional vector per vocabulary entry and has no bias, so it has V × d parameters."},{"type":"tf","level":2,"prompt":"With embedding_dim = 256 and 4 heads, each head works with 64-dimensional queries and keys.","answer":true,"explain":"head_dim = embedding_dim / num_heads = 256 / 4 = 64."},{"type":"mcq","level":2,"prompt":"Why doesn't splitting attention into 4 heads change its parameter count?","options":["Every head reuses the weights of the output projection","Attention heads have no trainable weights of their own","Keras quietly ignores the num_heads setting entirely","The heads split d into 4 parts of d/4, which still add up to d"],"answer":3,"explain":"The Q, K, V projections still map d → d overall; heads only reshape that output into 4 chunks of size d/4."},{"type":"order","level":2,"prompt":"Order the steps inside one transformer block.","items":["Masked multi-head self-attention","Add the block's input (residual)","Layer norm after attention","Two-layer MLP","Add residual, then layer norm"],"explain":"Attention, residual, LayerNorm; then MLP, residual, LayerNorm. That is why a block contains two LayerNorms."},{"type":"match","level":2,"prompt":"Match each component to its parameter count (d = embedding_dim).","pairs":[["LayerNorm","2 × d (γ and β)"],["Token embeddings","vocabulary_size × d"],["Attention","4 × (d + 1) × d"],["MLP","(d + 1) × mlp_dim + (mlp_dim + 1) × d"],["Output layer","(d + 1) × vocabulary_size"]],"explain":"Every Dense layer contributes (inputs + 1) × outputs; LayerNorm and the embedding table have no biases to add."},{"type":"mcq","level":2,"prompt":"In this lab's model of about 135M parameters, which parts hold most of them?","options":["The token embedding table and the output layer","The two transformer blocks together","The layer normalization layers","The sinusoidal positional encodings"],"answer":0,"explain":"Both scale with the 262,144-token vocabulary, at about 67M parameters each. The two blocks add under 1M."}]},{"id":"c4-5b","title":"Counting parameters","part":2,"icon":"chip","lab":"course_4/gdm_lab_4_5_reflection_on_trainable_parameters.ipynb","goal":"Apply them to harder, hands-on questions.","steps":[{"type":"cloze","level":2,"prompt":"Inputs are `padded[:, :-1]` and targets are `padded[:, 1:]`, so the target at each position is the ___ token.","options":["previous","same","padding","next"],"answer":3,"explain":"Shifting by one makes each target the token that follows its input position, which is exactly next-token prediction."},{"type":"mcq","level":2,"prompt":"What does a Keras layer's `call` method define?","options":["Which weights to create, and their shapes","How inputs become outputs using the layer's weights","How many epochs the model is trained for","Which loss function the model should use"],"answer":1,"explain":"`call` is the forward pass. Creating the weights happens in `__init__`; epochs and loss belong to training."},{"type":"mcq","level":3,"prompt":"A Dense layer maps 3 inputs to 2 outputs. How many parameters does it have, counting biases?","options":["6","5","8","9"],"answer":2,"explain":"(q + 1) × r = (3 + 1) × 2 = 8: six weights plus two biases."},{"type":"cloze","level":3,"prompt":"Fill in the parameter count of the MLP's second Dense layer.","code":"d = hp[\"embedding_dim\"]\nm = hp[\"mlp_dim\"]\nfirst = (d + 1) * m\nsecond = ___\nreturn first + second","options":["(d + 1) * m","m * d","(m + 1) * d","(m + d) * 2"],"answer":2,"explain":"The second layer maps mlp_dim back to embedding_dim, with a bias per output: (m + 1) × d."},{"type":"mcq","level":3,"prompt":"With embedding_dim d = 4, how many parameters does the attention component have?","options":["80","64","20","16"],"answer":0,"explain":"Four Dense layers, each (d + 1) × d = 5 × 4 = 20 parameters: 4 × 20 = 80."},{"type":"tf","level":3,"prompt":"Doubling num_blocks from 2 to 4 would roughly double this model's 135M parameters.","answer":false,"explain":"Each block has only about 461K parameters, so two more blocks add under 1M. The vocabulary-sized layers hold almost everything."},{"type":"mcq","level":3,"prompt":"One block has 461,440 parameters. How many parameters does going from 2 to 4 blocks add?","options":["461,440","1,845,760","922,880","135,402,752"],"answer":2,"explain":"Two extra blocks × 461,440 = 922,880. 1,845,760 would be all four blocks, not the increase."},{"type":"mcq","level":3,"prompt":"The output layer has exactly 262,144 more parameters than the token embedding table. Why?","options":["It also stores the sinusoidal position encodings","It has one bias for each vocabulary entry","It adds one extra row for each attention head","It includes the final LayerNorm's γ and β"],"answer":1,"explain":"Embeddings: V × d. Output Dense: (d + 1) × V = V × d + V. The difference is V = 262,144 biases."}]}]},{"id":"c5","title":"Finetune Your Model","blurb":"AI Research Foundations · Course 5","repo":"ai-foundations","sessions":[{"id":"c5-1a","title":"Base models and questions","part":1,"icon":"chat","lab":"course_5/gdm_lab_5_1_prompt_your_slm_with_questions.ipynb","goal":"Learn the ideas, then try the first checks.","steps":[{"type":"card","title":"A base model only continues","body":"Your small language model (SLM) learned one skill from the Africa Galore dataset: predict the next token. Given any prompt, it extends the text with likely tokens. It was never trained on questions paired with answers, so replying to a user is not something it was taught."},{"type":"card","title":"Statement or question?","body":"The lab compares openers like \"Jollof rice is\" and \"Tagine is\" with questions like \"What is Jollof rice?\". Statement openers resemble the training text, so the continuations read well. Questions look unusual in that data, so the output tends to drift, repeat or ignore what was asked."},{"type":"card","title":"Greedy, repeatable output","body":"With sampling_mode=\"greedy\" the model takes the most probable token at every step, so one prompt always yields the same continuation. That keeps the statement-versus-question comparison fair. The helper's other mode, \"random\", samples from the distribution instead.","code":"text, probs = generation.generate_text(\n    \"Jollof rice is\",\n    10,  # tokens to generate\n    model=model,\n    tokenizer=tokenizer,\n    pad_token_id=tokenizer.pad_token_id,\n    sampling_mode=\"greedy\",\n)"},{"type":"card","title":"Base vs instruction-tuned","body":"A base model is a general text completer. An instruction-tuned model has had extra training on prompt-response examples, so it answers questions and follows a requested format. The rest of this course builds that extra step for your own model: fine-tuning."},{"type":"mcq","level":1,"prompt":"Before this lab, what task was your SLM trained on?","options":["Answering questions about African food","Sorting texts into categories","Predicting the next token of text","Translating between languages"],"answer":2,"explain":"The SLM is a base model: it only learned next-token prediction on Africa Galore, so it completes text but was never taught to answer."},{"type":"tf","level":1,"prompt":"With sampling_mode=\"greedy\", the model picks the single most probable token at each step.","answer":true,"explain":"Greedy decoding always takes the highest-probability next token, which makes generation deterministic for a given prompt."},{"type":"cloze","level":1,"prompt":"Fill in the mode that always picks the highest-probability token.","code":"text, probs = generation.generate_text(\n    prompt,\n    num_tokens_to_generate,\n    model=model,\n    tokenizer=tokenizer,\n    pad_token_id=tokenizer.pad_token_id,\n    sampling_mode=\"___\",\n)","options":["random","beam","top_k","greedy"],"answer":3,"explain":"\"greedy\" selects the most likely token at every step; the helper's other supported mode, \"random\", samples instead."},{"type":"cloze","level":1,"prompt":"A model trained only on next-token prediction, with no extra tuning for questions, is called a ___ model.","options":["base","instruction-tuned","fine-tuned","distilled"],"answer":0,"explain":"The lab calls it a base model: a general text completer, as opposed to an instruction-tuned model trained on prompt-response pairs."},{"type":"mcq","level":1,"prompt":"In the lab's prompt cell, what does this setting control?","code":"num_tokens_to_generate = 10","options":["How many prompts are tested in a row","How many new tokens follow the prompt","How many tokens long the prompt may be","How many candidate tokens are compared"],"answer":1,"explain":"It sets the length of the continuation: the model generates 10 tokens, one at a time, after your prompt."},{"type":"match","level":1,"prompt":"Match each term to its meaning.","pairs":[["Base model","Trained only to continue text"],["Instruction-tuned","Further trained to respond to prompts"],["Greedy sampling","Always takes the most probable token"],["Tokenizer","Converts text to token IDs and back"],["Prompt","The starting text the model continues"]],"explain":"A tokenizer turns the prompt into IDs for the base model, and greedy sampling picks each next token."},{"type":"mcq","level":2,"prompt":"Which prompt is the base SLM most likely to continue well?","options":["What is Tagine?","Tagine is","Can you explain Tagine?","Tell me what Tagine is."],"answer":1,"explain":"A statement opener looks like the narrative training text, which is exactly what next-token prediction learned to extend."}]},{"id":"c5-1b","title":"Base models and questions","part":2,"icon":"chat","lab":"course_5/gdm_lab_5_1_prompt_your_slm_with_questions.ipynb","goal":"Apply them to harder, hands-on questions.","steps":[{"type":"mcq","level":2,"prompt":"Why does the base SLM often fail on \"What is Jollof rice?\"","options":["It rarely saw questions paired with answers","Its vocabulary has no token for a question mark","The question exceeds its 399-token length limit","Greedy decoding cannot produce full sentences"],"answer":0,"explain":"The model copies patterns from its training data. Narrative text seldom shows a question followed by a direct answer, so it has no habit of replying."},{"type":"tf","level":2,"prompt":"A base model that completes statements fluently will also answer direct questions reliably.","answer":false,"explain":"Completing text and answering questions are different behaviours. The lab shows the base SLM handles statements but stumbles on questions."},{"type":"tf","level":2,"prompt":"Prompting the model in this lab adjusts its parameters a little each time.","answer":false,"explain":"Generation is inference only. Parameters change only during training, for example when you later call model.fit to fine-tune."},{"type":"order","level":2,"prompt":"Put the lab's steps in order.","items":["Load the BPE tokenizer","Define the model with create_model","Load the trained weights from file","Prompt with statements and questions","Compare the quality of the outputs"],"explain":"create_model needs the tokenizer's vocabulary size, the weights need a matching model, and only a loaded model can be prompted."},{"type":"cloze","level":2,"prompt":"Fill in the Keras method that copies the downloaded parameters into the model.","code":"model = training.create_model(\n    max_length=399,\n    vocabulary_size=tokenizer.vocabulary_size,\n)\nmodel.___(model_filename)","options":["fit","summary","load_weights","save_weights"],"answer":2,"explain":"load_weights sets every parameter to the saved pre-trained values. The model must first be defined with the same hyperparameters."},{"type":"mcq","level":3,"prompt":"You run the greedy prompt cell twice with \"Jollof rice is\". What happens?","options":["The second run gives a better, longer answer","Each run samples a new continuation","Both runs print the same continuation","The second run continues the first"],"answer":2,"explain":"Greedy decoding is deterministic, and prompting never updates the weights, so the same prompt gives the same output."},{"type":"mcq","level":3,"prompt":"Which change would most directly teach the SLM to answer questions?","options":["Generate 50 tokens instead of 10","Switch from greedy to random sampling","Prompt it with shorter questions","Train it further on formatted Q&A pairs"],"answer":3,"explain":"Decoding settings only change how existing knowledge is sampled. The model needs fine-tuning on examples of questions followed by answers."}]},{"id":"c5-2a","title":"Turn-based formatting","part":1,"icon":"token","lab":"course_5/gdm_lab_5_2_format_text_for_turn_based_dialogue.ipynb","goal":"Learn the ideas, then try the first checks.","steps":[{"type":"card","title":"Why mark the turns?","body":"Narrative text has no speakers, so a model trained on it cannot tell where a question stops and a reply starts. Dialogue data for fine-tuning therefore wraps each turn in special delimiter tokens. Like \u003cPAD> or \u003cUNK>, these are signals to the model rather than ordinary words."},{"type":"card","title":"The turn template","body":"Each turn opens with \u003cstart_of_turn>, names the speaker (user or model) on its first line, and closes with \u003cend_of_turn>. Gemma's instruction-tuned models use this same layout.","code":"formatted_q = f\"{sot}user\\n{question}{eot}\\n\"\nformatted_a = f\"{sot}model\\n{answer}{eot}\""},{"type":"card","title":"Flashcard answers","body":"For the revision flashcard generator, each answer should open with its category, such as \"Category: Food\", then a newline, then the answer text. Applied consistently across the dataset, this teaches the model both the content and the shape of a good flashcard."},{"type":"card","title":"Working row by row","body":"Each Africa Galore QA row has the fields category, name, question and answer. Your format_qa takes one row and returns two strings: the formatted question and the formatted answer. Its sot and eot arguments default to the two turn tokens."},{"type":"mcq","level":1,"prompt":"What job do \u003cstart_of_turn> and \u003cend_of_turn> do?","options":["Tell the tokenizer which words to skip","Mark where each speaker's turn starts and ends","Pad short examples to the same length","Stand in for words missing from the vocabulary"],"answer":1,"explain":"They are delimiter tokens that separate the user's question turn from the model's answer turn."},{"type":"cloze","level":1,"prompt":"Fill in the speaker label for the question turn.","code":"formatted_q = f\"{sot}___\\n{question}{eot}\\n\"","options":["model","system","user","question"],"answer":2,"explain":"The person asking is the user, so the question turn is labelled user; the answer turn is labelled model."},{"type":"tf","level":1,"prompt":"In this format, the answer turn begins with \u003cstart_of_turn> followed by the label model.","answer":true,"explain":"formatted_a begins with f\"{sot}model\\n\", which marks the start of the model's reply."},{"type":"match","level":1,"prompt":"Match each piece of the format to its role.","pairs":[["\u003cstart_of_turn>","Opens a speaker's turn"],["\u003cend_of_turn>","Closes a speaker's turn"],["user","Labels the turn holding the question"],["model","Labels the turn holding the answer"],["Category: Food","First line of a flashcard answer"]],"explain":"Turn tokens bracket each turn, the label names the speaker, and the category line opens the flashcard answer."},{"type":"mcq","level":2,"prompt":"Which string does formatted_q hold?","code":"sot = \"\u003cstart_of_turn>\"\neot = \"\u003cend_of_turn>\"\nquestion = \"What is Fufu?\"\nformatted_q = f\"{sot}user\\n{question}{eot}\\n\"","options":["`\u003cstart_of_turn>user\\nWhat is Fufu?\u003cend_of_turn>\\n`","`\u003cstart_of_turn>model\\nWhat is Fufu?\u003cend_of_turn>\\n`","`\u003cstart_of_turn>\\nWhat is Fufu?\\n\u003cend_of_turn>user`","`\u003cend_of_turn>user\\nWhat is Fufu?\u003cstart_of_turn>\\n`"],"answer":0,"explain":"The template starts with sot, adds the speaker label user and a newline, then the question, then eot and a final newline."},{"type":"cloze","level":2,"prompt":"Fill in the placeholder so the answer opens with its category.","code":"category = data[\"category\"]\nquestion = data[\"question\"]\nanswer = data[\"answer\"]\nformatted_a = (f\"{sot}model\\nCategory: ___\"\n               f\"\\n{answer}{eot}\")","options":["{question}","{name}","{answer}","{category}"],"answer":3,"explain":"The flashcard answer needs a line like \"Category: Food\", so the row's category value goes right after \"Category: \"."},{"type":"tf","level":2,"prompt":"The category goes into the question turn so the user sees it first.","answer":false,"explain":"The category opens the model's answer turn (\"Category: ...\"), because the model should learn to generate it."}]},{"id":"c5-2b","title":"Turn-based formatting","part":2,"icon":"token","lab":"course_5/gdm_lab_5_2_format_text_for_turn_based_dialogue.ipynb","goal":"Apply them to harder, hands-on questions.","steps":[{"type":"mcq","level":2,"prompt":"Which dataset field does the flashcard format_qa leave out?","options":["name","category","question","answer"],"answer":0,"explain":"The function reads only category, question and answer from each row; the name field never appears in the formatted text."},{"type":"order","level":2,"prompt":"Order the parts of a formatted flashcard answer.","items":["\u003cstart_of_turn>","model","Category: Food","Jollof rice is a one-pot rice dish...","\u003cend_of_turn>"],"explain":"The model turn opens with the start token and speaker label, then the category line and answer, and closes with the end token."},{"type":"mcq","level":2,"prompt":"Why apply exactly the same delimiter format to every example?","options":["So the tokenizer can learn extra merge rules","So every example ends up the same length","So the model learns the dialogue pattern, not just facts","So the loss skips the tokens of each question"],"answer":2,"explain":"Consistent structure lets the model pick up the conversational shape, a question turn then an answer turn, along with the content."},{"type":"cloze","level":2,"prompt":"Turn delimiters work like the ___ and \u003cUNK> tokens from earlier courses: signals, not ordinary words.","options":["\u003cEOS>","\u003cPAD>","\u003cCLS>","\u003cMASK>"],"answer":1,"explain":"The lab compares them to \u003cPAD> and \u003cUNK>, special tokens you met before that carry meaning for the model rather than text."},{"type":"tf","level":2,"prompt":"Without turn delimiters, a model has no reliable signal for where a question ends and the answer begins.","answer":true,"explain":"That missing boundary is exactly why the lab wraps each turn with \u003cstart_of_turn> and \u003cend_of_turn>."},{"type":"mcq","level":3,"prompt":"How many times does \u003cend_of_turn> appear in formatted_q + formatted_a for one row?","options":["1","2","3","4"],"answer":1,"explain":"Each of the two turns, the question and the answer, is closed by exactly one \u003cend_of_turn>."},{"type":"mcq","level":3,"prompt":"A row has category \"Landmark\" and question \"What is Table Mountain?\". Which line comes right after \u003cstart_of_turn>model?","options":["What is Table Mountain?","Landmark: Table Mountain","\u003cend_of_turn>","Category: Landmark"],"answer":3,"explain":"formatted_a is f\"{sot}model\\nCategory: {category}\\n{answer}{eot}\", so the line after the label is \"Category: Landmark\"."}]},{"id":"c5-3a","title":"Full fine-tuning an SLM","part":1,"icon":"tune","lab":"course_5/gdm_lab_5_3_fine_tune_all_parameters_of_your_slm.ipynb","goal":"Learn the ideas, then try the first checks.","steps":[{"type":"card","title":"Fine-tuning is more training","body":"Full-parameter fine-tuning continues gradient descent on the pre-trained SLM, now with the small Africa Galore QA dataset. Every weight may change. Because the model already knows language patterns, it picks up the new task in far fewer iterations than training from scratch would need."},{"type":"card","title":"Keep the same tokenizer","body":"Tokenize fine-tuning data with the exact tokenizer used in pre-training. If ID 532 meant \"rice\", it must still mean \"rice\": everything the model learned about that ID (a food, a noun) would be useless if the ID suddenly stood for a different word."},{"type":"card","title":"Only answers count","body":"Targets are the inputs shifted one place left. Question positions become \u003cPAD>, which the loss ignores, so the model is trained to write answers rather than questions, while still attending to the question.","code":"full = q_ids + a_ids\nmasked = [pad_id] * len(q_ids) + a_ids\ninputs = full[:-1]\ntargets = masked[1:]"},{"type":"card","title":"Go gently","body":"Fine-tuning learning rates are usually 10-100× below pre-training (often ~1e-4); the lab sets 5e-5. Start with about 50 epochs and small batches of 4. Push too hard or too long and catastrophic forgetting can overwrite what pre-training taught."},{"type":"mcq","level":1,"prompt":"In full-parameter fine-tuning, which weights get updated?","options":["Only the final output layer","Every weight in the model","Only small added matrices","Only the token embeddings"],"answer":1,"explain":"Full-parameter fine-tuning is ordinary training continued, so gradient descent can change all parameters, which is what makes it memory-hungry for big models."},{"type":"tf","level":1,"prompt":"Small fine-tuning batches give noisier gradients, and that noise can act as a regularizer.","answer":true,"explain":"The lab notes that noisier estimates from small batches make overfitting less likely, on top of saving GPU memory."},{"type":"cloze","level":1,"prompt":"Fill in the callback that prints sample generations after each epoch.","code":"history = model.fit(\n    x=batches,\n    epochs=num_epochs,\n    callbacks=[___],\n)","options":["tokenizer","text_gen_callback","prompt_ids","tf_dataset"],"answer":1,"explain":"text_gen_callback generates text from a flashcard-style prompt after each epoch, so you can see when the format has been learned."},{"type":"mcq","level":2,"prompt":"Why must you fine-tune with the tokenizer used in pre-training?","options":["Each token ID must keep the meaning it learned","A new tokenizer would slow every epoch","Keras rejects weights from other tokenizers","Only that tokenizer can encode question marks"],"answer":0,"explain":"The embeddings learned what each ID stands for. Remapping IDs would discard those representations and force the model to relearn them."},{"type":"cloze","level":2,"prompt":"Fill in the slice that builds the input sequence.","code":"concatenated_tokens = q_ids + a_ids\nconcatenated_masked = (\n    [pad_token_id] * len_q + a_ids)\nencoded_inputs.append(\n    concatenated_tokens[___])\nencoded_targets.append(\n    concatenated_masked[1:])","options":["1:",":",":-1","::-1"],"answer":2,"explain":"Inputs drop the last token, since nothing follows it to predict; targets drop the first token, creating the one-step shift."},{"type":"cloze","level":2,"prompt":"Fill in the token ID used to hide the question from the loss.","code":"concatenated_masked = (\n    [___] * len_q + encoded_answers[idx])","options":["pad_token_id","unk_token_id","eot_token_id","len_q"],"answer":0,"explain":"Question positions are filled with the \u003cPAD> ID, and the loss function skips every position whose target is \u003cPAD>."},{"type":"tf","level":2,"prompt":"Masking the question in the targets stops the model from attending to the question.","answer":false,"explain":"Masking only removes question positions from the loss. The inputs are unchanged, so the model still attends to the question while predicting the answer."}]},{"id":"c5-3b","title":"Full fine-tuning an SLM","part":2,"icon":"tune","lab":"course_5/gdm_lab_5_3_fine_tune_all_parameters_of_your_slm.ipynb","goal":"Apply them to harder, hands-on questions.","steps":[{"type":"mcq","level":2,"prompt":"What is catastrophic forgetting?","options":["Dropping the turn delimiters after an epoch","Losing pre-trained knowledge by overfitting new data","The optimizer resetting its state each epoch","Losing progress when GPU memory runs out"],"answer":1,"explain":"If the model fits the small fine-tuning set too closely, the patterns it learned in pre-training can be overwritten."},{"type":"order","level":2,"prompt":"Order the fine-tuning pipeline from the lab.","items":["Load tokenizer and pre-trained model","Load the Africa Galore QA dataset","Format and tokenize each QA pair","Build masked inputs and targets","Pad, shuffle and batch the data","Continue training with model.fit"],"explain":"Data must be formatted, tokenized, aligned into inputs and targets, and batched before the pre-trained model can keep training on it."},{"type":"match","level":2,"prompt":"Match each setting to its value in the lab.","pairs":[["Learning rate","5e-5"],["Starting epochs","50"],["Batch size","4"],["Max sequence length","Read from the pre-trained model"],["Shuffle buffer","The size of the whole dataset"]],"explain":"The lab sets lr 5e-5, starts with 50 epochs, batches of 4, takes max length from model.input_shape, and shuffles across all examples."},{"type":"mcq","level":2,"prompt":"After fine-tuning, why does \"What is Mount Aconcagua?\" still get a poor answer?","options":["None of its training data covers that mountain","The question is longer than the model allows","The learning rate was too low to learn it","The flashcard format has no category for it"],"answer":0,"explain":"Aconcagua is in South America. Neither Africa Galore nor the QA set mentions it, so the SLM has no facts to draw on."},{"type":"mcq","level":2,"prompt":"In pad_sequences, what does padding=\"post\" do?","code":"keras.preprocessing.sequence.pad_sequences(\n    encoded_inputs,\n    maxlen=max_input_length,\n    padding=\"post\",\n    truncating=\"post\",\n    value=tokenizer.pad_token_id)","options":["Adds pad tokens before the real tokens","Pads only after batches are created","Adds pad tokens after the real tokens","Pads targets but leaves inputs alone"],"answer":2,"explain":"\"post\" places the \u003cPAD> tokens after the real tokens, so every sequence reaches the model's maximum length."},{"type":"mcq","level":3,"prompt":"A question encodes to 8 tokens. After masking and shifting, how many \u003cPAD> tokens open the target sequence?","options":["8","9","7","0"],"answer":2,"explain":"The masked sequence starts with 8 pads; targets = masked[1:] drops the first, leaving 7. The 8th target is the first answer token."},{"type":"mcq","level":3,"prompt":"Pre-training used a learning rate of 1e-4. Which fine-tuning rate follows the 10-100× lower guideline?","options":["1e-4","1e-3","5e-4","1e-5"],"answer":3,"explain":"1e-5 is ten times smaller than 1e-4. The others are equal or larger, which raises the risk of catastrophic forgetting."}]},{"id":"c5-4a","title":"Full fine-tuning Gemma","part":1,"icon":"memory","lab":"course_5/gdm_lab_5_4_full_parameter_fine_tuning_of_gemma.ipynb","goal":"Learn the ideas, then try the first checks.","steps":[{"type":"card","title":"A far bigger foundation","body":"Gemma-1B vs your SLM: about 1 billion vs 523,470 parameters; 256,000 vs 3,086 vocabulary tokens; around 2 trillion vs 92,568 training tokens; web text in 140 languages vs the Africa Galore dataset. Fine-tuned, it should handle far more topics."},{"type":"card","title":"Keras handles the prep","body":"Gemma's Keras preprocessor tokenizes, joins each prompt with its response, and masks the prompt from the loss for you. It does not add \u003cstart_of_turn> or \u003cend_of_turn>, so format_qa still supplies them.","code":"data = {\"prompts\": questions,\n        \"responses\": answers}\nmodel = keras_hub.models.Gemma3CausalLM\\\n    .from_preset(\"gemma3_1b\")\nmodel.preprocessor.sequence_length = 400"},{"type":"card","title":"Fits for inference","body":"Gemma-1B has roughly 700M parameters in its transformer blocks and 300M in token embeddings shared by input and output. That takes about 4 GB, so it loads and generates fine on a T4 GPU with about 15 GB. A 27B model would need around 100 GB."},{"type":"card","title":"Fails for training","body":"Training stores far more than the weights: every parameter also needs a gradient plus extra optimizer variables. Calling model.fit on all 1B parameters therefore hits an out-of-memory (OOM) error and crashes the Colab session. The way out is to train far fewer parameters."},{"type":"mcq","level":1,"prompt":"Roughly how many parameters does your SLM have?","options":["About 52 million","About 1 billion","About 523 thousand","About 3 thousand"],"answer":2,"explain":"The lab's table lists 523,470 parameters for the SLM, versus about 1,000,000,000 for Gemma-1B."},{"type":"tf","level":1,"prompt":"The Keras preprocessor excludes prompt tokens from the loss automatically.","answer":true,"explain":"This replaces the manual \u003cPAD> masking of the targets that you did for the SLM in the previous lab."},{"type":"cloze","level":1,"prompt":"Fill in the key that Keras's Gemma expects for the questions.","code":"data = {\n    \"___\": questions,\n    \"responses\": answers,\n}","options":["inputs","prompts","questions","x"],"answer":1,"explain":"The fine-tuning dictionary uses exactly two keys: \"prompts\" for the questions and \"responses\" for the answers."},{"type":"match","level":1,"prompt":"Match each item to its figure from the lab.","pairs":[["Gemma-1B vocabulary","256,000 tokens"],["SLM vocabulary","3,086 tokens"],["Gemma-1B training data","About 2 trillion tokens"],["SLM training data","92,568 tokens"],["T4 GPU memory","About 15 GB"]],"explain":"Gemma's vocabulary is about 80× larger and its training data about 20 million times larger than the SLM's."},{"type":"mcq","level":2,"prompt":"Why should a fine-tuned Gemma-1B handle far more topics than the fine-tuned SLM?","options":["It was pre-trained on far more, and more varied, text","Its fine-tuning dataset is much bigger","It uses a bigger batch size when training","It skips the turn delimiters entirely"],"answer":0,"explain":"Both are fine-tuned on the same small QA set; the difference is Gemma's ~2 trillion pre-training tokens of web text in 140 languages."},{"type":"tf","level":2,"prompt":"The Keras Gemma preprocessor adds \u003cstart_of_turn> and \u003cend_of_turn> for you.","answer":false,"explain":"It tokenizes, concatenates and masks prompts, but the turn delimiters must already be in the strings, which format_qa provides."},{"type":"mcq","level":2,"prompt":"Why does fine-tuning need much more GPU memory than generating text?","options":["It must load the tokenizer a second time","It produces longer outputs than inference","It keeps gradients and optimizer values per parameter","It copies the whole dataset into each layer"],"answer":2,"explain":"Training holds each parameter's gradient and optimizer variables alongside the weights, multiplying memory use."}]},{"id":"c5-4b","title":"Full fine-tuning Gemma","part":2,"icon":"memory","lab":"course_5/gdm_lab_5_4_full_parameter_fine_tuning_of_gemma.ipynb","goal":"Apply them to harder, hands-on questions.","steps":[{"type":"cloze","level":2,"prompt":"Fill in the method that downloads and builds the pre-trained Gemma-1B.","code":"model = keras_hub.models.Gemma3CausalLM\\\n    .___(\"gemma3_1b\")\nmodel.summary()","options":["from_preset","load_weights","fit","compile"],"answer":0,"explain":"from_preset creates the model with its architecture and pre-trained weights in a single call."},{"type":"order","level":2,"prompt":"Order what happens in this lab.","items":["Format the QA pairs with turn delimiters","Build the prompts/responses dictionary","Load Gemma-1B from its preset","Prompt the base model with a question","Call model.fit on all parameters","Hit an out-of-memory error"],"explain":"Data is prepared, the model loads and generates fine, and only the full-parameter training step runs out of memory."},{"type":"mcq","level":2,"prompt":"Prompted with \"What is Jollof rice?\", what does the base Gemma-1B typically produce?","options":["A concise flashcard that opens with Category","Rambling, repetitive text in no flashcard format","An error because the prompt lacks delimiters","Nothing at all until it is fine-tuned"],"answer":1,"explain":"Like your base SLM, base Gemma was trained only on next-token prediction, so its replies are long, repetitive and unformatted."},{"type":"cloze","level":2,"prompt":"Gemma-1B's roughly 300M embedding parameters are ___ between the input and the output layer.","options":["duplicated","frozen","shared","quantized"],"answer":2,"explain":"One embedding matrix both embeds input tokens and scores output tokens, so it is stored only once."},{"type":"mcq","level":3,"prompt":"At about 3.7 GB per billion parameters, roughly how much memory would a 27B model need just to load?","options":["About 27 GB","About 15 GB","About 400 GB","About 100 GB"],"answer":3,"explain":"27 × 3.7 GB ≈ 100 GB, several times the ~15 GB of a T4."},{"type":"mcq","level":3,"prompt":"In 32-bit floats each parameter takes 4 bytes. About how much memory do 1 billion parameters need?","options":["About 1 GB","About 4 GB","About 8 GB","About 32 GB"],"answer":1,"explain":"1,000,000,000 × 4 bytes = 4 billion bytes, about 4 GB (3.7 GB in 1024-based units), matching the lab's figure for Gemma-1B."},{"type":"tf","level":3,"prompt":"If a model fits on a GPU for inference, full-parameter fine-tuning on that GPU will fit too.","answer":false,"explain":"Gemma-1B shows the gap: its ~4 GB of weights load fine on a T4, but training all parameters runs out of memory."}]},{"id":"c5-5a","title":"LoRA from scratch","part":1,"icon":"layers","lab":"course_5/gdm_lab_5_5_implement_lora_for_parameter_efficient_fine_tuning.ipynb","goal":"Learn the ideas, then try the first checks.","steps":[{"type":"card","title":"Freeze W₀, learn ΔW","body":"LoRA (Low-Rank Adaptation) keeps the pre-trained matrix W₀ frozen and learns only an update: W = W₀ + ΔW. The trick is writing ΔW as the product of two thin matrices, ΔW = B·A, which hold far fewer numbers than ΔW itself."},{"type":"card","title":"Low rank, broad rules","body":"B (inputs × r) and A (r × outputs) each encode a few broad rules. In the lab's toy example, zeros in B silence inputs 1 and 2, negatives in B flip the sign of inputs 3 and 6, and 5s in A make outputs 4 and 7 five times larger. Each extra rank adds room for another rule."},{"type":"card","title":"The forward pass","body":"W₀ is stored with trainable=False; A, B and the bias are trainable. B starts as all zeros, so ΔW = 0 and the layer initially behaves exactly like the pre-trained one.","code":"def call(self, x):\n    delta_W = jnp.matmul(\n        jnp.asarray(self.B),\n        jnp.asarray(self.A))\n    W = self.W0 + delta_W\n    return jnp.matmul(x, W) + self.bias"},{"type":"card","title":"Counting the savings","body":"In a 512×512 layer the full matrix has 262,144 weights. With rank 8, A and B hold 8×512 = 4,096 each: 8,192 trainable, about 3.1% (2r/d). Counting the 512 trainable biases gives ≈3.3%. In practice LoRA performs about as well as full fine-tuning."},{"type":"mcq","level":1,"prompt":"What happens to the pre-trained matrix W₀ during LoRA fine-tuning?","options":["It is updated together with A and B","It is replaced by the product B·A","It stays frozen; only LoRA weights train","It is deleted to free up memory"],"answer":2,"explain":"LoRA keeps W₀ fixed (trainable=False) and learns the update ΔW = B·A on top of it."},{"type":"cloze","level":1,"prompt":"LoRA writes the weight update as ΔW = ___, a product of two thin matrices.","options":["B·A","W₀·A","A + B","W₀ − B"],"answer":0,"explain":"ΔW = B·A: B has shape inputs × r and A has shape r × outputs, so their product has the same shape as W₀."},{"type":"tf","level":1,"prompt":"With LoRA, a model's total parameter count rises slightly while its trainable count falls sharply.","answer":true,"explain":"A and B are added on top of W₀, so the total grows, but W₀, the bulk of the weights, is frozen."},{"type":"tf","level":1,"prompt":"In practice, LoRA fine-tuning performs about as well as full-parameter fine-tuning.","answer":true,"explain":"The lab notes little to no loss in performance, while training only a small fraction of the parameters."},{"type":"cloze","level":2,"prompt":"Fill in the missing term in LoraDense's forward pass.","code":"delta_W = jnp.matmul(\n    jnp.asarray(self.B),\n    jnp.asarray(self.A))\nW = self.W0 + ___\ny = jnp.matmul(x, W) + self.bias","options":["self.A","self.B","self.bias","delta_W"],"answer":3,"explain":"The effective weight is the frozen W₀ plus the learned update ΔW; the layer output is then xW + b."},{"type":"tf","level":2,"prompt":"In that toy ΔW, raising inputs 1 and 2 to 100 changes the output.","answer":false,"explain":"B is 0 for inputs 1 and 2, so their rows of ΔW are all zeros and those inputs have no effect at all."},{"type":"mcq","level":2,"prompt":"Why does the lab initialize B with zeros?","options":["So the gradients for A start at zero","So the layer starts by ignoring inputs","So A can stay frozen during training","So ΔW starts at 0 and the layer matches W₀"],"answer":3,"explain":"With B = 0, B·A = 0, so before any update the LoRA layer gives exactly the pre-trained layer's output."},{"type":"mcq","level":2,"prompt":"A layer has 256 inputs and 1024 units. With rank 8, what shape is A in the lab's LoraDense?","options":["(256, 8)","(8, 1024)","(8, 256)","(1024, 8)"],"answer":1,"explain":"A is rank × num_units = (8, 1024) and B is inputs × rank = (256, 8), so B·A has W₀'s shape, (256, 1024)."}]},{"id":"c5-5b","title":"LoRA from scratch","part":2,"icon":"layers","lab":"course_5/gdm_lab_5_5_implement_lora_for_parameter_efficient_fine_tuning.ipynb","goal":"Apply them to harder, hands-on questions.","steps":[{"type":"match","level":2,"prompt":"Match each LoraDense weight to its description.","pairs":[["W0","Frozen copy of the pre-trained weights"],["A","Trainable, rank × outputs, small random init"],["B","Trainable, inputs × rank, zero init"],["bias","Copied from the pre-trained layer, trainable"],["delta_W","Computed as B times A in each forward pass"]],"explain":"Only W₀ is frozen; A, B and the bias train, and ΔW is recomputed from B and A on every call."},{"type":"order","level":2,"prompt":"Order the steps in LoraDense's forward pass.","items":["Compute ΔW = B·A","Add ΔW to W₀ to get W","Multiply the input x by W","Add the bias"],"explain":"The update is built first, merged with the frozen weights, then used like an ordinary dense layer: y = xW + b."},{"type":"mcq","level":2,"prompt":"How would you use LoRA in Keras without writing your own layer?","options":["Wrap the model in keras.LoRA()","Pass lora=True to model.fit()","Set lora_rank on Dense layers","Swap each Dense for SimplifiedDense"],"answer":2,"explain":"Keras's layers.Dense already supports LoRA through lora_rank: None during pre-training, a rank such as 8 for fine-tuning."},{"type":"mcq","level":3,"prompt":"A 512×512 dense layer gets LoRA with rank 8. How many weights do A and B hold together?","options":["4,096","8,192","262,144","65,536"],"answer":1,"explain":"A is 8×512 = 4,096 and B is 512×8 = 4,096, so 8,192 in total, versus 262,144 in the full matrix."},{"type":"mcq","level":3,"prompt":"For a 1024×1024 layer with rank 4, what share of the weights does LoRA train (ignoring biases)?","options":["About 3.1%","About 0.4%","About 0.8%","About 8%"],"answer":2,"explain":"2 × 4 × 1024 = 8,192 trainable out of 1024² = 1,048,576, so 2r/d = 8/1024 ≈ 0.78%."},{"type":"mcq","level":3,"prompt":"What does this print (shown as integers)?","code":"A = jnp.array([[1, 1, 1, 5, 1, 1, 5, 1]])\nB = jnp.array([[0, 0,-1, 1, 1,-1, 1, 1]]).T\ndelta_W = jnp.matmul(B, A)\nx = jnp.ones(8)\nprint(jnp.matmul(x, delta_W))","options":["[2 2 2 10 2 2 10 2]","[8 8 8 40 8 8 40 8]","[1 1 1 5 1 1 5 1]","[0 0 -1 1 1 -1 1 1]"],"answer":0,"explain":"Each output equals (sum of B) × A. B's entries sum to 2, so the result is 2 × A."},{"type":"cloze","level":3,"prompt":"For a d×d layer with rank r, LoRA's trainable share (ignoring bias) is ___.","options":["2r/d","r/d","r²/d²","d/(2r)"],"answer":0,"explain":"A and B hold r·d weights each, 2rd in total, out of d²: 2rd/d² = 2r/d. For d = 512 and r = 8 that is 3.125%."}]},{"id":"c5-6a","title":"Fine-tune Gemma with LoRA","part":1,"icon":"rocket","lab":"course_5/gdm_lab_5_6_fine_tune_gemma_with_lora.ipynb","goal":"Learn the ideas, then try the first checks.","steps":[{"type":"card","title":"LoRA in one line","body":"Keras's Gemma has LoRA built in. After rank-4 LoRA is enabled, the summary shows the total parameter count up slightly but only a small fraction trainable, which is what lets Gemma-1B fine-tune on a T4 GPU.","code":"model = keras_hub.models.Gemma3CausalLM\\\n    .from_preset(\"gemma3_1b\")\nmodel.backbone.enable_lora(rank=4)\nmodel.summary()"},{"type":"card","title":"Three probe questions","body":"\"What is Kente cloth?\" is in the fine-tuning set. \"What is the tallest mountain in Africa?\" is new but on a covered topic. \"What is Mount Aconcagua?\" lies outside the fine-tuning data. A callback prints answers to all three after every epoch."},{"type":"card","title":"Picking a learning rate","body":"For models like Gemma, try learning rates from 1e-4 down to 1e-6 and 1-20 epochs; lower rates need more epochs. In the lab's logs, 2e-5 gave stable, factual answers after about 7-8 of 10 epochs, while 1e-4 and higher produced fluent answers containing factual errors."},{"type":"card","title":"Pre-training + fine-tuning","body":"After fine-tuning, Gemma answers even about Aconcagua in flashcard format: the facts come from ~2 trillion pre-training tokens, the format from a small QA set. Forgetting can be subtle, so pick validation prompts you could judge as an expert."},{"type":"cloze","level":1,"prompt":"Fill in the call that switches on rank-4 LoRA.","code":"model.backbone.___(rank=4)","options":["add_lora","enable_lora","freeze","compile"],"answer":1,"explain":"enable_lora on the backbone adds low-rank matrices to the model's layers and freezes the original weights."},{"type":"tf","level":1,"prompt":"After LoRA fine-tuning, Gemma answered in flashcard format even on topics absent from Africa Galore QA.","answer":true,"explain":"It combined facts from pre-training with the format learned from the fine-tuning examples, as with Mount Aconcagua."},{"type":"mcq","level":2,"prompt":"After enable_lora(rank=4), how does model.summary() change?","options":["Total and trainable both drop a lot","Total halves; trainable stays the same","Nothing changes until training starts","Total rises slightly; trainable drops a lot"],"answer":3,"explain":"LoRA adds a few new weights, so the total goes up, and freezes the pre-trained ones, so the trainable count goes down."},{"type":"mcq","level":2,"prompt":"Which evaluation prompt checks knowledge absent from the fine-tuning data?","options":["What is Kente cloth?","What is the tallest mountain in Africa?","What is Mount Aconcagua?","What is Jollof rice?"],"answer":2,"explain":"Aconcagua is a South American mountain that Africa Galore QA never covers, so a good answer must come from pre-training."},{"type":"tf","level":2,"prompt":"A higher learning rate reaches good results faster, so it is always the safer choice.","answer":false,"explain":"High rates looked fine at a glance but damaged pre-trained facts, such as false claims about Kilimanjaro at 1e-4."},{"type":"tf","level":2,"prompt":"Catastrophic forgetting can be subtle: fluent, confident answers that contain wrong facts.","answer":true,"explain":"The lab's 1e-4 run sounded convincing yet invented facts, which is why expert-checkable validation prompts matter."},{"type":"mcq","level":2,"prompt":"If you lower the learning rate, what usually has to change?","options":["Train for more epochs","Use a higher LoRA rank","Drop the turn delimiters","Use fewer test prompts"],"answer":0,"explain":"Smaller steps mean more updates are needed to learn the task, so lower learning rates generally require more epochs."},{"type":"cloze","level":2,"prompt":"Fill in the callback that prints the three probe answers each epoch.","code":"training_history = model.fit(\n    data,\n    epochs=num_epochs,\n    batch_size=1,\n    verbose=1,\n    callbacks=[___],\n)","options":["evaluation_callback","format_question","training_logs","model.optimizer"],"answer":0,"explain":"EvaluationCallback.on_epoch_end generates answers to the three evaluation prompts so you can watch format and facts emerge."}]},{"id":"c5-6b","title":"Fine-tune Gemma with LoRA","part":2,"icon":"rocket","lab":"course_5/gdm_lab_5_6_fine_tune_gemma_with_lora.ipynb","goal":"Apply them to harder, hands-on questions.","steps":[{"type":"cloze","level":2,"prompt":"format_question wraps only the ___ turn, which is how prompts are built for evaluation.","options":["model","category","system","user"],"answer":3,"explain":"It returns f\"{sot}user\\n{question}{eot}\\n\"; the fine-tuned model is expected to write the model turn itself."},{"type":"order","level":2,"prompt":"Order the lab's workflow.","items":["Format the QA data into a dict","Load Gemma-1B from its preset","Prompt the base model","Enable LoRA with rank 4","Set learning rate and epochs","Fine-tune with an evaluation callback"],"explain":"You first see the base model's behaviour, then add LoRA, choose hyperparameters, and watch fine-tuning through the probes."},{"type":"match","level":2,"prompt":"Match each probe question to what it tests.","pairs":[["What is Kente cloth?","A question found in the fine-tuning data"],["Africa's tallest peak?","A new question on a covered topic"],["What is Mount Aconcagua?","A topic missing from the fine-tuning data"],["What is Python?","An extra probe far from African culture"]],"explain":"Together they separate memorizing the fine-tuning set, generalizing within its topics, and drawing on pre-trained knowledge."},{"type":"mcq","level":2,"prompt":"Why does LoRA fine-tuning fit on the T4 when full fine-tuning did not?","options":["LoRA moves the frozen weights to the CPU","LoRA cuts every sequence to 100 tokens","Only the small LoRA matrices need gradients","LoRA removes the embedding layer while training"],"answer":2,"explain":"The frozen weights still sit in memory, but gradients and optimizer state are needed only for the few trainable LoRA weights."},{"type":"mcq","level":3,"prompt":"Which learning rate does the lab's solution recommend for 10 epochs of LoRA on Gemma-1B?","options":["1e-3","1e-4","2e-5","5e-4"],"answer":2,"explain":"At 2e-5 the answers stabilised after 7-8 epochs and stayed factual; 1e-4 and higher introduced factual errors."},{"type":"mcq","level":3,"prompt":"Before fine-tuning, base Gemma gets a formatted question. What will you most likely see?","options":["A short answer opening with Category","Repetitive text with no Category line","An error about unknown turn tokens","Only \u003cend_of_turn> and nothing else"],"answer":1,"explain":"The base model never learned the flashcard format; it often repeats itself or even writes more questions."},{"type":"mcq","level":3,"prompt":"Which setup sits inside the lab's suggested ranges for fine-tuning Gemma?","options":["Learning rate 2e-5 for 10 epochs","Learning rate 1e-2 for 10 epochs","Learning rate 2e-5 for 200 epochs","Learning rate 1e-3 for 50 epochs"],"answer":0,"explain":"The lab suggests rates between 1e-4 and 1e-6 and roughly 1-20 epochs; only 2e-5 for 10 epochs fits both."}]}]},{"id":"c7","title":"Accelerate Your Model","blurb":"AI Research Foundations · Course 7","repo":"ai-foundations","sessions":[{"id":"c7-1a","title":"Small vs large models","part":1,"icon":"scale","lab":"course_7/gdm_lab_7_1_compare_models_of_different_sizes.ipynb","goal":"Learn the ideas, then try the first checks.","steps":[{"type":"card","title":"Same prompts, two sizes","body":"The lab feeds ten identical prompts to the pre-trained (not instruction-tuned) Gemma-1B and Gemma-4B, using greedy decoding and 50 new tokens each, and times each loop. With every setting held fixed, the differences come from model size alone."},{"type":"card","title":"Bigger: better but slower","body":"Gemma-4B usually recalls facts more accurately and writes more nuanced text, for instance on the proverb \"A roaring lion kills no game\", where wild coffee originated, and the world's deepest river. But it takes considerably longer to generate."},{"type":"card","title":"Choose for the task","body":"There is no single best model. Prefer a larger one when quality, accuracy and detail are paramount; prefer a smaller one when speed matters and good-enough answers are acceptable, as in a real-time chatbot. It is always a balance between needs and resources."},{"type":"card","title":"The generation loop","body":"Each loop is timed with time.time_ns(), which returns nanoseconds; dividing by 1,000,000,000 gives seconds. Before loading Gemma-4B, the lab deletes Gemma-1B with del to free GPU memory.","code":"for p in list_of_prompts:\n    out, logits, tok = (\n        generation.prompt_transformer_model(\n            p, max_new_tokens=50,\n            loaded_model=gemma_1b_model,\n            sampling_mode=\"greedy\"))\n    generations_gemma_1b.append(out)"},{"type":"mcq","level":1,"prompt":"Which model generated its ten answers faster?","options":["Gemma-4B","Gemma-1B","Both took the same time","It varied randomly"],"answer":1,"explain":"Fewer parameters mean less computation per token, so the 1B model finishes the loop sooner."},{"type":"tf","level":1,"prompt":"Gemma-4B tended to give more factually accurate answers than Gemma-1B.","answer":true,"explain":"Its larger parameter count lets it store and recall more facts, at the cost of slower generation."},{"type":"cloze","level":1,"prompt":"Before loading Gemma-4B, the lab runs `___ gemma_1b_model` to free memory.","options":["del","free","clear","drop"],"answer":0,"explain":"Python's del removes the reference to the 1B model, so its GPU memory can be reclaimed for the larger model."},{"type":"match","level":1,"prompt":"Match each item to its description.","pairs":[["Gemma-1B","Faster, good-enough quality"],["Gemma-4B","Slower, better factual recall"],["Greedy decoding","Takes the most likely token every step"],["max_new_tokens","Caps how many tokens are generated"],["time.time_ns()","Current time in nanoseconds"]],"explain":"The lab compares two Gemma sizes under fixed decoding settings and measures elapsed time in nanoseconds."},{"type":"mcq","level":1,"prompt":"Which kind of Gemma models does this lab compare?","options":["The original pre-trained models","Instruction-tuned chat models","Models fine-tuned on flashcards","Models distilled from Gemma-27B"],"answer":0,"explain":"The lab uses the original pre-trained Gemma-1B and Gemma-4B, not variants instruction-tuned for dialogue."},{"type":"mcq","level":2,"prompt":"Which prompt does the lab cite as one where Gemma-4B did better?","options":["The national flower of South Africa is","The tallest mountain in Africa is","The Maasai ethnic group originate from","What 'A roaring lion kills no game' means"],"answer":3,"explain":"The lab highlights the proverb, the origin of wild coffee and the world's deepest river as cases where Gemma-4B was more accurate or nuanced."},{"type":"tf","level":2,"prompt":"Running both models on the same prompts with the same decoding settings makes the comparison fair.","answer":true,"explain":"Holding prompts, token budget and greedy decoding fixed isolates model size as the one thing that differs."}]},{"id":"c7-1b","title":"Small vs large models","part":2,"icon":"scale","lab":"course_7/gdm_lab_7_1_compare_models_of_different_sizes.ipynb","goal":"Apply them to harder, hands-on questions.","steps":[{"type":"cloze","level":2,"prompt":"Fill in the divisor that turns nanoseconds into seconds.","code":"before_loop = time.time_ns()\n# ... generate for every prompt ...\nafter_loop = time.time_ns()\nduration_ns = after_loop - before_loop\ntotal_seconds = duration_ns / ___","options":["1_000_000","1_000","1_000_000_000","60"],"answer":2,"explain":"One second is 10⁹ nanoseconds, so dividing the time.time_ns() difference by 1,000,000,000 gives seconds."},{"type":"mcq","level":2,"prompt":"Why does the lab use greedy decoding for both models?","options":["To remove sampling randomness from the test","Because Gemma cannot sample randomly","Because greedy decoding saves GPU memory","Because it makes the larger model faster"],"answer":0,"explain":"Greedy decoding is deterministic, so differences between the outputs reflect the models rather than luck in sampling."},{"type":"order","level":2,"prompt":"Order the lab's steps.","items":["Load Gemma-1B","Time Gemma-1B on the ten prompts","Delete Gemma-1B to free memory","Load Gemma-4B","Time Gemma-4B on the same prompts","Compare speed and quality side by side"],"explain":"Each model is loaded and timed in turn, with the 1B model removed first so the 4B one fits; then the outputs are compared."},{"type":"cloze","level":2,"prompt":"Larger models usually trade ___ for quality.","options":["accuracy","coherence","speed","detail"],"answer":2,"explain":"Gemma-4B gave higher-quality text but took considerably longer than Gemma-1B to generate it."},{"type":"mcq","level":3,"prompt":"The lab prints whole minutes (\"minute\" when 1) and seconds to 2 decimals. What does it show here?","code":"total_seconds = 95_000_000_000 / 1e9\nminutes = int(total_seconds // 60)\nseconds = total_seconds % 60","options":["Duration: 95.00 seconds","Duration: 1 minute 35.00 seconds","Duration: 1 minutes 35.00 seconds","Duration: 1.58 minutes"],"answer":1,"explain":"95 // 60 = 1 whole minute and 95 % 60 = 35 seconds; because minutes equals 1, the singular \"minute\" is used."},{"type":"mcq","level":3,"prompt":"Your app must reply instantly on modest hardware, and approximate answers are fine. Which fits the lab's takeaway?","options":["Gemma-4B, since bigger is always better","Either; size does not affect speed","Gemma-4B, since it needs less memory","Gemma-1B, for speed and efficiency"],"answer":3,"explain":"When latency and resources matter more than top accuracy, the smaller model is the sensible trade-off."},{"type":"tf","level":3,"prompt":"The best model is always the largest one you can afford to run.","answer":false,"explain":"The lab stresses that the right choice depends on the task: a larger model's quality must be weighed against its speed and cost."}]},{"id":"c7-2a","title":"Estimating training FLOPs","part":1,"icon":"gauge","lab":"course_7/gdm_lab_7_2_estimate_training_flops.ipynb","goal":"Learn the ideas, then try the first checks.","steps":[{"type":"card","title":"FLOPs vs FLOPS","body":"A FLOP is one floating-point operation, such as a multiply or an add. FLOPs (small s) counts the total work for a job; FLOPS (capital S) is a speed, operations per second. A job of 1,000 FLOPs on hardware running at 100 FLOPS takes 10 seconds."},{"type":"card","title":"The 6·P·N rule","body":"For one epoch, FLOPs ≈ 6 × P × N, with P trainable parameters and N training tokens. The forward pass costs about 2PN (a multiply and an add per parameter per token); the backward pass about 4PN, roughly twice the forward.","code":"def compute_num_flops(param_count,\n                      num_tokens):\n    return 6 * param_count * num_tokens"},{"type":"card","title":"Why estimate first?","body":"A FLOPs estimate made before training tells you roughly what it will cost, whether your hardware can handle it, and how long it may take: divide the FLOPs by the hardware's FLOPS."},{"type":"card","title":"Real-world scale","body":"BERT-base (110M params, 3.3B tokens) ≈ 2.18e18 FLOPs. T5-large (770M, 1T) ≈ 4.62e21. Gemma-1B on Africa Galore (1B, 30K) ≈ 1.8e14. PaLM (540B, 780B) ≈ 2.53e24. Cost is linear in P and in N, so 10× either one means 10× the FLOPs."},{"type":"mcq","level":1,"prompt":"What does FLOPS, with a capital S, measure?","options":["Total operations needed to train a model","Bytes of memory a GPU can hold","Operations a device performs per second","Tokens a model processes per epoch"],"answer":2,"explain":"The capital S means \"per second\": FLOPS is a speed. FLOPs with a small s is a total count of operations."},{"type":"cloze","level":1,"prompt":"Fill in the factor in the lab's FLOPs estimate for one epoch.","code":"def compute_num_flops(\n    param_count: float, num_tokens: float\n) -> float:\n    total_flops = (\n        ___ * param_count * num_tokens)\n    return total_flops","options":["6","2","4","3"],"answer":0,"explain":"FLOPs ≈ 6 × P × N: about 2PN for the forward pass plus about 4PN for the backward pass."},{"type":"cloze","level":1,"prompt":"In Python scientific notation, 2.5 billion is written ___.","options":["2.5e9","2.5e6","25e9","2.5e12"],"answer":0,"explain":"e9 means × 10⁹, a billion, so 2.5e9 = 2,500,000,000."},{"type":"mcq","level":2,"prompt":"Why is the backward pass estimated at about 4 × P × N FLOPs?","options":["It repeats the forward pass four times","Computing gradients costs about twice the forward pass","It updates four optimizer states per weight","Each weight is read from memory four times"],"answer":1,"explain":"Backpropagation computes gradients for both activations and weights, roughly double the forward pass's 2PN."},{"type":"tf","level":2,"prompt":"Doubling the number of training tokens roughly doubles the estimated FLOPs.","answer":true,"explain":"FLOPs ≈ 6PN is linear in N, so twice the tokens means twice the compute."},{"type":"tf","level":2,"prompt":"A GPU rated at 200 TeraFLOPS can perform 200 trillion operations in total over its lifetime.","answer":false,"explain":"TeraFLOPS is a rate: 200 trillion floating-point operations every second."},{"type":"cloze","level":2,"prompt":"The forward pass costs about ___ × P × N FLOPs: one multiply and one add per parameter per token.","options":["4","2","6","1"],"answer":1,"explain":"Each parameter takes part in a multiply-accumulate, that is two operations, for every token."},{"type":"match","level":2,"prompt":"Match each symbol or term to its meaning.","pairs":[["P","Number of trainable parameters"],["N","Number of tokens in the training set"],["2·P·N","Approximate forward-pass FLOPs"],["4·P·N","Approximate backward-pass FLOPs"],["FLOPS","Floating-point operations per second"]],"explain":"Adding the forward (2PN) and backward (4PN) costs gives the 6PN rule for one epoch."}]},{"id":"c7-2b","title":"Estimating training FLOPs","part":2,"icon":"gauge","lab":"course_7/gdm_lab_7_2_estimate_training_flops.ipynb","goal":"Apply them to harder, hands-on questions.","steps":[{"type":"mcq","level":2,"prompt":"On the lab's log-scale sliders, moving log_param_count from 9 to 10 does what to FLOPs?","options":["Adds 10 to them","Multiplies them by 100","Raises them by 10%","Multiplies them by 10"],"answer":3,"explain":"Each slider step is a factor of 10 in parameters, and FLOPs grow linearly with P, so they grow 10×."},{"type":"mcq","level":2,"prompt":"In FLOPs ≈ 6 × P × N for one epoch, what is N?","options":["Number of training examples","Number of epochs to run","Total tokens in the training dataset","Size of the vocabulary"],"answer":2,"explain":"N counts tokens, not examples or epochs: each token goes through one forward and one backward pass per epoch."},{"type":"mcq","level":3,"prompt":"Estimate the FLOPs to train a 1-billion-parameter model on 20 billion tokens for one epoch.","options":["1.2e19","2.0e19","1.2e21","1.2e20"],"answer":3,"explain":"6 × 1e9 × 2e10 = 12e19 = 1.2e20 FLOPs."},{"type":"mcq","level":3,"prompt":"Gemma-1B on Africa Galore needs about 1.8e14 FLOPs. On hardware sustaining 1e14 FLOPS, roughly how long is that?","options":["About 1.8 seconds","About 18 seconds","About 0.18 seconds","About 3 minutes"],"answer":0,"explain":"Time = FLOPs ÷ FLOPS = 1.8e14 ÷ 1e14 = 1.8 seconds, ignoring real-world inefficiencies."},{"type":"mcq","level":3,"prompt":"A 70-billion-parameter model trains on 1.5 trillion tokens. About how many FLOPs is one epoch?","options":["1.05e23","6.3e22","6.3e23","4.2e23"],"answer":2,"explain":"6 × 7e10 × 1.5e12 = 63e22 = 6.3e23. Forgetting the factor 6 would give 1.05e23."},{"type":"order","level":3,"prompt":"Order these training runs from fewest to most FLOPs.","items":["Gemma-1B on Africa Galore (1B, 30K tokens)","BERT-base (110M params, 3.3B tokens)","T5-large (770M params, 1T tokens)","PaLM (540B params, 780B tokens)"],"explain":"6PN gives about 1.8e14, 2.2e18, 4.6e21 and 2.5e24 FLOPs respectively."},{"type":"tf","level":3,"prompt":"Training for 3 epochs would take roughly 18 × P × N FLOPs.","answer":true,"explain":"6PN is the cost of one pass over the data; three passes cost about three times as much, 18PN."}]},{"id":"c7-3a","title":"Hitting the memory wall","part":1,"icon":"chip","lab":"course_7/gdm_lab_7_3_hitting_a_wall.ipynb","goal":"Learn the ideas, then try the first checks.","steps":[{"type":"card","title":"The plan: Gemma-4B","body":"In course 5, LoRA made fine-tuning Gemma-1B possible on a T4 GPU. The obvious next step is the same recipe on the 4-billion-parameter Gemma-4B, the model that gave better answers in the size-comparison lab."},{"type":"card","title":"RESOURCE_EXHAUSTED","body":"Loading the gemma3_4b_text preset with default 32-bit floats fails before training even starts. RESOURCE_EXHAUSTED is the GPU's out-of-memory (OOM) error, and the message says how much memory it tried to allocate.","code":"model = keras_hub.models.Gemma3CausalLM\\\n    .from_preset(preset=\"gemma3_4b_text\")\n# RESOURCE_EXHAUSTED: out of memory"},{"type":"card","title":"LoRA can't help here","body":"LoRA shrinks what you train, not what you store: all 4 billion frozen weights must still sit in GPU memory. At 4 bytes each that is 16 billion bytes, about 14.9 GB, which is essentially the whole T4 before any data, activations or gradients."},{"type":"card","title":"Getting past the wall","body":"Memory is the bottleneck, and it can be attacked: store numbers in fewer bits (bfloat16), train fewer parameters (LoRA), and keep real batches small while simulating big ones (gradient accumulation). The size-comparison lab quietly used such tricks to load Gemma-4B."},{"type":"mcq","level":1,"prompt":"What does a RESOURCE_EXHAUSTED error from the GPU mean?","options":["The dataset failed to download","The preset name is misspelled","The training loss became infinite","The GPU ran out of memory"],"answer":3,"explain":"RESOURCE_EXHAUSTED is the technical name for an out-of-memory (OOM) error; it also reports how much it tried to allocate."},{"type":"cloze","level":1,"prompt":"In 32-bit floating point, each parameter takes ___ bytes.","options":["2","4","8","32"],"answer":1,"explain":"A byte is 8 bits, so 32 bits = 4 bytes per number."},{"type":"cloze","level":1,"prompt":"Fill in the preset that loads the text-only Gemma-4B.","code":"model = keras_hub.models.Gemma3CausalLM\\\n    .from_preset(preset=\"___\")\nmodel.summary()","options":["gemma3_4b_text","gemma3_1b","gemma3_27b","gemma3_4b_lora"],"answer":0,"explain":"\"gemma3_4b_text\" is the Keras Hub preset for Gemma-4B; \"gemma3_1b\" was the smaller model from course 5."},{"type":"mcq","level":2,"prompt":"When did the attempt to use Gemma-4B in 32-bit precision fail?","options":["While loading the model's weights","During the first training epoch","While LoRA was being enabled","While the dataset was formatted"],"answer":0,"explain":"It failed before training began: the 32-bit weights alone did not fit in the GPU's memory."},{"type":"tf","level":2,"prompt":"LoRA reduces the memory needed to hold the frozen pre-trained weights.","answer":false,"explain":"LoRA cuts what you train, not what you store: every frozen weight must still be loaded onto the GPU."},{"type":"tf","level":2,"prompt":"The size-comparison lab could load Gemma-4B because it quietly used memory-saving techniques.","answer":true,"explain":"This lab notes that the earlier loader already applied efficiency techniques in the background."},{"type":"mcq","level":2,"prompt":"Which memory costs does LoRA actually shrink?","options":["Gradients and optimizer states","The frozen pre-trained weights","The input batch of token IDs","The tokenizer's vocabulary"],"answer":0,"explain":"Training extras are needed only for trainable weights, and with LoRA those are just the small low-rank matrices."}]},{"id":"c7-3b","title":"Hitting the memory wall","part":2,"icon":"chip","lab":"course_7/gdm_lab_7_3_hitting_a_wall.ipynb","goal":"Apply them to harder, hands-on questions.","steps":[{"type":"order","level":2,"prompt":"Order what happens in this lab.","items":["Format the flashcard dataset","Load Gemma-4B in 32-bit precision","Get a RESOURCE_EXHAUSTED error","Reflect on what fills GPU memory"],"explain":"Data preparation succeeds; the run stops at model loading with an OOM, which motivates studying where memory goes."},{"type":"match","level":2,"prompt":"Match each technique to how it saves memory.","pairs":[["bfloat16","Halves the bytes per stored number"],["LoRA","Shrinks the set of trainable weights"],["Gradient accumulation","Large effective batch from small batches"],["Smaller model","Fewer weights to store in the first place"]],"explain":"These are the levers for getting past the memory wall on a single T4 GPU."},{"type":"mcq","level":2,"prompt":"Why do bigger models hit the memory wall first?","options":["Bigger models need longer prompts","Bigger models use larger tokenizers","Bigger models must train for more epochs","Weight memory grows with parameter count"],"answer":3,"explain":"Weight memory is parameters × bytes each, so a 4B model needs four times the memory of a 1B model."},{"type":"cloze","level":2,"prompt":"An OOM while loading means the model's ___ alone don't fit.","options":["gradients","activations","weights","batches"],"answer":2,"explain":"At load time nothing is being trained, so no gradients or optimizer states exist yet; only the weights are being placed in memory."},{"type":"mcq","level":3,"prompt":"How many bytes do 4 billion parameters take in 32-bit floats?","options":["4 billion bytes","8 billion bytes","16 billion bytes","128 billion bytes"],"answer":2,"explain":"32 bits = 4 bytes, so 4e9 × 4 = 16e9 bytes, about 14.9 GB in 1024-based units."},{"type":"mcq","level":3,"prompt":"A T4 has about 15 GB and JAX may use 90% of it. Gemma-4B's 32-bit weights need ~14.9 GB. Can it load?","options":["Yes: 14.9 GB is just under 15 GB","No: weights exceed the ~13.5 GB usable","Yes: LoRA keeps most weights off the GPU","No: the tokenizer alone is too big"],"answer":1,"explain":"0.9 × 15 GB ≈ 13.5 GB, less than the 14.9 GB of weights, and inputs and activations would need more on top."},{"type":"tf","level":3,"prompt":"Storing Gemma-4B in 16-bit numbers instead would cut its weights to about 8 billion bytes.","answer":true,"explain":"16 bits = 2 bytes, so 4e9 × 2 = 8e9 bytes (≈7.45 GB), half the 32-bit size. This is the idea behind bfloat16."}]},{"id":"c7-4a","title":"Estimating GPU memory","part":1,"icon":"memory","lab":"course_7/gdm_lab_7_4_estimate_gpu_memory.ipynb","goal":"Learn the ideas, then try the first checks.","steps":[{"type":"card","title":"Five things on the GPU","body":"Training must fit five things in GPU memory: model parameters, the input batch and activations, which inference needs too, plus gradients and optimizer states, which only training needs. If their sum exceeds the GPU's capacity, you get an out-of-memory error."},{"type":"card","title":"Per-parameter costs","body":"Gradients store one number per parameter, and Adam keeps two states per parameter. So training needs at least 4× the bytes of the weights alone. Input memory is just token IDs.","code":"params = P * bytes_per_param\ngrads = P * bytes_per_param\nadam = 2 * P * bytes_per_param\ninputs = batch * max_len * bytes_per_id"},{"type":"card","title":"Activations","body":"Each layer outputs an embedding-sized vector per token, and training keeps every layer's output for the backward pass: batch × length × layers × embedding dim × bytes. For the lab's Gemma-4B setup that is 8 × 1024 × 32 × 2560 × 4 bytes = 2.5 GB."},{"type":"card","title":"The verdict for Gemma-4B","body":"In float32 (1 GB = 1024³ bytes): parameters 14.90, gradients 14.90, Adam 29.80, activations 2.50, inputs ≈0. Inference ≈ 17.4 GB; training ≈ 62.1 GB, far above a ~16 GB GPU. bfloat16 (2 bytes) halves everything: ≈ 8.7 and ≈ 31.05 GB."},{"type":"mcq","level":1,"prompt":"Which two memory components are needed only during training?","options":["Parameters and activations","Input batch and parameters","Gradients and optimizer states","Activations and input batch"],"answer":2,"explain":"Inference needs parameters, inputs and activations; training adds a gradient per parameter and the optimizer's states."},{"type":"cloze","level":1,"prompt":"Fill in the factor for Adam's optimizer states.","code":"def calculate_optimizer_memory(\n        param_count, bytes_per_param):\n    total_bytes = (___ * param_count\n                   * bytes_per_param)\n    return formatting.bytes_to_gb(\n        total_bytes)","options":["2","1","4","3"],"answer":0,"explain":"Adam stores two values per parameter, so its memory is 2 × parameters × bytes per parameter."},{"type":"mcq","level":1,"prompt":"How does the lab's bytes_to_gb convert bytes to gigabytes?","options":["Divides by 1000","Multiplies by 1024³","Divides by 1024³","Divides by 8"],"answer":2,"explain":"It returns num_bytes / (1024**3), so 1 GB here means 1,073,741,824 bytes."},{"type":"tf","level":2,"prompt":"Running inference requires memory for gradients too.","answer":false,"explain":"Gradients are only computed to update weights. Inference needs parameters, inputs and activations."},{"type":"tf","level":2,"prompt":"Changing every component from 4 to 2 bytes per number halves the total estimate.","answer":true,"explain":"Each formula is linear in the bytes per number, so halving it halves every component and the total."},{"type":"cloze","level":2,"prompt":"Fill in the missing factor of the activation-memory formula.","code":"total_bytes = (batch_size * max_length\n               * ___ * embedding_dim\n               * bytes_per_param)","options":["param_count","vocab_size","num_layers","num_heads"],"answer":2,"explain":"Activations are kept for every layer for the backward pass, so the per-sequence cost is multiplied by the number of layers."},{"type":"cloze","level":2,"prompt":"Fill in the last factor of the input-batch memory.","code":"total_bytes = (batch_size * max_length\n               * ___)","options":["embedding_dim","bytes_per_token_id","num_layers","param_count"],"answer":1,"explain":"The input batch is just token IDs: batch × length of them, each taking bytes_per_token_id bytes."},{"type":"mcq","level":2,"prompt":"Why are every layer's activations kept during training?","options":["They are reused as inputs for the next batch","The optimizer stores them as its two states","They speed up loading the model's weights","The backward pass needs them for gradients"],"answer":3,"explain":"Backpropagation works back through each layer and needs that layer's stored forward-pass outputs."}]},{"id":"c7-4b","title":"Estimating GPU memory","part":2,"icon":"memory","lab":"course_7/gdm_lab_7_4_estimate_gpu_memory.ipynb","goal":"Apply them to harder, hands-on questions.","steps":[{"type":"match","level":2,"prompt":"Match each component to its memory formula.","pairs":[["Parameters","P × bytes, needed even for inference"],["Gradients","P × bytes, training only"],["Adam states","2 × P × bytes, training only"],["Input batch","batch × length × bytes per token ID"],["Activations","batch × length × layers × dim × bytes"]],"explain":"Three components scale with the parameter count; inputs and activations scale with batch size and sequence length."},{"type":"mcq","level":3,"prompt":"Activations: batch 8, length 1024, 32 layers, embedding 2560, 4 bytes each. About how much memory? (1 GB = 1024³ bytes)","options":["0.31 GB","2.5 GB","0.08 GB","20 GB"],"answer":1,"explain":"8 × 1024 × 32 × 2560 × 4 = 2,684,354,560 bytes, exactly 2.5 GB. Leaving out the batch gives 0.31; leaving out layers gives 0.08."},{"type":"mcq","level":3,"prompt":"How much memory do 1 billion float32 parameters take? (1 GB = 1024³ bytes)","options":["≈ 1.00 GB","≈ 7.45 GB","≈ 32.0 GB","≈ 3.73 GB"],"answer":3,"explain":"1e9 × 4 bytes = 4e9 bytes, and 4e9 ÷ 1,073,741,824 ≈ 3.73 GB."},{"type":"mcq","level":3,"prompt":"Gemma-4B in bfloat16 (2 bytes per number): how much memory do Adam's optimizer states need?","options":["≈ 14.9 GB","≈ 7.45 GB","≈ 29.8 GB","≈ 3.73 GB"],"answer":0,"explain":"2 states × 4e9 parameters × 2 bytes = 16e9 bytes ≈ 14.9 GB, the biggest single item even in bfloat16."},{"type":"mcq","level":3,"prompt":"Total float32 memory to fine-tune all of Gemma-4B in the lab's setup is about:","options":["62 GB","17 GB","45 GB","30 GB"],"answer":0,"explain":"14.90 (params) + 14.90 (grads) + 29.80 (Adam) + 2.50 (activations) + ~0 (inputs) ≈ 62.1 GB. 17.4 GB is inference only."},{"type":"order","level":3,"prompt":"Rank these Gemma-4B float32 components from largest to smallest.","items":["Adam optimizer states","Model parameters","Activations","Input token IDs"],"explain":"Adam ≈ 29.8 GB, parameters ≈ 14.9 GB, activations 2.5 GB, and the input IDs only about 0.00003 GB."},{"type":"tf","level":3,"prompt":"With bfloat16, Gemma-4B inference (~8.7 GB) fits on a 16 GB GPU, but full training (~31 GB) still does not.","answer":true,"explain":"Halving the bytes makes inference fit, but full training still needs about twice the GPU, hence LoRA and other tricks."}]},{"id":"c7-5a","title":"Fine-tuning in bfloat16","part":1,"icon":"spark","lab":"course_7/gdm_lab_7_5_fine_tune_a_model_with_bfloat16.ipynb","goal":"Learn the ideas, then try the first checks.","steps":[{"type":"card","title":"One argument to load it","body":"bfloat16 stores each number in 16 bits (2 bytes) instead of 32, halving the memory for weights. That single change lets Gemma-4B load on a T4. Printing a layer's kernel dtype, such as the query projection in decoder_block_0, confirms the format.","code":"model = keras_hub.models.Gemma3CausalLM\\\n    .from_preset(\"gemma3_4b_text\",\n                 dtype=\"bfloat16\")"},{"type":"card","title":"Still need LoRA","body":"Even in bfloat16, full fine-tuning won't fit. With rank-4 LoRA enabled, gradients and optimizer states are needed only for the small low-rank matrices, so the 4B model trains on one T4 at batch size 1."},{"type":"card","title":"Stable low-precision training","body":"Less precise numbers make training touchier, so the lab uses settings found to be stable: AdamW with a small learning rate, light weight decay, beta_2 of 0.95, and clipnorm 0.5 to cap gradient size. It trains for 4 epochs.","code":"optimizer = keras.optimizers.AdamW(\n    learning_rate=5e-5,\n    weight_decay=0.01,\n    beta_1=0.9, beta_2=0.95,\n    epsilon=1e-6,\n    clipnorm=0.5,\n)"},{"type":"card","title":"Watching the epochs","body":"Three probes: Kente cloth (in the data), Kilimanjaro without \"Mount\" (generalization), and Tokyo (absent from the data, so pre-trained knowledge). Epoch 1 was unstable, with a looping \"KMnO4\" token and repeated \"Category:\" lists, but by epoch 4 the answers were fluent, factual and well formatted."},{"type":"cloze","level":1,"prompt":"Fill in the dtype that halves the memory for Gemma-4B's weights.","code":"model = keras_hub.models.Gemma3CausalLM\\\n    .from_preset(\"gemma3_4b_text\",\n                 dtype=\"___\")","options":["float32","int8","bfloat16","float64"],"answer":2,"explain":"Passing dtype=\"bfloat16\" loads every parameter as a 16-bit number instead of the default 32-bit float."},{"type":"mcq","level":1,"prompt":"How much storage does bfloat16 use per number?","options":["32 bits (4 bytes)","16 bits (2 bytes)","8 bits (1 byte)","64 bits (8 bytes)"],"answer":1,"explain":"The 16 in bfloat16 is its bit width: 2 bytes, half of float32's 4."},{"type":"tf","level":1,"prompt":"Training in low precision can be more sensitive, so stable optimizer settings matter.","answer":true,"explain":"With less precise numbers the learning process is touchier, which is why the lab picks conservative AdamW settings."},{"type":"mcq","level":2,"prompt":"Why enable LoRA even after switching to bfloat16?","options":["bfloat16 weights can only be updated through LoRA layers","LoRA converts the weights back to float32","LoRA is needed to read turn delimiters","Full training's gradients and Adam states won't fit"],"answer":3,"explain":"bfloat16 makes the weights fit, but training every parameter would add a gradient and two Adam states per weight, far too much."},{"type":"tf","level":2,"prompt":"The lab's final generations showed that bfloat16 badly hurt answer quality.","answer":false,"explain":"By epoch 4 the answers were high-quality, factual and correctly formatted, so bfloat16 did not noticeably harm the result."},{"type":"mcq","level":2,"prompt":"In the lab's AdamW setup, what does clipnorm=0.5 do?","options":["Freezes half of the model's parameters","Caps the gradient's size to keep updates stable","Halves the learning rate after each epoch","Rounds every weight to 0.5 precision"],"answer":1,"explain":"Gradient clipping rescales any gradient whose norm exceeds 0.5, preventing sudden large updates during sensitive bfloat16 training."},{"type":"mcq","level":2,"prompt":"Which test prompt checks that pre-trained knowledge survives fine-tuning?","options":["What is Kente cloth?","What is Kilimanjaro?","What is Tokyo?","What is Jollof rice?"],"answer":2,"explain":"Nothing about Tokyo or Japan is in the fine-tuning data, so a good answer must come from what Gemma learned in pre-training."},{"type":"cloze","level":2,"prompt":"Fill in the attribute that reveals the weights' number format.","code":"block = model.backbone.get_layer(\n    \"decoder_block_0\")\nquery_weights = (\n    block.attention.query_dense.kernel)\nprint(query_weights.___)","options":["dtype","shape","name","trainable"],"answer":0,"explain":"The dtype attribute reports the data type; after loading with dtype=\"bfloat16\" it prints bfloat16."}]},{"id":"c7-5b","title":"Fine-tuning in bfloat16","part":2,"icon":"spark","lab":"course_7/gdm_lab_7_5_fine_tune_a_model_with_bfloat16.ipynb","goal":"Apply them to harder, hands-on questions.","steps":[{"type":"match","level":2,"prompt":"Match each item to what it shows or tests.","pairs":[["What is Kente cloth?","Knowledge from the fine-tuning data"],["What is Kilimanjaro?","Generalizing without the word Mount"],["What is Tokyo?","Keeping pre-trained knowledge"],["Epoch 1 KMnO4 loop","Early training instability"],["Epoch 4 outputs","Fluent, factual, in flashcard format"]],"explain":"The probes separate fine-tuning knowledge, generalization and retained pre-training; epochs 1 and 4 show the arc from unstable t
