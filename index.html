cells divide"],"answer":1,"explain":"A protein's function, meaning what it does in the body, is determined by its folded shape."},{"type":"tf","level":1,"prompt":"Proteins begin as one-dimensional chains of amino acids before they fold.","answer":true,"explain":"Cells build proteins bit by bit as a chain of amino acids, which then folds into a 3D structure."},{"type":"mcq","level":2,"prompt":"Bond 165 was twisted by +30°. How do you repair the protein?","options":["Rotate bond 165 by +30°","Rotate bond 30 by −165°","Rotate every bond by −30°","Rotate bond 165 by −30°"],"answer":3,"explain":"Undo the twist where it happened: rotate the same bond by the opposite angle, −30°."},{"type":"cloze","level":2,"prompt":"Problem 2: a 42° twist happened somewhere in bonds 100–120. The fix is bond 115 with angle ___.","options":["42","−42","−115","0"],"answer":1,"explain":"Just like Problem 1, you rotate back by the same amount: −42° at bond 115. Finding the bond meant trying values in the range."},{"type":"tf","level":2,"prompt":"On the error curve, a higher number means you're closer to the correct shape.","answer":false,"explain":"The error measures how far your protein is from the correct one, so lower is better and near zero means solved."},{"type":"mcq","level":3,"prompt":"What is the last number this code prints?","code":"for somename in range(7):\n  print(somename)","options":["6","7","0","8"],"answer":0,"explain":"range(7) produces 0, 1, 2, 3, 4, 5, 6: seven values, starting at 0 and stopping before 7."},{"type":"mcq","level":3,"prompt":"What does this code print?","code":"square = 5*5\nsquare = square * square\nprint(square)","options":["25","50","10","625"],"answer":3,"explain":"square starts as 25. The second line overwrites it with 25 × 25 = 625."},{"type":"cloze","level":1,"prompt":"The machine-learning recipe in one line: solution = solution + ___.","options":["improvement","error","range","candidate"],"answer":0,"explain":"Start with a solution and keep adding small improvements, exactly what the protein code does with candidate."},{"type":"order","level":1,"prompt":"Order the basic machine-learning loop.","items":["Start with an initial guess","Improve it by a little bit","Repeat until it's good enough"],"explain":"Start somewhere, improve slightly, repeat. A computer can run this loop thousands of times without getting bored."},{"type":"cloze","level":2,"prompt":"Complete the learning loop.","code":"candidate = get_initial_candidate()\nfor i in range(1000):\n  candidate = candidate + ___()\n  view_results()","options":["get_initial_candidate","view_results","get_improvement","range"],"answer":2,"explain":"Each pass adds the nudge from get_improvement() to the current candidate. get_initial_candidate is only used once, at the start."},{"type":"tf","level":2,"prompt":"It's normal for the protein to get slightly worse before it improves again.","answer":true,"explain":"get_improvement sometimes makes things worse. Learning from mistakes is part of the process."},{"type":"mcq","level":2,"prompt":"Why use machine learning for real protein folding?","options":["Real proteins only ever break at a single bond each","Fixing hundreds of bonds by hand is impractical","Computers can see protein shapes directly","It removes the need to measure the error"],"answer":1,"explain":"One bond is easy, but tens, hundreds or thousands of rotations are too many to tune by hand. That's a perfect job for a tireless computer."},{"type":"match","level":1,"prompt":"Match each term to its meaning.","pairs":[["Amino acids","Building blocks chained together into proteins"],["Genetic code","Tells us a protein's amino-acid sequence"],["ATP synthase","Protein machine making the cell's energy currency"],["Error curve","Tracks how far your fold is from correct"],["Bond number","Which link in the chain you rotate"]],"explain":"Amino acids form the chain, the genetic code gives their order, and the error curve tracks your progress as you rotate bonds."},{"type":"mcq","level":3,"prompt":"How many numbers does this code print?","code":"for number in range(11):\n  square = number * number\n  print(square)","options":["10","100","11","12"],"answer":2,"explain":"range(11) gives 0 to 10, which is eleven values, so it prints 11 squares, from 0 up to 100."}]}]},{"id":"c1","title":"Build Your Own Small Language Model","subtitle":"AI Research Foundations · Course 1","repo":"ai-foundations","skills":[{"id":"c1-1","title":"Next-word probabilities","icon":"dice","lab":"course_1/gdm_lab_1_1_create_your_own_probability_distribution.ipynb","cards":[{"title":"Next-word prediction","body":"A language model reads a prompt (its context) and gives every candidate next word a probability. For \"Twinkle twinkle little\", the lab gives \"star\" 0.99, \"bottle\" 0.009 and \"beef\" 0.001. Generating text means drawing one word from that distribution, adding it, and repeating."},{"title":"A valid distribution","body":"Three rules: every candidate word gets a probability, none is below 0, and together they add up to exactly 1. The lab's `test_probabilities` helper checks all three before you sample. The numbers are your mental model of how well each word fits the prompt."},{"title":"Sampling with random.choices","body":"`random.choices` draws from the list using your probabilities as weights. It returns a list, so `[0]` pulls out the word. Likely words come up most often, but any word above 0 can appear, so reruns can differ. This built-in randomness is called stochastic.","code":"import random\nwords = [\"star\", \"beef\", \"bottle\"]\nprobs = [0.99, 0.001, 0.009]\npick = random.choices(words, weights=probs)\nprint(pick[0])"},{"title":"Context changes the odds","body":"Change \"Jide was hungry so she went looking for\" to \"thirsty\" and a sensible distribution shifts: \"water\" should rise while \"food\" and \"snacks\" fall. In the lab's sample answer, \"water\" jumps from 0.16 to 0.76. A good model is context-aware: its probabilities follow the meaning of the prompt."}],"exercises":[{"type":"mcq","level":1,"prompt":"In this lab, what does a language model attach to each candidate next word?","options":["A fixed position in the dictionary","A count of the letters it contains","A probability based on the context","A grammar label such as noun or verb"],"answer":2,"explain":"A language model scores each candidate continuation with a probability, and those probabilities depend on the prompt that came before."},{"type":"tf","level":1,"prompt":"A list of probabilities can include a negative value, as long as all the values still add up to 1.","answer":false,"explain":"Every probability must be 0 or more, and the whole list must sum to 1. A negative entry breaks the first rule."},{"type":"cloze","level":3,"prompt":"The lab's 'hungry' answer lost one value. What must the blank be for a valid distribution?","code":"words = [\"food\", \"snacks\", \"leftovers\",\n         \"her\", \"for\", \"water\",\n         \"photosynthesis\", \"pyramid\"]\nprobs = [0.2, ___, 0.2, 0.09,\n         0.001, 0.16, 0.002, 0.001]","options":["0.346","0.654","0.300","0.446"],"answer":0,"explain":"The seven known values sum to 0.654, so the missing one is 1 − 0.654 = 0.346."},{"type":"mcq","level":2,"prompt":"What kind of value ends up in `chosen`?","code":"chosen = random.choices(\n    [\"star\", \"beef\", \"bottle\"],\n    weights=[0.99, 0.001, 0.009])","options":["The string \"star\", every time","All three words in a new order","The number 0.99","A list holding one sampled word"],"answer":3,"explain":"`random.choices` returns a list (one item by default). That is why the lab prints `chosen[0]`. \"star\" is likely, not guaranteed."},{"type":"mcq","level":3,"prompt":"With weights 0.99 / 0.001 / 0.009 for star / beef / bottle, about how many of 1,000 samples will be \"bottle\"?","options":["About 1","About 9","About 99","About 990"],"answer":1,"explain":"Expected count = probability × number of draws = 0.009 × 1,000 = 9."},{"type":"tf","level":2,"prompt":"Running the same `random.choices` cell twice can print different words, even with identical probabilities.","answer":true,"explain":"Sampling is random: the probabilities set how often each word wins, not which word wins on a given run."},{"type":"mcq","level":2,"prompt":"Jide is now thirsty instead of hungry. Which candidate should gain the most probability?","options":["water","leftovers","snacks","pyramid"],"answer":0,"explain":"Thirst points to a drink, so \"water\" should rise sharply. In the lab's sample answer it goes from 0.16 to 0.76."},{"type":"cloze","level":2,"prompt":"Fill in the keyword argument that passes the probabilities.","code":"chosen_word = random.choices(\n    candidate_words,\n    ___=your_mental_model)","options":["probs","k","weights","context"],"answer":2,"explain":"`random.choices(population, weights=...)` uses the weights to decide how likely each item is to be drawn. `k` sets how many items to draw."},{"type":"mcq","level":2,"prompt":"Why does the lab give \"photosynthesis\" a tiny probability after \"Jide was hungry so she went looking for\"?","options":["Long words are never sampled","It rarely fits that sentence","Long words need small values","It is not a candidate word"],"answer":1,"explain":"Probabilities should reflect how well a word fits the context. \"photosynthesis\" makes little sense here, but it is still a candidate with a small non-zero chance."},{"type":"tf","level":2,"prompt":"The weights [0.5, 0.3, 0.1] form a valid probability distribution over three words.","answer":false,"explain":"0.5 + 0.3 + 0.1 = 0.9, not 1. A valid distribution must sum to exactly 1."},{"type":"match","level":1,"prompt":"Match each term to its meaning.","pairs":[["Prompt","The input text given to the model"],["Context","Earlier words that shape the prediction"],["Sampling","Randomly drawing a word by its probability"],["Candidate words","Possible continuations being scored"],["Stochastic","Random, so outputs can vary run to run"]],"explain":"These are the core ideas of the lab: a prompt gives context, candidates get probabilities, and sampling picks one at random."},{"type":"order","level":2,"prompt":"Put the steps for generating one next word in order.","items":["Write the prompt","List candidate next words","Give each word a probability","Check values are ≥ 0 and sum to 1","Sample one with random.choices"],"explain":"You need candidates before you can score them, and a valid distribution before `random.choices` can sample from it."},{"type":"cloze","level":1,"prompt":"A model that picks words at random according to probabilities is called ___.","options":["deterministic","greedy","sparse","stochastic"],"answer":3,"explain":"Stochastic means involving randomness. A deterministic process would give the same output every time."},{"type":"mcq","level":3,"prompt":"In the lab's 'thirsty' answer, \"water\" gets 0.76. What total probability is left for the other seven words?","options":["0.14","0.24","0.34","0.76"],"answer":1,"explain":"All probabilities sum to 1, so the rest share 1 − 0.76 = 0.24."}]},{"id":"c1-2","title":"N-gram language models","icon":"chain","lab":"course_1/gdm_lab_1_2_experiment_with_n_gram_models.ipynb","cards":[{"title":"Counting gives probabilities","body":"An n-gram is a run of n tokens in a row. An n-gram model predicts the next token B from the previous n − 1 tokens A: P(B | A) = Count(A B) / Count(A). Both counts come from a corpus, here Africa Galore, a synthetic dataset of paragraphs about African culture, history and geography."},{"title":"A naive space tokenizer","body":"First, each paragraph is split into tokens wherever there is a space. \"Bimpe didn't buy the rice\" becomes five tokens. Punctuation stays attached, so \"tall.\" and \"tall\" are different tokens. That is why these units are called tokens rather than words.","code":"def space_tokenize(text):\n    return text.split(\" \")"},{"title":"From tokens to n-grams","body":"Slide a window of size n along the tokens: T tokens give T − n + 1 n-grams. `get_ngram_counts` counts which token follows each context; `build_ngram_model` divides each count by the context's total to get probabilities.","code":"tokens = space_tokenize(text)\nngrams = []\nfor i in range(len(tokens) - n + 1):\n    ngrams.append(tuple(tokens[i:i+n]))"},{"title":"Sparsity and dead ends","body":"Most possible n-grams never occur: about 99.95% of the Africa Galore bigram table is zeros, and 99.98% of the trigram table. A bigger n sees more context but makes counts sparser. If a context such as \"Their name\" never appears, the model has no entry for it (a `KeyError`) and generation stops."}],"exercises":[{"type":"mcq","level":1,"prompt":"An n-gram model predicts the next token from how many preceding tokens?","options":["n − 1","n","n + 1","All earlier tokens"],"answer":0,"explain":"An n-gram has n tokens: the last one is predicted and the other n − 1 form the context. A trigram model uses 2 tokens of context."},{"type":"mcq","level":3,"prompt":"\"a staple\" appears 13 times and \"a staple in\" appears 6 times. What is P(in | a staple)?","options":["13/6 ≈ 2.17","6/19 ≈ 0.32","6/13 ≈ 0.46","1/13 ≈ 0.08"],"answer":2,"explain":"P(B | A) = Count(A B) / Count(A) = 6 / 13 ≈ 0.46. A probability can never exceed 1, so 13/6 is impossible."},{"type":"mcq","level":2,"prompt":"What does a space tokenizer return for \"Table mountain is tall.\"?","options":["[\"Table\", \"mountain\", \"is\", \"tall\", \".\"]","[\"Table\", \"mountain\", \"is\", \"tall.\"]","[\"Table mountain\", \"is\", \"tall.\"]","[\"table\", \"mountain\", \"is\", \"tall\"]"],"answer":1,"explain":"Splitting on spaces keeps punctuation glued to the word and leaves capital letters alone, so the last token is \"tall.\"."},{"type":"mcq","level":3,"prompt":"How many bigrams does this call return?","code":"text = \"Table Mountain is tall.\"\ngenerate_ngrams(text, n=2)","options":["4","2","5","3"],"answer":3,"explain":"4 tokens give 4 − 2 + 1 = 3 bigrams: (Table, Mountain), (Mountain, is), (is, tall.)."},{"type":"cloze","level":2,"prompt":"Complete `generate_ngrams` so each n-gram is stored the way the lab asks.","code":"for i in range(len(tokens) - n + 1):\n    ngrams.append(___(tokens[i:i+n]))","options":["tuple","list","set","sum"],"answer":0,"explain":"Each n-gram is a tuple of tokens. Tuples keep the order and can be counted by `Counter`; a set would lose the order and drop repeated tokens."},{"type":"cloze","level":3,"prompt":"Fill the blank so `total` equals Count(A), the number of times the context appeared.","code":"for context, nxt in counts.items():\n    total = ___(nxt.values())\n    model[context] = {}\n    for tok, c in nxt.items():\n        model[context][tok] = c / total","options":["len","sum","max","min"],"answer":1,"explain":"Count(A) is the total of all counts of tokens that followed A. `len` would only count how many different tokens followed it."},{"type":"tf","level":2,"prompt":"For a context that never appears in the dataset, the lab's trigram model returns a small probability for every token.","answer":false,"explain":"Unseen contexts have no entry in the model's dictionary, so looking one up raises a `KeyError` and generation stops."},{"type":"mcq","level":2,"prompt":"Dataset: \"Table Mountain is tall\" and \"Table Mountain is beautiful\". What does a trigram model store for context \"Mountain is\"?","options":["{'tall': 1.0, 'beautiful': 1.0}","{'is': 1.0}","{'tall': 0.5, 'beautiful': 0.5}","{'tall': 1, 'beautiful': 1}"],"answer":2,"explain":"\"Mountain is\" occurs twice, once followed by each word, so each gets 1/2. The model stores probabilities, not raw counts."},{"type":"tf","level":1,"prompt":"Moving from a bigram to a trigram model makes the table of counts sparser.","answer":true,"explain":"Longer contexts have far more possible combinations, and most never occur: 99.95% zeros for bigrams versus 99.98% for trigrams in Africa Galore."},{"type":"mcq","level":3,"prompt":"With a 5-token vocabulary (I, love, to, eat, jollof), how many trigram combinations are possible?","options":["25","125","15","243"],"answer":1,"explain":"Each of the 3 positions can hold any of 5 tokens: 5 × 5 × 5 = 125. Only a few, like \"love to eat\", will actually appear in data."},{"type":"match","level":1,"prompt":"Match each term to its meaning.","pairs":[["Corpus","The collection of texts used for counting"],["Bigram","A sequence of two consecutive tokens"],["Context","The n − 1 tokens before the predicted one"],["Sparsity","Most possible n-grams have a count of zero"],["KeyError","What a context missing from the data causes"]],"explain":"These ideas run through the whole lab: count n-grams in a corpus, predict from the context, and watch out for sparse or missing counts."},{"type":"order","level":2,"prompt":"Order the steps to build and use an n-gram model.","items":["Load the text corpus","Split paragraphs into tokens","Turn token lists into n-grams","Count next tokens per context","Divide counts by the context total","Sample next tokens repeatedly"],"explain":"Tokens come before n-grams, counts before probabilities, and probabilities before you can sample a continuation."},{"type":"cloze","level":1,"prompt":"P(B | A) = Count(A B) / Count(___)","options":["B","A B","the corpus","A"],"answer":3,"explain":"You divide how often A is followed by B by how often A appears at all."},{"type":"mcq","level":2,"prompt":"For a trigram model (n = 3), how many tokens end up in `context`?","code":"# n = 3\ncontext = generated_words[-(n - 1):]\ncontext = \" \".join(context)","options":["2","3","1","All generated tokens"],"answer":0,"explain":"`generated_words[-(n - 1):]` keeps the last n − 1 = 2 tokens, which are joined with a space to look up the model."},{"type":"tf","level":2,"prompt":"Because the next token is sampled, the same prompt can produce different continuations on different runs.","answer":true,"explain":"The n-gram model draws each token with `random.choices`, so likely tokens usually win but less likely ones can be chosen too."}]},{"id":"c1-3","title":"N-grams vs. transformers","icon":"scale","lab":"course_1/gdm_lab_1_3_compare_n_gram_models_and_transformer_language_models.ipynb","cards":[{"title":"Meet the contenders","body":"The lab compares a trigram model built from Africa Galore with Gemma-1B, a transformer with about 1 billion parameters. Parameters are what training produces: for the n-gram model, its conditional probabilities; for a transformer, a vast set of numbers that only mean something together. The matchup is uneven: Gemma also learned from far more text."},{"title":"Context window","body":"A trigram model sees only the last 2 tokens. \"Jide was hungry so she went looking for\" and the \"thirsty\" version both end in \"looking for\", so its prediction does not move. Gemma reads the whole prompt and shifts toward \"water\" for thirst. Transformers can use hundreds or thousands of tokens of context."},{"title":"Judging generations","body":"The lab compares outputs on four criteria. Fluency: does it read naturally? Coherence: does it make sense and stay on topic? Relevance: does it answer the prompt? Bias: does it repeat stereotypes, like continuing \"nurse\" with she and \"doctor\" with he, patterns absorbed from human-written training text?"},{"title":"Greedy vs. random","body":"Random sampling draws each token from the distribution, so reruns differ, which suits stories and creative tasks. Greedy sampling always takes the single most probable token, so a prompt gives the same output every time, which suits tasks that need accuracy and consistency. Note: transformer tokens can be pieces of words."}],"exercises":[{"type":"mcq","level":2,"prompt":"Why does the trigram model give identical next-token odds for the 'hungry' and 'thirsty' Jide prompts?","options":["It treats the two words as synonyms","Both end with the same two tokens","It always picks the commonest word","Its data has no words about drinks"],"answer":1,"explain":"A trigram model only looks at the last 2 tokens, \"looking for\", which are identical in both prompts. Everything earlier is invisible to it."},{"type":"tf","level":1,"prompt":"Gemma-1B gets its name from having roughly 1 billion parameters.","answer":true,"explain":"The \"1B\" refers to about one billion learned numbers. The lab's own small model, by comparison, has about 3.5 million."},{"type":"mcq","level":1,"prompt":"What are the parameters of the n-gram model?","options":["The prompts used to test it","Gemma's billion numbers","The four evaluation criteria","Its conditional probabilities"],"answer":3,"explain":"Training an n-gram model means estimating P(B | A) from counts. Those probabilities are exactly what the model learned, so they are its parameters."},{"type":"match","level":1,"prompt":"Match each evaluation criterion to the question it asks.","pairs":[["Fluency","Does it read naturally and grammatically?"],["Coherence","Does it make sense and stay on topic?"],["Relevance","Does it actually fit the prompt?"],["Bias","Does it repeat stereotypes from its data?"]],"explain":"The lab uses these four criteria to compare the two models' generations."},{"type":"mcq","level":2,"prompt":"In the lab, which model often fails to predict any next token at all?","options":["The trigram model, on unseen contexts","Gemma-1B, on very long prompts","Both, whenever the prompt is a question","Neither; both always give an answer"],"answer":0,"explain":"The trigram model only has a distribution if its two-token context occurs in Africa Galore. Gemma assigns probabilities for any prompt."},{"type":"cloze","level":2,"prompt":"Fill in the mode that makes Gemma's output the same on every run.","code":"generation.prompt_transformer_model(\n    prompt,\n    max_new_tokens=50,\n    loaded_model=gemma_model,\n    sampling_mode=\"___\",\n)","options":["random","sparse","greedy","creative"],"answer":2,"explain":"`sampling_mode=\"greedy\"` always takes the most probable token. \"random\" samples from the distribution and varies between runs."},{"type":"tf","level":3,"prompt":"Gemma beats the trigram model in the lab purely because of its architecture; both learned from the same amount of text.","answer":false,"explain":"The comparison is stacked: Gemma was trained on a very large dataset, the trigram model only on Africa Galore. The lab notes a transformer would still win on equal data."},{"type":"mcq","level":2,"prompt":"For a creative task like story writing, which approach does the lab favor?","options":["Always pick the single most likely token","Use only the trigram model","Cut the prompt down to two words","Sample randomly from the distribution"],"answer":3,"explain":"Random sampling explores different plausible tokens, giving varied, imaginative text. Greedy decoding suits tasks that need consistency."},{"type":"mcq","level":3,"prompt":"A trigram model gets \"The doctor went to university in Ethiopia.\" Which tokens form its context?","options":["\"in\" and \"Ethiopia.\"","\"university\" and \"in\"","\"Ethiopia.\" alone","All seven tokens"],"answer":0,"explain":"A trigram model uses the last n − 1 = 2 tokens. With space tokenization, those are \"in\" and \"Ethiopia.\" (period included)."},{"type":"mcq","level":2,"prompt":"Gemma tends to continue \"nurse\" with \"she\" and \"doctor\" with \"he\". What causes this?","options":["The greedy sampling setting","Its short context window","Skewed patterns in its training text","Its tokenizer splitting words into pieces"],"answer":2,"explain":"Models learn from human-written text, where male doctors and female nurses are written about more often, so they absorb that bias."},{"type":"cloze","level":1,"prompt":"Transformers beat n-gram models partly because they have a much larger ___ window.","options":["sampling","context","vocabulary","batch"],"answer":1,"explain":"An n-gram model's context is only n − 1 tokens. Transformers can attend to hundreds or thousands of earlier tokens."},{"type":"tf","level":3,"prompt":"Given as much training text as Gemma, a trigram model would match Gemma's quality, according to the lab.","answer":false,"explain":"The lab says the transformer would still be much better: it has a far larger context window and learns abstract patterns, such as food and snack being related."},{"type":"order","level":2,"prompt":"Order these models from the smallest to the largest context.","items":["Bigram model","Trigram model","4-gram model","Gemma-1B transformer"],"explain":"An n-gram model uses n − 1 tokens of context, so it grows by one with each step in n. Transformers use far longer contexts."},{"type":"mcq","level":2,"prompt":"A Gemma generation sometimes ends partway through a word. Why?","options":["It runs out of probability mass","The trigram model cuts it off","Greedy sampling truncates words","Its tokens can be parts of words"],"answer":3,"explain":"Transformer tokens may be a single character or a piece of a word, so stopping after a fixed number of tokens can land mid-word."},{"type":"cloze","level":2,"prompt":"Neural networks can learn that \"food\" and \"___\" have related meanings, which raw n-gram counts cannot.","options":["snack","pyramid","looking","for"],"answer":0,"explain":"Neural networks learn abstract patterns that link related words, like food and snack. N-gram counts treat every token string as unrelated."}]},{"id":"c1-4","title":"From tokens to token IDs","icon":"token","lab":"course_1/gdm_lab_1_4_prepare_the_dataset_for_training_a_slm.ipynb","cards":[{"title":"Models need numbers","body":"A transformer cannot read strings. Preparing data means: tokenize every paragraph, collect the vocabulary (the unique tokens), and give each token an ID. IDs must be consecutive: with a vocabulary of size k, they run from 0 to k − 1."},{"title":"Tokens vs. vocabulary","body":"`tokens` keeps every token in dataset order, repeats included. The vocabulary keeps each token exactly once. The lab's `space_tokenize` uses `re.split(r\" +\", text)`, so a run of spaces counts as one separator.","code":"tokens = []\nfor paragraph in dataset:\n    for token in space_tokenize(paragraph):\n        tokens.append(token)\nvocabulary = list(set(tokens))"},{"title":"Two lookup tables","body":"`token_to_index` turns a token into its ID; `index_to_token` reverses it. `enumerate` hands out consecutive IDs 0, 1, 2, … in vocabulary order.","code":"for index, token in enumerate(vocabulary):\n    token_to_index[token] = index\n    index_to_token[index] = token"},{"title":"Encode and decode","body":"`encode(text)` tokenizes the text and maps each token to its ID. `decode(ids)` maps IDs back to tokens and joins them with spaces, so decoding an encoding returns the original text. The `SimpleWordTokenizer` class bundles all of this; it sorts its vocabulary alphabetically before assigning IDs."}],"exercises":[{"type":"mcq","level":1,"prompt":"Why must text become token IDs before training a transformer?","options":["IDs make the text shorter to read","The model processes numbers, not text","IDs strip punctuation from tokens","IDs put tokens in alphabetical order"],"answer":1,"explain":"Neural networks compute with numbers. Mapping each token to a unique ID is the bridge between text and the model."},{"type":"mcq","level":3,"prompt":"\"the cat saw the dog\" is space-tokenized. How many tokens, and how many vocabulary entries?","options":["5 tokens, 4 unique","5 tokens, 5 unique","4 tokens, 4 unique","4 tokens, 5 unique"],"answer":0,"explain":"There are 5 tokens, but \"the\" appears twice, so the vocabulary is {the, cat, saw, dog}: 4 entries."},{"type":"cloze","level":2,"prompt":"Complete `build_vocabulary` so it keeps each token once.","code":"def build_vocabulary(tokens):\n    vocabulary = list(___(tokens))\n    return vocabulary","options":["sorted","tuple","set","len"],"answer":2,"explain":"`set` removes duplicates; `list(...)` turns it back into a list. `sorted` alone would keep every repeat."},{"type":"mcq","level":3,"prompt":"A vocabulary has 5,000 tokens. Which IDs should it use?","options":["0 to 4,999","1 to 5,000","0 to 5,000","Any 5,000 numbers"],"answer":0,"explain":"IDs are consecutive and start at 0, so a vocabulary of size k uses 0 to k − 1. Here that is 0 to 4,999."},{"type":"cloze","level":2,"prompt":"Complete the loop that builds `index_to_token`.","code":"for token, index in token_to_index.items():\n    index_to_token[___] = token","options":["token","len(token)","index + 1","index"],"answer":3,"explain":"`index_to_token` is the reverse map: the ID is the key and the token is the value."},{"type":"mcq","level":2,"prompt":"What does this return?","code":"vocab = [\"rice\", \"jollof\", \"spicy\"]\ntok = SimpleWordTokenizer(\n    [], vocabulary=vocab)\ntok.decode([1, 0])","options":["'rice jollof'","'jollof rice'","'spicy jollof'","[1, 0]"],"answer":1,"explain":"With the given vocabulary, ID 1 is \"jollof\" and ID 0 is \"rice\". `decode` maps them in order and joins them with a space."},{"type":"mcq","level":3,"prompt":"Using the same vocabulary, what does `tok.encode(\"spicy jollof rice\")` return?","code":"vocab = [\"rice\", \"jollof\", \"spicy\"]\ntok = SimpleWordTokenizer(\n    [], vocabulary=vocab)","options":["[0, 1, 2]","[3, 2, 1]","[1, 2, 3]","[2, 1, 0]"],"answer":3,"explain":"IDs come from list positions starting at 0: rice = 0, jollof = 1, spicy = 2. Encoding keeps the word order of the text."},{"type":"tf","level":1,"prompt":"Each token appears exactly once in the vocabulary, even if it occurs thousands of times in the data.","answer":true,"explain":"The vocabulary is the set of unique tokens. Frequency matters for counts, not for the vocabulary list."},{"type":"mcq","level":3,"prompt":"In this `encode`, what happens to a token missing from `token_to_index`?","code":"indices = []\nfor token in space_tokenize(text):\n    idx = token_to_index.get(token)\n    indices.append(idx)","options":["A KeyError stops the encoding","It is added to the vocabulary","It becomes None; no error is raised","It is mapped to ID 0"],"answer":2,"explain":"`dict.get(key)` returns None when the key is missing instead of raising an error. The next lab replaces this with a proper `\u003cUNK>` token."},{"type":"match","level":1,"prompt":"Match each piece to its job.","pairs":[["vocabulary","The list of unique tokens in the dataset"],["token_to_index","Maps a token to its ID"],["index_to_token","Maps an ID back to its token"],["encode","Turns text into a list of token IDs"],["decode","Turns token IDs back into text"]],"explain":"Together these make a tokenizer: a vocabulary plus two inverse lookups, wrapped in encode and decode."},{"type":"order","level":2,"prompt":"Order the data-preparation steps from this lab.","items":["Load the Africa Galore paragraphs","Space-tokenize every paragraph","Collect the unique tokens","Give each token an ID","Encode texts as lists of IDs"],"explain":"You need tokens before a vocabulary, a vocabulary before IDs, and IDs before encoding."},{"type":"cloze","level":3,"prompt":"What does `re.split` return here (note the two spaces)?","code":"import re\nre.split(r\" +\", \"Kanga  cloth\")\n# result: ___","options":["['Kanga', '', 'cloth']","['Kanga', 'cloth']","['Kanga  cloth']","['Kanga', ' ', 'cloth']"],"answer":1,"explain":"The pattern \" +\" matches one or more spaces, so the double space is one separator. Plain `split(\" \")` would leave an empty string."},{"type":"tf","level":3,"prompt":"`SimpleWordTokenizer` gives IDs in the order tokens first appear in the dataset.","answer":false,"explain":"Its `build_vocabulary` returns `sorted(list(set(tokens)))`, so IDs follow alphabetical (sorted) order, not order of appearance."},{"type":"mcq","level":2,"prompt":"Why does the `tokens` list have far more entries than `vocabulary`?","options":["Common tokens like \"the\" repeat a lot","The vocabulary drops all punctuation","Tokens are split into characters","The vocabulary covers one paragraph"],"answer":0,"explain":"`tokens` keeps every occurrence; the vocabulary keeps each distinct token once. Frequent words account for most of the difference."}]},{"id":"c1-5","title":"Train a small LM","icon":"rocket","lab":"course_1/gdm_lab_1_5_train_your_own_small_language_model.ipynb","cards":[{"title":"Pad and truncate","body":"A batch is a matrix, so every row needs the same length. Paragraphs longer than `max_length` (300 in the lab) are cut, and shorter ones are filled with the `\u003cPAD>` token. Here both happen at the end (\"post\"). The tokenizer puts `\u003cPAD>` first (ID 0) and `\u003cUNK>` last, for unseen words.","code":"padded = pad_sequences(\n    encoded_tokens, maxlen=300,\n    padding=\"post\", truncating=\"post\",\n    value=tokenizer.pad_token_id)"},{"title":"Input and target","body":"The model learns next-token prediction, so the target is the input shifted left by one. For \"Table Mountain is beautiful\": input = Table Mountain is, target = Mountain is beautiful. Each sequence is now one token shorter.","code":"inputs = padded[:, :-1]   # drop last\ntargets = padded[:, 1:]   # drop first"},{"title":"Shuffle and batch","body":"Africa Galore is ordered by topic (food paragraphs sit together), so paragraphs are shuffled before training, while tokens inside each paragraph keep their order. Then they are grouped into batches of 32. Larger batches can speed training but need more memory and may run out."},{"title":"Training loop","body":"The model has about 3.5 million parameters, starting as random numbers. After each batch (a step) they are nudged to predict better; one pass over all batches is an epoch, and the lab suggests 200. The loss should trend down, and a callback prints a sample for \"Abeni,\" every 10 epochs."}],"exercises":[{"type":"mcq","level":1,"prompt":"Why are paragraphs padded or truncated before training?","options":["Padding adds meaning to short texts","Truncation removes the rare tokens","The tokenizer needs equal-length words","Rows in a batch must share one length"],"answer":3,"explain":"The model's input is a matrix with one paragraph per row, and every row of a matrix needs the same number of entries."},{"type":"mcq","level":3,"prompt":"`max_length` is 300 and padding is \"post\". A paragraph has 120 tokens. What happens?","options":["180 \u003cPAD> tokens added at the end","180 \u003cPAD> tokens added at the start","120 \u003cPAD> tokens added at the end","It is cut down to 120 tokens"],"answer":0,"explain":"300 − 120 = 180 padding tokens are needed, and \"post\" puts them after the real tokens."},{"type":"mcq","level":2,"prompt":"\"Table Mountain is beautiful\" is a training example. What is its target sequence?","options":["Table Mountain is","beautiful","Mountain is beautiful","Table Mountain is beautiful"],"answer":2,"explain":"The target is the input shifted left by one: each position's target is the token that comes next."},{"type":"cloze","level":2,"prompt":"Complete the slice that keeps every token except the last.","code":"# drop the last token of each row\ninput_sequences = padded[:, ___]","options":[":-1","1:","0","-1:"],"answer":0,"explain":"`[:, :-1]` takes all rows and every column but the last. The target uses `[:, 1:]`, which drops the first."},{"type":"mcq","level":3,"prompt":"`padded_sequences` has 300 columns. What is `input_sequences.shape[1]` after the split?","options":["300","299","301","150"],"answer":1,"explain":"Dropping one token (the last for inputs, the first for targets) leaves 300 − 1 = 299, so the lab updates `max_length` to match."},{"type":"tf","level":2,"prompt":"Shuffling the dataset also shuffles the order of tokens inside each paragraph.","answer":false,"explain":"Only whole paragraphs are shuffled. Mixing tokens within a paragraph would turn sentences into word puzzles."},{"type":"mcq","level":3,"prompt":"7 padded paragraphs are shuffled and split into batches of size 3. What do you get?","options":["2 batches; the last holds 1 paragraph","3 batches of 3 paragraphs each","3 batches; the last holds 1 paragraph","7 batches of 1 paragraph each"],"answer":2,"explain":"Batches of 3, 3 and 1 cover all 7 paragraphs. Since 7 is not divisible by 3, the final batch is smaller."},{"type":"match","level":1,"prompt":"Match each training term to its meaning.","pairs":[["Epoch","One full pass over all the batches"],["Step","One parameter update after a batch"],["Batch size","How many paragraphs are grouped together"],["Learning rate","How quickly the parameters change"],["Loss","Error measure that should trend downward"]],"explain":"Training repeats steps over batches; many epochs with a sensible learning rate should drive the loss down."},{"type":"cloze","level":2,"prompt":"A word that never appeared in the training data is mapped to the ___ token.","options":["\u003cPAD>","\u003cEOS>","\u003cBOS>","\u003cUNK>"],"answer":3,"explain":"`encode` uses `token_to_index.get(token, unk_index)`, so unseen words fall back to `\u003cUNK>`. All their information is lost."},{"type":"mcq","level":3,"prompt":"The dataset has 5,000 unique tokens. What are `vocabulary_size` and the ID of `\u003cPAD>`?","code":"self.vocabulary = (\n    [self.PAD_TOKEN] + vocabulary\n    + [self.UNKNOWN_TOKEN]\n)","options":["5,000; \u003cPAD> has ID 0","5,002; \u003cPAD> has ID 0","5,002; \u003cPAD> has ID 5,001","5,001; \u003cPAD> has ID 1"],"answer":1,"explain":"Two special tokens are added: `\u003cPAD>` at the front (ID 0) and `\u003cUNK>` at the end (ID 5,001), giving 5,000 + 2 = 5,002."},{"type":"tf","level":1,"prompt":"At the start of training, the transformer's parameters are random numbers.","answer":true,"explain":"Parameters are initialized randomly and improve step by step as the model learns to predict the next token."},{"type":"order","level":2,"prompt":"Order the steps from raw text to a trained SLM.","items":["Encode paragraphs as token IDs","Pad or truncate to max_length","Split into inputs and targets","Shuffle and group into batches","Train with model.fit for many epochs"],"explain":"This is the lab's pipeline: numbers first, equal lengths next, then input/target pairs, batches, and finally training."},{"type":"mcq","level":2,"prompt":"What is a likely problem with a very large batch size?","options":["Running out of memory","Paragraphs lose their word order","The vocabulary keeps growing","The loss can no longer drop"],"answer":0,"explain":"Bigger batches can speed up training, but each batch must fit in memory; too large and you get out-of-memory errors."},{"type":"tf","level":2,"prompt":"If the loss goes up a little from one epoch to the next, training has failed and must be restarted.","answer":false,"explain":"Small temporary rises are normal. What matters is that the loss trends downward over many epochs."},{"type":"cloze","level":1,"prompt":"The lab's SLM has about 3.5 ___ parameters, compared with about 1 billion in Gemma-1B.","options":["billion","thousand","million","trillion"],"answer":2,"explain":"Around 3.5 million parameters makes it a small language model; it also trains on the small Africa Galore dataset."}]}]},{"id":"c2","title":"Represent Your Language Data","subtitle":"AI Research Foundations · Course 2","repo":"ai-foundations","skills":[{"id":"c2-1","title":"Cleaning raw text","icon":"filter","lab":"course_2/gdm_lab_2_1_preprocess_data.ipynb","cards":[{"title":"Why clean web text?","body":"Text scraped from the web carries leftovers: HTML tags like `\u003cbr>` or `\u003cstrong>`, entities like `&amp;`, and stray symbols. Cleaning aims to cut noise while keeping useful information. Every choice shapes what the model learns, so automatic cleaning still benefits from a human review."},{"title":"Strip tags with a regex","body":"`\u003c` and `>` are literal brackets, `.` matches any character, `*` repeats it zero or more times, and `?` makes the match lazy (as short as possible). Without the `?`, `\u003c.*>` grabs everything from the first `\u003c` to the last `>`. The `r` prefix marks a raw string.","code":"def clean_html_tags(text):\n    return re.sub(r\"\u003c.*?>\", \"\", text)"},{"title":"Decode HTML entities","body":"Entities survive tag stripping, so `clean_html` replaces them one by one with `re.sub`: `&nbsp;` becomes a space, `&amp;` becomes &, `&lt;` becomes \u003c, and `&gt;` becomes >. Tags are removed first, so a decoded \u003c or > is never mistaken for a tag.","code":"text = re.sub(r\"\u003c.*?>\", \"\", text)\ntext = re.sub(\"&nbsp;\", \" \", text)\ntext = re.sub(\"&amp;\", \"&\", text)"},{"title":"Filter by Unicode category","body":"Each character has a code point (😱 is U+1F631) and a two-letter category. The first letter is the group: L letter, N number, P punctuation, S symbol, Z separator, C control. `clean_unicode` keeps whitespace plus chosen groups; {\"L\", \"N\", \"P\"} drops emojis (So) and currency (Sc). Add \"Sc\" to keep ₦."}],"exercises":[{"type":"mcq","level":2,"prompt":"What does this return?","code":"text = \"Let's \u003cstrong>win\u003c/strong> this!\"\nre.sub(r\"\u003c.*?>\", \"\", text)","options":["\"Let's  this!\"","\"Let's win this!\"","\"Let's strongwin/strong this!\"","\"Let's \u003cwin> this!\""],"answer":1,"explain":"The lazy pattern removes each tag separately, `\u003cstrong>` and `\u003c/strong>`, and keeps the text between them."},{"type":"mcq","level":3,"prompt":"Without the `?`, what does `re.sub(r\"\u003c.*>\", \"\", \"\u003ch3>Hi \u003cb>you\u003c/b>\u003c/h3>\")` return?","options":["An empty string","\"Hi you\"","\"Hi \u003cb>you\u003c/b>\"","\"\u003ch3>\u003c/h3>\""],"answer":0,"explain":"Greedy `.*` stretches from the first `\u003c` to the very last `>`, which here covers the whole string, so everything is deleted."},{"type":"cloze","level":1,"prompt":"In the regex `\u003c.*?>`, the `?` makes `*` ___, so it matches the shortest possible string.","options":["greedy","optional","literal","lazy"],"answer":3,"explain":"By default `*` is greedy and grabs as much as it can. The `?` flips it to lazy mode."},{"type":"match","level":1,"prompt":"Match each HTML entity to what `clean_html` turns it into.","pairs":[["&amp;","& (ampersand)"],["&lt;","\u003c (less-than sign)"],["&gt;","> (greater-than sign)"],["&nbsp;","a plain space"]],"explain":"These four entities are the ones the lab's `clean_html` decodes after stripping tags."},{"type":"cloze","level":2,"prompt":"Complete the replacement for the less-than entity.","code":"text = re.sub(r\"\u003c.*?>\", \"\", text)\ntext = re.sub(\"&nbsp;\", \" \", text)\ntext = re.sub(\"&amp;\", \"&\", text)\ntext = re.sub(\"&lt;\", ___, text)","options":["\">\"","\"\"","\"\u003c\"","\"&\""],"answer":2,"explain":"`&lt;` stands for \u003c, so it is replaced with \"\u003c\". `&gt;` is the one that becomes \">\"."},{"type":"mcq","level":2,"prompt":"Why does `clean_html` strip tags before decoding `&lt;` and `&gt;`?","options":["re.sub can run only once per string","So decoded \u003c and > aren't taken for tags","Entities only ever appear inside tags","It makes the regex run in lazy mode"],"answer":1,"explain":"If `&lt;b&gt;` were decoded first it would become `\u003cb>`, and the tag remover would then delete text that was meant to stay."},{"type":"mcq","level":1,"prompt":"What does `unicodedata.category('😊')` return?","options":["'So'","'Sc'","'Lo'","'Po'"],"answer":0,"explain":"Emojis are \"Symbol, other\": the S group with sub-code o. \"Sc\" is for currency signs like ₦."},{"type":"mcq","level":3,"prompt":"`categories_to_keep = {\"L\", \"N\", \"P\"}`. What survives `clean_unicode(\"Ah! 😱 ₦150\")`?","options":["Everything except 😱","Only the letters and digits","Everything except ₦","Letters, digits, ! and spaces"],"answer":3,"explain":"Result: \"Ah!  150\". 😱 (So) and ₦ (Sc) are symbols, which are not kept; spaces are always preserved."},{"type":"tf","level":2,"prompt":"An emoji like 😱 is stored in text as a small image pasted inline.","answer":false,"explain":"An emoji is a character with its own Unicode code point; 😱 is U+1F631."},{"type":"cloze","level":3,"prompt":"To keep currency signs like ₦ while still dropping emojis, add ___ to `categories_to_keep`.","options":["\"Sc\"","\"S\"","\"So\"","\"C\""],"answer":0,"explain":"\"Sc\" matches only currency symbols. Adding \"S\" would also keep emojis (\"So\"), and \"So\" is the emoji category itself."},{"type":"tf","level":2,"prompt":"Dropping the whole S group would remove emojis but also currency and math symbols.","answer":true,"explain":"S covers Sm (math, ±), Sc (currency, ₦), Sk (modifiers) and So (emojis and other symbols)."},{"type":"tf","level":1,"prompt":"Unicode categories follow the same scheme across every language and script.","answer":true,"explain":"That consistency is why category checks work for Arabic, Chinese or Yoruba text as well as English."},{"type":"order","level":2,"prompt":"Order the parts of the pattern `\u003c.*?>` from left to right.","items":["\u003c literal opening bracket",". any single character","* repeat zero or more times","? make the match lazy","> literal closing bracket"],"explain":"The pattern reads: an opening bracket, then any characters (as few as possible), then a closing bracket."},{"type":"mcq","level":2,"prompt":"For sentiment analysis on social media, which emoji handling does the lab suggest?","options":["Always delete every emoji","Convert emojis to code points","Swap emojis for tags like \u003cemoji_happy>","Keep emojis and drop the words"],"answer":2,"explain":"Emojis carry feeling, so replacing them with descriptive tags keeps that signal in a form the model can use."},{"type":"mcq","level":2,"prompt":"What does `hex(ord('😱'))` return?","options":["'U+1F631'","'0x1f631'","'1F631'","'😱'"],"answer":1,"explain":"`ord` gives the code point as a number and `hex` prints it in hexadecimal, which Python writes with a `0x` prefix."}]},{"id":"c2-2","title":"Zipf's law and tokenizers","icon":"chart","lab":"course_2/gdm_lab_2_2_tokenize_texts_into_characters_and_words.ipynb","cards":[{"title":"Count before you model","body":"The lab lowercases text and pulls out words with `re.findall(r'\\b\\w+\\b', text)`, which skips punctuation, so \"Music,\" and \"music\" count as one token. A `Counter` then tallies them. In Africa Galore, \"the\" comes first, with \"a\", \"and\", \"of\" and \"is\" close behind, as in most English text."},{"title":"Zipf's law","body":"Rank tokens by frequency (rank 1 = most common). Frequency is roughly proportional to 1 / rank: rank 2 appears about half as often as rank 1, rank 10 about a tenth. On a log-log plot this is a straight line with slope −1. Most tokens live in a long tail of rare words, which models struggle to learn."},{"title":"Characters vs. words","body":"Character tokenization splits text into single characters: a tiny vocabulary and almost no unknown tokens, but long sequences. Africa Galore's first paragraph is 685 character tokens versus 118 word tokens. Word tokenization gives short sequences but a huge vocabulary.","code":"def character_tokenize(text):\n    return list(text)\ndef space_tokenize(text):\n    return text.split(\" \")"},{"title":"Vocabulary trade-offs","body":"A model can only read and write tokens in its vocabulary. A bigger vocabulary spreads meaning over specific tokens, while a single character like \"t\" must help represent every word it appears in. But each token needs its own parameters, so the model gets bigger and slower, and more tokens are too rare to learn."}],"exercises":[{"type":"mcq","level":1,"prompt":"Which token is the most frequent in the Africa Galore counts?","options":["Africa","jollof","the","music"],"answer":2,"explain":"Function words dominate English text. \"the\" tops the list, as it does in much larger English corpora."},{"type":"mcq","level":3,"prompt":"Under Zipf's law, if the top token appears 6,000 times, about how often does the rank-3 token appear?","options":["About 2,000","About 3,000","About 1,000","About 600"],"answer":0,"explain":"Frequency ∝ 1 / rank, so rank 3 appears about a third as often: 6,000 / 3 = 2,000."},{"type":"tf","level":2,"prompt":"On a log-log plot of frequency against rank, Zipf's law looks like a straight line sloping down.","answer":true,"explain":"Taking logs turns the power law f ∝ 1/r into log f = −log r + constant, a straight line."},{"type":"cloze","level":2,"prompt":"Taking logs of f ∝ 1/r gives log f = −log r + constant: a line with slope ___.","options":["1","0","−2","−1"],"answer":3,"explain":"The equation has the form y = kx + b with k = −1, so frequency falls as rank rises."},{"type":"mcq","level":3,"prompt":"What does this return?","code":"text = \"The drum, the DRUM!\"\nre.findall(r'\\b\\w+\\b', text.lower())","options":["['the', 'drum,', 'the', 'drum!']","['the', 'drum', 'the', 'drum']","['The', 'drum', 'the', 'DRUM']","['the', 'drum']"],"answer":1,"explain":"`lower()` makes the case match, and `\\b\\w+\\b` grabs runs of word characters, so punctuation is left out. Repeats are kept."},{"type":"cloze","level":2,"prompt":"Complete `get_token_counts`.","code":"def get_token_counts(tokens_list):\n    token_counts = ___(tokens_list)\n    return token_counts","options":["Counter","set","sorted","len"],"answer":0,"explain":"`Counter(tokens_list)` maps each token to how often it appears, and `most_common()` ranks them."},{"type":"mcq","level":3,"prompt":"For \"Hi, Ada\", how many tokens do a character tokenizer and a space tokenizer produce?","options":["6 and 2","5 and 3","7 and 3","7 and 2"],"answer":3,"explain":"Characters: H, i, ',', ' ', A, d, a = 7 (the comma and space count). Spaces: \"Hi,\" and \"Ada\" = 2."},{"type":"tf","level":3,"prompt":"In the lab, the first paragraph needed roughly 6 times as many character tokens as word tokens.","answer":true,"explain":"685 character tokens versus 118 word tokens: 685 / 118 ≈ 5.8."},{"type":"match","level":1,"prompt":"Match each idea to its description.","pairs":[["Character-level","Tiny vocabulary, very long sequences"],["Word-level","Huge vocabulary, short sequences"],["Zipf's law","Frequency is roughly proportional to 1/rank"],["Long tail","The many tokens that appear only rarely"],["Log-log plot","Turns a power law into a straight line"]],"explain":"These are the lab's two tokenizers and the tools used to study word frequencies."},{"type":"tf","level":2,"prompt":"A model can generate a word outside its vocabulary if that word is common in everyday English.","answer":false,"explain":"The vocabulary is fixed during training. A model can neither process nor generate a token that is not in it."},{"type":"mcq","level":2,"prompt":"Why is a huge word-level vocabulary expensive?","options":["Its sequences get much longer","Punctuation can't be removed","Each token needs its own parameters","Zipf's law no longer applies"],"answer":2,"explain":"Every token gets its own stored representation, so more tokens means a bigger model that is slower to train and run."},{"type":"mcq","level":2,"prompt":"Why do character-level tokens struggle to capture meaning?","options":["Characters are left out of the vocabulary","One character serves many unrelated words","Each text yields too few tokens","Punctuation can't be represented"],"answer":1,"explain":"The token \"t\" has to help represent \"time\", \"the\" and \"train\", so its parameters can't hold one precise meaning."},{"type":"order","level":2,"prompt":"Order from smallest to largest typical vocabulary.","items":["English letters A–Z","Characters in Africa Galore","Word tokens in Africa Galore","Words in English (~1 million)"],"explain":"26 letters, then a few dozen more characters with capitals, digits and punctuation, then thousands of word tokens, then around a million English words."},{"type":"cloze","level":1,"prompt":"Splitting text with `list(text)` is ___-level tokenization.","options":["character","word","subword","sentence"],"answer":0,"explain":"`list` breaks a string into its individual characters, each of which becomes a token."}]},{"id":"c2-3","title":"Subword tokens in Gemma","icon":"puzzle","lab":"course_2/gdm_lab_2_3_tokenize_texts_into_subword_tokens.ipynb","cards":[{"title":"Best of both worlds","body":"Subword tokenization keeps frequent words like \"the\" or \"is\" as single tokens and breaks rare words into smaller pieces. The vocabulary stays a fixed size, yet almost any word can be written. Gemma learns its pieces with byte pair encoding (BPE) and has a vocabulary of more than 260,000 tokens."},{"title":"How Gemma splits text","body":"\"The Baobab (genus Adansonia) is\" becomes 11 tokens: The · ␣Ba · ob · ab · ␣( · genus · ␣Ad · ans · onia · ) · ␣is. A space attaches to the start of the next word, common words stay whole, and rare names break into chunks. Emojis get IDs too: ☺️ is 145233."},{"title":"Encode and decode","body":"`encode` turns text into IDs; `decode` turns IDs (or a single ID) back into text, exactly matching the original. Even a made-up word gets familiar pieces instead of an uninformative `\u003cUNK>`.","code":"tok = gm.text.Gemma3Tokenizer()\nids = tok.encode(\"Clusterophonexia\")\nfirst = tok.decode(ids[0])\ntext = tok.decode(ids)"},{"title":"Special tokens","body":"Some tokens carry structure, not content. `\u003cBOS>` and `\u003cEOS>` mark where a sequence begins and ends, which helps pack texts into batches, and producing `\u003cEOS>` lets a model stop on its own. `\u003cPAD>` fills sequences to equal length; `\u003cUNK>` stands in for unknown characters. Use `encode(text, add_bos=True, add_eos=True)`."}],"exercises":[{"type":"mcq","level":1,"prompt":"How does a subword tokenizer treat a frequent word like \"the\"?","options":["Splits it into letters","Keeps it as one token","Maps it to \u003cUNK>","Drops it entirely"],"answer":1,"explain":"Frequent words earn their own tokens; only rare or complex words are broken into pieces."},{"type":"mcq","level":2,"prompt":"How many tokens does Gemma produce for \"The Baobab (genus Adansonia) is\"?","options":["11","5","31","8"],"answer":0,"explain":"The · ␣Ba · ob · ab · ␣( · genus · ␣Ad · ans · onia · ) · ␣is = 11. There are 5 words and 31 characters."},{"type":"tf","level":2,"prompt":"In Gemma's tokens, a space usually sticks to the end of the previous word, as in \"The \".","answer":false,"explain":"It is the other way round: the space joins the start of the next word, which is why tokens like \" Ba\" and \" is\" carry a leading space."},{"type":"cloze","level":2,"prompt":"Turn the first token ID back into text.","code":"ids = tok.encode(\"Clusterophonexia\")\nfirst_token_as_text = tok.___(ids[0])","options":["encode","split","decode","vocab_size"],"answer":2,"explain":"`decode` maps IDs to text, and it accepts a single ID as well as a list."},{"type":"mcq","level":2,"prompt":"Why is splitting \"Clusterophonexia\" into pieces better than mapping it to \u003cUNK>?","options":["It keeps the vocabulary smaller","\u003cUNK> tokens can never be decoded","It shortens the token sequence","Pieces like \"Cluster\" still hint at meaning"],"answer":3,"explain":"Familiar subwords carry information about the word; a blanket `\u003cUNK>` throws all of it away."},{"type":"match","level":1,"prompt":"Match each special token to its job.","pairs":[["\u003cBOS>","Marks where a sequence begins"],["\u003cEOS>","Marks the end; a cue to stop generating"],["\u003cPAD>","Fills short sequences to equal length"],["\u003cUNK>","Stands in for a character not in the vocab"]],"explain":"Special tokens carry structural information rather than content."},{"type":"mcq","level":2,"prompt":"What lets a model decide for itself when a reply is finished?","options":["Reaching a \u003cPAD> token","Producing an \u003cUNK> token","Generating an \u003cEOS> token","Running out of vocabulary"],"answer":2,"explain":"When the model outputs `\u003cEOS>`, generation stops, instead of always producing a fixed number of tokens."},{"type":"tf","level":1,"prompt":"Gemma's tokenizer has a vocabulary of more than 260,000 tokens.","answer":true,"explain":"Its vocabulary was built from a huge, varied dataset covering many languages, subwords and emojis."},{"type":"cloze","level":2,"prompt":"Complete the call so both boundary markers are added.","code":"tok.encode(\"Hello world!\",\n           add_bos=True,\n           ___=True)","options":["add_eos","add_pad","add_unk","add_end"],"answer":0,"explain":"`add_bos=True` prepends the beginning marker and `add_eos=True` appends the end marker, useful when teaching a chatbot when to stop."},{"type":"mcq","level":3,"prompt":"`n` is the token count without markers. How long is `ids`?","code":"text = \"Good morning!\"\nn = len(tok.encode(text))\nids = tok.encode(text, add_bos=True,\n                 add_eos=True)","options":["n","n + 2","n + 1","2 × n"],"answer":1,"explain":"`add_bos=True` puts one `\u003cBOS>` token in front and `add_eos=True` puts one `\u003cEOS>` token at the end, so the sequence grows by exactly 2."},{"type":"tf","level":2,"prompt":"Decoding the IDs returned by Gemma's `encode(text)` gives back exactly the original text.","answer":true,"explain":"The lab checks this with a ✅: encoding and then decoding is lossless for normal text."},{"type":"order","level":3,"prompt":"Put Gemma's first six tokens for \"The Baobab (genus\" in order.","items":["\"The\"","\" Ba\"","\"ob\"","\"ab\"","\" (\"","\"genus\""],"explain":"Baobab splits as Ba + ob + ab, and the space before \"(\" travels with it. \"genus\" has no space because it follows the bracket."},{"type":"mcq","level":2,"prompt":"The emoji ☺️ has ID 145233. What does `tok.decode(145233)` return?","options":["'\u003cUNK>'","'145233'","'smiling'","'☺️'"],"answer":3,"explain":"The emoji is a regular entry in Gemma's vocabulary, so decoding its ID returns the emoji itself."},{"type":"cloze","level":1,"prompt":"Subword tokenization sits between ___-level and word-level tokenization.","options":["sentence","paragraph","document","character"],"answer":3,"explain":"It mixes both: common words stay whole and rare words fall back to smaller pieces, down to characters if needed."},{"type":"mcq","level":2,"prompt":"How do \u003cBOS> and \u003cEOS> help with batching?","options":["Texts can share a batch with less padding","They remove the need for a vocabulary","They make every sequence one token","They sort texts by their length"],"answer":0,"explain":"Clear start and end markers let several documents sit in one batch without padding each one heavily."}]},{"id":"c2-4","title":"Build a BPE tokenizer","icon":"wrench","lab":"course_2/gdm_lab_2_4_implement_a_bpe_tokenizer.ipynb","cards":[{"title":"The BPE recipe","body":"1) Split each word into characters plus an end-of-word marker `\u003c/w>`; the vocabulary starts as the unique characters. 2) Count every adjacent pair of tokens. 3) Add the most frequent pair as a new merged token. 4) Replace that pair everywhere in the corpus. 5) Repeat until you reach the target number of merges or vocabulary size."},{"title":"Initialize","body":"\"rice\" becomes ['r', 'i', 'c', 'e', '\u003c/w>']. The marker lets the tokenizer tell a word-final piece like \"e\u003c/w>\" from an \"e\" inside a word.","code":"for word in paragraph.split(\" \"):\n    chars = list(word) + [EOW_SYMBOL]\n    corpus.append(chars)\n    vocabulary.update(chars)"},{"title":"Count pairs","body":"A word of L tokens has L − 1 adjacent pairs. In Africa Galore the top pair is ('e', '\u003c/w>'), since many words end in \"e\"; pairs like ('i', 'n') and ('t', 'h') are common too.","code":"for word in corpus:\n    for i in range(len(word) - 1):\n        pair = (word[i], word[i + 1])\n        pairs[pair] += 1"},{"title":"Merge and repeat","body":"`merge_pair_in_word` walks along the word: if positions i and i + 1 match the pair, it appends the merged token and jumps ahead by 2; otherwise it copies one token and moves on. Each merge adds exactly one token to the vocabulary. `learn_bpe` loops this for `num_merges` rounds."}],"exercises":[{"type":"order","level":1,"prompt":"Order the steps of byte pair encoding.","items":["Split words into characters + \u003c/w>","Count adjacent token pairs","Pick the most frequent pair","Add the merged token to the vocab","Replace that pair across the corpus","Repeat until enough merges"],"explain":"Initialize, count, merge, replace, repeat: each round adds one new subword token."},{"type":"mcq","level":2,"prompt":"After initialization, how is the word \"rice\" stored?","options":["['rice', '\u003c/w>']","['r', 'i', 'c', 'e']","['r', 'i', 'c', 'e', '\u003c/w>']","['\u003c/w>', 'r', 'i', 'c', 'e']"],"answer":2,"explain":"Each word becomes its characters followed by the end-of-word marker."},{"type":"cloze","level":2,"prompt":"Complete the initialization line.","code":"EOW_SYMBOL = \"\u003c/w>\"\nchars = list(word) + ___","options":["[EOW_SYMBOL]","EOW_SYMBOL","[\" \"]","[word]"],"answer":0,"explain":"You can only add a list to a list, so the marker is wrapped in brackets. Adding the bare string would raise a TypeError."},{"type":"mcq","level":3,"prompt":"How many adjacent pairs are counted in ['r', 'i', 'c', 'e', '\u003c/w>']?","options":["5","4","3","10"],"answer":1,"explain":"5 tokens give 5 − 1 = 4 pairs: (r, i), (i, c), (c, e), (e, \u003c/w>)."},{"type":"cloze","level":2,"prompt":"Complete the pair inside `get_pair_frequencies`.","code":"for i in range(len(word) - 1):\n    pair = (word[i], ___)\n    pairs[pair] += 1","options":["word[i - 1]","word[i]","word[-1]","word[i + 1]"],"answer":3,"explain":"Each pair is a token and its right-hand neighbour. The loop stops one early so `i + 1` never runs off the end."},{"type":"cloze","level":3,"prompt":"How far does `i` jump after a merge?","code":"while i \u003c len(word):\n    if (i \u003c len(word) - 1 and\n            (word[i], word[i + 1]) == pair):\n        new_word.append(merged)\n        i += ___\n    else:\n        new_word.append(word[i])\n        i += 1","options":["1","0","2","3"],"answer":2,"explain":"A merge consumes two tokens, positions i and i + 1, so the next unread token is at i + 2."},{"type":"mcq","level":3,"prompt":"Merge the pair ('a', 'n') in ['b', 'a', 'n', 'a', 'n', 'a', '\u003c/w>']. What do you get?","options":["['b', 'an', 'an', 'a', '\u003c/w>']","['b', 'an', 'a', 'n', 'a', '\u003c/w>']","['ban', 'an', 'a', '\u003c/w>']","['b', 'a', 'nan', 'a', '\u003c/w>']"],"answer":0,"explain":"Every adjacent ('a', 'n') is merged: two matches become \"an\", \"an\". The last \"a\" is followed by \u003c/w>, so it stays alone."},{"type":"tf","level":1,"prompt":"Each BPE merge adds exactly one new token to the vocabulary.","answer":true,"explain":"One merge creates one new token, the concatenation of the chosen pair, so after k merges the vocabulary has grown by k."},{"type":"mcq","level":3,"prompt":"Corpus: desert ×3, deserted ×2, deserts, desertion ×2, tested, test, function. Which pair does BPE merge first?","options":["('d', 'e'), 8 times","('r', 't'), 8 times","('t', '\u003c/w>'), 4 times","('e', 's'), 10 times"],"answer":3,"explain":"\"es\" appears once in each of the 8 desert-words plus \"tested\" and \"test\": 10 times, more than any other pair."},{"type":"mcq","level":3,"prompt":"That corpus starts with 11 characters plus \u003c/w> in its vocabulary. How big is the vocabulary after 10 merges?","options":["21","22","12","10"],"answer":1,"explain":"It starts with 11 + 1 = 12 tokens, and each merge adds one: 12 + 10 = 22."},{"type":"tf","level":3,"prompt":"After 10 merges on that corpus, \"deserted\" is tokenized as \"desert\" + \"ed\u003c/w>\".","answer":true,"explain":"The early merges build up \"desert\", and later ones create \"ed\u003c/w>\", so the word splits into a stem and an ending."},{"type":"match","level":2,"prompt":"Match each piece of the BPE code to its role.","pairs":[["\u003c/w>","Marks the end of a word"],["bpe_initialize","Splits words into chars and seeds the vocab"],["get_pair_frequencies","Counts adjacent token pairs in the corpus"],["merge_pair_in_word","Replaces a pair with one merged token"],["most_common(1)","Returns the top pair and its count"]],"explain":"These are the building blocks that `learn_bpe` combines into the full algorithm."},{"type":"tf","level":2,"prompt":"BPE merges the least frequent pair first so that rare words get their own tokens.","answer":false,"explain":"BPE always merges the most frequent pair. Common words become single tokens, while rare words stay split into smaller pieces."},{"type":"mcq","level":2,"prompt":"Why does BPE add `\u003c/w>` to every word?","options":["To mark characters it doesn't know","To pad words to equal length","To tell word endings from inner pieces","To separate one paragraph from the next"],"answer":2,"explain":"With the marker, \"e\u003c/w>\" (a word-final e) and \"e\" inside a word become different tokens, which also lets decoding restore spaces."}]},{"id":"c2-5","title":"Embeddings and similarity","icon":"vector","lab":"course_2/gdm_lab_2_5_experiment_with_embeddings.ipynb","cards":[{"title":"Tokens as vectors","body":"An embedding maps each token to a high-dimensional vector; Gemma 1B uses 1,152 dimensions. The embedding table is a matrix with one row per token. To save memory and time, the lab loads only 24 of Gemma's 260,000+ rows, so `embeddings.shape` is (24, 1152). `labels.index(token)` gives a token's row."},{"title":"numpy basics","body":"`.shape` gives (rows, columns), or just (length,) for a plain vector. Indexing starts at 0, and `:` means all rows or all columns.","code":"v = np.array([1, 2, 3])     # (3,)\nM = np.array([[6, 1, 4],\n              [9, 0, 2]])  # (2, 3)\nM[1, :]   # row 2: [9 0 2]\nM[:, 0]   # column 1: [6 9]"},{"title":"Dot product","body":"u · v = u₁v₁ + u₂v₂ + … + uₖvₖ, computed with `np.dot(u, v)` or `np.matmul(u.T, v)`. Positive: the angle is under 90° and the vectors point a similar way. Zero: they are orthogonal, loosely unrelated. Negative: over 90°, pointing apart. With many dimensions the raw value can get very large."},{"title":"Cosine similarity","body":"cos(u, v) = u · v / (‖u‖ ‖v‖) divides out vector length, so the result is always between −1 and +1, and it is symmetric. In Gemma: king–queen 0.42, sad–happy 0.22, king–bus 0.04. Even antonyms such as good–bad (0.42) can score high, since both describe quality. t-SNE squeezes embeddings into 2D while keeping neighbours close."}],"exercises":[{"type":"mcq","level":1,"prompt":"How many dimensions does each Gemma 1B token embedding have?","options":["24","260,000","1,152","2"],"answer":2,"explain":"Each token is a 1,152-number vector. 24 is how many tokens the lab loads; 260,000+ is the vocabulary size."},{"type":"mcq","level":2,"prompt":"What is the shape of `np.array([[7, 4], [3, 5], [1, 6], [4, 7]])`?","options":["(4, 2)","(2, 4)","(8,)","(4,)"],"answer":0,"explain":"There are 4 inner lists (rows), each with 2 numbers (columns), so the shape is (4, 2)."},{"type":"cloze","level":2,"prompt":"Get the embedding dimension, i.e. the number of columns.","code":"embedding_dim = embeddings.shape[___]","options":["0","-2","2","1"],"answer":3,"explain":"`shape` is (rows, columns) = (24, 1152). Index 1 picks the columns, so `embedding_dim` is 1,152."},{"type":"mcq","level":3,"prompt":"`embeddings` has shape (24, 1152). What is the shape of `embeddings[:, 6]`?","options":["(1152,)","(24,)","(6,)","(24, 6)"],"answer":1,"explain":"`[:, 6]` takes column 7 from every row: one number per token, so 24 values."},{"type":"mcq","level":3,"prompt":"What is the dot product of [1, 2, 3] and [4, −1, 2]?","options":["12","6","0","8"],"answer":3,"explain":"1·4 + 2·(−1) + 3·2 = 4 − 2 + 6 = 8. Forgetting the minus sign gives 12."},{"type":"tf","level":2,"prompt":"A negative dot product means the angle between two embeddings is greater than 90°.","answer":true,"explain":"Negative means the vectors point in roughly opposite directions, a sign of dissimilarity."},{"type":"cloze","level":2,"prompt":"Complete `cos_sim`.","code":"dot_uv = np.matmul(u.T, v)\nlen_u = np.linalg.norm(u, 2)\nlen_v = np.linalg.norm(v, 2)\ncosine_sim = dot_uv / ___","options":["(len_u * len_v)","(len_u + len_v)","len_u","(dot_uv * len_v)"],"answer":0,"explain":"Cosine similarity divides the dot product by the product of the two vector lengths, which scales it into the range −1 to +1."},{"type":"mcq","level":3,"prompt":"u = [3, 4] and v = [6, 8]. What is their cosine similarity?","options":["50","0.5","1.0","0"],"answer":2,"explain":"u · v = 18 + 32 = 50, ‖u‖ = 5, ‖v‖ = 10, so 50 / 50 = 1. They point the same way; only their lengths differ."},{"type":"tf","level":2,"prompt":"Because \"good\" and \"bad\" are antonyms, Gemma gives them a cosine similarity close to −1.","answer":false,"explain":"It is 0.42. Opposites still share a lot: both are adjectives about quality, so they sit in similar contexts."},{"type":"cloze","level":2,"prompt":"Complete `get_embedding`.","code":"token_idx = labels.index(token)\nembedding = embeddings[___, :]","options":["token","token_idx",":","labels"],"answer":1,"explain":"The row number comes from `labels.index(token)`; numpy needs that integer index, not the token string."},{"type":"match","level":1,"prompt":"Match each term to its meaning.","pairs":[["Dot product","Sum of element-wise products"],["Cosine similarity","Dot product divided by both lengths"],["Orthogonal","At 90°, with a dot product of zero"],["t-SNE","Projects to 2D while keeping neighbours"],[".shape","The dimensions of a numpy array"]],"explain":"These are the tools the lab uses to measure and picture embedding similarity."},{"type":"mcq","level":2,"prompt":"Why did plotting two raw embedding dimensions against each other rarely show clear groups?","options":["Meaning is spread over many dimensions","Most dimensions hold only zeros","Only dimension 0 stores meaning","The plot can't show 24 tokens"],"answer":0,"explain":"Word relationships come from combinations of many dimensions, so any two on their own capture little of the structure."},{"type":"mcq","level":2,"prompt":"In the t-SNE plot, \"cat\" lands right next to \"car\". What's the best explanation?","options":["Gemma treats cats as vehicles","Their cosine similarity must be 1","t-SNE orders tokens alphabetically","Detail lost squeezing 1,152 dims into 2"],"answer":3,"explain":"Projecting to two dimensions throws away fine-grained information, so some neighbours, like cat and car, are artifacts."},{"type":"order","level":2,"prompt":"Order these Gemma similarities from highest to lowest.","items":["king – king","king – queen","sad – happy","king – bus"],"explain":"A vector compared with itself gives 1.0, then king–queen 0.42, sad–happy 0.22, and the unrelated king–bus 0.04."},{"type":"cloze","level":3,"prompt":"`np.array([[4, 4, 4]])` has shape ___.","options":["(3,)","(3, 1)","(1, 3)","(4, 4, 4)"],"answer":2,"explain":"The double brackets make one row of three columns. `np.array([4, 4, 4])` without the outer brackets would be (3,)."},{"type":"tf","level":1,"prompt":"The lab loads embeddings for just 24 tokens to save memory and speed up computation.","answer":true,"explain":"The full table has a row for each of 260,000+ tokens; 24 is enough to explore similarity."}]},{"id":"c2-6","title":"Train an SLM with BPE","icon":"brain","lab":"course_2/gdm_lab_2_6_train_an_slm_with_your_bpe_tokenizer.ipynb","cards":[{"title":"Train the tokenizer first","body":"`BPEWordTokenizer(dataset, num_merges=3000)` learns 3,000 merges from Africa Galore. The constructor then makes sure a–z, A–Z and 0–9 are present and wraps the sorted tokens as [`\u003cPAD>`] + … + [`\u003cUNK>`], so `\u003cPAD>` is ID 0 and `\u003cUNK>` the last ID. The final vocabulary is therefore a bit larger than merging alone gives."},{"title":"Encoding new text","body":"Each word becomes its characters plus `\u003c/w>`, then the learned merges are replayed in order. \"launched\" → la · un · ched\u003c/w>. The unseen \"Zimbabwian\" → Zimbab · wi · an, which can relate to \"Zimbabwe\". 😋 never appeared, so it becomes `\u003cUNK>`.","code":"for word in text.strip().split():\n    chars = list(word) + [\"\u003c/w>\"]\n    for pair in self.merges:\n        chars = self._merge_pairs_in_word(\n            chars, pair)\n    tokens.extend(chars)"},{"title":"Same training pipeline","body":"Encode every paragraph, pad or truncate to 300 with `\u003cPAD>`, then shift by one for inputs and targets (299 tokens each). The model trains for 100 epochs with batch size 2 and learning rate 8e-5, printing a \"Jide\" sample every 10 epochs. Early samples contain non-words because subword pieces are combined at random."},{"title":"What the embeddings learned","body":"The model's first trainable weight matrix holds its token embeddings. A t-SNE plot of food words, prepositions, adjectives and countries shows the prepositions (on, in, with, for, of) clustering tightly: frequent function words give even a small dataset plenty of evidence. Rarer words cluster less cleanly. The best merge count depends on data, language and goal."}],"exercises":[{"type":"mcq","level":2,"prompt":"Why is the final vocabulary larger than the tokens produced by merging?","options":["Each merge adds two tokens instead of one","Letters, digits, \u003cPAD> and \u003cUNK> are added","Every word is also stored as a whole","Gemma's vocabulary gets merged in too"],"answer":1,"explain":"After learning merges, the constructor adds missing letters and digits plus the two special tokens."},{"type":"mcq","level":1,"prompt":"How does your BPE tokenizer handle the unseen word \"Zimbabwian\"?","options":["Splits it into Zimbab · wi · an","Maps the whole word to \u003cUNK>","Adds it to the vocabulary","Splits it into single letters"],"answer":0,"explain":"Replaying the learned merges builds familiar pieces, so the word gets informative subwords instead of `\u003cUNK>`."},{"type":"tf","level":2,"prompt":"The emoji 😋 is encoded as \u003cUNK> because no emoji appears in Africa Galore.","answer":true,"explain":"BPE can only build tokens from characters it has seen, and no emoji was added to the vocabulary by hand."},{"type":"cloze","level":2,"prompt":"Complete `_split_text`: which list of pairs is replayed on each word?","code":"for word in text.strip().split():\n    chars = list(word) + [\"\u003c/w>\"]\n    for pair in self.___:\n        chars = self._merge_pairs_in_word(\n            chars, pair)","options":["vocabulary","token_to_index","tokenized_corpus","merges"],"answer":3,"explain":"`self.merges` stores the learned pairs in the order they were learned, and applying them in that order reproduces the training tokenization."},{"type":"mcq","level":3,"prompt":"The vocabulary is [\u003cPAD>] + sorted tokens + [\u003cUNK>], 3,200 tokens in total. What are the IDs of \u003cPAD> and \u003cUNK>?","options":["0 and 3,199","1 and 3,200","0 and 3,200","3,199 and 0"],"answer":0,"explain":"IDs are list positions starting at 0. `\u003cPAD>` is first (0) and `\u003cUNK>` is last (3,200 − 1 = 3,199)."},{"type":"mcq","level":2,"prompt":"Early in training, why do the \"Jide…\" samples contain made-up words?","options":["The tokenizer forgot its merges","Padding tokens are being printed","It hasn't learned how pieces combine","The learning rate was set to zero"],"answer":2,"explain":"The model samples subword tokens. Until it learns which pieces go together, it glues them randomly into non-words."},{"type":"tf","level":3,"prompt":"With `max_length = 300`, the input and target sequences are each 299 tokens long.","answer":true,"explain":"Inputs drop the last token and targets drop the first, so both are one shorter than the padded length."},{"type":"order","level":2,"prompt":"Order the steps of this lab.","items":["Learn 3,000 BPE merges on Africa Galore","Encode each paragraph as token IDs","Pad and truncate to length 300","Shift by one into inputs and targets","Train the transformer for 100 epochs","Plot learned embeddings with t-SNE"],"explain":"The tokenizer must exist before encoding, and the model must be trained before its embeddings are worth plotting."},{"type":"mcq","level":2,"prompt":"In the t-SNE plot of your model's embeddings, which group forms the tightest cluster?","options":["Countries like Egypt, Ghana","Adjectives like aromatic, hot","Food words like stew, sauce","Prepositions like in, on, of"],"answer":3,"explain":"Prepositions are very frequent, so even this small dataset shows the model many examples of how they are used."},{"type":"cloze","level":2,"prompt":"Prepositions cluster well because they are ___ in the dataset, giving the model lots of evidence.","options":["rare","frequent","capitalized","unknown"],"answer":1,"explain":"Frequent function words appear in many contexts, so the model learns stable embeddings for them; rare words get far fewer examples."},{"type":"match","level":1,"prompt":"Match each name from the lab to its role.","pairs":[["num_merges=3000","How many merge rules the tokenizer learns"],["pad_token_id","ID used to fill short sequences"],["unknown_token_id","ID for symbols outside the vocabulary"],["trainable_weights[0]","The model's token embedding matrix"],["_merge_pairs_in_word","Applies one merge to a single word"]],"explain":"These names tie the tokenizer, the padding step and the trained model together."},{"type":"mcq","level":3,"prompt":"What does the `assert` check?","code":"token_ids = []\nfor token in tokens:\n    ids = tokenizer.encode(token)\n    token_ids.extend(ids)\nassert len(token_ids) == len(tokens)","options":["Each word is in Gemma's vocabulary","No word was padded to length 300","Each chosen word is one BPE token","Embeddings have 1,152 dimensions"],"answer":2,"explain":"If a word split into several subword tokens, `token_ids` would be longer than `tokens` and the plot labels would not line up."},{"type":"tf","level":2,"prompt":"The best number of BPE merges is fixed and does not depend on the dataset or language.","answer":false,"explain":"The right number depends on the data, the language and the goal, so it is usually found by experimenting."},{"type":"cloze","level":3,"prompt":"With zero merges learned, \"stew\" would be encoded as ___ tokens.","options":["5","4","1","6"],"answer":0,"explain":"No merges means pure characters: s, t, e, w plus the `\u003c/w>` marker, which is itself in the vocabulary. That makes 5."}]}]},{"id":"ml","title":"ML Toolkit","subtitle":"DeepMind Educational · Summer School","repo":"educational","skills":[{"id":"ml-1","title":"Python & NumPy basics","icon":"code","lab":"colabs/summer_schools/intro_to_python_numpy_for_deep_learning.ipynb","cards":[{"title":"Python in a nutshell","body":"Python is interpreted (no separate compile step), high-level (it reads almost like pseudo-code) and dynamically typed: a variable's type is checked while the code runs, so `v = 1` followed by `v = 'hi'` is fine. Adding an int to a float gives a float. `//` is floor division, `%` the remainder and `**` a power."},{"title":"Containers","body":"Lists are mutable and can grow with `append` or `extend`. Tuples are immutable, and `(4)` is just the number 4 while `(4,)` is a one-element tuple. Strings are immutable too. Dicts map unique keys to values; reading a missing key raises `KeyError`, so test with `key in d` first."},{"title":"Slices and comprehensions","body":"Indexing starts at 0. A slice `start:stop:step` includes `start` but excludes `stop`: `x[1:3]` gives items 1 and 2, `x[:-1]` drops the last item and `x[::2]` takes every other one. A list comprehension builds a new list in one readable line, with an optional `if` filter.","code":"a = [10, 4, 3, 2, 5, 9, 0]\nodds = [v+10 for v in a if v % 2 == 1]\n# [13, 15, 19]"},{"title":"First NumPy arrays","body":"A NumPy array is a grid of values of one type. Its rank is the number of axes and its shape gives each axis's size: a scalar has rank 0, a vector rank 1, a matrix rank 2. `np.array([1, 2, 3.1])` becomes float because of the 3.1, while forcing `dtype=np.int32` truncates it to 3. Set `np.random.seed` for reproducible runs.","code":"a = np.zeros((2, 3))\na.ndim, a.shape, a.dtype
